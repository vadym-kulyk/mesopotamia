Не знаю. Просто про астрономію. Про ром, про птахів.", "— Що ти вигадуєш? — розсміялась вона. — Давай, одужуй. Завтра подзвоню."], ["Він чекав зранку, прокинувшись. Чекав, приїхавши в офіс. Не витримав, набрав її. Вона не відповіла. За півгодини набрав ще раз. Потім почав писати. Потім знову телефонував. Занервував, не витримав, вирішив з'їздити поговорити. Не наважився вийти, набрав Антона.", "— Зараз вийду, — коротко відповів той.", "Вийшов за п’ять хвилин, сів на переднє сидіння, дверцят не причиняв, дивився на піратський прапор, ніби остерігався, що звідти хтось вийде непоміченим.", "— Коротше, її сьогодні не було, — заговорив Антон, навіть не дивлячись на нього. — Думаю, у неї з братом знову проблеми.", "— Що за проблеми? — не зрозумів Фіма.", "— Коротше, — сказав Антон, помовчавши. — Є в неї брат. Рідкісний мудак. Мами в них різні, вони брат і сестра за батьком. Жив десь на Півночі, повернувся років п'ять тому, коли її старі померли. Типу старший брат, рідна кров. Пресує її по-страшному. Йому наговорили про неї різного, він її тепер із дому не випускає. Вона вчора в тебе була?", "— Ну, — не наважився заперечити Фіма.", "— Ну, от він її, мабуть, і не пускає тепер нікуди.", "— Вона ж не мала дитина, — здивувався Фіма.", "— Ти б його бачив, — відповів на це Антон. — У нього на шкірі живого місця немає — все в рубцях. І волосся зовсім немає — ні на голові, ні на тілі.", "— Ти спав з ним чи що? — роздратовано випалив Фіма.", "— Я з нею спав, — пояснив Антон.", "— Як це? — не зрозумів Фіма.", "— Ну, ти що, не розумієш? — пояснив йому Антон. — Я з нею спав. Вона мені взагалі подобалась. Проститутка? Хуй з ним. У мене половина однокласниць проститутками стали. Причому інша половина їм заздрить. Я за нею вже в старших класах бігав. Я спортом займався, щоби вона звернула на мене увагу.", "— Знаю, вона боксерів любить.", "— Яких боксерів? — образився Антон. — Це брат її любить боксерів. Та ладно, що я тобі розповідаю. Одне слово, вона мені завжди подобалась. А коли в нас із нею все нарешті вийшло, повернувся її брат.", "— І що?", "— І що? І зламав мені носа. Дивись, — Антон повернувся в профіль. — У мене навіть перетинка ушкоджена.", "Антон зранку, очевидно, поголився. Але, мабуть, поспішав. Або просто звик робити це не надто уважно: на шиї були порізи, щелепою темніли волоски. Комір сорочки був несвіжий, кульчик у вусі потемнів від часу. Найбільше йому, мабуть, хотілося заховатись за барною стійкою й нікого до себе не підпускати. Почекає, — злісно подумав Фіма.", "— У тебе є його номер? — запитав.", "— Звідки?", "— Знаєш, де він може бути?", "— Ну де, — неохоче відповів Антон. — У себе, у гаражах. Тут, за рікою, — показав він униз, — є гаражі, знаєш?", "— Ну.", "— У нього там СТО. Побачиш прибитий до стіни собачий череп — це його місце. Тільки для чого це тобі?", "Фіма не відповів. Антон почекав. Із бару хтось визирнув — наляканий погляд, нечесане волосся, темна шкіра. Антон зірвався, кивнув на прощання, зник за дверима. Фіма лишив машину, спустився вулицею, перейшов міст, минув заводську огорожу, вийшов на гаражі.", "Глина, було багато глини, ніби тут щось мали випалювати на вогні. Ніби тут ніколи нічого не росло й ночами сюди приходили померлі, тамуючи голод сухим глиняним груддям. Чорні скати, вкопані вздовж дороги, безкінечна біла цегляна стіна, рясно списана біблійними цитатами — під ногами розсипалася глина, над головою палало сонце, у траві лежали газети й мертві коти, пахло пеклом і річковою водою. В’їзд було перекрито іржавим шлагбаумом, поруч стояла будка вахтера — тріснуте скло, календарики, листівки, перемотаний ізоляційною стрічкою шматок шланга, прочинені двері, чорна кров, що в'їлася в цементну долівку. Вахтера не було. Фіма покрутився, зазирнув досередини. Вахтер багато курив, ясна річ, погані сигарети, ясна річ, не виходячи на вулицю. Одяг його, мабуть, не відпирався від тютюну. Розбита дорога вела вперед, ліворуч і праворуч тяглися ряди білих цегляних гаражів. Фіма подумав і рушив ліворуч. Ішов уздовж металевих дверей, розглядав важкі навісні замки. Де-не-де під стіною лежав металобрухт, іноді вгорі пролітали наполохані птахи. Не було нікого видно, усюди стояла тиша, і робилося від цього моторошно. Фіма пройшов до кінця, вперся в цегляну огорожу, завернув праворуч, вийшов на наступний ряд, побачив бічну вуличку, завернув туди. Знову пройшов до кінця, знову завернув праворуч. Гаражі тяглись безкінечно й безнадійно. Де вони всі? — подумав він. — Має ж тут хтось бути. Зупинився, прислухався. Вигорілою травою перебігали ящірки, під шиферними дахами шурхотіли ластівки, вітер протяжно сурмив в отвори та порожнини металевих деталей, мовби сповіщаючи сонне місто про наближення невидимого ворога. Раптом далеко попереду майнув кольоровий спалах. Фіма рвонув на рух. Встиг помітити, як за ріг поквапливо завернув хтось у строкатій сорочці. Фіма пробіг до рогу, вивалився в сусідній ряд, знову встиг помітити спину незнайомця. Той швидко йшов уздовж гаражів в яскравій пляжній сорочці, сірих брюках і капцях на босу ногу. У руках тримав щось важке й металеве. Фіма було заспокоївся й думав швидко наздогнати незнайомця, проте чоловік несподівано пірнув у бічний прохід, тож Фіма знову панічно кинувся вперед. Добіг, теж повернув, помчав вузьким проходом, поміж високими стінами, давлячи начищеними черевиками биту цеглу й наступаючи на порожні пачки з-під цигарок та використані презервативи. Чоловік попереду все не ставав ближчим, якимось чином виходило йому весь час лишатися десь попереду, майоріти своєю сорочкою, збивати каміння під ногами. І хоч як Фіма прискорював ходу, дистанція між ними не зменшувалася. І тоді Фіма зважився.", "— Ей! — крикнув він.", "Голос посеред тиші тріснув і розколовся. Незнайомець, утім, його почув. Зупинився, повернувся. Фіма подумав і рішуче рушив уперед. І тоді незнайомець кинувся тікати. Фіма кинувся слідом. Тиша наповнилась важким гупотінням. Чоловік попереду добіг до стіни, на перехресті заметушився, не знаючи, куди йому далі, однак стрибнув ліворуч і зник за рогом. Фіма почув, як віддаляються його кроки. Теж добіг до рогу. Незнайомця не було. Фіма біг уперед, пробігаючи ряди гаражів і щоразу сподіваючись побачити строкатого чоловіка. Але той просто зник, ніби й не він тут щойно налякано зупинявся, ніби не він метушився на роздоріжжі. Фіма важко дихав, проте вперто біг уперед, прагнучи будь-що дістати незнайомця, зупинити його, розпитати зрештою, що в них тут відбувається. У якийсь момент відчув, що прохід між гаражів ледь помітно забирає ліворуч і що він ось уже якийсь час біжить по колу. Уже думав зупинитись і повернути назад, як раптом побачив в одному з гаражів напівпрочинені двері. Зупинився, перевів подих, підійшов, зазирнув усередину.", "У темряві пахло мастилом і паленою шерстю, сонячне проміння, пробиваючись з-поза його спини, розсипалося червоною лакованою поверхнею легковика. Була це копійка, що чесно відпрацювала свій довгий вік, але не заслужила на спокійну старість, щось було в її минулому такого, за що вона спокутувала навіть тепер, по своїй смерті. Що смерть була жорстокою, Фіма зрозумів відразу, щойно побачив цей металевий фарш посеред гаража. Демони схопили свого часу цю автівку й довго грали нею в регбі, перекидали її з рук у руки, запускали нею в гаряче небо. Жований метал, внутрішнє дрантя, чорна палена гума, дрібно помелене скло — легковик схожий був на тіло християнського святого, замученого римськими легіонерами. Фіма пригледівся. Позаду автівки висіло повстяне покривало. Невидимий протяг час від час легко погойдував його важке темне вітрило, був там, очевидно, ще якийсь невидимий вихід, варто було спробувати. Фіма обійшов розламану копійку, обережно відвів рукою повстяну завісу. І не помилився: була там ще одна кімната, завалена банками з-під фарби й пляшками з-під лаку. Обережно пройшов, помітив наступні двері, прочинив їх. Увійшов до наступного, значно меншого приміщення. У кутку стояв канцелярський стіл, на ньому лежали старі вижовклі газети. Пройшов досередини, уважно обдивився навсібіч. Наступні двері були майже не помітні, лише пройма в стіні темніла, мов шрам. Фіма підійшов, підважив двері плечем. Ті важко піддалися, заскрипіли, відчинилися. В очі вдарило гаряче насичене сонячне світло. Фіма ступив на вулицю й затулився рукою від болючих променів. Але відразу ж відчув чиєсь дихання. Відвів руку, проте засліплені очі відмовлялися бодай щось розрізняти. Присів, затуляючись від сонця й застережливо викинувши руку вперед. Перечекав, усе так само відчуваючи поруч чиюсь присутність. Поступово зір повертався, в очах застрибали жовті кола й чорні планети, виступили сльози, сфокусувалась різкість. Фіма підвівся. Просто перед ним, на відстані двох кроків, важко дихаючи й висолоплюючи сухі язики, чатували темні вуличні пси, принюхуючись і постогнуючи від напруження та спеки. Двері за плечима, важко вдарившись іржавим металом, причинились. Відступати не було куди. Пси дивились на нього порожньо й запекло. Ближче не підходили, хоча й поглядів не відводили, готуючись будь-якої миті кинутись і перегризти йому горлянку. Старший, найбільш рваний і м'язистий, був сірого кольору, мав пошрамоване чоло й поцяткований чорним важкий язик. Відразу за ним стояли двоє молодих — подібних між собою кривуватими ногами й жовтою жорсткою шерстю. Ці виглядали ще більш загрозливо, і зрозуміло було, що кинулися б на нього просто тепер, просто чекали на команду старшого. Трішки далі, за їхніми спинами, хижо пригинала хребет молода сука з холодними іклами, з високим загривком. Поруч із нею гарчало зовсім молоде щеня з міцними, як на свій вік, лапами, з червоними плямами на животі. А збоку прикульгував старий волоцюга з перебитою передньою правою, з відчаєм і люттю в очах, зі слиною, запеченою на пащеці, з колючками, що в'їлися в розірваний ніс. А зовсім позаду стояв ще один молодий, лискучий і чорний, дещо наполоханий, проте рішучий і заведений, ще не надто потяганий і побитий, проте вже тепер готовий довести старшим усю свою рішучість, довести їй, тій, що стояла поруч, силу своїх м'язів, гостроту своїх різців, серйозність своїх намірів. Вона теж це відчувала, проте не подавала виду, повернулась спиною до нього й гарчала, нервово реагуючи на кожен Фімин порух.", "Старший повільно повів шиєю, завмер і почав хрипко видихувати всю свою чорну агресію, Фіма зрозумів, що це кінець, що ось тепер усе напевне й почнеться, що старший повідомив своїх про те, що далі тягнути немає сенсу — потрібно просто порвати цього чужого, що забрів на їхню територію. І потягнувся вже до Фіми, ледь помітно загріб лапами мертву глину, це кінець, зрозумів Фіма, це справжній кінець, і відвести його неможливо, потрібно просто сприймати все таким, яким воно є, себто жорстоким і несправедливим. Він подивився вожаку в очі, аби смерть не настигла його зненацька. І вожак теж піймав цей його погляд із повагою, проте без жодних послаблень: усе має бути так, як має бути, кожен отримає те, на що заслуговує, прощення не буде нікому, винятки принижують, і коли Фіма, стиснувши зуби й кулаки і зробивши півкроку вперед, приготувався відчути на горлянці солоний віддих собачої пащеки, звідкись збоку з'явилася жінка. Була вона високого зросту, темна лицем, старшого віку, одягнена в синій чоловічий плащ, на ногах мала важкі черевики. У руках тримала безліч торб і пакунків, якісь навіть волочила за собою по гарячій глині. Набиті ці пакунки були древнім одягом і порожніми пляшками, виловленою по смітниках їжею й стародавнім кухонним начинням — горщиками, ножами, тарілками й ложками. Усе це торохтіло й перекочувалось, і сама вона, здавалось, теж торохтіла всіма своїми суглобами, і пил стояв там, де вона проходила, і пахло від неї старим помешканням, у якому померла немолода людина. Вона ковзнула по Фімі порожнім поглядом, ніби й не бачила його, ніби його тут і не було зовсім. Пси нашорошились і завмерли. Далі гарчали й скалили пащеки, проте вже скоріше за інерцією, не бажаючи відступатись від жертви, що так легковажно трапилась їм до лап.", "— Бальтазар! — покликала жінка старшого, з пошрамованим чолом.", "Той незадоволено сіпнувся було в бік Фіми, проте голос її подіяв на нього дивним чином: ніби паралізував його впевненість, перепинив його лють. Відвернувшись від Фіми, Бальтазар потягнувся мордою до жінки, та простягла йому свою висохлу темну руку, гладячи побиту голову. Потому рушила вперед. Зграя поспішила слідом, зникаючи за рогом і лишаючи по собі запах сухої шерсті.", "Надвечір вона передзвонила йому. Вибачилась, домовилась про зустріч. Він запропонував приїхати, забрати її прямо тепер. Не треба, — відповіла Оля, — завтра все одно побачимось. Подумала, що чоловіки ніколи надовго не затримувалися в її житті. Траплялось так, що вона сама звертала на них увагу, вирізняла їх із-поміж інших. Торкалася вперше їхніх долонь, зазирала вперше в їхні очі, запам'ятовувала їхні зморшки, вимовляла їхні імена. Дозволяла їм залишитись поруч із собою. Пізнавала їхні звички, їхню поведінку, прислухалася до їхньої мови, вислуховувала їхні оповіді про пригоди, перемоги та нещастя, коротко, проте чітко переривала всі їхні спроби дізнатись про неї більше, ніж вона хотіла розповісти. Легко насміхалася з їхньої хоробрості, ніжно бентежилась від їхньої довірливості, жорстко відповідала на їхню агресію. Підлаштовувалась під їхнє дихання, підштовхувала їх до рішучих дій, втрачала з ними відчуття часу, лишала їх зрештою сам на сам з їхніми бідами та викривленими уявленнями про любов і вірність. Сумувала за ними потому, згадувала їх, забувала, знову відновлювала в пам'яті все, що вони говорили їй, у чому вони їй присягались, що вони з нею робили. Їй вистачало сили, аби не повертатися до них, і ставало розуму, аби не забувати про них назавжди, ховати глибоко під шкірою згадку про кожного з них, про їхню впевненість і рвучкість, слабкість і необов'язковість, уважність і закоханість, непостійність і святенництво. Чоловіки в цьому місті, — думала вона, — народжуються для оборони та завойовницьких походів. Їх виховують у покорі та стриманості, їх із дитинства вчать зносити холод та спеку, біль та голод. Вони виростають, аби боронити фортечні мури міста, аби будувати церкви й торговельні склади, примножуючи міські статки й славлячи всіх святих, що дбають про наше місто. До обов'язків їхніх належить підтримувати в робочому стані газову мережу та водогін, дбати про жінок та дітей, годувати вуличних тварин і відганяти диких птахів від фруктових дерев. Призначенням їхнім є любов, боги відкривають серце кожного з них для закоханості й запеклості, налаштовуючи їх на безкінечні радощі та страждання. Тому їм залишається кохати й сподіватись, вірити й розчаровуватись, чекати й не відступатись, дякувати й переконувати, втрачати все, що надбали, і починати щоразу все спочатку. Сподіваючись, що цього разу любов їх не зрадить, а смерть відступиться."], ["Десять років тому час для мене зупинився, рішуче відмовляючись рухатися далі. Механізми завмерли, серце билося так, ніби робило послугу: без претензій, проте й без гарантій. Дратувало все, навіть запах власного одягу. Тридцять років виявилися пасткою — жодної втіхи від занурення в невідоме, жодної радості від продовження початого. Лише ранковий вогонь у голові, пообідня порожнеча в горлі, різке вечірнє світло. І жорстока, на рівні віри ненависть до тих, хто намагається зробити тобі добре, жорстока помста всім, хто намагається тобі допомогти. До тридцяти я встиг двічі розлучитись. Устиг би й утретє, але за мене більше ніхто не йшов. Жінок лякали мої звички, напружувало те, що я майже ніколи не спав, а коли спав — довго не прокидався. Вони сиділи наді мною в холодних сутінках на старих простирадлах, налякано ловили моє дихання, пробували пульс, хапливо телефонували знайомим, питались поради, обережно торкали мене за плече, перевертали на бік, аби я не захлинувся власною жовчю. Мені в цей час снились піщані дюни, вони перетікали моїм життям, не лишаючи по собі нічого, крім спеки й задухи. Снились мені змії й земляні птахи, снились написи, зроблені на темній глині, снились мовчазні діти, що збирали між сухих гілок отруйні ягоди й простягали їх мені, мовби просячи: давай, спробуй, ти не знаєш, від чого відмовляєшся, ніколи в житті ти не відчував цього дивного смаку, так смакує лише смерть, це краще за будь-які прянощі, це солодше за будь-які мікстури, ти лише спробуй, прокинься й спробуй. Прокидатись після цього, ясна річ, не хотілося.", "Іноді жінки не витримували і йшли у своїх справах, іноді сиділи, чемно чекаючи. Але потім усе одно йшли. Іноді поверталися й далі сиділи на солоних, як вітрила, простирадлах. Насичене особисте життя, одне слово. По обіді я збирався із силами і йшов на ефір. Запускав розбитий, наповнений вірусами комп'ютер, перебирав диски, намагався прибрати на робочому столі, безсило кидав усе це й виходив у коридор, скажімо, з чаєм, скажімо, перекурити. Свічка політехнічного, де знаходилася студія, височіла над деревами, відсвічуючи поодинокими вогнями аудиторій. Темрява стояла в провулках, пахло вогкістю й ранньою весною, хотілося ніколи не залишати це місто й ніколи в житті, ніколи й нізащо не повертатися в студію.", "Десять років тому вона закінчила університет і спробувала дивитись на світ дорослими очима. Світ погано фокусувався. Батьки її ще довший час думали, що вона далі навчається. Вперто будили її на першу пару. Тато її був професійним безробітним. Здається, непогано при цьому почувався. Мама працювала на пошті. Тому про пошту з маминих слів вона знала все, могла розповідати про неї годинами. Якби це когось цікавило, ясна річ.", "Узимку вона влаштувалась на роботу в якийсь благодійний фонд, проте фонд виявився недостатньо благодійним, навіть працівникам своїм нічого не платив, тож і роботою назвати це було важко. На студію її привів Вадик Сальмонела, вони зустрічалися вже близько місяця, хоча навіть після всього того, що між ними було, Вадик дозволяв собі її не впізнавати, особливо після концертів: оглушений і прибитий, накачаний поганим бухлом, із зірваним горлом, він, як справжній рок-стар, міг пройти й демонстративно її не помітити. Вона нервувала, плакала. Йому це, схоже, подобалось. Їй, схоже, теж. Можна отримувати радість від усього, навіть від спілкування з мудаками.", "Вона ввійшла слідом за ним, навіть не привіталась, мовчки сіла коло дверей, злісно дістала мобільник, упевнено почала набивати повідомлення. Вадик кинув їй до ніг свій шкіряний рюкзак і демонстративно про неї забув. Світле волосся, білий плащ, який вона кинула на підлогу, рожеві обвітрені пальці, родимки на шиї, шкільний светр, з-під якого гостро пробивались ключиці, недовірливий погляд, напружені рухи, дитячий вираз обличчя, нечищене взуття, красиві коліна.", "— Дочка? — кивнув я Вадику замість привітатись.", "— Хуй там, — відповів він незадоволено, й ефір таким чином почався.", "Рівно двадцять хвилин, не рахуючи музичних пауз, Вадик говорив про рок-н-рол, дух бунтарства, естетику свободи, пісні протесту й розширення свідомості. Вона сиділа в кутку й лише незадоволено хитала головою. На правій руці в неї був пластмасовий браслет. Загалом схоже було, що вона прийшла в маминому одязі. Після ефіру ми стояли з Вадиком у коридорі, розглядали вогні, він дістав коньяк, я відмовився — пити після нього з однієї пляшки було просто страшно. Бідна дівчинка, — подумав я.", "— Скільки їй років? — запитав.", "— Чорт її знає, — відповів Вадик, — я в паспорт не дивився.", "— Як вона взагалі? — запитав я далі.", "— Та ніяк, — відповів він. — Нічого не вміє, нічого не хоче.", "— Розійдетесь — скажи, — попросив я. — Я її навчу.", "— Аякже, — розсміявся Вадик.", "Я помітив, як він швидко старіє. Рвані капіляри, запалені ясна, чорні зуби. Риба гниє з голови, — подумав.", "Чого я насправді міг її навчити? Що я вмів? Уникати відповідальності, оминати небезпеки, говорити про речі, які мені нецікаві, спілкуватися з людьми, від яких нічого в цьому житті не залежить. Чого її міг навчити він? Теж нічого доброго. Ми просто говорили один одному необов'язкові речі, намагалися триматись упевнено й нахабно, нікому насправді не вірячи, нікого насправді не вибачаючи. За пару місяців Вадик спробував повіситись. Застряг у зашморгу, провисів якийсь час, доки прийшли знайомі й опустили його з небес на землю.", "Дев'ять років тому вона прийшла на відкриття виставки з Густавом, терпляче проштовхуючись слідом за ним крізь густий натовп друзів та знайомих. У Густава на шиї бовталась нова камера, час від часу він фотографував якусь із давніх подруг, котрих тут у нього було зо два десятки. Ми довго з ним обіймались, розпитували про новини, хоча й так усе один про одного знали: світ тісний, життя коротке, люди схильні до пліткування. Вона підстриглась, їй це пасувало. Раптом виявилось, що в неї цікаве обличчя. Коли вона відводила очі, риси її загострювались, ніби під шкірою в неї скресала крига й перетікала вода. Мала на собі шкірянку і яскраві помаранчеві панчохи. Зі стоптаними балетками все це виглядало трішки дико. Мабуть, вона багато ходить, подумав я, розглядаючи її взуття. Вона перехопила цей мій погляд, напружилась. Мене, ясна річ, не впізнала, розмову, звісно, не підтримала, проте погодилась вийти перекурити.", "— Ти з усіма моїми друзями зустрічатися будеш? — запитав я.", "Вона помовчала, певно, гадаючи, ображатись чи ні. Вирішила не ображатись.", "— У тебе хороші друзі, — сказала. — Ти б у них повчився манер.", "Треба ж, — подумав я, — мене вчить манер людина, яка спала з Вадиком Сальмонелою.", "— Не ображайся, — сказав.", "— Не буду, — відповіла вона й пішла всередину, грітись.", "За якийсь час Густава взяли в прес-службу мера. Потім звільнили. Камеру він продав. Квартиру теж. Життя позбавляє не лише ілюзій.", "Вісім років тому вона поступила на заочне відділення. Знайомі викладачі скаржились, говорили, що вона зовсім не розуміється на фінансах, хоча ми й самі, говорили вони, на них не надто розуміємось. Ніхто нічого не знає, скаржились, ніхто ні в чому не розбирається, ми всі імітуємо знання, імітуємо почуття, живемо ілюзіями. Хоча платити за все це доводиться живими грошима.", "Кілька разів ми перетиналися з нею на концертах, одного разу зіткнулися в підземці, якось я бачив її в компанії хасидів. Здається, вона робила для них екскурсію. Хасиди схожі були на велику родину, що купує помешкання в центрі й не розуміє, чому тут до сьогодні не вивели тарганів. У неї тепер знову було довге волосся, від чого вона виглядала дорослішою й досвідченішою. Хоча говорила так само недовірливо й виклично, ніби доводячи щось дорослим, наче намагаючись переконати всіх хасидів цього світу в доречності й необхідності запропонованої нею фінансової операції."], ["Сім років тому я змінив станцію. Для мене це був серйозний крок, я довго зважувався. Нове радіо цілком могло закритися вже за кілька місяців після відкриття. Проте це була справжня серйозна робота. Потрібно було вирішувати. Пару років тому я б навіть не став про це думати. А тут раптом запитав сам себе: скільки можна сидіти й робити те, що тобі не подобається, скільки можна гнути на когось спину, залежати від когось, під когось підлаштовуватись? Давай, говорив я собі, зважуйся, тобі не двадцять років. Вік Христа, час робити дива й підіймати з могил прокажених.", "Я наткнувся на неї випадково травневого ранку в центрі. Вона сиділа на сходах, під відділенням банку, ще зачиненим такої ранньої пори. Виглядала загубленою. Проте не плакала. Сиділа, підперши голову кулаком, дивилася в нікуди. На зап'ястку в неї бовтався невеличкий годинник, хоча запитай її, котра година, впевнений, вона б не відповіла. Просто не зрозуміла б запитання. Побачила мене, змучено кивнула. Щось примусило мене зупинитися. Мабуть, те, що вона кивнула першою. Я не чекав. Сів поруч із нею. Почав питати про справи, про навчання, про спільних знайомих. Вона кивала у відповідь, щось говорила, проте не надто охоче. Зрештою замовкла.", "— Щось сталося? — запитав я.", "— Та ні, — відповідала вона. — Просто мене цілу ніч трахали.", "— Цілу ніч? — не повірив я.", "— Цілу ніч, — підтвердила вона.", "Я не знав, що їй сказати. Почекав. Але вона теж мовчала. Поліз до торби, дістав тетрапакет із молоком. Простягнув їй. Вона зубами розірвала папір, пила довго й жадібно. Виснажливе це, мабуть, заняття, — подумав я, — цілу ніч трахатись. Помітив, як тремтять її пальці, ніби після активного заняття в спортивному залі. Помітив, як напружуються жилки на її шиї, коли вона закидає голову, п'ючи з пакета. Помітив темні кола під її очима, такі бувають лише в жінок, що народжують або просто недосипають, так чи інакше — такі глибокі прозорі кола бувають лише в жінок, які переймаються тим, що роблять, які бояться зробити щось не так. З утомленого й відстороненого виразу її обличчя можна було зрозуміти, як добре й важко їй сьогодні велося, як вона переживає через те, що сталося, як анітрохи не шкодує за тим, що відбулося. Від неї пахло теплою водою душової кабіни, чужим милом, ранковими сигаретами. Кров, здавалося, залишила її пальці, витікши з них на безпечну відстань. Натомість губи її — покусані й припухлі — темно горіли під ранковим сонцем, вона їх і далі постійно прикушувала, мовби згадуючи весь час, що з нею було цієї ночі, мовби ця ніч для неї все не закінчувалася. Мені навіть здалося, що вона найбільше й хотіла, аби ця ніч не закінчувалася, здалося, що разом із темрявою від неї відступило щось дуже важливе, щось, за чим вона негайно почала шкодувати — сиділа тут невідомо скільки, незрозуміло для чого й шкодувала за втраченим, сумувала з приводу щойно набутого. Я, мабуть, надто відверто розглядав її губи, аж вона захлинулася молоком, воно потекло їй підборіддям, вона швидко витерлась і далі прикривала губи долонею, говорила ніби не до мене, приглушено й рвано, торкалася рукою ран на тонкій вразливій шкірі, спиняла кров, що проступала після кожного необережного вигуку чи запитання, нервувала, розуміла, що я бачу, як вона нервує. Спробувала заговорити про щось інше, я відразу ж підтримав розмову, намагався не дивитись на неї, намагався демонструвати легкість та безтурботність, а сам лише й думав: «Її трахали цілу ніч! Цілу ніч! Цілу ніч вона була готова кохати й розуміти, цілу ніч вона не спала й мучилась, цілу ніч вона говорила якісь слова, вислуховувала чиїсь освідчення, запам'ятовувала обіцянки, не стримувалась і викрикувала слова радості. Цілу ніч їй було добре, цілу ніч їй не давали спати, цілу ніч її позбавляли спокою. Вона впадала в сон і вихоплювалася звідти назад — у чорне повітря, вона ловила чиєсь дихання, відчувала чиїсь дотики, намагалась підлаштуватись під чиїсь рухи, дослуховувалась до чужого серцебиття, звикала до чужого запаху, до чужого голосу, до чужої любові!»", "Я забрав у неї молоко, приклався до пакета.", "— У тебе немає якої-небудь роботи? — раптом запитала вона.", "— Запитаю в начальства, — пообіцяв я їй.", "Простягнув їй пакет. Вона заперечливо хитнула головою, мовляв, досить із мене на сьогодні. Я підвівся, попрощався, пішов додому. Молоко дорогою викинув.", "Начальство чомусь відразу погодилось її взяти. Тепер ми працювали разом. Вона сиділа в сусідній кімнаті й викачувала з мережі новини. Легко з усіма перезнайомилась, швидко обжилася, завела собі подружок. Мала добрий характер і погану пам'ять. Майже ніколи не злилась, майже ніколи не скаржилась. Не певен, що робота їй подобалась. Не певен, що вона взагалі вважала це роботою — безкінечне сидіння в мережі, постійні перекури й телефонні розмови, яскраве сонце за розчиненими настіж вікнами, голоси на сходах, автомобільна сигналізація, що раптово заводилась у свіжому ранковому повітрі. До мене вона ставилась із вдячністю, що мене неабияк дратувало, оскільки позбавляло наші стосунки будь-якої перспективи. Ми віталися зранку, пили палений коньяк під час чиїхось днів народження, потім вона десь зникала, а я робив вигляд, що так і має бути. Спробував було її кудись запросити, запропонував кудись разом піти, поговорити про щось, крім роботи, проте вона погоджувалась настільки неуважно й знуджено, що бажання йти зникало саме собою. Ладно, — думав я, — що за інтим у творчому колективі? Хай працює. Ти ж, — говорив я собі, — розмовляючи про неї з начальством, насправді не думав, що теж будеш трахати її цілими ночами? Чи думав? — допитувався я в себе. Давай, зізнавайся. Ну, думав, думав, — визнавав я зрештою, — ясна річ, що думав. Побачивши її тоді, виснажену й безкровну, про що іще можна було думати? І роки три тому обов'язково б довів почате до кінця, поза всяким сумнівом підловив би її на робочому місці й запустив би свої холодні долоні їй під помаранчеву футболку, натикаючись пальцями на тверді камінці її родимок. Хай би опиралась, хай би скаржилась начальству, хай би написала заяву про звільнення. Що мені з цього? Дивно, — погоджувався я із собою, — саме так би все й було. Навіть не знаю, що мене стримує тепер.", "Але щось і справді стримувало. Настільки, що одного разу, уже поночі, покидаючи студію й проходячи повз її робоче місце, я з подивом виявив, що вона залишила відкритою свою пошту. Спробував переконати себе не читати побачене, просто розвернутися й піти. Не переконав. Сів за її місце. Спробував переконати себе ще раз. Що з тобою? — звернувся сам до себе. — Ти ж не будеш із нею потім вітатись. Врешті підвівся, вимкнув її комп'ютер, зачинив за собою двері.", "А потім, під кінець літа, сталася така історія. Була це якась вечірня виробнича нарада, що непомітно переросла в пиятику. А я вже від самого ранку був у доброму настрої і тепер з оптимізмом дивився за вікна, де в сутінках, мов радіатори, охолоджувались важкі дерева, виснажені за день білим серпневим сонцем. Щось у мене ще зранку сталося радісного — зустріч із давніми друзями десь посеред вулиці, несподіване зависання в розпал робочого дня, п'яні обійми й солодкі спогади про всіх, кого давно не бачили, хто безнадійно зник у невідомому напрямку, обіцянки більше не губитися й підтримувати зв'язки, присягання й напучування, сльози й стриманий чоловічий спів. Одне слово, на нараду я прийшов, даючи всім неабияку фору. А вже під час неофіційної частини, у дружній невимушеній обстановці, мене годі було від чогось застерегти й бодай до чогось закликати. Так сталося, що вона, ясна річ, весь час сиділа поруч, просто біля мене, на чиємусь робочому столі, заваленому звітами й газетними вирізками, і я цілий вечір відчував, ясна річ, її тепло й м'якість, і в мені, ясна річ, зривало останні запобіжники, бо коли ж іще, думав я, як не тепер, ніколи більше, погоджувався я, лише сьогодні. Я говорив лише з нею й слухав лише її, лише їй розповідав героїчні історії й лише її думкою з приводу почутого цікавився. Якоїсь миті все це, ясна річ, стало виглядати аж надто відверто, і вона, як особа, що дбає про свою репутацію, але й, ясна річ, не хоче образити доброго приятеля, виявила ініціативу й запропонувала йти. Сказала, що ми можемо сидіти тут хоч до ранку, слухаючи важке дихання дерев за вікном, ніхто, ясна річ, не буде нас за це засуджувати, а проте вже пізня година, і якщо їй особисто все одно, бо живе вона тут поруч і від громадського транспорту не залежить, то ось моєю долею відверто переймається. Оскільки ще зовсім трішки — і метрополітен зачинить свої світлі брами для громадян пасажирів, і як я буду вирішувати проблему транспортування, вона навіть не знає, ясна річ, якщо я просто не додумаюсь викликати таксі. Але ж я не додумаюсь, правда ж? — запитала вона мене довірливо. Не додумаюсь? — перепитав я сам себе. Не додумаюсь, — відповів я чітко — їй і собі. Тож вона схопила мене за руку й потягла редакційними коридорами, вивела старими комунальними сходами, пройшла зі мною занедбаним темним подвір'ям, під низькими, як зимові хмари, деревами, під несподіваним нічним дощем. Перебігла зі мною вулицю, опинилася зі мною в парку. І саме там я спробував її зупинити й сказати все, що потрібно було в цій ситуації сказати. Ну й зробити все, що треба було зробити. І саме тоді з-за дерев вийшли дві печальні патрульно-постові тіні.", "І саме так усе це завершилось. Вона показувала журналістське посвідчення, я демонстрував прийоми самооборони, вона телефонувала в редакцію й передавала телефон патрульним, я намагався забрати в них гумовий кийок і передавав прокляття із самого пекла. Вона намагалася дати їм гроші, я обзивав їх при цьому проститутками. Забрали нас, ясна річ, обох. Утім, її відразу ж погодилися відпустити. А ось мені запропонували залишитися до ранку з ними, в опорному пункті. У неї сталася істерика, вона розплакалась, почала їх просити. Мене це ще більше наснажувало стояти до кінця. Коли один із патрульних відвернувся, аби взяти якийсь бланк, я зірвав у нього з паска газовий балончик і пустив під стелю веселий струмінь. Усі змушені були вийти в коридор, патрульні дали мені пару разів по ребрах, вона, схоже, добавила б, якби могла. Якось у них із патрулем несподівано почали складатися добрі стосунки — усі вони дивились на мене з неприхованим роздратуванням, усі засуджували мою поведінку. Мені це подобалось: нарешті я побачив в її очах хоча б якийсь інтерес. Хай цей інтерес полягав у бажанні якомога болючіше дати мені по шиї — вона дивилась на мене, вона не відводила погляду, усі дивились на мене, мене ненавидів увесь опорний пункт, я був героєм, заради цього варто було жити. Провітрили приміщення, повернулись усередину. Наказали вийняти все з кишень. Я неохоче погодився. Вона стояла поруч і уважно слідкувала за моїми рухами, наче боялася щось пропустити й не зрозуміти. Їй було доволі холодно в її футболці й мокрих після нічного дощу кедах, вона охопила себе руками за плечі й застигло дивилась, як я дістаю велику в'язку ключів з причепленими в якості талісманів кількома автоматними гільзами. Ключів у мене було багато. Мусив доглядати за двома квартирами в центрі: власник однієї, мій шкільний приятель, сидів, власник іншої, колишній напарник, переховувався, щоб не сісти. Я мав відмички від кількох поштових скриньок, оскільки доглядав за старенькими сусідами, що жили поверхом вище й на вулицю майже не виходили, проте вперто передплачували якісь наукові видання. Діти їх не відвідували, я був чи не єдиним, хто пам'ятав їхні імена. За ключами на стіл полетів записник. Патрульний знічев'я погортав його, натрапив на кілька знайомих прізвищ, боязко відклав набік. У записнику були номери телефонів, мабуть, усіх депутатів міськради. Принаймні достатня їхня кількість, аби створити в сесійному залі працездатну більшість. Можна було комусь із них зателефонувати, попросити про допомогу. Але права одного дзвінка мене позбавили, а всі мої три телефони вже лежали перед патрульними. Один був розтоптаний під час першотравневої демонстрації й перемотаний скотчем. На іншому стерлись літери, і я міг хіба що приймати вхідні. Третій був рожевого кольору зі стразами — мені його залишила сестра, коли приїжджала в гості. Хотів його викинути, а ось не встиг. Патрулі дивились на все це з дедалі більшою недовірою. Дістав візитки дитячих лікарів, яким нещодавно намагався допомогти, запросивши! їх на ефір, візитку якогось правозахисника, який приходив час від часу й скаржився на жорстоке поводження з вуличними тваринами, візитку молодої юристки, що захищала права працівників трамвайного депо, візитку власника грузинського ресторану, який усе запрошував на шашлики, проте я вперто не йшов, знаючи, які гроші за ним стоять, чий це бізнес і чия на ньому кров. Далі витяг кілька флешок, з десяток батарейок, жуйки, ментолові льодяники й чомусь металевий суддівський свисток. Свисток їх зацікавив. Вони крутили його в руках, передавали один одному, зрештою один із них, мабуть, молодший, відповідно прибитіший, не витримав, засвистів. Інший його осмикнув. Найбільше мене хвилювали презервативи. Вони лежали в задній кишені. Спочатку я сподівався, що їх не помітять, проте патрульні йшли до кінця, вимагаючи витягти все до останнього цента. Вона мовчала, запам'ятовуючи моє мокре, давно не стрижене волосся, чорну футболку з антиурядовим гаслом, темну кофту, залиту кавою, джинси, кросівки. Ніби ніколи цього всього не помічала, не звертала на все це уваги, не бачила слідів крові на рукаві, не зауважувала крапель гарячого асфальту на взутті, не знала, чим я займаюся в цьому житті, що мене цікавить, кого я ненавиджу, з ким воюю. Лишалися презервативи. І ось тут була головна проблема. З одного боку, заспокоював я себе, це добре, що вона побачить у мене презервативи. Вона відразу зрозуміє, що я серйозний і відповідальний чоловік, не пацан, тримаю все під контролем, налаштований на серйозні стосунки. Власне, яке там налаштований, заперечував я собі, стурбований, я б сказав — постійно тягаю із собою гандони, навіть на роботу їх беру. Зрозуміло, що в мене в голові, зрозуміло, чого мені від неї треба. Хоча, аргументував я собі далі, присутність у кишені презервативів свідчить про постійну бойову готовність, про ненав'язливу мужність і неприховану суворість. Я справжній чоловік, і соромитись цього смішно. Хоча, нагадував я собі, презервативи ці я тягаю вже місяці зо два. Вони настільки затягані й потерті, що говорити слід не так про мужність, як про безпорадність. Тому я демонстративно взявся за пасок, зняв його, передав патрульному. Удавися на ньому, — побажав наостанок. Вона вже не слухала — гнівно вискочила в коридор, люто гримнувши дверима. Можна було діставати презервативи.", "На ранок мене відпустили. Звісно, намагалися присоромити, певно, що пробували пояснити свої дії, само собою, виправдовувались, поза всяким сумнівом, дещо нервували. Повернули візитки, повернули флешки, повернули свисток. З ним я й прийшов на робоче місце. Вона сиділа за своїм компом. Я попросив її вийти поговорити. Вона мовчки погодилась. Узяла свою каву, вийшла в коридор, сіла на широке підвіконня. Я прилаштувався поруч.", "— Вибач, — сказав, — щось я зірвався вчора.", "— Буває, — відповіла вона, зробила ковток, обпекла піднебіння, закашлялась, занервувала. — Я просто хвилювалася.", "— Та ладно, — сказав я, забрав у неї каву, обпікаючи пальці, відставив чашку.", "Спробував її поцілувати. Вона демонстративно дістала жуйку, почала жувати, дивлячись кудись убік. Ладно, — подумав я, — не надто й хотілося. Хоча насправді хотілося. Звісно, що хотілося."], ["Восени вона звільнилась. На її місце взяли сина директора. За місяць нас накрив ОМОН. Увірвалися до директорського кабінету, забрали документацію. Директор запропонував колективу розпочати голодування. Я погодився. Зрештою я один і погодився. Директор подумав і поїхав до мера, домовлятись. Починалися веселі часи.", "Шість років тому, узимку, я зустрів її коло ювелірного. Біг на зустріч, дивився під ноги, раптом боковим зором побачив її. Відразу впізнав. Вона пофарбувалась. Їй це не личило. Зрештою їй усе це не личило — довга шуба, певно, з чужого плеча, якісь гренадерські чоботи, мужик у шкірянці, що дивився на неї важко, проте тримав за руку, не відпускав. Я кивнув, вона зробила вигляд, що не помітила, різко обернулась до свого мужика, сказала йому щось веселе. Я пішов далі, тим-таки бічним зором помітивши, як очі його звузились, ніби він дивився в бойовий бінокль, як він міцно стис її руку, як від досади заскрипіла його шкірянка.", "П'ять років тому я бачив її виступ на місцевому телебаченні. У титрах її називали громадською активісткою. Вона виступала за звільнення із СІЗО якогось бізнесмена, який зробив, виявляється, для міста дуже багато, а ось тут нещодавно, виявляється, був прихоплений правоохоронними органами за, виявляється, підозрами в несплаті та переховуванні, у чому особисто вона, виявляється, вбачає помсту з боку конкурентів і спробу дискредитувати його благодійну діяльність на користь харків'ян. Вона вже, виявляється, подала апеляцію і звернулася, виявляється, до батьків міста. Саме на них, на батьків, вона й розраховує, хоча поводяться вони, як мудаки. Цього останнього вона не сказала, проте в погляді її читалося саме це. Загалом про ув'язненого говорила з такою теплотою в голосі, що навіть ведучий не витримав і пустив рекламу.", "Чотири роки тому я поїхав із міста й не згадував про неї взагалі. Але потім таки повернувся, згадав.", "Три роки тому мені розповіли про неї історію. Виявляється, закінчивши заочне й знайшовши якусь пристойну роботу, вона набрала кредитів. Під шалені відсотки. Купила квартиру в новому будинку, збиралася туди переїжджати. І ось несподівано влітку все продала, зібрала заощадження, позичила якусь суму в рідної тітки й швидко розрахувалася з кредиторами. Після цього почалась фінансова криза.", "Два роки тому я зустрів її в грузинів. Сиділа сама, дивилась фільм на лептопі, пила червоне сухе. Побачила мене, напружилась, але помахала рукою, запрошуючи до себе. Я підсів, вона якийсь час розпитувала про здоров'я, сказала, що звільнилась, що займається духовними практиками. Карате? — перепитав я. Вона почала пояснювати. Я вже збирався сказати щось приємне й відвалити, коли вона раптом притримала мене за лікоть і сказала, щоб я на неї не ображався, що вона завжди відчувала до мене тепло і вдячність, що я справжній друг, а ось вона невдячна свинота, яка ніколи не цінувала мого дружнього до неї ставлення, а тепер ось потерпає від цього, мучиться, оскільки це неправильно, і так не має бути, і друзі мають підтримувати один одного, виявляти своє дружнє ставлення, оскільки саме на дружності й дружніх почуттях тримається справжня дружба поміж друзями. Мені здалось, що вона прямо тут, переді мною, займається своїми духовними практиками, я дещо незграбно її перебив, сказав, що теж завжди ставився до неї з теплом і вдячністю і що тішуся з нашої багатолітньої дружби. Під кінець навіть приобійняв її, ледь не розливши її червоне сухе. Ми обмінялись номерами, діставши телефони: вона — срібний і лакований, я — чорний і перемотаний скотчем.", "За рік вона передзвонила. Я довго не брав слухавку, записана вона в мене не була, дзвінки з невідомих номерів я намагався ігнорувати. Щось підказало відповісти. Вона була терплячою, дочекалася. Голос у неї був заплаканий. Привіталась, вибачилась, так і сказала: вибач, сказала, що турбую, мені просто немає до кого звернутись, батьки зовсім старі, роботи в мене немає, друзів, як виявилося, теж. У мене з тіткою біда — впала, зламала ногу. У її віці це початок смерті. Чому ти мені телефонуєш? — не зрозумів я. В тебе ж є знайомі лікарі, — пояснила вона, — я ж пам'ятаю, ти постійно спілкувався з якимись лікарями. Це були дитячі лікарі, — пояснив я. Яка різниця? — гаряче заперечила вона. — Може, вони порадять якогось спеціаліста, що спеціалізується на таких операціях? Я боюсь, що у звичайній лікарні її просто вгроблять. Пробий, ти ж можеш. Ну, тут вона, звісно, розплакалась, я спробував було її втішати, але вона від'єдналась. Я пробив, мені справді порадили лікаря, попросили зачекати, зв'язались із ним, передзвонили, сказали, що він у курсі. Головне, попередили, хай старенька скаже, що вона від тебе. Я передзвонив їй, мовляв, такі справи, ось номер, набереш, скажеш, що ти від Матвія, усе буде добре. І давай я під'їду, допоможу.", "Вона стояла під лікарнею. Плакала, витирала сльози вологими серветками, пальці дрібно тремтіли, нервово копалась у торбинці, шукала телефон, щось перебирала, змахувала з обличчя волосся, що знову відросло й навіть устигло вигоріти під літнім сонцем. Кинулась мені на шию, проте якось сухо й відсторонено, аж я сам відійшов назад. Не знаю, — сказала, — що робити: з операцією ніби все гаразд, але лікарі не дозволяють із нею лишатись. Що робити? — питала. — Чекати тут? Давай я тебе додому відвезу, — запропонував я. Вона безпорадно озирнулась на вікна лікарні. Пізній літній вечір. На всю лікарню світло горіло хіба у двох вікнах. Несподівано одне з них згасло. Вона погодилась їхати додому.", "Була це, наскільки я зрозумів, тітчина кімната. Жила вона, як можна було здогадатися, саме тут. Захаращене й заповнене книгами трикімнатне помешкання в будинку на Театральному. Четвертий поверх. Перед під'їздом вона на якусь мить завагалась, потім запропонувала зайти. Унизу з-поміж дерев світилися апельсинові ліхтарі. Повітря пахло дощем. Хоча дощу не було.", "Цілу ніч вона пила чай і розповідала жахи. Переважно про пошту. А потім про тітку. Про те, що тітка рано втратила чоловіка, який був жокеєм і розбився під час змагань. Для тітки це був удар, після якого вона так і не прийшла до тями. Ходила потім ціле життя на іподром. Брала із собою малу. Разом вони сідали на трамвай, тоді вони ще їздили до парку, сідали поруч, тітка весь час мовчала, мала не наважувалась її про щось питати, виходили коло іподрому, ішли на трибуни, тітка мовчала й дивилась на далекі неприкаяні фігурки жокеїв, мала читала програмки, вибирала, за кого вболівати, переживала, нервувала, ішла потім додому невтішна й знесилена. Тітка так і не вийшла заміж, хоча в неї, виявляється, були чоловіки. Мала, виявляється, завжди про це здогадувалась, тітка, виявляється, не надто їх і приховувала. З дитинства малій запам'ятались ці юні обличчя курсантів, по-підлітковому зсутулені постаті студентів і практикантів, по-дитячому розбите взуття петеушників у коридорі, по-молодечому різані дешевими бритвами підборіддя старшокласників і злісних дезертирів. Мала зовсім нічого про них не знала, вони виринали час від часу в темних коридорах, натрапляли на неї, виходячи з туалету, лякались її, стоячи в непричиненому душі, посміхались їй, заходячи з холодного балкону в теплу прокурену кухню. Тітка про них нічого не розповідала. А мала ні про що не розпитувала. Тільки коли залишалась у тітки ночувати, та кудись телефонувала й про щось передомовлялась або виходила в передпокій і довго й переконливо там із кимось говорила, повертаючись потім до малої й читаючи їй на ніч що-небудь пригодницьке.", "Так тривало до ранку: вона пригадувала й розповідала, говорила й уточнювала, і кожна щасливо завершена історія тягла за собою наступну, а кожен уміло закручений сюжет вимагав продовження й поглиблення. І всі мої спроби перервати її закінчувались нічим, а всі мої намагання попрощатись і вирватись назовні приречені були на невдачу — вона трималась за мене міцно й упевнено, розповідала безліч інтимних деталей, як близькому родичу, хворому на рак: усе одно він і так усе про всіх знає, усе одно він нікому нічого не встигне переповісти. Але щойно я намагався ненав'язливо торкнутись її руки, як вона підхоплювала свою теплу чашку, щойно я хотів поправити пасмо її волосся, що спадало їй на очі, як вона легко відхилялась назад і визирала у вікно, слухаючи нічний спів сирен, що лунав від ріки. На ранок попросила поїхати разом із нею. І як я міг їй відмовити?", "У лікарні я спробував заснути в загальній черзі. Пахло йодом. Мені здавалося, що я на морі у квітні. Кілька годин вона провела з тіткою, потім побігла аптеками шукати якісь препарати. Я погодився її почекати. Надвечір лікарі повідомили, що стара втратила свідомість. Хто б подумав, — дивувався лікар, — ніби все йшло як треба. Сподіваюсь, — сказав, — усе буде добре. Але ви про всяк випадок готуйтесь до найгіршого. Відкликав мене вбік, попросив забрати її додому. Я так і зробив.", "Ніч вона просиділа на балконі. Я приносив їй чай, приносив заспокійливе, приносив вино, приносив сигарети. Вона дякувала, намертво вхопившись пальцями в огорожу балкона. Я хотів розчепити їх і покласти її спати, проте спробуй розчепити пальці жінки, яка ризикує втратити все. Приніс плед, накинув їй на плечі, сів поруч, рахував до ранку метеорити. Нарахував два.", "Наступного ранку, о восьмій, зателефонував лікар. Заспокоїв, сказав, що ситуація нормалізувалася, попросив докупити ліків. Я запропонував їй лишитись удома, пообіцяв сам усе зробити. Вона, звісно, відмовилась.", "Третій день на ногах давався важко. Але чим далі, тим менше шансів у мене було від усього цього відмовитись. Півдня ми ганяли аптечними складами й кіосками, інші півдня вона простояла під дверима відділення. Додому ми потрапили десь опівночі. У неї знову були ніжні глибокі кола під очима від сліз та недосипання. У мене починались галюцинації.", "— Давай спати, — сказав я їй.", "— Ти йди, — сказала вона, — спи. Я все одно не зможу. Стільки всього сталося останнім часом.", "— Ну, тоді я з тобою посиджу, — найбільше мені не хотілося лишати її саму на балконі. — Розкажи що-небудь. Що там у тебе із заочним?", "— Усе добре, — відповіла вона тихо.", "— Хто ти тепер за освітою? — запитав я.", "— Податківець, — відповіла вона автоматично.", "— З тебе вийде добрий податківець, — запевнив я її. — А чим узагалі займаються податківці?", "— Збирають податки, — відповіла вона й простягла мені руку."], ["І потім з'являється це відчуття втраченого часу. Виростає в тобі, як риф, стає поперек горла, мучить, виснажує. Я познайомився з нею десять років тому, — думав я, коли вона востаннє скрикнула й затихла, дивлячись на мене в темряві, мовби перепитуючи, чи нікому я, бува, не розповім тепер про справжній колір її волосся, Про його крихкість і посіченість, чи не почну я хвалитись перед друзями та знайомими, що бачив її відвертою, чи не буду я потім нагадувати їй усі її вигуки й стогони, усю її грубість та ніжність, усі вигини й гострі виступи під її шкірою. Десять років тому їй було двадцять, вона ще нічого не вміла, але вона легко вчилась і ретельно повторювала домашні завдання. Де був я увесь цей час? Чим таким важливим я займався? Чому я не дізнався нічого про її звички та поведінку ще тоді — десять років тому? Чому я лише тепер побачив, як вона рвучко прибирає волосся, відвертаючись до вікна, як вона ранить нігтями власні долоні, коли хоче стриматись і не видати себе, чому лише тепер я довідався, що вона любить розмовляти в темряві, говорити, реагуючи на голоси й теплий рух у сутінках, чому я стільки часу не знаходив у собі сили піймати її, примусити її лишитись, примусити її робити те, що їй подобається? Десять років — час, достатній, аби все забути й вигадати знову, аби розкласти небо на частини й спробувати зібрати його ще раз, ані на мить не сумніваючись в успіху власної затії. Що сталося з усім тим часом, що минув, на що його було використано? Що сталося з нами за весь цей час? Я розглядав зблизька тонкі зморшки під її очима. Такі зморшки обов'язково з'являються в людей, які багато сміються. Які сміються багато й довго, — додав я від себе. Її обличчя набуло певної гостроти й дорослості, вона майже припинила користуватись косметикою, хоча все одно здавалося, ніби вона постійно фарбується. Можливо, через виразні очі, можливо, через тьмяність шкіри, що не ставала молодшою. Її ключиці були так само гострі, нігті були так само пощерблені в щоденних сутичках, коліна були в подряпинах, литки були в синцях, нагадувала вона циркову гімнастку, що останні десять років літала в повітрі, б'ючись і хапаючись за згустки й розлами наелектризованої порожнечі. Коли втомлювалась, просила принести води. Голос її пересихав, шепотіла вона хрипко, проте ледь чутно, ніби боячись розбудити ще когось, хто спав о цій порі. Змочувала губи, втішено переводила дихання й знову шукала мене серед перемотаних мокрих простирадл. О четвертій ранку, виговорившись і заспокоївшись, почала засинати. Говорила крізь сон, згадувала якісь імена, вказувала на тонкі шрами на шиї, дістала цигарку, попросила вогню, так і заснула. Я обережно вийняв у неї з пальців сигарету, поклав поруч із ліжком, на стілець, де бовтався її дитячий бюстгальтер і лежали мої невикористані презервативи. Подумав, поклав поруч запальничку. Розбереться зранку, — подумав. Третя ніч без сну робила речі прозорими, а сутінь — живою. Серце поспішало так, наче боялося спізнитись на потяг. Воно рвалось уперед, мов пес, якого довго тримали на ланцюгу. Тілом, від лівої легені до правої, прокочувалися солоні хвилі, глухо б’ючи по обшивці й незадоволено відкочуючись назад. Іноді в темряві спалахували іскри, іноді пролітали вогняні жуки. Потрібно було йти відсипатись. Я зібрав свої речі, у коридорі, як зумів, одягнувся, знайшов кросівки, вийшов на сходи. У під'їзді було світло й лунко, ніби в шахті, з якої вибрали вугілля, а наповнили натомість склом і сонячним пилом. За вікнами починався сухий серпневий ранок. Я рушив униз, рахуючи сходинки, збиваючись із ліку й рахуючи знову. Унизу, за дверима, на вулиці, почув якийсь рух. Пси, — подумав, — це вуличні пси чекають на мене, аби перегризти мені горлянку за всіх, кого я в цьому житті образив. Зупинився, зважився, штовхнув двері ногою. Вони зі скрипом розчахнулися. Світло вдарило мені в очі. Так, наче я вийшов із лабіринту, яким блукав останні десять років.", "Було їх багато. Я навіть не бачив тих, що стояли позаду. Але відчував їхнє тепло, від якого ніздрі й горлянка бралися кригою. З півсотні їх було напевне, а то й більше — очі ще не звикли до яскравого ранкового світла, обриси їхні чорно застигали, ніби вирізані зі старого заліза. Одягнені були по-вуличному, всім років по двадцять-тридцять, коротке волосся, зручне спортивне взуття, легкі куртки з капюшонами, темні широкі тренувальні штани. Стояли нерухомо, чекаючи, очевидно, на мою появу. Піймали, — подумав я й притулився спиною до цегляної стіни.", "Усі пильно розглядали мене, дивилися мені в очі, ловили мої панічні рухи. Нарешті один із них, старший, заговорив.", "— Звідси? — кивнув він головою на вікна вгорі.", "— Ну, — погодився я.", "— Давно тут живеш?", "— Недавно, — чесно відповів я.", "— Чорного знаєш?", "Я завагався. Хто вони? — подумав. — Що їм говорити? Чорного я знав. І він мене теж знав. Але я не знав, добре це чи погано. Вирішив говорити як є.", "— Знаю, — сказав.", "— Знаєш, де він? — старший підійшов до мене зовсім близько й притишив голос.", "— Та звідки? — здивувався я.", "— Точно? — перепитав старший, упритул наблизивши до мене своє обличчя. Пахло від нього бензином.", "— Точно, — я намагався не відводити погляду.", "— Ну ладно, — так само тихо сказав старший, — дізнаєшся — скажи.", "— А ви хто? — не втримався я.", "Старший на мить відсахнувся й подивився на мене, не приховуючи здивування. Потім знову нахилився й тихо заговорив. Майже зашепотів. Я ловив якісь його слова, інші натомість безнадійно пролітали повз мене. Перепитувати я не наважувався, слухав те, що міг почути, дивуючись і запам'ятовуючи. Бо говорив він речі важливі. Настільки важливі, що мені й чути їх було не обов'язково — я й так усе це знав.", "— Ми митарі, — сказав старший. — Митарі й сторожа. Ми збираємо данину з тих, хто винен, збираємо її для того, аби в усьому була рівновага. Ми забираємо зайве й повертаємо те, чого не стає. Ми полюємо на винних і підтримуємо боязких. Ми отримуємо мито з ощадливих і щедрих, з легковірних і підступних, ми збираємо його в горішньому місті й бідних кварталах за рікою. Ми беремо з підприємців та банкірів поважні щомісячні суми, але не гребуємо й мідяками робітників, чоботарів і перекупників. Ми складаємо монету до монети, банкноту до банкноти, ми фіксуємо кожен грошовий переказ і зберігаємо кожну фінансову розписку. Оскільки знаємо: ніщо не може залишатись несплаченим, не можна лишати по собі в цьому житті жодних боргів, не можна йти з цього життя боржником. Маєш повернути все, що тобі не належить, маєш розрахуватися за все, що отримав. Але ми збираємо не лише гроші й коштовності. Щомісяця ми збираємо несплачену злість, збираємо лють і запеклість, збираємо сміливість і застигле почуття помсти. А головне — ми збираємо всю несплачену любов цього міста, всю до крихти, всю до останнього подиху. Ми всі тут, у цьому місті, і є за великим рахунком митарями любові. Ми збираємо її щоранку, ми відшукуємо її щовечора, ми знаходимо її щоночі. Тому що не може бути любові несплаченої, любові, залишеної при собі, тому що вся любов належить цьому місту, тому що місто тримається цією любов'ю, наповнюється нею, ніби дощем восени, гріється нею, мов кам'яним вугіллям узимку. Без неї, без цієї любові, місто просто помре від холоду й спраги, його покинуть останні мешканці, вони вийдуть із нього, наче з лабіринту, не в змозі далі блукати цими вулицями й закутками без жодної мети. Тому — що б не сталося, що би з нами всіма не відбулося, які б скрутні часи нам не випало переживати, які б негоди не спали на наші дахи — ми вперто й наполегливо збираємо це велике невидиме мито, добираємо його атом до атома, подих до подиху, смерть до смерті. Знаходячи спільну мову з тими, хто нічого не приховує. Переконуючи тих, хто нам не довіряє. Знищуючи тих, хто стоїть нам на заваді. Так і передай Чорному, — старший повільно відвів голову, відступив убік, повернувся до своїх, щось їм сказав, повернувся, рушив до ріки. Решта рушила за ним. Залишились бензинові плями, у яких відбивалося вигоріле небо серпня.", "За тиждень вона переїхала до мене. Речей не брала, сказала, що взагалі не певна, чи в нас щось вийде. У нас вийшло. Але за пару місяців вона влаштувала грандіозну сварку. Усе як завжди — вогонь виник нізвідки, але зжер усе, випалюючи наші спогади, мов кораблі в порту. Вона довго кричала та ображалась. Я теж ображався, але радше на себе самого. Ідучи, вона сказала, що змінить номер телефону, аби я не дзвонив. Я просив не робити цього, пообіцяв не дзвонити. Але надвечір зателефонував, перевірив. Вона справді змінила номер. Ну й добре, думав я, далі злостячись на самого себе, добре, що я для неї помер, добре, що все це сталося так швидко, добре, що не було всієї цієї тяганини зі з'ясовуванням стосунків. Дуже добре, думав я, дуже добре. Хоча що доброго, коли подумати?", "За місяць вона повернулась. А взимку знову пішла. Цього разу попросила дати їй час на роздуми. Під час роздумів несподівано вийшла заміж. Зі мною, ясна річ, стосунків не переривала. Я почав ревнувати її до її ж чоловіка. Навіщо він тобі? — питав. — Для чого ти його тримаєш? Ти ж просто мучиш його. Вона погоджувалась, але, ясна річ, розлучитись із ним не могла. Та він би й сам не пішов. Я хотів із ним поговорити. Вона забороняла, влаштовувала істерики, говорила, що покінчить із собою, якщо він про мене дізнається. Ясна річ, обіцяла, що все владнає, обіцяла, що все буде добре. Навесні з чоловіком розлучилась. Навіщо ти взагалі з ним одружувалась? — питав я. Вона пояснювала, говорила щось про борги, які потрібно повертати тим, хто нас любить, про любов, яка рухає нами всіма, про сплату й розрахунки, чесність і справедливість. Я розумів, що вона й далі з ним бачиться, мені про це, ясна річ, не говорячи. Так почалося літо. У червні вона сказала, що завагітніла. Ясна річ, не від мене. Ясна річ, не від нього."], ["«Америка видається мені країною дійсно рівних можливостей, — повідомляв Боб Кошкін, пишучи короткі, проте місткі електронні листи рідним та близьким. — Основу цієї рівності я вбачаю в надійності конституційних норм і сталості демократичних засад. Я вірю в життєвість та гнучкість американської ліберальної системи, бачу майбутнє за виробленими нею принципами взаємодії великого капіталу з державними механізмами фінансового регулювання. Єдине, що викликає в мене певні застереження, та навіть не застереження: єдине, що мене по-справжньому вбиває, — це кількість тут негрів».", "Два місяці тому, на початку літа, він висадився на летовищі Джона Кеннеді й рушив уперед, почуваючись так, як, мабуть, почувався свого часу Колумб: хитавиця ще не відпустила, думка про океан викликала спазми, проте під ногами лежала Америка й час було братися до її підкорення та окультурення. Діставшись міста, Боб видзвонив колишнього однокласника, що вже з добрий десяток років топтав ряст на Іст-Віллідж. Однокласник прибув на зустріч за півгодини просто в банному халаті. Боб мав на собі ковбойського капелюха із зображеними по колу карпатськими оленями, легкий піджак та яскраві строкаті шорти. За шортами однокласник його й упізнав. Обійнялись, навіть розцілувались. Зовні були схожі на пару трансвеститів, що зустрілись після тривалої розлуки. Причому трансвестит у шортах зустрічі тішився, а трансвестит у банному халаті волів би її максимально відтермінувати. Додому Боба однокласник не повів. Сіли в китайців, замовили чай. Боб розраховував, що за нього заплатять, однокласник розумів, що таки доведеться. Боб дістав із татової шкіряної валізи, обліпленої ендеерівськими наклейками з ніжними жіночими головами, сувенірну тарілку, чомусь із видами Криму. Це тобі, — сказав. Однокласник подякував, побачив вид Ай-Петрі. О, — сказав, — я в Ялті вперше на трипер захворів. На тренувальних зборах. Бобу стало незручно. Забрати? — кивнув він на тарілку. Ні-ні, — заопирався однокласник, — по-своєму це приємні спогади.", "«Пам'ять, — зауважував потім Боб у своїх повідомленнях, — здатна примиряти в нашій уяві речі, на перший погляд несумісні й протилежні за своїм логічним наповненням. Іноді я думаю: з яких печальних епізодів складається наша свідомість, з яких невтішних випадків! Мабуть, саме всеохопність пам'яті й невідворотність спогадів і змусили людство вигадати спорт, мистецтво та анестезію».", "Однокласник провів його до метро й пішов собі, тримаючи під пахвою подаровану тарілку, ніби згаслий німб. Того ж вечора потягом Боб дістався благословенної Філадельфії. Знайти родичів виявилося зовсім нескладно: Кошкіних у телефонній книзі було лише двоє — тьотя Амалія й дядя Саша. Дядя Саша, щоправда, записаний був як Алекс, але Боба це вже не могло спинити — він відразу ж набрав родичів і натрапив на дещо сварливий дівочий голос. Це виявилась його кузина Ліліт. Боб довго пояснював їй мету свого приїзду та ступінь їхньої спорідненості, ковтаючи приголосні, не тримаючись думки, тиснучи передусім на дитячі спогади й притаманну їхній родині гостинність… Так, — кричав, — саме так: міжнародними авіалініями України! Хрестовим походом крізь усі д'юті-фрі! Не їв дві доби! Не мав жодних сумнівів, що знайду вас і зможу стиснути в братерських обіймах. Ліліт пояснила, як їхати. Порадила не їхати зайцем — вони ні за що платити не будуть.", "Кошкіни осіли у Філадельфії давно й надовго. З одного боку, швидко вивчили мову, з іншого — не забували про власне коріння. А оскільки коріння було щедро переплетене, вели вони доволі дивний спосіб життя. Дядя Алекс працював на велику фірму, що займалася продуктами харчування, тьотя Амалія була педагогом. Чи була вона при цьому безробітною, Боб не зрозумів. Радість родини, шістнадцятилітня Ліліт, навчалась і мріяла стати зубним лікарем. «Усе вірно, — писав із цього приводу Боб, — рівень наших життєвих потреб має визначатись рівнем наших можливостей. Саме тому я все життя мріяв стати королевою карнавалу де-небудь у Бразилії». Кошкіни доволі вибірково приймали американську дійсність. Попри роки, проведені на чужині, далі святкували всі радянські свята. Але й усі православні також. І єврейські, поза сумнівом. Тому великодні вечори для них непомітно перетікали в день солідарності трудящих. Дядя Алекс одного разу навіть вийшов цього дня на демонстрацію, піддавшись на вмовляння друзів із якогось дивного хасидського анархічного гуртка. Четверте липня, день незалежності, вони теж святкували, оскільки вважали чомусь це свято єврейським. Колеги дяді Алекса по роботі не заперечували, говорили, що мотивація в цьому випадку — не головне, головне — святковий настрій.", "Несподівана поява Боба викликала в родині Кошкіних сум'яття. Прибулець зі Сходу лякав своїми баками й барвистими шортами. Хотілось відразу попросити його показати зворотній квиток. Кошкіни давно перервали стосунки із заокеанською родиною, сам дядя Алекс згадував рідного брата, себто Бобового батька, виключно в негативному контексті, себто виключно як мудака. Було для того кілька причин: по-перше, тато Боба був партійним, по-друге, був нестерпним, по-третє, продавши родинну дачу, з молодшим братом ділитись не захотів. Тож лихі спомини про колишнє життя залишились, здавалося б, у далекому минулому. І ось це минуле знову ступило на їхній поріг, і як на нього реагувати — було поки що не зрозуміло. Дядя Алекс першого вечора про всяк випадок приготував святкову пасту, потому вся родина сиділа за великим столом і переглядала привезені Бобом сімейні фотокартки. На фотокартках молоді Кошкіни — Бобів папа Сєва та його молодший брат Шурік — білозубо дивились життю в недовірливі очі, зухвало кидаючи виклик непевному майбутньому. Папа Сєва був підтягнутий і самовпевнений, Шурік — пухкий і жіночний. Дядя Алекс на фотокартки дивився з відразою, всі ми жертви тоталітарної системи, — говорив він, тикаючи жовтим нігтем в чорно-біле зображення, — ви лише подивіться на мій живіт. Жіноцтво з цікавістю розглядало його округле черевце, говорячи, що як на жертву він доволі відгодовано виглядав. Яке відгодовано, — відбивався дядя Алекс, — я з дитинства боксом займався, у мене ось ніс у двох місцях зламаний, — демонстрував він усім свого великого доброго носа, — перетинка пошкоджена. До Боба жіноцтво відразу ж почало виявляти симпатію й гаряче підтримувало розмову. Тьотя Амалія — пишна й лагідна після сухого каліфорнійського — захоплено розглядала фото з кінця 70-х, всі ці пляжні сцени й пікнікові замальовки, злісно коментуючи зачіски та купальні костюми головних дійових осіб. Найбільше перепадало, звісно, дяді Алексу. Як у будь-якій родині, що проґавила свій шанс на спокійне розлучення, стосунки між ними трималися на взаємному пресингу, тож тьотя Амалія нараз увімкнула всі берегові вогні й узялася добивати нещасного дядю Алекса, вказуючи тому на невідповідність життєвих запитів та соціального статусу. Алекса вистачило ненадовго: десь поміж пастою та кокосовим печивом він з усіма розпрощався, побажав небожеві солодких снів, висловивши тверде переконання в тому, що Америка, як колиска демократії, зробить із нього людину, себто що він не повторить помилок його прибабаханого брата Сєви, а стане гідним членом відкритого суспільства. Тьотя Амалія запропонувала вважати це тостом. Ліліт присунулася до Боба з лівого боку.", "Опинившись поміж двох жінок, Боб ураз розслабився й заспокоївся. Зрештою він здійснив те, про що просив його батько, — знайшов рештки розкиданого світом сімейства, зібрав докупи всіх Кошкіних, відновив рівновагу, почув голос крові. Адже що таке сімейні стосунки? Пам'ять про померлих, турбота про продовження роду. До речі, про продовження роду, — подумав Боб і обережно кинув оком на Ліліт. Та нагадувала свою маму — мала такі ж широкі стегна, таку ж високу зачіску й яскраві уста. Мама й дотепер виглядала доволі пристойно, особливо як на свій спосіб життя. Дивлячись на неї, можна було передбачити, що чекає на Ліліт за якихось двадцять років. Себто можна було передбачити, що нічого доброго її не чекає. «Відсутність достатньо прозорих механізмів, — міркував із цього приводу Боб у листі до папи Сєви, — що забезпечують наше просування соціальними ліфтами, часто навертає нас до справ засадничо інтимніших, як от родинне життя, церковна заангажованість чи просто щоденні медитації. Хоча в більшості випадків усе закінчується наркологією». Ліліт цілий час сиділа поруч, потім і зовсім притислась до нього своїм гарячим стегном, відпускала критичні репліки щодо місцевих філадельфійських порядків, хвалила Боба за його чіткі життєві переконання, жувала гумку й пахла якимись убивчими ароматичними маслами. Добре було б її завалити, — думав Боб, розповідаючи жінкам про проблеми посттоталітаризму та ксенофобії в рідному місті. — Щоправда, вона моя кузина. Як це буде потрактовано? Тут, у країні перманентної демократії, такі речі, мабуть, і не вітаються. Якось це зовсім уже по-східному — спати з живою кузиною, є в цьому щось таке безнадійно наше, пост-тоталітарне. Тож він повернувся до тьоті Амалії, відчуваючи пекучий вогонь дівочого тіла й жадібно ловлячи ніздрями ароматизоване повітря. Тьотя Амалія тим часом теж розпалилась, курила ментолові цигарки, копалася ножем в охололій, наче небіжчик по довгій і невдалій операції, пасті, і розповідала про поневіряння їхньої родини, про довгі роки вигнання, про подорож у товарних вагонах і корабельних трюмах, про буферні зони й хімічну обробку одягу, про запах свободи й рівні можливості, про вичавлювання із себе раба, про перманентну демократію як передумову життєвої рівноваги та мультикультуралізм як основу мирного співжиття навіть із неграми. Найближчі нам за духом та моральними настановами, — говорила вона Бобу дещо зарізким нетверезим голосом, — безперечно, українці. Вони всі націоналісти. Це нас поєднує. Боб не бачив у її словах особливої логіки, проте сама тема розмови йому подобалась. На питання, що там, на батьківщині, які новини, яка ситуація, розповідав таке: безперечно, ми всі є свідками історичних катаклізмів, що невблаганно й безповоротно змінюють життя міста й характер його мешканців. Після довгих років боротьби до влади в мегаполісі прийшли жерці, фокусники та черевомовці. Скориставшись залишеними без нагляду соціальними ліфтами й опинившись на верхівці політичної піраміди, вони взялися за вирішення найнагальніших проблем міського самоврядування. Так, насамперед було поправлено та укріплено міські мури, особливо зі східного боку, звідки зазвичай очікується небезпека у вигляді кочових прикордонних племен, відразу потому відбулися глобальні зміни в міській забудові, зокрема, через головні вулиці в центральній частині міста було пробито два нові проспекти, один із яких простягнуто від східної брами до західної, а інший — від північних мостів до південних улоговин. У місці, де вони перетиналися, споруджено було піраміду, що символізувала архітектурну адекватність та фінансову прозорість нової влади. Звичним стало проведення масових акцій поклоніння культу предків та щонедільне освячення річкової води з метою подальшого її використання в комунальному господарстві. Збільшилась кількість знамен. На знаменах, — стверджував Боб, — зображено передусім левів, шакалів та бойових півнів, що мало би свідчити про тверду настанову нової влади на подальшу соціальну ломку. Попри всі очевидні й незаперечні реформи, проведені останнім часом, проблема посттоталітаризму та ксенофобії, за рваними свідченнями Боба, нікуди не щезла. Тому, скажімо, я, — сухо констатував він, — позбавлений щонайменшого шансу на просування вгору бодай якимись, бодай вантажними соціальними ліфтами. І все, що випадає на мій життєвий жереб, — це печальне скніння в тісних провулках приміського ґетто, тяжкий тягар неадаптованості, невтішне споглядання суспільної диференціації та релігійної нетерпимості. Ці суки, — плакався Боб, хапаючи тьотю Амалію то за руку, то за коліно, — ніколи, ви чуєте, ніколи не дозволять мені твердо стати на ноги!", "Тьотя Амалія слухала, знервовано стиснувши губи. Ліліт гладила його по плечу, від чого Боб плакався ще завзятіше. І лише коли десь поночі, після чергової пляшки каліфорнійського, він завів мову про двоголових працівників муніципалітету, у чиї обов'язки входить курування сектору освіти й спалювання відьом на центральному ринку, тьотя Амалія таки зібралася з духом і запропонувала всім іти спати, бажано вдома, бажано окремо. Наостанок висловила чітку впевненість, що Боб зробив правильний вибір і що Америка, ця колиска мультикультуралізму, таки зробить із нього людину. Якщо він, звісно, буде по-людськи поводитись.", "На пасту зранку було боляче дивитись."], ["Так почались його філадельфійські будні. Займатись особливо не було чим, до роботи його поки що ніхто не заохочував, зворотний літак, квиток на який Боб про всяк випадок узяв, був лише за два місяці, можна було пізнавати дійсність і заглиблюватись у невідоме. У перші дні по приїзді Боб сфотографувався з пам'ятником Сталлоне й відвідав український клуб. У клубі мав дискусію про націоналізм із народженими в екзилі українськими молодиками. Боба з огляду на його щедрі руді баки та важку вимову сприйняли за ірландця. Ще дивувалися, звідки цей траханий ірландець знає прізвища всіх українських депутатів. Мірялися силою на кулаках, співали бандерівських пісень. Боб намагався при цьому голосно протестувати, але всім здавалося, що він підспівує, стільки в його голосі було запалу й суто ірландської любові до України. Під кінець Боб заснув. Сидячи. Йому викликали таксівку. Постало питання, куди його везти. Знайшли його мобільний, побачили на заставці фото з пам'ятником Сталлоне. Туди й відвезли.", "Зазвичай пізньої ночі, коли вся родина Кошкіних розбрідалась помешканням, Боб читав листи з батьківщини. «Дорогий Боба, — писав йому папа Сєва, — ніколи й за жодних обставин не повертайся до цього Богом забутого міста! Спробуй зробити все, щоби залишитися там — у країні щоденної демократії, коло мого замудоханого брата Шуріка. Це місто не варте твоєї любові й пам'яті. Досить того, що воно вчинило зі мною, позбавивши віри, надії та партійного стажу. Нізащо сюди не повертайся! А якщо все-таки повернешся, дуже тебе прошу пошукати в яких-небудь китайців запасні диски для моєї газонокосарки». Мама писала менш патетично, проте не менш тривожно. Повідомляла, що в місті перешіптуються про дефолт і нове відключення світла. Нібито банківські автомати видають лише крупні купюри, та й ті мічені. І в питній воді начебто знайдено якийсь мутований різновид інфекційної палички, і це незважаючи на щонедільне освячення річок та озер, Бобочко, це незважаючи на всю їхню соціальну ломку! Подейкували також, що батьки міста отримали китайські паспорти, тож передача ключів від міських брам представникам китайської компартії була питанням часу. Натякали також, що ось-ось мають початись перебої з цукром та борошном. Одно слово, — завершувала мама, — життя сповнене оман і таємниць, і треба мати залізні нерви та холодне серце, аби дослуховувати ранкові новини хоча б до прогнозу погоди. Тож із нетерпінням чекаємо тебе на нашій гостинній землі!", "Куди цікавіше й безпосередніше писав Жорік — інший його кузен, дипломований медик, працівник однієї з цілодобових аптек. Жорік писав довгі повчальні листи, вдавався до моралізаторства, не гребував ліричними відступами. Писав, що Фома, їхній сусід по під'їзду, почав зустрічатись із колишньою проституткою. Весь під'їзд переживає. А Марік, їхній далекий родич через тьотю Марину, по ходу спить зі своєю двоюрідною сестрою. Ніколи не знаєш, — коментував ці випадки Жорік, — які сюрпризи готує тобі доля. Головне при цьому — не дивуватись. Не забудь принагідно передати вітання Лілічці, нашій милій кузині.", "Але про кузину Бобові нагадувати не було потреби. Ліліт оселилася в його серці, розвівши там цілковитий безлад. З думкою про неї він засинав, з думкою про неї прокидався. Зранку довго лежав на надувному матраці, де його розмістили родичі, і слухав, як за стіною вона прокидається й починає гарячково збиратися на навчання, як шукає одяг, як фарбується, як хапається за мобільний. Увечері, лягаючи спати, із завмиранням розбитого серця слухав, як вона триндить із кимось по скайпу, як готується до сну, як легко шурхотить її одяг, як вона солодко засинає, як до неї вві сні приходять кіногерої та професійні футболісти. Кілька разів він бачив, як вона виходила зі своєї кімнати напівроздягненою, одного разу вона попросила його защіпнути їй бюстгальтер, але він не впорався, ще й Амалія проходила повз, тож незручно було всім трьом. Час від часу він знаходив на кухні її трусики й сприймав це як підтвердження існування всіх святих. Іноді вона приходила лише над ранок, і тоді Амалія влаштовувала сварку, а Боб лежав на матраці й божеволів від ревнощів та співпереживання. День незалежності святкували тихо й по-сімейному. Ліліт була неуважна, з Бобом майже не говорила, батьків ігнорувала. Боб прикладався до сухого каліфорнійського й вів дискусії з дядею Алексом щодо впливу американської демократії на стабільність нафтового ринку. Амалія піддала вже зранку й тепер була цілком на боці Боба. На тому й розійшлись. Із Ліліт нічого не складалось. Боб безнадійно захандрив. Ще раз відвідав український клуб. Там його знову визнали за ірландця, але цього разу чомусь набили. Сонце над Філадельфією світило відсторонено. Повітря було просякнуте безнадією. Хотілося повіситись, краще за все в її кімнаті, краще за все ненадовго. Він пробував писати їй листи. Пробував підстерегти вночі коло її дверей. Проте все було намарне, і літо минало, відносячи за собою всі його надії та сподівання. Ліліт на вакаціях узагалі втратила совість і додому приходила хіба що за свіжим одягом.", "І ось десь на початку серпня, коли до літака залишалось якихось чотири дні, тьотя Амалія запропонувала влаштувати паті. На паті прийшла власне Амалія і Боб. Ліліт їхню компанію рішуче зігнорувала, а дядя Алекс завіявся десь по роботі, проте передзвонив і порадив починати без нього. Амалія пила й скаржилась на родинне життя, на чоловічу черствість і дитячу невдячність, Боб як міг її підтримував, так-так, говорив: черствість, невдячність, чорт знає що. Ближче до дванадцятої Амалія вирішила передзвонити доньці. Відразу ж почала сваритись, кричала, плакала, погрожувала. Несподівано передала слухавку Бобу. Що там у вас відбувається? — почув він спокійний і дещо холодний голос Ліліт. Боб озирнувся довкола. Амалія плакала в кутку, не випускаючи з рук свою ментолову. Стіл заставлений був порожньою тарою. У нас паті, — пояснив він кузині. Добре, — відповіла та, — тоді робимо так: поклади її спати. І сам лягай. Я незабаром буду. Голос її вже не звучав так металево, більше того — Боб зрозумів, до чого вона вела. Звісно, подумав, ось воно, вона все спланувала, вона все продумала, саме так — лягай, проте не засинай, дочекайся мене, я незабаром буду, я вже поспішаю. Говорила вона, що вже поспішає? Ясно, що говорила, він чув це на власні вуха. І тоді Боб допоміг Амалії піднятись на другий поверх, а коли та впала на ліжко, не скидаючи вечірнього домашнього халату, кинувся до себе й почав готуватись до приходу Ліліт. Прибрав брудний одяг, відніс на кухню немитий посуд, запалив свічку, від неї загорілись якісь журнали, залив усе це водою, потім хапливо провітрював кімнату, довго зачиняв вікно, не зміг, лишився спати на протягах. Чекав десять хвилин, потім двадцять, потім сорок. Поступово його охоплював розпач. Очі втомилися розглядати темряву. Раптом у коридорі щось скрипнуло. Двері, відразу ж зрозумів він, вхідні двері. Це вона. Коридором залунали невпевнені кроки, хтось пару разів наштовхнувся на стіну, двері до його кімнати теж скрипнули, тепла жіноча постать прослизнула крізь морок і опустилася поруч із ним. І перш ніж почати заготовлену промову про непереборність жаги й невідворотність спокуси, він завважив над собою дещо вибляклі кучері тьоті Амалії, і з жахом помітив ментолову сигарету в її правій руці, і з відчаєм відчув її ліву руку на своєму животі, а перш ніж тьотя Амалія встигла зробити для нього бодай щось як не приємне, то принаймні корисне, нерви його не витримали, рвучись, мов капронові струни, і накопичена ним за ці два місяці туга й покута вирвались назовні, обриваючи всі сподівання тьоті Амалії на довгу безсонну ніч, обриваючи всі розрахунки Боба на любов і взаємність. Амалія, до її честі, нічого не сказала. Лише сіла зручніше поруч із ним, дістала з кишені халата наступну сигарету й почала чекати. Боб у цей час говорив. Намагався говорити впевнено й сухо, так, щоби й не виправдовуватись і разом із тим все їй пояснити, так, щоби не виглядати смішно, але бажано все-таки перевести все на жарт. Довге утримання, пояснював він, схима й медитації, ми — воїни-монахи, маємо до діла не так із жінками, як із холодною зброєю, тож і не дивно, що сталась така оказія. Але не треба себе картати, — радив він Амалії, — не треба себе ні в чому звинувачувати: ти все зробила правильно, зробила, як зуміла, зробила, як звикла робити у своєму нещасливому жіночому житті. Просто він звик дещо до інших стосунків і до іншого градусу пристрасті, а що він має на увазі, він їй продемонструє прямо тепер — Боб говорив усе впевненіше, оскільки десь глибоко у своєму розбитому й нашвидкуруч склеєному серці відчував готовність продовжити це змагання. Тому перехопив її ліву руку й приклав до свого живота. Амалія було пожвавилась і навіть відклала набік сигарету, але варто було їй намацати в темряві те, про що розводився Боб останні сорок п'ять хвилин, як усе повторилось так, як і першого разу, і Амалія лише скрушно витирала руку об вилогу халату, а Боб відчайдушно забився під подушку від сорому та безнадії. Раптом вхідні двері справді скрипнули. Цього разу це була-таки Ліліт. Боб почув під горлом холодний кришталевий передзвін. Це осипалися рештки його серця. Амалія підвелась і, не ховаючись, вийшла в коридор. Щось запитала в доньки, щось їй розповіла. Ліліт легко засміялась, потому зайшла до своєї кімнати. У тиші лунко клацнув внутрішній замок у її спальні.", "На ранок Боб повідомив усіх, що має їхати просто сьогодні, оскільки до відльоту умовився про кілька важливих зустрічей у НЙ, тож не може марнувати й хвилини дорогоці
