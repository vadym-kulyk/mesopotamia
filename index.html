нного часу. Подякував за гостинність, пропонував заплатити за зіпсований кран у душовій, обіцяв писати. Нічого, — думав гарячково, — пересиджу три дні в однокласника. Головне — подалі від цієї ганьби. Як не дивно, рідня проводжала його ніжно й тужливо, закликала поїхати хоча б наступного дня, відмовляла, спокушала, напучувала. Найбільше через його від'їзд побивався чомусь дядя Алекс. Найменше — Ліліт. Амалія провела його до порога й ніжно поцілувала в губи."], ["Уся справа в жінках, — думав він, спостерігаючи, як потяг виривається з невеселих передмість на широкі обрії, — усе в нашому серці змінюється від нашого з ними спілкування, від нашого ними зацікавлення. Життя ніколи не дає гарантій, — думав Боб, — у більшості випадків воно просить повірити на слово. І коли ти довіряєш йому, коли стаєш відкритим та беззахисним, воно трощить усі твої сподівання, як велика вода трощить прибережні рибальські поселення. Усе моє завоювання дикої й непокірливої Америки обірвалося через надміру ніжні й рішучі жіночі руки, через надмірно глибоке й прокурене дихання однієї жінки та недостатньо дорослу, ба, навіть зовсім по-дитячому безтямну легковажність іншої. І хто зарадить мені в цій печальній ситуації? На кого можна покластись? Близькі не допоможуть мені нічим, оскільки не справа близьких займатися проблемами твоєї ерекції. Друзі не вирішать моїх проблем, хіба поділяться своїми власними. Що вони можуть мені розповісти, що порадити? Один із них спить із власною сестрою, інший — зустрічається з колишньою проституткою. А що мені до проституток? — міркував Боб, усе більше запалюючись. — Що таке проституція, якщо подумати? Безперечно, це життєва поразка, досвід падіння та смирення. Тоді що нас притягує до цих жінок? Що нас змушує подавати їм руку допомоги, що спонукає нас до порозуміння з ними? Суспільна зневага? Безперечно — суспільна зневага. Мужні й відважні чоловіки в останню чергу зважають на суспільне святенництво та подвійні стандарти. Радше навпаки — вони діють усупереч релігійним та моральним догмам. Вони тримаються цих не менш мужніх і відважних жінок, оскільки саме поруч із ними почувають повноту проживання та глибину відчуття. Адже хто взагалі йде в проститутки? Улюбленці долі, сильні, цілісні натури. Нестримні коханки, щасливі наречені, люблені діти. Студентки-відмінниці, робітниці-ударниці. Багатодітні матері з невичерпними запасами ніжності, вдови, що всиновлюють сиріт і люблять сухе дихання шампанського. То про кого ж мені й думати, — думав Боб, бовтаючись у тамбурі на під'їздах до НЙ, — як не про них, кого ж мені й славити у своїх щоденних духовних практиках? Адже більшість із них живуть життям значно сенсовнішим за моє, життям, сповненим суспільної доречності та громадської активності. Певен, що серед них якнайчастіше трапляються екологічні активістки й політичні діячки, культуртрегерки та церковні хористки. Безперечно, більшість із них знаються на політекономії та зв'язках із громадськістю, безперечно, для більшості з них близькими є неоліберальна модель економічного розвитку та болонська система освіти. Усі вони залюблені в хоровий спів та командні види спорту, усі вони поєднують захоплення серфінгом, великим тенісом та здоровим ранковим бігом. Зранку вони збираються в басейнах та спортивних залах і славлять провидіння за можливість бути дотичними до часу й простору, за шаленство бути зануреними в темне річище епохи, за мед на губах і троянди під ногами, за радість спілкування з найбільшими винахідниками та ентузіастами нашої героїчної доби. Боб раптом відчув, що марить. Можливо, навіть уголос. Добре, що навколо одні чорні: ніхто нічого не зрозуміє. Його й білі зазвичай погано розуміли, а що вже говорити про цих. Так чи інакше, починалася застуда, починалася прогнозовано, як жовтневі дощі. Потрібно було лікуватись. Потрібно було вертати додому.", "Ще на вокзалі він зауважив кількох стриманих, проте радісних китаянок, що сиділи у фастфуді над своєю локшиною. Їхні порцелянові шиї навчено згинались над їжею, ніби засвідчуючи жіночу покору та непоквапливість. У підземці йому трапилась компанія італійок, що запекло розглядали карту міста й сперечались так гаряче, ніби читали вголос ранні футуристичні маніфести. Від них пахло теплом і ніжним, ледь відчутним потом, що нагадував Бобу річкові заплави й штучні озера його рідного міста, кабінки для переодягання та серпневі пляжі з їхнім сонцем та антисанітарією.", "Однокласник слухавку не брав. І на листи теж не відповідав. І вдома його теж не виявилось, хоча Боб на це й розраховував, швидко в неті знайшовши необхідну йому адресу. Нічого, — намагався він не гарячкувати, — пересиджу до завтра, має ж він озватися. У кишені його шортів лежав паспорт, зворотний квиток і остання сотня. Витрачати гроші на гостел не хотілось. Боб поволікся гарячими вулицями, вірячи в знаки й не втрачаючи віри в людське призначення. На перехресті його необережно черкнула своїм чорним розвіяним волоссям шалена пуерториканка. У маленькому грецькому магазині, куди він забрів по воду, до нього притислась, виходячи, світловолоса й легко одягнена німкеня з ніжним світлим пушком на тренованих стегнах, з підкачаним животом, з пірсинґом, що бовтався в неї на носі, ніби кільце з інформацією на лапці домашнього голуба. Він тягнув у руках валізу, що ставала чимдалі важчою, і мріяв про перепочинок, мріяв про гарячий чай і холодну жіночу шкіру. Надвечір набрів на український клуб. Там його напоїли поляки. Випивши, він пробував заплатити сам і за себе, і за своїх друзів, проте поляки навідріз відмовились, запевнивши, що для них честь споїти такого пекельного ірландця, що Ірландія взагалі країна-посестра Польщі. Бо у вас такі жінки! — захоплено кричали вони, заздрісно позираючи на його баки, — у вас такі жінки! Руді й гарячі, мов білки! Блідошкірі, як медузи! Високі, наче корабельні сосни. Всіяні ластовинням, ніби сузір'ями, за якими капітани ведуть свої кораблі!", "Ночувати, втім, Боба із собою не забрали, обмежились словами подяки та черговим захватом із приводу ірландських жінок. Навіщо вони мені про це говорять, — плакав Боб, лежачи на прогрітій за день лавці під гостроверхою протестантською церквою, — навіщо вони викручують із мене душу? Що мені до ірландських жінок? У мене жодного разу не було ірландської жінки. Навіть північноірландської жодного разу не було! У мене не було жодної пуерториканки, жодної бразилійки, жодної перуанки. Я не знаю, яка на смак їхня любов, яка вона на дотик, як вона вимовляється їхніми устами. Я просто хочу додому — до міста сонця, яке я залишив так легковажно, від якого я так необачно відійшов на небезпечну відстань, аж утратив будь-яке його відчуття. І всі інші відчуття я теж давно утратив, — додавав подумки Боб, бо саме так воно й було: він не відчував власного горла, не відчував язика, не відчував болю, не відчував життя. З тим і заснув. Снилась йому королева Англії.", "Ранок приніс полегшення та надію. Температура спала, тілом клекотала застояна за ніч кров, голуби сиділи на валізі й видзьобували очі жінкам на наклейках. Проте в парку навпроти робила якісь свої неймовірні вправи юна темношкіра дівчина. І ноги її при цьому заплітались у такі небачені вузли, що Бобу враз пропав увесь ранковий настрій і повернулась учорашня туга й невпевненість. Ідучи до однокласника, він старанно оминав сонячних офіціанток, що виносили стільці й застилали столи білосніжними скатертинами, оминав літніх поштарок, що дивились на перехожих уважно й трепетно, як на потенційних власників поштових скриньок. Оминав зовсім стареньких монашок, що зблискували керамічними щелепами, оминав тілистих жінок-поліцейських, у чиї руки хотілося віддатись і чиїми кайданками хотілось навіки бути скованим. Однокласника далі не було вдома. Розпитування в сусідів не дало нічого доброго, радше навпаки — із сусідньої квартири вискочила японка, вистрибнула, недбало прикриваючись ковдрою, та що там прикриваючись — розмахуючи нею, ніби прапором. Око Боба мимоволі, проте чіпко ковзнуло й темними голеними литками, й золотими від світла стегнами, й усім, що було в неї ще, і хай було в неї всього не так багато, з огляду, скажімо, на вік, проте й цього виявилось достатньо, аби він увійшов у стан тяжкої меланхолії, подякував незрозуміло за що, попрощався невідомо навіщо й побрів до найближчого парку, де просидів до вечора. Увечері надибав церковну їдальню, повечеряв, розповів жінкам, що розливали суп, про свої поневіряння. Жінки слухали уважно, проте супу більше не пропонували. Проститутки, — злився про себе Боб, — справжні проститутки. Хіба цього вчить їх їхня віра? Хіба до цього закликають їх їхні пастирі? Чому б не лишити мене в цій чортовій їдальні до ранку? Проститутки, — лише й повторював він, — ага, проститутки. Єдині, хто зрозуміє мене в цьому місті, — це саме вони. Єдині, на кого можна покластися. Єдині, хто мені справді допоможе. У мене лишилась ця чортова сотня, не везти ж мені її додому? — намагався логічно міркувати він. Сувеніри? У нас їхні сувеніри коштують дешевше. Гостел? Для слабаків. Я просто маю тут знайти собі жінку. Я маю все виправити, маю все відновити, маю пустити свіжу воду старими річищами. Я просто мушу виловити яку-небудь суринамку. Або ефіопку. Ефіопка вдихне мені в горло радість і спокій. Саме так і станеться. Або, — розмірковував він далі, лежачи на тій-таки лавці й підклавши під голову валізу, — японка. Японки вміють язиком воскрешати померлих. Вони піднімуть мене, як Лазаря, відчистять мене від глини й темних водоростей, зрушать із місця мої внутрішні органи, що застигли тепер, ніби замерзлі паровози. Або, — вже зовсім уві сні продовжував він, — бразилійка. Королева карнавалу. Зі стопами гарячими, як перегоріле вугілля. З долонями вологими, мов прибережне каміння зранку. Гнучка й витривала, вона доведе мене до брам аеропорту, посадить на необхідний рейс і стане потому писати жартівливі короткі листи ні про що. Вночі пішов дощ. Прокинувся Боб із температурою й закладеним носом. До літака залишалась доба.", "Але навіть закладеним носом він усе одно відчував запахи й дими цього міста, його серпневу шкіру — випалену сонцем, вибілену океаном. Дивився на вуличних птахів — навдивовижу спокійних, як на такі галасливі умови, дивився на йогів та монахів, спостерігав за драконами на дахах і гієнами при сміттєвих баках, прикривався рукою від кривавого ранкового проміння, кутався в обвислий від дощу піджак, а проте не ставало йому ні затишніше, ні тепліше. І коли вже виникла думка їхати на летовище й чекати там добу до завантаження, покликав його гурт життєрадісних пияків, які завважили його ще раніше, проте з притаманною справжнім пиякам делікатністю не наважувалися відірвати від самокопания та печальних світанкових рефлексій. Аж ось, коли побачили, що справи зовсім погані і що вигризають чоловіка сього зсередини біси ранкової невтіхи, тоді гукнули вони його, і покликали, запрошуючи до загальної учти, і пригостили дивним напоєм. Як називається напій, не знали й самі аборигени, сказали лише, що отрутою цією торгують поляки у своєму магазині, назву ж її не можуть вимовити навіть вони — польські продавці. У польській мові стільки шиплячих, — захоплено кричали вони Бобу, все підливаючи й підливаючи, — що ми навіть боїмося собі уявити їхню службу Божу! Бог, мабуть, прокидається щоразу від псалмів із такою кількістю шиплячих! — казали вони Бобу, і той їм навіть щось на це відповідав, проте його ніхто не слухав, усі лише говорили й говорили, і гієни перебігали в затінок, а жовті змії звивали собі гнізда в металевих смітниках. Сонце палало над дзвіницями й рекламними щитами, відбивалося у високих вікнах, де стояло тепле повітря, де кімнати наповнювалися життям і на пожежних драбинах гуляли серпневі протяги. Жінки, ідучи вулицею, всміхалися до нього, привітно махали йому хустками й капелюшками, вигукували щось радісне й ніжне, щось, настільки щільно зліплене з шиплячих та йотованих, що Боб не наважувався торкнутись цих золотих щільників їхньої мови, наповнених радістю й насолодою. Саме з потребою радості й насолоди він і прокинувся, саме їх він потребував якнайбільше, саме за ними він, підвівшись і знайшовши поруч неторкану ніким стару татову валізу, рушив крізь пізні вечорові сутінки вперед — у пошуках громадського транспорту, у пошуках братерської любові."], ["Знайшов він їх у Бронксі, куди дістався, перетнувши ріку. Стояли вони під будівлями банків та зачинених магазинів з одягом. Можна було навіть подумати, що саме в цих магазинах вони й одягаються. Боб завмер, насторожено повів носом, як бувалий вуличний пес, подумав розвернутися й рушити назад, однак розумів: якщо не тепер, то вже ніколи, буду потім картати себе за слабкодухість, буду шукати виправдання своїм страхам і комплексам. Давай, Колумбе, воруши ластами, — підштовхнув він себе назустріч усім пуерториканкам та суринамкам Бронкса. Перехопила його, втім, якась невисока на зріст, фарбована в чорне, гостроноса й худюща риба-тріска з неправдоподібно великим і, відповідно, принадним бюстом і таким оксамитовим голосом, що серце його знову озвалося з небуття. Хочеш відпочити? — запитала тріска довірливо. А що ти робиш? — запитав її у відповідь Боб, із завмиранням серця прислухаючись до западання її голосу. За півсотні зроблю тобі добре, — пообіцяла вона, роблячи рукою такі рухи, ніби чистила зуби. — За двісті — все інше. Не бійся, усе чесно, усе легально, тут поруч. Тебе як звати? Боб відповів, вона не запам'ятала. Своєю чергою повідомила, що її звати Мел. Мем? — перепитав він. Забудь, — сказала вона, — неважливо. Зійшлися на півсотні. Мел-Мем упевнено взяла його під руку. Повела вулицею. Подружки її відводили від них очі. Далеко ще? — запитав Боб. Триста метрів, — заспокоїла вона. — Але мені важко йти. Боб нарешті звернув увагу на її високі підбори. Іти їй, мабуть, справді було нелегко. А йти було потрібно. Я викличу таксі, — запропонувала вона. Боб напружився, проте не заперечував. Вона махнула рукою. Таксі ніби на це й чекало. Сіли, проїхали два будинки, зупинились. Заплати йому, — тихо попросила вона. Боб тицьнув таксистові десятку. Той весело подякував. Таксист його чомусь заспокоїв. Міг же завезти за місто, — подумав Боб, — і там розчленувати. Я би принаймні так і зробив. За китайським рестораном пірнули в браму, пройшли подвір'ям, оминули блискучі металеві баки зі сміттям. Піднялися сходами, відчинили темні непримітні двері. При вході на стільцях сиділи двоє охоронців. Ковзнули недобрими неуважними поглядами, повернулись до своєї розмови. Вона вихопила в одного з них ключ, потягла Боба крутими сходами нагору. Стінами висіли червоні ліхтарі, підлогу застелено було білим кудлатим килимом. Нагадувало фотолабораторію. Особливо запахами. Пройшли в кінець коридору, вона відчинила двері, зайшла першою, він зазирнув слідом. У кімнаті було вогко й напівтемно. Ліворуч стояв невеликий порожній столик, праворуч темніло величезне ліжко з якимись дивними дерев'яними закрутами, шовковими покривалами та іншою хрінню. Подібне ліжко стояло в спальні дяді Алекса, — раптом згадав Боб, і стало йому від цього спогаду ще сумніше. Збоку прочинені двері вели до невеликої душової кімнати. Там горіло світло, висіли чисті рушники. Вона відразу ж узялася порядкувати, як гостинна господиня. Значить так, — сказала, — ти хочеш у душ? Третю добу, — відповів Боб. Добре, — погодилась вона, — дай мені трішки грошей, я куплю алкоголю. Тут потрібно купувати алкоголь, — пояснила. Який алкоголь ти будеш? Є що-небудь польське? — поцікавився Боб. Дізнаюсь, — пообіцяла вона, узявши гроші. — А що в тебе з носом? — зреагувала на застуджене Бобове шмаркання. — Наркотики? Бокс, — пояснив Боб, — пошкоджена перетинка. Вона мовчки розвернулась і вийшла.", "Звісно, що вона не повернеться, — думав він, лежачи на ліжку й розглядаючи тіні на стелі, — ясно, що вона давно залишила цей будинок і розчинилась у невідомому напрямку. Певно, що я ніколи більше її не побачу. Звісно, що при зустрічі я її просто не згадаю. Мем, мем, де ти тепер? Нащо ти затягла мене на ці пекучі простирадла? Нащо ти кинула мене посеред цієї задушливої ночі — без любові, без співучасті, навіть без алкоголю?", "Двері тихо відчинились, і вона прослизнула всередину. Як ти тут? — запитала. — Що душ? Працює, — коротко відповів Боб. Вона не зрозуміла й простягла йому його склянку, повну золотої отрути. Якщо не помру — здобуду безсмертя, — подумав Боб і випив. А далі вона взялась до справи. Взялась завзято, проте було в цьому завзятті щось механічне, щось декоративно-оздоблювальне, невтішне й цілком безперспективне. По-перше, вона примусила Боба лягти й не рухатись, загалом, складалося враження, що вона боялась його активності, боялась його здатності самостійно пересуватись, насторожено слідкувала за його гримасами, прислуховувалась до клекотання в його горлянці, обережно промацувала — ніби між іншим, ніби задля його ж задоволення — кишені його безумних шортів: чи немає там, бува, яких-небудь психотропних засобів або, на крайняк, такої-сякої холодної зброї. По-друге, вона відразу ж узялася стогнати. І це — не перериваючи процесу! Стогнала заведено й затято. Боб якоїсь миті відчув себе немовлям, яке заколисують. Навіть підвів голову, аби подивитись, чи з нею все гаразд. З нею все було гаразд, на відміну від нього: вона старанно трудилась над ним, допомагаючи собі у дві руки, ніби добувала вогонь із відсирілого дерева. Зрештою теж підвела голову, перехопила його погляд. Важко зупинилася, закинула назад пасмо волосся, що спало на обличчя. Що, — запитала, — забагато алкоголю? Так, — відповів розчаровано Боб, — і його теж. Ну, послухай, — вона поставилась до справи відповідально, чимось цей ковбой з ірландськими оленями на капелюсі її таки зачепив, не хотілося відпускати його ні з чим, — давай так: докинь ще півсотні, дозволю взятися за груди. Що дозволиш? — не зрозумів Боб. Але вона вже вивільнила свій дивовижний космічно-синтетичний бюст. І вже гойдала ним у синьо-рожевих сутінках цієї фотолабораторії, і що йому лишалось робити. Доберуся до літака зайцем, — подумав Боб. Мем, — сказав тихо, проте впевнено, — ось усе, що лишилось. Тут немає півсотні, але ж і я нічого вже не хочу, погодься. І вона погодилась. Узяла його останні м'яті купюри й знову стала до праці, ніби востаннє, з твердим наміром не відступати до переможного кінця. А коли й це не допомогло, знову відірвалась на мить і сухим (але таким оксамитовим, таким глибоким!) голосом працівника нотаріальної контори повідомила, що коли він протягом ближчого часу не кінчить — доведеться платити ще, а оскільки платити йому немає чим (і вона прекрасно це розуміє!), то вона навіть не знає, чим усе це закінчиться. Ну, самі знаєте, як це зазвичай буває. І тут можна було б сказати, що він почав пригадувати якісь потаємні, якісь приховані й недомовлені видива й переживання, що сталися з ним у цьому житті, що він розгледів у прозорій незворушній темряві, скажімо, найкрасивіші жіночі обличчя, що вийняв із закамарків минулого свої найбільші мрії та сподівання, але ні, нічого подібного: механіка жіночої ніжності, тяглість інтимної праці роблять зазвичай своє солодке діло, тож не минуло й кількох хвилин, як усе щасливо для всіх присутніх завершилось, без жодних фінансових ускладнень, без жодних несплачених боргів і невиконаних обов'язків. Вона витирала його паперовими рушниками, він дивився на її темний обрис і згадував, як пальці його натрапили на тонкий, ледь відчутний шрам під її грудьми, очевидно, після того, як вона закачала собі під шкіру весь цей пластилін, від чого груди її стали ніжними й пружними, ось тільки шрами нікуди не зникли. І не зникнуть уже ніколи.", "Потім вона якийсь час сиділа з ним у напівосвітленій кімнаті, всіляко вдаючи, що ніхто нікуди не поспішає, що до клієнта тут ставляться з повагою, що її цікавить не лише те, як він це робить (тим більше, кого це могло зацікавити?), а й чим він живе, тож вона спробувала з ним поговорити і розповіла про себе, сказала, що сама вона стовідсоткова американка (велика радість, подумав він), із порядної родини (воно й видно, спало йому на думку), закінчила нормальний коледж (років тридцять тому), була в шлюбі (з підаром якимось, очевидно), але так сталося, що доля закинула її сюди (не найгірший для тебе варіант), і ось тепер вона мусить займатись цією не надто шляхетною справою (так займайся ж, хулі), але вона вірить, що все стане на свої місця (ну, це навряд) і вона отримає-таки вищу освіту (хіба в Україні, мем). А ваші жінки, — запитала вона в Боба, — вони які? Наші жінки, — відповів їй на це Боб, — мають одну дивну властивість: вони вагітніють поза сексом. Як це? — не зрозуміла вона. Так, — підтвердив Боб, — вони запліднюються, мов квіти: вітром і сонячним промінням. Вони використовують для цього бджіл і метеликів, вони підставляються навесні сонцю та місячному сяйву й несуть свій тяж легко й радісно, ніби нове знання, отримане у вищій школі. Ну а секс? — не зрозуміла вона. А секс, — пояснив Боб, — вони сприймають як найвищий вияв своєї любові, як найтоншу межу своєї прив'язаності, за яку так страшно заступити, але від якої так важко відмовитись. Вони й виростають заради того, аби любити, виховуються заради того, готуються до великої пори кохання й відданості, до щемкої залежності від очікувань та розставань. Чоловіки знають про це й теж готуються до того, що їм доведеться в їхньому житті мати справу з жінками, ніжність яких є невичерпною, а пристрасть — некерованою. Там, де я живу, — сказав він, — стільки любові, що чоловікам немає сенсу кидати своїх жінок: усе одно рано чи пізно вони закохаються в них знову. Кому потрібні зайві рухи?", "— Послухай, — перепитала вона, — а ти точно не на наркотиках?", "У брамі, при виході на освітлену вулицю, на нього вже чекали. Був це великий суринамець чи, можливо, навіть ефіоп — було темно й загрозливо, Боб вийшов, і той просто перепинив йому шлях. Ну що, малюк, — сказав, щойно Боб спробував його обійти — ти ж знаєш, що я по твою душу, не обійдеш, не оминеш. Боб зупинився. У темряві чорного майже не було видно, так, мовби порожнеча зливалася з порожнечею і з порожнечі промовляла порожнеча. Давай, — сказав він Бобу, — вивертай, що там у тебе в кишенях. Знаю, що ти боксер, але і я не такий простий, як тобі здається. Бобу він простим саме й не здавався. Боб його взагалі не бачив, лише чув. Але вже з упевненості цього голосу розумів, що відступати просто немає куди. І сподіватися тут, у цій частині світу, серед цієї темряви й порожнечі, теж немає на кого. Розумів, що оманлива доля закинула його так далеко, що далі вже нічого немає — світ обривається й закінчується, і починається лише його відсутність. І що звідси можна лише повертатися назад. Але для цього потрібно якось порозумітися із суринамцем. У сенсі ефіопом. У мене нічого немає, — сказав він змучено, — ти ж сам знаєш. Нічого я не знаю, — заперечив йому чорний, — давай, вивертай кишені. Інакше тут і залишишся. І тоді Боб сказав йому так: добре, — сказав, — чорт із тобою, у мене для тебе таки щось є. І дістав звідкись із потаємної внутрішньої кишені шортів дещо затасканий, проте ще доволі запашний згорток, щось, поза сумнівом, коштовне, щось дбайливо й уміло загорнуте в жовту газету, друковану потойбічною мовою, себто такою, якої тут ніхто не розумів, якою тут ні з ким не можна було порозумітись і нікому не можна було освідчитись.", "«Смерть, — писав Боб безпосередньо перед відльотом, сидячи в терміналі й очікуючи на посадку, — часто вводить нас в оману своєю присутністю. Іноді ми сприймаємо її появу на свій рахунок, хоча поява її не обов'язково стосується саме нас. Смерть присутня в нашому житті як любов, як довіра або ностальгія. Вона виникає нізвідки, вона рухається своїми напрямками, і годі навіть мріяти якось на ці напрямки впливати. Залишається хіба що вірити й сподіватись. Залишається любити й приймати життя таким, яким воно є. Себто нестерпно неймовірним. Себто неймовірно нестерпним»."], ["Наприкінці серпня вона знову зателефонувала.", "— Чув, що з Лукою? — запитала. — Рак горла. А він зовсім не хоче лікуватись.", "— Чув-чув, — відповів я. — Ти для цього телефонуєш?", "— Так. У нього день народження післязавтра. Він просив, щоб усі були. Думаю, хоче попрощатись. Ти поїдеш?", "— Якщо просив — ясно, що поїду. А ти?", "— Я тому й дзвоню. Поїхали разом.", "— Поїхали, — відразу погодився я. — Ти машиною будеш?", "— Та ні, я електричкою збиралась. Тому й прошу тебе поїхати разом.", "— Правильно, — підтримав я її, — хто на день народження їздить машиною. Жодного тобі алкоголю.", "— Який алкоголь, Матвію? — образилась вона. — Я на четвертому місяці.", "Вона чекала на мене коло кас. Довге волосся, зав'язане в міцний вузол — для надійності, для безпеки, для зручності. Кросівки, джинсовий комбінезон, теплий светр. Зовсім не помітна вагітність, серйозне обличчя. Стояло сонце, проте вона була одягнена, ніби для довгої нічної виправи. Я у своїй заношеній футболці почувався поруч із нею як пляжник на готельній рецепції. Вона першою простягла руку, потім не втрималась, охопила мене руками за шию — досить стримано, аби я собі чогось не надумав, проте й доволі щиро, аби не забував, куди ми їдемо.", "— Подарунок якийсь потрібен? — запитав я, не відпускаючи її.", "— Який подарунок? — відповіла вона здивовано.", "— Ну, квіти, наприклад.", "— Ти ще вінок купи, — незадоволено сказала вона. — Візьмемо вина, — додала примирливо, відштовхуючись від мене, наче від бортика в басейні, — там на станції буде магазин.", "У напівпорожньому вагоні вона сама вибрала місце — із сонячного боку, за рухом потяга. Сиділа, дивилась, як вагони викочуються за станційні межі, як лишаються позаду останні, здавалося, безкінечні цистерни з хімікатами, як цеглу заступає зелень, як з-поза фабричних огорож раптом виривається обрій — зелений і лісистий, як починаються передмістя, як виринають чергові зупинки, на яких товчуться під пообіднім сонцем випадкові пасажири — рибалки, перекупки й дачники. Потяг рушав далі, повз між соснами, повільно, наче боявся привернути чиюсь увагу, завмирав на перегонах, стояв на піщаних насипах. Вона мовчала. Я теж не надто пам'ятав, на чому ми зупинились останнього разу і з чого варто продовжувати розмову. Проїхали озера, втяглися поміж дачних кооперативів. За вікном починались ліси, над ними стояли щедрі хмари. Раптом стало багато неба. Серпень, — подумав я, — коли він устиг минути?", "Потяг зупинився, ми зійшли на платформу. Було тихо, широкі навскісні промені золотили повітря, заважаючи бачити речі такими, якими вони були. Третя по обіді. Жодної живої душі. Найкращий час для урочистих відвідин померлих. Взяли в привокзальному торбу вина, рушили вздовж колій, піщаною стежкою. Вона йшла попереду, хоча дороги не знала. Хода її змінилась: дивилася вона переважно під ноги, мовби боялася збитись зі шляху. Тривало все це доволі довго. Кілька разів вона зупинялась, аби перепочити. Ще раз їй до кросівка потрапив камінь, вона оперлась на моє плече, стрибала на одній нозі, сміялась, витрушуючи його. Дістались селища, я спитався дороги, пішли шукати потрібну адресу. Вулиця виходила безпосередньо на річковий берег, трішки нижче від того місця, де дві ріки зливалися в одну й течія ставала подібною до мармуру: світлі прожилки перепліталися з темними, тьмяний струмінь — із прозорим. Тут вона остаточно загубилась, дістала телефон, передзвонила комусь, перепитала, ну ось, — сказала, показуючи на будинок, навпроти якого ми й стояли, — це він і є. Будинок стояв за старими деревами, з вулиці його й не помітиш. Був паркан, було багато квітів, стояла тиша. Відчинили хвіртку, пройшли подвір'ям. Схоже, старий користувався газонокосаркою. Подвір'я нагадувало футбольне поле, на якому, щоправда, було заборонено грати. Сам будинок був невеликий, ніби зібраний із різних деталей: цілком пристойні віконні рами й притягнуті звідкись двері, червона цегла в кладці стіни із вкрапленням білої, дерев'яні балки, залізні скоби — так, ніби хтось розвалив кілька будівель і зібрав із них одну. Можливо, не найкращу. Вона підійшла до дверей, потягла їх на себе. Двері не відчинялись. Вона постукала. Я зазирнув у вікно. Усередині під стіною стояло ліжко, коло вікна — порожній стіл, застелений обгортковим папером. З дерева впало яблуко — важко й розмірено. Ми озирнулись. Він стояв і мовчки дивився на нас. На обличчі додалось зморшок, бороду, схоже, підстригав сам. Темно-зелена сорочка із закоченими до ліктя рукавами, бойові, витерті на колінах джинси, розтріскані від невтомного ходіння кросівки. Запалені очі, покусані губи. Чорні руки, довгі пальці, вижовклі нігті. Шкіра кольору сухої глини. Шістдесят років за спиною. Смерть і зникнення попереду. Четверта дня. Сонця для нас на сьогодні майже не залишалося.", "Двадцять років тому він не носив цієї бороди. І зморшок у нього було куди менше. Хоча руки були такі ж — темні від праці, з фарбою під нігтями, з порізаними долонями, з набряклими від напруження венами. Так, наче він малював пальцями. Та й у всьому іншому він мало змінився — завжди джинси, навіть на відкриттях та офіційних зустрічах, завжди кросівки, завжди стояв у тебе за спиною, ніби кажучи: можеш оступитися, я підстрахую. Двадцять років тому він був молодим і агресивним, нікого не боявся, нікого ні про що не просив. Він і тепер, схоже, нікого не боявся. Але і його тепер теж ніхто не боявся. А тоді, двадцять років тому, він примушував із собою рахуватись, не можна було просто так його оминути. Від вісімдесятих він викладав у дитячій студії, у підвалі, у центрі. Учив дітей малювати. У дев'яностих почались фінансові проблеми, проте діти так само хотіли малювати, тож він і далі їх навчав. Наприкінці дев'яностих студію таки прикрили. З того часу, вже більше десяти років, він був безробітним і почувався, здається, прекрасно. З ним були знайомі всі. У нього була купа друзів. З ним товаришували навіть міліціонери. У нього було багато коханок. Я особисто знав кількох із них. Вони приносили йому до майстерні їжу та свіжий одяг, вони чистили його кросівки, вони плакались одна одній, коли він, не попередивши нікого, зникав із міста. У нього був син від першого шлюбу, займався бізнесом, нормально виглядав, тата любив. Виставок він не проводив, але вдома в усіх були його роботи. Останніми роками будував собі цей будинок. Викупив у когось сад і поміж дерев почав мурувати гніздо. Син допомагав, пропонував збудувати нормальний дім, готовий був за все заплатити, але він відмовлявся, говорив, що зробить усе сам. Хтось йому все-таки допомагав, іноді син приїздив на вихідні й тягав цеглу, відімкнувши мобільний, аби не турбували. Він не поспішав, схоже, йому подобалось саме будування, сам процес. Минулого року син таки привіз бригаду робітників, і ті за місяць усе завершили. Навесні він переїхав сюди жити. Вірніше, помирати.", "— Луко! — крикнула вона й кинулась до нього.", "Він засміявся у відповідь, вона повисла в нього на шиї, я підійшов слідом. Він опустив її на землю, обійняв мене.", "— Ви перші, — сказав, далі сміючись. — Сподіваюсь, не останні.", "Ми справді були не останніми. Вулицею підкотив на своєму джипі син. Із цілим багажником харчів. Привіз Луці маленький, якийсь дитячий магнітофон, досипав до нього купу батарейок, аби старий слухав улюблену музику там, куди його закинуть обставини. Скажімо, у лікарні. Привіз із собою також давніх приятелів Луки — підсліпуватого Зураба, з яким Лука якийсь час жив в одній комуналці на Революції, і високого худого дядь Сашу, що робив Луці свого часу, у далеких вісімдесятих, замовлення на оформлювальні роботи в закладах громадського харчування. Зураб, здається, не зовсім розумів, куди його привезли, але з Лукою вітався чемно, довго й міцно тиснув йому руку, плескав по плечу, навіть випустив зі свого напівсліпого ока сувору сльозу. Натомість дядь Саша, висохлий, по-армійськи вистрижений, зі своєю незмінною посивілою смужечкою вусів, у своєму традиційному чорному піджаку сажотруса, все чудово розумів, приховував як міг своє розчулення й співчуття, обіймав Луку, обіймав Зураба, голосно говорив, не замовкав ні на хвилину, аж син Луки не витримав, добре, сказав, ви спілкуйтесь, я буду на стіл накривати. І почав тягати пакунки з їжею під яблуні, де вже стояв, застелений тим-таки сірим обгортковим папером, великий порожній стіл.", "— Я допоможу, — сказала вона й узялась за роботу.", "— Хай готують, — погодився Лука, — не треба їм заважати. Покажу вам яблуні.", "Зураб із дядь Сашею пішли вперед, я рушив за ними, Лука ледь чутно притримав мене за лікоть.", "— Що у вас? — запитав тихо, кивнувши головою в бік столу, де вона саме розставляла посуд.", "— Не знаю поки що, — відповів я.", "— Вона вагітна?", "— А ти звідки знаєш? — здивувався я.", "— Помітно, — пояснив Лука. — Вагітні жінки спокійні й зосереджені на собі. Вона такою ніколи не була. І що ти думаєш?", "— Нічого не думаю, — зізнався я.", "— Це що — не твоя дитина?", "— Скоріше за все.", "— А чия?", "— Не знаю.", "— А вона знає?", "— Не впевнений, — припустив я.", "— Не кидай її, — порадив Лука. — Кинеш — будеш потім шкодувати. Спробуй її втримати. Воно того варте. Ну, пішли."], ["Серед трави лежали теплі яблука. Деякі з них Лука підбирав, тримав у руках, клав назад у траву.", "Поступово всі збирались. Приїхала Марина, спільна знайома, втомлена після роботи, з великим букетом квітів. Припхався Жора. Я його не бачив від весни, востаннє, коли зустрічались, він скаржився, що проходить практику в цілодобовій аптеці коло метро, але не певен, чи візьмуть його туди на постійну працю, але ось узяли, все склалося добре, Жора виглядав упевнено, тішився, роздавав усім медичні поради, що з огляду на ситуацію виглядало дещо недоречно, але хто зважав на ситуацію, всі зважали на свіжий серпневий вечір, на ріку, що протікала за кілька десятків метрів, на стиглі яблука й вечірнє небо. Разом із Жоріком з'явився його кузен Боб в офіційному костюмі, з акуратною зачіскою, схожий на молодого протестанта. Боб щойно повернувся з подорожі Америкою, але поводився так, ніби повернувся щонайменше з пекла. Ділився враженнями, що його, вочевидь, переповнювали. Подарував Луці пляшку каліфорнійського сухого. За Бобом прийшов і його найкращий друзяка Саша Цой — молодий поет-бунтар, син корейських вигнанців, активний учасник поетичної студії при єврейському центрі. Вручив Луці рукопис. Лука обіцяв прочитати, коли в нього з'явиться час. Прийшов, накульгуючи, Паша Чингачгук із дружиною Маргаритою. Маргарита мала повен кошик риби, відразу ж побігла до будинку, на кухню, готувати. Паша лишився накульгувати поміж дерев. Загальне пожвавлення викликала поява Алки-Акули — загальної улюблениці, музи всіх бідних та упосліджених. Вона принесла шоколадний торт, довго обіймалась із Лукою. Той дивився на неї з ніжністю й печаллю. Я згадав, як колись давно, сто років тому, під час якоїсь пиятики, Лука розповідав мені довірливо, що саме він був першим чоловіком Акули, саме він навчив її всього того, чим вона потому щедро ділилася з друзями та знайомими. Віриш, — говорив, — вона прийшла до мене в маминій сукні. У неї не було нормального дорослого одягу. А звідки ти знаєш, що сукня була мамина? — запитав я його. Так я і з мамою теж спав, — пояснив мені тоді Лука. З Алкою прийшов Юра, мій давній знайомий, колишній гітарист із відірваним пальцем на лівій руці, зі злим відкритим поглядом. Пити відмовився. Сказав, що лікується. Не сказав, від чого саме. Хоча всі й так знали: туберкульоз. Прийшла Kipa, подружка Луки. Була печальна й самотня, на ланцюжку мала срібний перстень. Теж принесла Луці квіти. Той запитав, чому вона сама. Kipa пояснила, що розійшлась із подружкою, але все гаразд і не треба про це. Останнім приїхав Іван, який довгий час здавав Луці під майстерню одну з лабораторій на заводі, де він, Іван, офіційно значився ледь не заступником директора. Сухо привітався з усіма, довго тис руку Луці. Почав ще більше сутулитися, здається, ще більше схуд. З ним приїхало ще кілька гостей. Одного з них я бачив колись під час вуличних пікетів, щоправда, не міг згадати, за кого він тоді стояв. З ним ще якась знайома Луки, з попереднього життя, з давньої пам'яті. Останньою з вулиці зайшла молода ще дівчина. З довгим, фарбованим у чорне волоссям, у світлій сукні, легких босоніжках. Привіталася лише з Лукою. Більше тут, схоже, нікого не знала. Її теж ніхто не знав. Усі спочатку звернули на неї увагу, почали перешіптуватись, багатозначно перезиратись. Лука помітив це, схоже, йому стало неприємно, тож він голосно запросив усіх до столу. Дівчина ступила крок убік, під яблуневе віття, й ураз про неї всі забули. Потім сіла з усіма до столу. Сиділа, мовчала, пила вино.", "За столом відразу загаласували й засперечались. Особливо голосно кричав Боб. Йому було що розповісти співвітчизникам, він на власній шкірі відчув потойбічний подих вогню, тож тепер, усіх перебиваючи і до всіх довірливо тягнучись, захлинався, переповідаючи дивовижні подробиці своєї нещодавньої виправи за океан, у холодне серце Америки. Усі поступово стихли, оскільки розуміли: краще його вислухати й підтримати, аніж перебивати й перекрикувати. Лука сидів і посміхався, переводячи погляд від Боба до незнайомки, що сиділа при іншому боці столу.", "Америка, стверджував Боб, омивається двома гарячими океанськими потоками. Це визначає її клімат та складність характеру її мешканців. Це впливає на флору, але також і на фауну. Дикі тварини Америки цілком мирні та переважно приручені. Лисиці вбігають на передмістя й сплять на автобусних зупинках. Уночі виють на місяць, заважають спати. Птахи звивають собі гнізда на балконах і в дитячих возиках. Черепахи дістаються системи каналізації, там і доживають свого довгого віку. Гарячі океанські потоки пробиваються крізь ґрунт у глибину материка. Скажімо, той-таки Нью-Йорк стоїть на розпечених водах і вологій глині. На вулицях там пахне сіркою, а сонце ховається в теплому тумані. Над містом стоїть постійна сутінь, і в сутіні цій ростуть чорні водорості й висока помаранчева трава. І є лише одне місто, що може позмагатися з Нью-Йорком у сутінковості — це, звісно, Сан-Франциско: місто, засноване безпосередньо Святим Франциском, що прибув сюди свого часу з офіційним візитом і залишився на цих піщаних берегах, аби укріплювати аборигенів у вірі й розпалювати серед ночі вогні, на які рухались крізь океанську спекоту російські та китайські торговельні кораблі.", "— Ну добре, — сказали йому на це вражені слухачі, — а що з жінками? Як в Америці з жінками?", "А Боб ніби чекав на це запитання. Тому відразу ж і відповів. З жінками, сказав, там особлива історія. Найбільше там, звісно, суринамок. Та ефіопок. Суринамки за звичкою носять воду від ріки у великих глиняних глечиках. Живуть великими родинами, без чоловіків. Чоловіків підпускають до себе, хіба щоби завагітніти. Працюють переважно у сфері обслуговування. Харчуються фруктами та зеленню. Рано старіють, але все одно лишаються привабливими. Інша річ— ефіопки, — продовжував Боб. — Ті, навпаки, поміж собою тримають дистанцію, а гуртуються довкола церков, яких — у самому лише Нью-Йорку! — набудовано ефіопськими християнами щось понад сотню. З чужинцями не кохаються, — печально зазначив Боб, — я пробував. Живуть довго. Зустріти ефіопку, якій уже за дев'яносто — доволі просто й нескладно. Одні говорять, що це від води, яку вони п'ють. Інші запевняють, що від молитов. Але найбільш дивно, — перебивав Боб сам себе, — поводяться все ж таки японки. Кажуть, що вони здатні лікувати власною слиною. Подейкують, що вони не хворіють узагалі. Припускають, що в них немає на це часу. У всіх них мармурова шкіра, над усіма ними стоїть ледь видиме сяйво, а декотрі з них, — завершив Боб, — узагалі мають по дві голови.", "Усі на якусь мить принишкли, не знаючи, як реагувати на почуте. Аж тут із дому вийшла Маргарита, несучи дві великі тарілки з приготованою рибою, і це повернуло всіх у добрий гумор, і всі знову заговорили, коментуючи, заперечуючи або, навпаки, підтримуючи все те, про що тут щойно розводився Боб. І дядь Саша кричав, що так і є, що всюди люди, що немає за великим рахунком жодної різниці, з ким ділити надію та вино — із суринамкою чи з ефіопкою. Хоча з ефіопкою все-таки краще. А Марина тихим голосом заперечувала йому й говорила, що головне — це родина, а все, що робиться поза родиною, може робитися й без нашої участі. Паша Чингачгук із нею погоджувався, а Kipa заперечливо хитала головою й розповідала про зради, які ми схильні чинити, і забуття, яке нас часто охоплює. І Алка теж підхопила про забуття, але сказала, що жодне забуття нічого не важить проти справжньої закоханості.", "— Правильно, — відповів на це раптом Лука, що весь цей час мовчав, прислуховуючись до інших.", "Усі враз замовкли, згадавши, що їх тут, власне, зібрало. Було затишно й урочисто. Світло з веранди губилося серед листя, вихоплювало важкі чоловічі руки й тихі жіночі обличчя. Лука сидів у кінці столу, тіні робили риси його обличчя гострими, а зморшки глибокими. У бороді криваво темніли краплі вина. Ліворуч від нього сидів Іван, праворуч — Зураб. Слухали, не дивлячись на нього. А Лука дочекався загальної тиші й продовжив:", "— Це дуже вірно — те, що ти сказала. Забуття взагалі нічого не важить. І смерть нічого не важить.", "— Смерті немає! — упевнено викрикнув Саша Цой.", "— Смерть є, — не погодився з ним Лука. — І ви навіть не уявляєте, як близько вона від нас. Річ не в цьому. Ні наша смерть, ні наше зникнення, ні наш перехід до царства мертвих не мають жодного значення з огляду на їхню неминучість. Ну справді, смішно не приймати місячні цикли. Смішно не погоджуватися з напрямком руху річок. Їх слід сприймати як даність і сприймати спокійно, як усе невідворотне. Єдине, що по-справжньому має вагу, — це наша закоханість, любов, яку ми в собі тримаємо, яку ми носимо при собі, з якою ми живемо. Адже ти ніколи не знаєш, скільки тобі її відпущено, скільки її в тебе є, скільки її на тебе чекає. Знаходити її — радість, втрачати її — прикрість і нещастя. Ми всі живемо в цьому дивному місті, ми всі тут лишились, ми всі рано чи пізно до нього повертаємось. І живемо, носячи в собі цю любов, ніби провину, ніби пам'ять, що вміщує в собі весь наш досвід, усі наші знання. І ця присутність її в нашому диханні, на наших піднебіннях є чи не найбільшою інтригою в нашому житті. Щоранку я прокидаюсь і згадую всіх тих жінок, з якими мені трапилося перетинатись і мати справу. Веселих і занепокоєних, безтурботних і безпорадних, незайманих і вагітних. Мені здається, що найважливішим для мене завжди було саме спілкування з ними, можливість чи неможливість ділитися з ними своєю закоханістю, усією своєю любов'ю. Все інше так чи інакше виникало внаслідок цієї закоханості, а отже, не мало за великим рахунком жодної ваги, жодного сенсу. Тому й говорити про все інше немає жодного сенсу. І ось тепер, — завершив Лука, — після всього того, що я вам сказав, ви всі мусите йти купатися!", "Усі так і зробили. І галасливою юрбою почали вибиратися між дерев, дякуючи господареві за такі мудрі, хоча й дещо патетичні слова. І хтось ніс із собою вино, а хтось вмикав ліхтарики на мобільних, аби знайти стежку й спуститися до берега. Вона теж підвелась із-за столу й почала збирати порожні тарілки.", "— Ходімо? — покликав я її.", "— Іди з усіма, — легко відмахнулась вона. — Я допоможу тут і підійду пізніше.", "Я почекав, розвернувся й пішов у темряву. Перейшов вулицю, пройшов під деревами, вийшов до ріки. Берегом розкидано було одяг і порожні пляшки, а з глибини вечірнього повітря, звідкись із чорного вогкого простору, чулися сміх і вереск, і веселий плескіт води, і впевнені змахи рук, що вигрібали посеред течії. Жіночі тіла срібно відсвічували під місячним промінням, і від п'яних вигуків ставало тепло й радісно. Я пізнавав їх, стоячи на березі, озивався до них, кричав їм просто в чорноту. Вони відповідали звідти, то наближаючись, то знову відпливаючи до протилежного берега. Так, ніби ріка приносила сюди з міста всі знайомі мені голоси, весь сміх, всі співи. Від цього виникало почуття спокою та впевненості, адже все було тут, поруч, на відстані кількох кроків. І жодним чином це не могло зникнути, ніколи це не могло завершитись, скільки б я тут не стояв, скільки б часу не минуло.", "Але поволі вони вибирались на берег, хтось швидко підхоплював одяг і натягував його на мокре тіло, хтось обтирався завбачливо принесеними рушниками, а хтось просто прикладався до пляшок, у яких іще щось лишалося, хапав одяг — добре, якщо свій, — і брів назад на подвір'я, на світло. Вечір був пізній. Я чув, що хтось прощається з господарем, хтось починає співати, у жіночих голосах з'явилась гіркота, у чоловічих — вогонь. Автівки від'їздили, голоси замовкали. Ставало тихо. Ставало все більше місяця, все більше прохолоди.", "Я зовсім не почув, як вона підійшла. Просто з'явилася мені з-за спини, легко торкнулась плеча, ну що, — спитала, — що ти тут стоїш? Я не відразу знайшов, що відповісти, а вона скинула із себе позичену в когось куртку, стягнула светр, стягнула кросівки, якийсь час возилася з комбінезоном, але зрештою скинула його теж. Скинула футболку, на якусь мить завагалась, але білизну теж кинула зверху на теплий ще одяг. Боязко намацуючи дно, ступила у воду. Потім весело зойкнула, пірнула, попливла.", "— Ей, — крикнула з темряви, — що ж ти не йдеш?", "— Пливи-пливи, — відповів я їй. — Я твої речі постережу.", "— Як хочеш, — відповіла вона.", "Я подумав, як це добре, що я зрештою тут опинився — на цьому березі, при цій воді. Стояти й спостерігати, як вона роздягається й заходить у ріку, знати, що до будь-якої ріки можна насправді входити безкінечно. Можна безкінечно довго триматися вологи, що тебе охоплює, можна безкінечно довго очікувати на повернення всіх, кого ти знав і кого любив. Ріка принесе всі чуті тобою інтонації, ріка збереже все залишене при берегах тепло, ріки вміють чекати, вміють починати все від початку. Тому що існує тяглість річища, тяглість потоку, і ніхто не може зупинити всю цю масу вологого світла, весь цей огром тепла й холоду. Мені залишається тільки дочекатись її тут, на березі, і повертатись разом із нею назад, до міста, як повертаються до нього щодня тисячі біженців і заробітчан, мандрівників і прибульців, усі ці бригади найманих чорноробів, котрі тягаються світом, споруджують вежі та в'язниці, але рано чи пізно все одно приходять сюди — на ці береги, під це місячне проміння.", "Я подумав, що довго буду тримати в пам’яті запах цієї води, запах глини й трави, запах диму й осені, запах життя, яке ще не скінчилось, і смерті, яка ще не настала. А ось що вона буде згадувати про це все? Чи згадає вона тишу, яка стоїть над нами? Чи згадає вона своє дихання, яке виростає тепер посеред цієї тиші? Адже все залежить від нас. Перш за все — наше бажання бодай щось пам'ятати. І наше бажання не пам’ятати нічого.", "Уже коли вона вийшла, коли я підхопив її при березі й допоміг знайти одяг, коли ми повертались назад, до будинку, вона сказала:", "— Остання електричка, мабуть, поїхала. У Луки є місце. Залишишся зі мною?", "— Ясно, що залишусь, — відповів я.", "Підходячи до дому, ми почули музику. Різкі переможні звуки лунали звідкись з-поза яблунь. На подвір'ї було порожньо, усі роз'їхались. Ми пішли на музику. Не доходячи, зупинились під деревами. Коло столу, у траві, стояли стільці. На одному з них сиділа незнайомка, яка чомусь залишилась. Сиділа, відкинувши назад волосся й спокійно поклавши руки на коліна. А перед нею радісно й злісно танцював Лука. Ну, як танцював? Було це щось на зразок поґо — веселі відчайдушні стрибки в небо, відривання від поверхні, спроби застрибнути в темряву. Стрибав Лука високо, хоча давалося йому це тяжко — сорочка його просякла потом, жили на шиї напружились, проте він стрибав і викидав угору руки, стрибав і опускався в мокру траву, скакав під хрипкі звуки з подарованого магнітофона. Була це його улюблена Патті Сміт, яку він слухав завжди, коли мав добрий настрій. Але коли мав поганий настрій, то слухав також її, там де вона говорила, що Ісус помер за чиїсь гріхи, але напевне не за мої. І Лука стрибав, ніби тішачись від усього цього — напевне не за мої, і напевне не за твої, дівчинко, бо які в тебе гріхи, яка в тебе спокута, ми сплатимо всі наші борги, ми домовимося з усіма митарями цього світу, ми розрахуємося за все, до останнього слова, до останнього видиху.", "А вона сиділа й уважно на нього дивилася. Слухала його, не відводячи погляду, кивала головою, з усім погоджуючись. Не озиваючись до нього, не спиняючи. Чекаючи, скільки треба."]];

const OPEN_MIN = 300;
const TOTAL_Q = QUESTIONS.reduce((s,p)=>s+p.length,0);
const KIND = { single:"Один варіант", multi:"Кілька варіантів", tf:"Правда чи неправда", input:"Впиши відповідь", match:"Відповідність", order:"Хронологія", device:"Художній засіб" };
const KEY = "zhadan-book-v2";
let DG = 0;
const OG = [...new Set(OPEN_G)];

/* ---------- стан ---------- */
let S = load();
function blank(){ return { uid:"u"+Date.now().toString(36)+Math.random().toString(36).slice(2,8), sent:null, name:"", tab:"home", part:0, ans:{}, draft:{}, game:{ first:null, best:null, tries:0 }, open:{}, big:false, tg:{ cls:"", onl:"", last:null, turn:"cls", score:{cls:0,onl:0} } }; }
function migrate(){ return null; try{ const o = JSON.parse(localStorage.getItem("zhadan-five-v1")); if(!o || !o.ans) return null;
  const PO = PART_META.findIndex(m=>m.s===4), OO = OPEN_G.indexOf(OPEN_G[OPEN_G.length-1]);
  const sh = obj => Object.fromEntries(Object.entries(obj||{}).map(([k,v])=>[k.replace(/^p(\d+)/,(_,n)=>"p"+(+n+PO)), v]));
  return Object.assign(blank(), o, { ans:sh(o.ans), draft:sh(o.draft), part:(o.part||0)+PO, game:blank().game,
    open:Object.fromEntries(Object.entries(o.open||{}).map(([k,v])=>[+k+OO, v])) }); }catch(e){ return null; } }
function load(){ try{ const v = JSON.parse(localStorage.getItem(KEY)); if(v && v.ans) return Object.assign(blank(), v); }catch(e){} return migrate() || blank(); }
let saveT; function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }, 250); syncSoon(); }
/* ---------- таблиця вчителя (Google Sheets через Apps Script) ---------- */
const SHEET_URL = String(window.SHEET_URL||"").trim();
let syncT, lastSig = "", syncMsg = "";
function payload(){ return { id:S.uid, name:(S.name||"").trim(), stories:STORIES.map((st,s)=>{ const sc=storyScore(s); return { name:st.name, pct:sc.pct, c:sc.c, n:sc.n }; }),
  game:S.game, openDone:openDone(), answered:answeredAll(),
  open:OPEN_QUESTIONS.map((q,i)=>({ i, g:OPEN_G[i], q, a:(S.open[i]||"").trim() })).filter(o=>o.a) }; }
function syncSoon(){ if(!SHEET_URL||!(S.name||"").trim()) return; clearTimeout(syncT); syncT=setTimeout(()=>syncNow(false), 15000); }
async function syncNow(manual){
  if(!SHEET_URL) return; clearTimeout(syncT);
  if(!(S.name||"").trim()){ if(manual) toast("Спочатку впиши ім'я та прізвище"); return; }
  const body = JSON.stringify(payload()); if(!manual && body===lastSig) return;
  try{ await fetch(SHEET_URL, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body });
    lastSig = body; S.sent = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    syncMsg = "Надіслано в таблицю вчителя о " + new Date(S.sent).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"}) + ".";
    if(manual) toast("Результати надіслано"); }
  catch(e){ syncMsg = "Немає зв'язку з таблицею. Перевір інтернет і натисни «Надіслати» ще раз."; if(manual) toast("Не вдалося надіслати"); }
  const m=document.getElementById("syncMsg"); if(m) m.textContent=syncMsg;
}
addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") syncNow(false); });

/* ---------- утиліти ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function seed(str){ let h=2166136261; for(const ch of str){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%100000)/100000; }; }
function shuffle(arr, key){ const r=seed(key), a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function orderStart(n, key){ let a=shuffle([...Array(n).keys()], key); if(a.every((v,i)=>v===i)) a=a.reverse(); return a; }
const norm = s => String(s||"").toLowerCase().replace(/[’ʼ`]/g,"'").replace(/[«»".,!?:;()…]/g,"").replace(/\s+/g," ").trim();
const qid = (p,i) => `p${p}q${i}`;
const minutes = p => Math.max(1, Math.round(p.join(" ").split(/\s+/).length / 140));

/* ---------- оцінки ---------- */
function partCorrect(p){ return QUESTIONS[p].filter((_,i)=>S.ans[qid(p,i)]?.ok).length; }
function partDone(p){ return QUESTIONS[p].filter((_,i)=>S.ans[qid(p,i)]).length; }
function mainScore(){ let c=0; QUESTIONS.forEach((qs,p)=>c+=partCorrect(p)); return { c, pct: Math.round(c/TOTAL_Q*1000)/10 }; }
function storyParts(s){ return PART_META.map((m,i)=>m.s===s?i:-1).filter(i=>i>=0); }
function storyScore(s){ const ps=storyParts(s); let c=0,n=0,d=0; ps.forEach(p=>{ c+=partCorrect(p); d+=partDone(p); n+=QUESTIONS[p].length; }); return {c,d,n,pct:Math.round(c/n*1000)/10}; }
function partNo(p){ return storyParts(PART_META[p].s).indexOf(p)+1; }
function answeredAll(){ return Object.keys(S.ans).length; }
function openDone(){ return OPEN_QUESTIONS.filter((_,i)=>(S.open[i]||"").trim().length>=OPEN_MIN).length; }
const fmt = n => (Math.round(n*10)/10).toString().replace(".",",");

function vQ(q,p,i){
  const id = qid(p,i), a = S.ans[id], dr = S.draft[id], locked = !!a;
  const val = locked ? a.v : dr;
  let body = "", ready = false;
  if(q.t==="single"||q.t==="device"||q.t==="tf"){
    const opts = q.t==="tf" ? ["Правда","Неправда"] : q.o;
    const order = q.t==="tf" ? [0,1] : shuffle([...opts.keys()], id);
    const correct = q.t==="tf" ? (q.a?0:1) : q.a;
    body = `<div class="opts ${q.t==="tf"?"two":""}">${order.map(k=>{
      let cls = val===k ? "sel" : "";
      if(locked){ cls = k===correct ? "good" : (val===k ? "miss" : ""); }
      return `<button class="opt r ${cls}" type="button" data-q="${id}" data-pick="${k}" ${locked?"disabled":""}><span class="bx">${locked&&k===correct?"✓":locked&&val===k?"✕":""}</span><span>${esc(opts[k])}</span></button>`; }).join("")}</div>`;
    ready = val!=null;
  } else if(q.t==="multi"){
    const sel = val||[];
    body = `<div class="opts">${shuffle([...q.o.keys()], id).map(k=>{
      const on = sel.includes(k), should = q.a.includes(k);
      let cls = on ? "sel" : "";
      if(locked){ cls = should&&on ? "good" : (!should&&on ? "miss" : (should ? "good" : "")); }
      return `<button class="opt ${cls}" type="button" data-q="${id}" data-tog="${k}" ${locked?"disabled":""}><span class="bx">${on?"✓":locked&&should?"✓":""}</span><span>${esc(q.o[k])}${locked&&should&&!on?' <em style="font-size:12.5px;opacity:.75">(пропущено)</em>':""}</span></button>`; }).join("")}</div>`;
    ready = sel.length>0;
  } else if(q.t==="input"){
    body = `<input class="in" id="in-${id}" data-q="${id}" data-text="1" placeholder="${esc(q.ph||"Твоя відповідь")}" value="${esc(val||"")}" ${locked?"disabled":""} autocomplete="off">`;
    ready = (val||"").trim().length>0;
  } else if(q.t==="match"){
    const v = val||{}, rights = shuffle(q.r.map((_,k)=>k), id+"r");
    body = `<div class="opts">${q.l.map((l,li)=>{ let cls=""; if(locked) cls = v[li]===li ? "good":"miss";
      return `<div class="mrow"><span class="ml">${esc(l)}</span><select class="in ${cls}" id="sel-${id}-${li}" data-q="${id}" data-ml="${li}" ${locked?"disabled":""}><option value="">— обери —</option>${rights.map(k=>`<option value="${k}" ${v[li]===k?"selected":""}>${esc(q.r[k])}</option>`).join("")}</select></div>`; }).join("")}</div>`;
    ready = q.l.every((_,li)=>v[li]!=null);
  } else if(q.t==="order"){
    const ord = val || orderStart(q.items.length, id);
    body = `<div class="ord">${ord.map((k,pos)=>{ const cls = locked ? (k===pos?"good":"miss") : "";
      return `<div class="oi ${cls}"><span class="k">${pos+1}</span><span>${esc(q.items[k])}</span>${locked?"":`<span class="ar"><button type="button" data-q="${id}" data-mv="${pos}" data-dir="-1" ${pos===0?"disabled":""} aria-label="Вгору">▲</button><button type="button" data-q="${id}" data-mv="${pos}" data-dir="1" ${pos===ord.length-1?"disabled":""} aria-label="Вниз">▼</button></span>`}</div>`; }).join("")}</div>`;
    ready = true;
  }
  let fb = "";
  if(locked){
    let ca = "";
    if(!a.ok){
      if(q.t==="single"||q.t==="device") ca = `Правильно: «${esc(q.o[q.a])}».`;
      if(q.t==="tf") ca = `Правильно: ${q.a?"правда":"неправда"}.`;
      if(q.t==="input") ca = `Правильна відповідь: «${esc(q.a[0])}».`;
      if(q.t==="match") ca = q.l.map((l,k)=>`${esc(l)} → ${esc(q.r[k])}`).join("<br>");
      if(q.t==="order") ca = q.items.map((t,k)=>`${k+1}. ${esc(t)}`).join("<br>");
    }
    fb = `<div class="fb ${a.ok?"ok":"bad"}"><b>${a.ok?"Правильно.":"Не зовсім."}</b>${esc(q.e)}${ca?`<div class="ca">${ca}</div>`:""}</div>`;
  }
  return `<div class="q ${locked?(a.ok?"ok":"bad"):""}" id="card-${id}">
    <div class="top2"><span class="no">${partNo(p)}.${i+1}</span><div style="display:grid;gap:3px"><span class="kind">${KIND[q.t]}</span><span class="txt">${esc(q.q)}</span></div></div>
    ${body}
    ${locked ? fb : `<div class="row"><button class="btn sm" type="button" data-check="${id}" ${ready?"":"disabled"}>Перевірити</button></div>`}
  </div>`;
}

function check(id){
  const [p,i] = id.slice(1).split("q").map(Number), q = QUESTIONS[p][i], v = S.draft[id];
  let ok=false, val=v;
  if(q.t==="single"||q.t==="device") ok = v===q.a;
  else if(q.t==="tf") ok = v===(q.a?0:1);
  else if(q.t==="multi"){ const s=(v||[]).slice().sort(), c=q.a.slice().sort(); ok = s.length===c.length && s.every((x,k)=>x===c[k]); }
  else if(q.t==="input") ok = q.a.some(x=>norm(x)===norm(v));
  else if(q.t==="match") ok = q.l.every((_,k)=>(v||{})[k]===k);
  else if(q.t==="order"){ val = v || orderStart(q.items.length,id); ok = val.every((x,k)=>x===k); }
  S.ans[id] = { v:val, ok }; delete S.draft[id]; save(); rerender(id);
}
function rerender(id){
  const [p,i] = id.slice(1).split("q").map(Number);
  const el = document.getElementById("card-"+id);
  if(el){ el.outerHTML = vQ(QUESTIONS[p][i],p,i); }
  topUpd();
  const h = document.querySelector(".qhead .mono"); if(h) h.textContent = `${partDone(p)}/${QUESTIONS[p].length} · ${partCorrect(p)} правильно`;
}

/* ---------- гра «Хто з якої історії?» ---------- */
let G = null;
const GAME_OPTS = [...new Set(GAME_CARDS.map(c=>c.c))];
function newGame(){ const s="g"+Date.now(); G = { deck: shuffle(GAME_CARDS.map((_,k)=>k), s), i:0, res:[], pick:null, s }; }
function optsFor(k){ const right = GAME_CARDS[k].c; const others = shuffle(GAME_OPTS.filter(o=>o!==right), G.s+k).slice(0,2); return shuffle([right, ...others], G.s+"o"+k); }
function vGame(){
  const g = S.game;
  if(!G) return `
    <section class="hero">
      <img class="mark m1" src="${SPIRAL}" alt="">
      <span class="eyebrow">Гра · оцінюється окремо</span>
      <h2 style="font-size:clamp(30px,9vw,46px);font-weight:800">Хто з якої історії?</h2>
      <p class="lede">Дев'ять новел, одне місто. На кожній картці — деталь, річ або місце з однієї з історій. Обери, з якої новели вона.</p>
      <p class="lede" style="color:var(--muted);font-size:14px">${GAME_CARDS.length} карток, по три варіанти. Учителю зараховується перша спроба, найкращий результат теж видно.</p>
      <div class="row"><button class="btn" type="button" data-game="start">${g.tries?"Зіграти ще раз":"Почати гру"}</button></div>
    </section>
    ${g.tries?`<div class="scores"><div class="score"><span class="n">${g.first}%</span><span class="l">Перша спроба</span></div><div class="score" style="--c:var(--violet)"><span class="n">${g.best}%</span><span class="l">Найкраща</span></div><div class="score"><span class="n">${g.tries}</span><span class="l">Спроб</span></div></div>`:""}`;
  if(G.i>=G.deck.length){
    const ok = G.res.filter(Boolean).length, pct = Math.round(ok/G.deck.length*100);
    return `<section class="panel" style="text-align:center;justify-items:center">
      <span class="eyebrow">Результат</span>
      <div class="big-n">${pct}%</div>
      <p class="lede">${ok} з ${G.deck.length}. ${pct>=90?"Ти тримаєш у голові все місто, як Жорік — усі плітки.":pct>=60?"Майже все. Ще одна спроба — і жодна деталь не загубиться.":"Погортай частини й спробуй знову."}</p>
      <div class="dots">${G.res.map(r=>`<i class="${r?"ok":"bad"}"></i>`).join("")}</div>
    </section>
    <div class="note"><b>Чому це важливо?</b> Герої переходять з історії в історію: офіціантка з «Юри» стає Олею у «Фомі», ковбой із весілля стає Бобом, а за столом у Луки збираються майже всі. «Месопотамія» — це одне місто, розказане дев'ятьма голосами.</div>
    <div class="row"><button class="btn" type="button" data-game="start">Ще раз</button><button class="btn ghost" type="button" data-game="close">До меню гри</button></div>`;
  }
  const k = G.deck[G.i], c = GAME_CARDS[k], picked = G.pick;
  return `<section class="game">
    <div class="sec-h"><h2>Хто з якої історії?</h2><span class="mono">${G.i+1}/${G.deck.length}</span></div>
    <div class="dots">${G.deck.map((_,j)=>`<i class="${j<G.res.length?(G.res[j]?"ok":"bad"):""}"></i>`).join("")}</div>
    <div class="card" style="position:relative;height:auto;min-height:170px"><span class="cn">деталь із книжки</span><span class="ct">${esc(c.x)}</span></div>
    <div class="opts">${optsFor(k).map(o=>{ let cls=""; if(picked!=null){ cls = o===c.c ? "good" : (o===picked ? "miss" : ""); }
      return `<button class="opt r ${cls}" type="button" data-gpick="${esc(o)}" ${picked!=null?"disabled":""}><span class="bx">${picked!=null&&o===c.c?"✓":picked===o?"✕":""}</span><span>${esc(o)}</span></button>`; }).join("")}</div>
    ${picked!=null?`<div class="row"><button class="btn" type="button" data-game="next" id="gNext">${G.i+1<G.deck.length?"Далі →":"Результат →"}</button></div>`:""}
  </section>`;
}
function gamePick(o){
  if(!G || G.i>=G.deck.length || G.pick!=null) return;
  G.pick = o; G.res.push(o===GAME_CARDS[G.deck[G.i]].c); render();
  const b=document.getElementById("gNext"); b&&b.focus({preventScroll:true});
}
function gameNext(){ if(!G||G.pick==null) return; G.pick=null; G.i++; if(G.i>=G.deck.length) finishGame(); render(); }
function finishGame(){
  const pct = Math.round(G.res.filter(Boolean).length/G.deck.length*100), g = S.game;
  g.tries++; if(g.first==null) g.first = pct; g.best = Math.max(g.best??0, pct); save();
}

let TQ = { i:-1, show:false }, TIMER = null;
function names(s){ return String(s||"").split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean); }
function vTogether(){
  const T = S.tg, cls = names(T.cls), onl = names(T.onl);
  const left = TIMER ? Math.max(0, Math.ceil((TIMER.end-Date.now())/1000)) : 0;
  const pctT = TIMER ? Math.max(0, (TIMER.end-Date.now())/TIMER.total*100) : 0;
  return `<section class="hero">
      <img class="mark m1" src="${WAVE}" alt="">
      <span class="eyebrow">Для всього класу · без оцінок</span>
      <h2 style="font-size:clamp(30px,9vw,46px);font-weight:800">Разом</h2>
      <p class="lede">Жартівливі завдання для класу й онлайн-учнів одночасно. У кожному є варіант «у класі» і «онлайн», тож ніхто не залишається глядачем. Усе тихе, сидячи на місцях.</p>
    </section>

    <section class="panel">
      <div class="sec-h"><h3 style="font-size:17px">Пульт учителя</h3><span class="mono">клас ${T.score.cls} : ${T.score.onl} онлайн</span></div>
      <div class="two-col">
        <div class="field"><label for="tgCls">У класі (імена через кому або з нового рядка)</label><textarea class="in small" id="tgCls" data-tg="cls" placeholder="Марта, Андрій, Софія…">${esc(T.cls)}</textarea></div>
        <div class="field"><label for="tgOnl">Онлайн</label><textarea class="in small" id="tgOnl" data-tg="onl" placeholder="Олег, Дарина, Ілля, Катя, Тарас">${esc(T.onl)}</textarea></div>
      </div>
      <div class="pick">
        <div class="pick-out"><span class="cn">Відповідає</span><span class="pick-name" id="pickName">${T.last?esc(T.last.n):"—"}</span>${T.last?`<span class="tag ${T.last.g==="onl"?"":"g"}">${T.last.g==="onl"?"онлайн":"у класі"}</span>`:""}</div>
        <div class="row">
          <button class="btn sm" type="button" id="pickBtn" ${cls.length+onl.length?"":"disabled"}>Обрати учня</button>
          <span style="font-size:12.5px;color:var(--muted)">Чергує клас і онлайн, щоб онлайн-учні не губилися.</span>
        </div>
      </div>
      <div class="timer">
        <div class="tbar"><i id="tFill" style="width:${pctT}%"></i></div>
        <div class="row" style="justify-content:space-between">
          <span class="mono" id="tLeft" style="font-size:22px;font-weight:600">${TIMER?fmtSec(left):"0:00"}</span>
          <span class="row">${[1,2,3,5].map(m=>`<button class="btn ghost sm" type="button" data-timer="${m}">${m} хв</button>`).join("")}${TIMER?`<button class="btn ghost sm" type="button" data-timer="0">Стоп</button>`:""}</span>
        </div>
        <span style="font-size:12.5px;color:var(--muted)">Таймер беззвучний: смужка просто доходить до кінця.</span>
      </div>
      <div class="row">
        <span style="font-weight:700;font-size:14px">Бал команді:</span>
        <button class="btn ghost sm" type="button" data-score="cls">+1 клас</button>
        <button class="btn ghost sm" type="button" data-score="onl">+1 онлайн</button>
        <button class="btn ghost sm" type="button" data-score="reset">Обнулити</button>
      </div>
    </section>

    ${TOGETHER.map((x,i)=>`${i===0||TOGETHER[i-1].g!==x.g?`<div class="sec-h"><h2>${esc(x.g)}</h2></div>`:""}<section class="panel tcard">
      <div class="top2" style="display:flex;gap:10px;align-items:flex-start">
        <span class="no2">${i+1}</span>
        <div style="display:grid;gap:4px;min-width:0"><h3 style="font-size:18px">${esc(x.t)}</h3>
        <div class="tags"><span class="tag y">≈ ${x.min} хв</span><span class="tag">${esc(x.who)}</span><span class="tag g">${esc(x.scene)}</span>${x.g.startsWith("«")?`<span class="tag">${esc(x.g)}</span>`:""}</div></div>
      </div>
      <div class="mode"><b>У класі</b><p>${esc(x.cls)}</p></div>
      <div class="mode onl"><b>Онлайн</b><p>${esc(x.onl)}</p></div>
      <p class="tip">${esc(x.tip)}</p>
      ${i===TOGETHER.length-1?`<h3 style="font-size:17px;margin-top:6px">Хто це сказав? (${WHO_SAID.length} цитат з усіх новел)</h3>`+whoSaid():""}
    </section>`).join("")}`;
}
function whoSaid(){
  const q = TQ.i>=0 ? WHO_SAID[TQ.i] : null;
  return `<div class="ws">
    <div class="ws-q">${q?`«${esc(q.q)}»`:"Натисни «Наступна цитата»"}</div>
    ${q&&TQ.show?`<div class="ws-a">${esc(q.a)}</div>`:""}
    <div class="row"><button class="btn sm" type="button" id="wsNext">${TQ.i<0?"Перша цитата":TQ.i+1<WHO_SAID.length?"Наступна цитата":"Спочатку"}</button>${q&&!TQ.show?`<button class="btn ghost sm" type="button" id="wsShow">Показати відповідь</button>`:""}<span class="mono" style="font-size:12px;color:var(--muted)">${TQ.i+1}/${WHO_SAID.length}</span></div>
  </div>`;
}
function fmtSec(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function startTimer(m){
  if(TIMER) clearInterval(TIMER.h); TIMER=null;
  if(m>0){ TIMER = { total:m*60000, end:Date.now()+m*60000 }; TIMER.h = setInterval(tick, 500); }
  render();
}
function tick(){
  if(!TIMER) return; const left = Math.max(0, Math.ceil((TIMER.end-Date.now())/1000));
  const f=document.getElementById("tFill"), l=document.getElementById("tLeft");
  if(f) f.style.width = Math.max(0,(TIMER.end-Date.now())/TIMER.total*100)+"%";
  if(l) l.textContent = left ? fmtSec(left) : "Час!";
  if(!left){ clearInterval(TIMER.h); TIMER=null; }
}
function pickStudent(){
  const T=S.tg, c=names(T.cls), o=names(T.onl);
  let g = T.turn; if(g==="cls"&&!c.length) g="onl"; if(g==="onl"&&!o.length) g="cls";
  const pool = g==="cls"?c:o; if(!pool.length) return;
  let n = pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1 && T.last && T.last.n===n) n = pool[(pool.indexOf(n)+1)%pool.length];
  T.last = { n, g }; T.turn = g==="cls"?"onl":"cls"; save(); render();
}

/* ---------- для допитливих ---------- */
function vDeep(){
  const od = openDone();
  return `<section class="hero">
      <img class="mark m1" src="${WAVE}" alt="">
      <span class="eyebrow">Додатковий розділ · оцінюється окремо</span>
      <h2 style="font-size:clamp(28px,8vw,42px);font-weight:800">Для допитливих</h2>
      <p class="lede">${OPEN_QUESTIONS.length} запитань для роздумів, згрупованих за новелами. Тут немає правильних відповідей — є аргументи. Пиши розгорнуто, спирайся на текст і цитуй. Відповідь зараховується від ${OPEN_MIN} знаків, оцінку за зміст ставить учитель.</p>
      <div class="row"><span class="pill"><span class="ring" style="--p:${od/OPEN_QUESTIONS.length*100}"></span><span class="mono">${od}/${OPEN_QUESTIONS.length} виконано</span></span></div>
    </section>
    <div class="chips stories">${OG.map((g,k)=>{ const n=OPEN_G.filter(x=>x===g).length, d=OPEN_QUESTIONS.filter((_,i)=>OPEN_G[i]===g&&(S.open[i]||"").trim().length>=OPEN_MIN).length; return `<button class="chip ${k===DG?"on":""}" type="button" data-dg="${k}">${esc(g)} · ${d}/${n}</button>`; }).join("")}</div>
    ${OPEN_QUESTIONS.map((q,i)=>{ if(OPEN_G[i]!==OG[DG]) return ""; const v = S.open[i]||"", n = v.trim().length;
      return `<div class="panel oq"><div class="top2" style="display:flex;gap:10px"><span class="mono" style="flex:none;font-size:12px;font-weight:600;background:var(--violet);color:#fff;border-radius:8px;padding:3px 7px;height:max-content">${i+1}</span><label for="oq-${i}" style="font-weight:700;line-height:1.45">${esc(q)}</label></div>
      <textarea class="in" id="oq-${i}" data-open="${i}" placeholder="Твоя розгорнута відповідь або есе…">${esc(v)}</textarea>
      <div class="cnt ${n>=OPEN_MIN?"ok":""}" id="oqc-${i}">${n>=OPEN_MIN?"✓ зараховано · ":""}${n} / ${OPEN_MIN}+ знаків</div></div>`; }).join("")}`;
}

/* ---------- підсумок ---------- */
let confirmReset = false, dlMsg = "";
function vRes(){
  const m = mainScore(), g = S.game, od = openDone();
  return `<section class="panel">
      <span class="eyebrow">Підсумок</span>
      <h2 style="font-size:24px">${S.name?esc(S.name):"Ім'я не вказано"}</h2>
      ${S.name?"":`<div class="field"><label for="nameIn2">Ім'я та прізвище</label><input class="in" id="nameIn2" value=""></div>`}
      ${scoreCards()}
    </section>
    <section class="panel">
      <h3 style="font-size:17px">Оцінка за кожну новелу (максимум 100%)</h3>
      <table class="table"><tbody>${STORIES.map((st,s)=>{ const sc=storyScore(s); return `<tr><td>«${esc(st.name)}»</td><td><b>${fmt(sc.pct)}%</b> · ${sc.c}/${sc.n}${sc.d<sc.n?` · без відповіді ${sc.n-sc.d}`:""}</td></tr>`; }).join("")}</tbody></table>
      <p style="margin:0;font-size:13.5px;color:var(--muted)">Кожна новела оцінюється окремо: усі її запитання разом дають 100%.</p>
    </section>
    <section class="panel">
      <h3 style="font-size:17px">Надіслати вчителю</h3>
      ${SHEET_URL?`<p style="margin:0;font-size:14.5px">Результати автоматично потрапляють у таблицю вчителя, щойно ти вписав(-ла) ім'я. Наприкінці уроку натисни кнопку, щоб надіслати останню версію.</p>
      <div class="row"><button class="btn violet" type="button" id="sendBtn">Надіслати в таблицю</button></div>
      <p id="syncMsg" style="margin:0;font-size:13.5px;color:var(--muted)">${esc(syncMsg|| (S.sent?"Востаннє надіслано: "+new Date(S.sent).toLocaleString("uk-UA",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+".":"Ще не надіслано."))}</p>`:""}
      <p style="margin:0;font-size:14.5px">У звіті — бали, відповіді на всі запитання, результат гри й тексти розділу «Для допитливих».</p>
      <div class="row">
        <button class="btn" type="button" id="copyBtn">Скопіювати звіт</button>
        <button class="btn ghost" type="button" id="dlBtn" hidden>Завантажити .txt</button>
      </div>
      <textarea class="in" id="reportBox" hidden readonly></textarea>
      ${dlMsg?`<p style="margin:0;font-size:13.5px;color:var(--muted)">${esc(dlMsg)}</p>`:""}
    </section>
    ${confirmReset ? `<div class="confirm"><b>Видалити всі відповіді на цьому пристрої?</b><span style="font-size:14px">Скасувати це не можна.</span><div class="row"><button class="btn sm" style="background:var(--wrong);color:#fff" type="button" id="resetYes">Так, почати заново</button><button class="btn sm ghost" type="button" id="resetNo">Скасувати</button></div></div>`
      : `<div class="row"><button class="btn ghost sm" type="button" id="resetBtn">Почати заново</button></div>`}`;
}
function answerText(q,a){
  if(!a) return "—";
  if(q.t==="single"||q.t==="device") return q.o[a.v];
  if(q.t==="tf") return a.v===0?"Правда":"Неправда";
  if(q.t==="multi") return (a.v||[]).map(k=>q.o[k]).join("; ");
  if(q.t==="input") return a.v;
  if(q.t==="match") return q.l.map((l,k)=>`${l} → ${q.r[a.v[k]]??"—"}`).join("; ");
  if(q.t==="order") return a.v.map(k=>q.items[k]).join(" → ");
  return "—";
}
function report(){
  const m = mainScore(), g = S.game, L = [];
  L.push("Сергій Жадан. «Месопотамія»: " + STORIES.map(s=>"«"+s.name+"»").join(", ") + " — звіт учня");
  L.push("Учень/учениця: " + (S.name||"—"));
  L.push("Оцінка за кожну новелу (максимум 100%):");
  STORIES.forEach((st,s)=>{ const sc=storyScore(s); L.push(`  «${st.name}»: ${fmt(sc.pct)}% (${sc.c}/${sc.n})`); });
  L.push(`Гра «Хто з якої історії?»: перша спроба ${g.first??"—"}%, найкраща ${g.best??"—"}%, спроб ${g.tries}`);
  L.push(`Для допитливих: зараховано ${openDone()}/${OPEN_QUESTIONS.length}`);
  L.push("");
  QUESTIONS.forEach((qs,p)=>{ if(!qs.length) return; L.push(`== «${STORIES[PART_META[p].s].name}», ${partNo(p)}. ${PART_META[p].title} (${partCorrect(p)}/${qs.length}) ==`);
    qs.forEach((q,i)=>{ const a=S.ans[qid(p,i)]; L.push(`${partNo(p)}.${i+1} ${a?(a.ok?"[+]":"[-]"):"[ ]"} ${q.q}`); L.push("   " + answerText(q,a)); }); L.push(""); });
  L.push("== Для допитливих ==");
  OPEN_QUESTIONS.forEach((q,i)=>{ if(i===0||OPEN_G[i-1]!==OPEN_G[i]) L.push(`-- ${OPEN_G[i]} --`); L.push(`${i+1}. ${q}`); L.push((S.open[i]||"—").trim()); L.push(""); });
  L.push("created by Vadym Kulyk");
  return L.join("\n");
}

/* ---------- події ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.tab){ go(t.dataset.tab); return; }
  if(t.dataset.dg!=null){ DG=+t.dataset.dg; const y=scrollY; render(); scrollTo(0,y); return; }
  if(t.dataset.go){ go(t.dataset.go, { part: t.dataset.part!=null ? +t.dataset.part : null }); if(t.dataset.go==="text") requestAnimationFrame(()=>{ const c=document.querySelector(".chip.on"); c&&c.scrollIntoView({inline:"center",block:"nearest"}); }); return; }
  if(t.dataset.check){ check(t.dataset.check); return; }
  if(t.dataset.pick!=null){ const id=t.dataset.q; S.draft[id]=+t.dataset.pick; save(); rerender(id); return; }
  if(t.dataset.tog!=null){ const id=t.dataset.q, k=+t.dataset.tog, s=new Set(S.draft[id]||[]); s.has(k)?s.delete(k):s.add(k); S.draft[id]=[...s]; save(); rerender(id); return; }
  if(t.dataset.mv!=null){ const id=t.dataset.q, [p,i]=id.slice(1).split("q").map(Number), q=QUESTIONS[p][i]; const o=(S.draft[id]||orderStart(q.items.length,id)).slice(); const a=+t.dataset.mv, b=a+(+t.dataset.dir); [o[a],o[b]]=[o[b],o[a]]; S.draft[id]=o; save(); rerender(id); return; }
  if(t.dataset.game==="start"){ newGame(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.game==="close"){ G=null; render(); return; }
  if(t.dataset.game==="next"){ gameNext(); return; }
  if(t.dataset.gpick!=null){ gamePick(t.dataset.gpick); return; }
  if(t.id==="pickBtn"){ const y=scrollY; pickStudent(); scrollTo(0,y); return; }
  if(t.dataset.timer!=null){ const y=scrollY; startTimer(+t.dataset.timer); scrollTo(0,y); return; }
  if(t.dataset.score){ const k=t.dataset.score; if(k==="reset") S.tg.score={cls:0,onl:0}; else S.tg.score[k]++; save(); const y=scrollY; render(); scrollTo(0,y); return; }
  if(t.id==="wsNext"){ TQ.i = TQ.i+1<WHO_SAID.length ? TQ.i+1 : 0; TQ.show=false; const y=scrollY; render(); scrollTo(0,y); return; }
  if(t.id==="wsShow"){ TQ.show=true; const y=scrollY; render(); scrollTo(0,y); return; }
  if(t.id==="fontBtn"){ S.big=!S.big; save(); render(); return; }
  if(t.id==="resetBtn"){ confirmReset=true; render(); return; }
  if(t.id==="resetNo"){ confirmReset=false; render(); return; }
  if(t.id==="resetYes"){ confirmReset=false; G=null; const big=S.big, tg=S.tg; S=blank(); S.big=big; S.tg=tg; S.tab="home"; save(); render(); window.scrollTo(0,0); return; }
  if(t.id==="copyBtn"){ const txt=report(); const done=()=>{ toast("Звіт скопійовано"); }; const fail=()=>{ const b=document.getElementById("reportBox"); b.hidden=false; b.value=txt; b.focus(); b.select(); toast("Виділи текст і скопіюй вручну"); };
    try{ navigator.clipboard.writeText(txt).then(done, fail); }catch(err){ fail(); } return; }
  if(t.id==="dlBtn"){ download(); return; }
  if(t.id==="sendBtn"){ syncNow(true); return; }
});
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.id==="nameIn"||t.id==="nameIn2"){ S.name=t.value; save(); return; }
  if(t.dataset.tg){ S.tg[t.dataset.tg]=t.value; save(); const b=document.getElementById("pickBtn"); if(b) b.disabled=!(names(S.tg.cls).length+names(S.tg.onl).length); return; }
  if(t.dataset.text){ const id=t.dataset.q; S.draft[id]=t.value; save(); const b=document.querySelector(`[data-check="${id}"]`); if(b) b.disabled=!t.value.trim(); return; }
  if(t.dataset.open!=null){ const i=+t.dataset.open; S.open[i]=t.value; save(); const n=t.value.trim().length, c=document.getElementById("oqc-"+i); c.className="cnt "+(n>=OPEN_MIN?"ok":""); c.textContent=(n>=OPEN_MIN?"✓ зараховано · ":"")+n+" / "+OPEN_MIN+"+ знаків"; return; }
});
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset.ml!=null){ const id=t.dataset.q, d=Object.assign({}, S.draft[id]||{}); if(t.value==="") delete d[t.dataset.ml]; else d[t.dataset.ml]=+t.value; S.draft[id]=d; save(); const [p,i]=id.slice(1).split("q").map(Number); const b=document.querySelector(`[data-check="${id}"]`); if(b) b.disabled=!QUESTIONS[p][i].l.every((_,k)=>d[k]!=null); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.dataset && e.target.dataset.text){ const id=e.target.dataset.q; if((S.draft[id]||"").trim()) check(id); }
});
window.addEventListener("scroll", ()=>{ const h=document.documentElement; const p = S.tab==="text" ? Math.min(100, h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100) : 0; document.getElementById("rbar").style.width=p+"%"; }, { passive:true });

function toast(msg){ const d=document.createElement("div"); d.className="toast"; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(), 2200); }

/* завантаження через можливість downloads */
let DL = (window.claude && typeof window.claude.use==="function") ? null : { save:async ({filename,data})=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"text/plain;charset=utf-8"})); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500); } };
if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("downloads").then(d=>{ DL=d; const b=document.getElementById("dlBtn"); if(b&&DL) b.hidden=false; }).catch(()=>{});
}
const _render = render;
render = function(){ _render(); const b=document.getElementById("dlBtn"); if(b) b.hidden=!DL; };
async function download(){
  if(!DL) return;
  try{ await DL.save({ filename:`mesopotamia-${(S.name||"uchen").trim().replace(/\s+/g,"-")}.txt`, data: report() }); dlMsg="Файл збережено."; }
  catch(err){ const c=err&&err.code; dlMsg = c==="declined" ? "Збереження скасовано." : c==="rate_limited" ? "Зачекай кілька секунд і спробуй ще раз." : "Завантаження тут недоступне — скористайся кнопкою «Скопіювати звіт»."; if(c!=="declined"&&c!=="rate_limited") DL=null; }
  render();
}

render();
</script>
