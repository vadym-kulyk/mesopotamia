ємного теж нічого — просто вона іноді нікого не впізнає. — Це ж не страшно, правда? — питала Аліна. — Я теж не завжди всіх упізнаю. Одне слово, оскільки це її мама, вона має завжди бути десь поруч, десь недалеко. Марат легко з нею погодився. І знав краще за інших, що вона нікуди з ним не поїде. А отже, і він нікуди не поїде. Тому що одна річ — спати в чужому будинку з чужою жінкою, і зовсім інша — кинути того, кого кидати не можна. Ніяк не можна. За жодних обставин. Принаймні так я все це зрозумів.", "Що з нею буде далі, думав я, як вона дасть собі раду? Що взагалі робити далі? Минув подвір'я інституту, піднявся вгору, зупинився коло нашої школи. Мій будинок стояв навпроти, зовсім поруч, старий, чотириповерховий, неремонтований. Під'їзд не зачинявся. Іноді зранку я прокидався від підліткових голосів на сходовому майданчику: школярі прибігали на перекур. Я жив на горішньому поверсі, наді мною був лише дах. Там жили сотні голубів, інколи я чув крізь сон їхнє туркотання. Одного разу, вже в старших класах, Марат потягнув мене на них полювати. Не знаю, навіщо йому було це потрібно. Не пам'ятаю, чому я на це погодився. — Там сотні голубів, — збуджено говорив він, — вночі вони сонні, їх можна просто набирати в мішок. Ми зустрілися ввечері коло мого будинку. Він мав із собою тренувальну торбу. Ми піднялися нагору. Марат заліз перший. Я за ним. На горищі було задушливо й тихо. Тишу порушувало хіба що невидиме й моторошне шарудіння пташиних крил. Я дістав ліхтарик, проте Марат вчасно мене зупинив: ти що, сказав, налякаєш. Він пішов уперед. Голуби сиділи на бантинах, сонні й безборонні. Марат легко хапав їх і кидав до торби. Вони давались йому до рук із якоюсь неприємною приреченістю, не встигнувши нічого зрозуміти, не встигнувши як слід розгледіти свою смерть в обличчя. Незабаром торба була повна. Вона вся шаруділа зсередини, ніби там хтось із кимось сварився. Марат підійшов до вікна, виліз назовні. Покликав мене. Я виліз слідом. Ми обережно примостилися коло вікна, розглядаючи будинки внизу. Прямо під нами світилися темним сріблом квартали, в яких ми виросли, важкі нагромадження домів, розгалуження крони. Світилися порожні подвір'я, у яких стояла темрява, ніби вода в затонулих танкерах. Світилися вікна й балкони, антени й драбини. Світилися арки й під'їзди, стовпи та афішні тумби. Світилися цегла й жерсть, трава й каміння, глина й нічна земля. Світилася павутина, тонкими прожилками наповнюючи повітря. Далі будинки обривалися вниз, до ріки, і вже там, ближче до річища, світилися дахи складів та автомайстерень, світилася холодна ртуть течії, примарна труба старого млина на тому березі, вогні приватного сектора, білі дими котелень і фабрик. Далі срібло заливало собою землю та небеса. І можна було лише здогадуватися, хто там живе й що там відбувається. Марат зачаровано дивився перед собою.", "— Ось що, — сказав він, — добре було б усе тут купити.", "— Для чого? — не зрозумів я.", "— Як для чого? — здивувався він. — Для престижу. Уявляєш, мати такий будинок, — показав він на сусідні вікна. — Я коли виросту, обов'язково все куплю. Все і всіх. Тут усе буде моїм. Тут і так усе моє, — додав, подумавши.", "— Точно, — погодився я.", "— Ти що, — образився Марат, — не віриш, що я зможу? Побачиш. Я зможу все. Усе, що завгодно. Як ти можеш мені не вірити? Ти ж мій друг, мій учень.", "— Як це?", "— Я тебе вчив боксу!", "— Та ладно, — не погодився я. — Ти просто двічі мене побив.", "— Неважливо, — відповів Марат. — Ти, можна сказати, мій улюблений учень.", "— Послухай, — сказав я, — давай їх випустимо, — показав на торбу. — А то противно якось.", "Марат замовк. Видно, вагався. Потім мовчки розкрив торбу, витрусив птахів просто на шифер. Вони покотилися, змахуючи крильми й злітаючи в повітря. Марат відкинув торбу вбік. Сидів і мовчав. Я теж не надто розумів, про що тепер говорити. Враз він озирнувся. За нами, у тріснутому вікні, різко відбивався тонкий місячний серп. Це від нього було стільки світла. Він сліпив очі й позбавляв спокою. Марат обережно простягнув руку й відламав шматок скла. Ніби розламав місяць навпіл. Залишилася половина. Стало темніше."], ["Два роки тому я відчував, як серце щоранку будить мене зі сну, говорячи: давай, прокидайся, ми втрачаємо час. Скільки можна спати, підштовхувало воно, підстрибуючи на місці, давай, ми пропустимо все цікаве. Я прокидався й вибігав на вулицю, і жодне з див не могло б мене тоді оминути. Два роки тому я рвав повітря легенями й був певен, що за найближчим рогом на мене чекає щось неймовірне — вогні, салюти й святкові оркестри. І хоча там насправді на мене не очікувало нічого, крім весняних протягів, це аж ніяк не бентежило. Двадцять років — той вік, коли диявол приходить до тебе, аби поскаржитися на життя. Усе зав'язано на тобі, від тебе вимагається лише поменше спати. І користуватися презервативами. Все інше обов'язково з тобою станеться. І станеться саме так, як ти цього хочеш. Хочеш ти цього чи не хочеш.", "Я приїхав сюди наприкінці травня. Від вокзалу пішов пішки. Речей мав мало: шкіряний рюкзак із парою футболок та старим ноутом, термос із коньяком, який не встиг допити в дорозі. Джинси, кеди, ядучо-зелена сорочка — я приїхав надовго. Щоденні пробіжки робили мій крок легким і невагомим, зачіска робила мене схожим на вокаліста боні ем у кращі їхні часи, сонце щедро відбивалося від темних окулярів на півобличчя. Я був зіркою, і на мене не можна було не звернути увагу. Принаймні так я собі все це бачив. Місто мені сподобалося: тихі привокзальні двори, зарослі травою й засаджені абрикосами, гаражі, флігелі та аварійні будинки, з яких виходили повільні, мов хамелеони, пенсіонери — мене все влаштовувало. Запах цукру й шоколаду у кварталах довкола кондитерської фабрики, суворі цехи порожніх підприємств довкола ринку, брами, крамниці та лікувальні заклади — усе було за мене. Я вийшов до набережної. Виявляється, тут були мости. Це добре, подумав я, місто, яке лежить на ріці, більш захищене й спокійне, життя в такому місті тримається своїх меж і має свій порядок. Потім я дізнався, що ріка тут не одна. Місто лежало між ними, на пагорбах, ніби на острові, світячись усіма своїми білими й червоними будівлями, що були оточені зусібіч гарячою травневою зеленню. Що ж, сказав я, ступаючи на міст, можете мене зустрічати.", "Будинок мав чотири поверхи. Виглядав занедбано, себто затишно. Загалом тиха вулиця, лише з протилежного боку, зі шкільного подвір'я, лунав відчайдушний школярський лемент. Я потягнув двері. Жодного коду — заходь і вбивай їх у їхніх теплих ліжках. Гарний настрій, піднесений стан, початок сонячного безкінечного дня. Третій поверх був мій. Чорні металеві двері, синій гумовий килимок, червоний симпатичний ґудзик дзвінка. Іноді життя забуває про нашу присутність і починає нам подобатися.", "Я тиснув і тиснув, витискаючи з червоної кнопки рештки противного писку. Ніхто, ясна річ, не відчиняв. Бив у двері ногою, наспівував веселі куплети. Думав навіть зайти до сусідів, тиснув на таку само червону кнопку, але там теж ніхто не відчиняв. Що робити? — подумав. Інших адрес я не мав, у цьому місті на мене просто не чекали. Кинув рюкзак під стіну, сів на килимок, відкрив термос. Коли-небудь вони повернуться, подумав я, і так чи інакше пошкодують.", "За якийсь час зауважив, що за дверима хтось ходить доволі безтурботно і теж щось собі наспівує. Сусіди знизу, подумав я. Проте ні — ходили саме за дверима, до яких я привалився спиною. Я зірвався на ноги й потягнувся до дзвінка. Кроки стихли, потім ледь чутно наблизились. Хтось розглядав мене у вічко. Я ступив назад, аби можна було розгледіти окуляри. Головне — справити враження, подумав. Двері відчинилися.", "У неї була радісна зачіска. Не просто фарбоване в біле волосся, а фарбоване різними відтінками білого. Приємне й радісне. Погляд мала допитливий, хоча й сонний. Загалом виглядала заспано. Одягнена була в червону піжаму, поверх якої абияк був накинутий білосніжний халат із готельною емблемою. Час від часу він сповзав, тоді вона нагадувала боксера, що готувався виходити в ринг, скидаючи командний халат на плечі масажистів. Мала зелені очі, бліду від куріння шкіру, ніжну шию, стояла босоніж, переступаючи з ноги на ногу.", "— Ти хто? — спитала, зазираючи мені за плечі.", "— Рома, — відповів я, і собі озираючись. — Вам мама моя дзвонила.", "— Мама? — не зрозуміла вона. — Для чого дзвонила?", "— Я у вас жити буду, — пояснив я.", "— З мамою?", "— Сам. Мама вдома.", "— Вдома? — перепитала вона, поправивши халат, що все сповзав. — І що вона там робить, удома?", "— У неї процес, — відповів я.", "— Що?", "— Процес. Вона юрист.", "— Все, — раптом згадала вона, — згадала. Ти Рома, так?", "— Рома.", "— Мама — юрист.", "— Точно.", "— А що в тебе на голові?", "Звали її Даша. З мамою моєю вони познайомилися на семінарі місяць тому. Удень сиділи поруч, нотували за доповідачами, заливалися кавою на брейках. Увечері, під час корпоративного боулінґу, набралися, мама знала, як це робиться, під кінець вечора вона висіла в нової подружки на плечі й розповіла, що я ось-ось маю залишити батьківський дім, оскільки перевівся до них на навчання. Рік не довчився, — плакала мама, — ясно, що йому зі мною сидіти, який інтерес? Ось він і перевівся. А де він там жити буде? На вокзалі? Мама витирала сльози й замовляла ще, а від цього ще більше плакала. Аж урешті Даша сказала: ну, що за біда, хай поживе в мене, в мене є вільна квартира, бабуся дуже доречно померла. Я все одно збиралася її здавати, краще здавати знайомим — хоч меблі не винесуть. А захочуть винести, все одно не зможуть — їх там просто немає. Мама вхопилася за такий варіант: якщо вже відпускати малого, ну, мене себто, в доросле життя, то краще знати, де потім шукати тіло. Я на все погоджувався. Навіть якби не було цієї Даші, я б усе одно знайшов, де жити. Головне — вибратися з кімнати, яка смерділа дитячим одягом і шкільними підручниками. Я давно збирався куди-небудь з'їхати, у двадцять років жити з мамою — задоволення сумнівне. Вона забагато пила як для юриста, я забагато часу проводив у ванній кімнаті. Найкраще для всіх у такій ситуації — роз'їхатись і писати один одному листи.", "Схоже, враження я на неї не справив. Звісно, мені це не подобалося. Я думав, потрібно їй щось розповісти про маму, про те, що мене цікавить у житті, чим я займаюсь, на що розраховую, але вона мене випередила.", "— Пішли, — сказала, — я тобі все покажу.", "Вона підійшла до сусідніх дверей, відчинила їх, зайшла досередини. Мене не запрошувала, я постояв на порозі, потім зайшов. Дві кімнати. Схоже, не так давно ремонтували. Схоже також, що ремонтом займалася вона сама: шпалери відклеювались, у душовій стояли теплі калюжі, стеля була не те, щоби побілена, радше помальована. Даша пройшла до кімнати, відчинила вікно, перехилилася назовні. Мала красиві литки. Добре, що я поселився саме в неї, подумав я. Тут вона повернулася.", "— Ти без спальника? — запитала. — Добре, дам тобі матрац. Значить, тут кухня, — вона потягла мене до сусідньої кімнати. Там стояла плита. Ну, і все, більш нічого. — В принципі не так важливо, — сказала на це вона. — Поруч піцерія, якщо що. Душ, — промовила, обережно переступаючи через калюжі. — Рушник дам, — додала. — Що ще? Ага, Інтернет, світло, газ. Ти мене розбудив, — сказала, — я щось ніяк не зосереджусь.", "Ми перенесли з її квартири великий матрац, залитий акварельними фарбами й перемащений пластиліном та губною помадою. Даша мала тонке тіло й приємний голос. Я подумав, добре було би спати з нею на цьому матраці. Зрештою, чому б і ні, подумав. Головне, подумав, справити враження. Живе вона, схоже, одна. Спить до обіду. Ходить під'їздом у піжамі. Мені підходить, подумав я, дивлячись, як вона легко схиляється над матрацом, намагаючись його відчистити. Просто потрібно брати все у свої руки, подумав я і пішов у душ.", "По обіді вона знову забігла. Сказала, що їде у справах, принесла постіль, залишила ключі від своєї квартири, пояснила, що коли зголоднію, можу йти на кухню й вибирати з холодильника все, що знайду. А знайдеш ти там, додала, хіба що капусту. Свіжу, уточнила. Була в діловому костюмі пісочного кольору. Він її дещо повнив, проте черевики на високих підборах все ставили на свої місця — не зовсім молодий, проте цілком упевнений у собі юрист, із бойовою зачіскою, з-під білосніжної сорочки просвічувала білизна. Фарбована була похапцем, пахло від неї кавою, і говорила вона так багато й голосно, що я навіть не зрозумів, коли вона пішла."], ["Ну, добре-добре, злився я, не назавжди ж вона пішла, незабаром повернеться. Які в неї можуть бути справи? Ну, судове засідання, ну, очна ставка, розпізнавання трупів. Вихопить іще одного невдаху з кігтистих лап смерті, розпишеться, де треба, і додому, до мене. Головне — не втратити момент, не пропустити нагоду, піймати своє щастя, коли воно пробігатиме коридором. Вечір повільно міняв повітря, як готельну білизну, роблячи зелень темною, а шибки рожевими. Світло м'яко торкалося підлоги й порожніх стін, за деревами на вулиці чутно було голоси й дитячий сміх. Хотілося йти на ці голоси, ходити між деревами, торкатись у темряві жіночих рук, ловити зелені місяці, що обриваються з гілок, не витримуючи власної ваги.", "Як усе влаштувати, думав я, як усе влаштувати? Можна, скажімо, прийти до неї на кухню. Нібито за харчами. Стримано поскаржитись на голод, суворо попередити, що приготую все сам, але попросити її допомогти. Бути впевненим і небагатослівним. Можна прийти без футболки, хай бачить, який я засмаглий. Можна прийти босоніж. Ні, відразу ж передумав я, босоніж не годиться, вона все зрозуміє, скаже: ти б ще голий прийшов. Добре, тоді пляжні капці. Щоби в разі чого не возитися зі шнурівками. Так, задоволено похвалив я себе, саме так. Попросити її дістати прянощі: корицю, кардамон, чорний перець. Прянощі в неї, очевидно, на якійсь полиці. І коли вона за ними полізе, спокійно, головне — спокійно! — підійти й торкнутися її ніг. Нібито підтримуючи її. А далі вона сама все зрозуміє. Відчує тепло моїх долонь. І тоді я зніму її зі стільця, посаджу на стіл і почну роздягати.", "Або, не міг заспокоїтись я, можна прийти й попросити в неї яку-небудь дрібничку. Скажімо, мило. Ні, заперечив я сам собі, тоді вона точно все зрозуміє. Краще не мило. Краще зубну щітку. Прийти до неї в капцях, з оголеним торсом, можна в окулярах, і суворо та небагатослівно попросити запасну щітку. Мовляв, свою забув у потязі — швидко збирався, допомагав жінкам, виносив на перон дітей, евакуював пенсіонерів. Щітка в неї, напевно, буде у ванній. І коли вона пройде туди у своєму діловому костюмі, можна прослизнути за нею, стати в неї за спиною, близько-близько, так щоби вона відчула запах мого дезодоранту й завмерла стривожено, усе розуміючи й передчуваючи. І тоді можна торкнутися її одягу, чуючи, як під ним здригається її чутливе тіло, і мовчки стягнути з неї піджак, і …", "Але й це ще не все, заводився я, це ще далеко не все! Можна прийти до неї з ноутом, мовляв, не можу налаштувати нет, який пароль, мовляв? Вона в цей час може валятися на своєму ліжку в діловому костюмі, змучена довгим робочим днем, очними ставками. Лежатиме на животі (вона, очевидно, любить спати на животі) і дивитиметься телевізор, бажано без звуку, щоби не відволікатись. Можна стати між нею та екраном і стримано-суворо запитати пароль. А вона може сказати: ти знаєш, я вже й сама його не пам'ятаю, давай сюди ноут, зараз налаштуємо. І поплескає долонею поруч із собою, мовляв, стрибай давай, зараз усе зробимо. І тоді потрібно спокійно (спокійно!) впасти поруч із нею. Головне — не забути скинути капці! А коли вона почне копатися в машині, можна взятися їй підказувати й ніби ненароком накрити її долоню своєю, і торкнутися її волосся, і подивитися — уважно й упевнено — в її широко розплющені очі. І ось коли вона все зрозуміє й відкладе набік мій недолугий ноут, мені й робити нічого не доведеться …", "З цим я й заснув. Уві сні наді мною літали ластівки. Загрозливо робили наді мною кола. Але я не боявся.", "Я й прокинувся цілком випадково, не так почувши, як відчувши її кроки. Спочатку внизу скрипнули двері, потім вона затупотіла витертими сходами, б'ючи долонею по перилах, завмираючи на поверхах, зазираючи вниз, перечікуючи й рушаючи далі. Вона підіймалася безкінечно довго, аж я встиг розігнати всіх ластівок, рвонув до ванної, намочив волосся, аби все було як слід, кинувся на сходи. Зіткнувся з нею лицем до лиця. Її помітно хитало. Вона тримала по пляшці шампанського в кожній руці. Піджак волочила за собою сходами, недбало підчепивши його правим мізинцем. Черевики її перемащені були піском і травою. Усмішка в неї була п'яна, виглядала вона чарівно.", "— О, — здивувалась, — ти без капців?", "— Неважливо, — заговорив я стримано й суворо. — Почув, що ти йдеш.", "— Чекав на мене? — засміялась вона.", "— Ключі хотів віддати, — говорив я далі, так само стримано й суворо.", "— Вип'єш? — запропонувала Даша.", "— Шампанське? — я вклав у питання максимум суворості. — Хіба за компанію.", "Вона кинула на підлогу піджак, сіла на нього, запросивши й мене. На спідницю її не можна було дивитися без болю, так це було відверто. Я сів поруч, відчуваючи босими ногами холод нічної долівки. Потрібно було все-таки не одягати футболку, подумав, хай би розгледіла, хай би вона все розгледіла. Даша сама взялася відкорковувати шампанське, довго з ним боролась, бовтала пляшку, зубами гризла фольгу. Врешті пляшка вибухнула, Даша запищала, втім, швидко заспокоїлась, за знайомство, сказала й приклалася до вина. Шампанське залило її всю з головою, потекло з уст, кудись за комір білосніжної сорочки, Даша різко передала пляшку мені, почала розстібати ґудзики, витирати шкіру, я зовсім розгубився, дивлячись, як вона ніжно й старанно торкається свого тіла.", "— Давай, — сказала, — пий.", "— Як робота? — запитав я поважно.", "— Робота нормально, — пояснила вона. — Нервова робота. У клієнтів завжди проблеми. Як працювати з людьми, в яких проблеми? Їх лікувати треба. А ти чим збираєшся займатись? — запитала.", "— Обживусь поки що, — відповів я, вирішивши не відкривати всіх козирів. — Можна тебе поцілувати?", "— Ще чого! Заведи собі друзів — з ними й цілуйся. Все, давай.", "Підвелась, підхопила піджак, сунула мені невідкорковану пляшку й пішла спати."], ["Що я зробив не так? Де помилка? Футболка? Капці? Окуляри? Усе мало закінчитися зовсім інакше. Я нині мав лежати в її ліжку, вона мала б лежати поруч, ніжно й утомлено дивлячись у мої незворушні очі. Натомість я стою серед кухні з пляханом шампанського в руках і не знаю куди подіти руки. А вона в цей час, що вона робить? Ага, ось вона теж виходить на кухню — за стіною почулися кроки, я поставив шампанське на підлогу й припав вухом до стіни. Ось вона підходить до вікна, відчиняє, на неї відразу ж кидається вся сутінкова живність, усі ці нетлі та жуки, тож вона швидко причиняє вікно, підходить до шафки на стіні, дзвенить посудом, дістає банку з чаєм, цукор, чашку, ложечки, блюдця. Мелодійно всім цим подзвонює, ставить усе це на стіл прямо за моєю стіною, на відстані руки, на відстані видиху. Запалює газ, ставить чайник, сідає. Встає, підходить до вікна, знову відчиняє, дістає запальничку. Чорт, вона курить. Нервово добиває сигарету, видихає дим із легень, причиняє вікно, дістає з кишені піджака мобільний, перевіряє вхідні, різко ховає телефон назад. Закипає чайник, вона довго не звертає на нього уваги, стоїть і напружено дивиться перед собою, саме туди, де стою я. Різко повертається, зі злістю перекриває газ. Сідає за стіл, важким рухом згрібає в куток усі горнята, ложки та блюдця. Далі я ніяк не можу розчути. Що вона робить? Що вона там робить? Плаче! — раптом доходить до мене, вона плаче! Вона там сидить і плаче! Так-так, сидить сама в порожній квартирі й ниє. Заливається гіркими слізьми, безутішно побивається, наковтавшись проти ночі гіркого тютюну, і немає нікого, зовсім-зовсім нікого, хто б почув її плач, хто міг би її втішити! Нікого, крім мене. Я аж підстрибую від такого прозріння, збиваю пляшку, та глухо завалюється набік і повільно, як вантажений нафтою товарняк, котиться вимитою холодною плиткою, поскрипуючи й порушуючи навколишню тишу. Вона по той бік насторожується. Усе розуміє й затихає, прислухаючись. Пляшка докочується до стіни й зупиняється. Я теж затихаю. Стою й слухаю, як вона мовчить. Мовчить, знаючи, що я тут, що я все чую, усе знаю, про все здогадуюсь.", "Вона розбудила мене перед восьмою, відчинивши двері своїми ключами, і закричала з порогу:", "— Так і знала, що ти спиш!", "Пробіглася коридором, зазирнула до ванної, кинула прискіпливий погляд на кухню й завалила прямо до кімнати, де я спав. Спав я без одягу, і ось тут вона нарешті розгледіла все.", "— Ой, — сказала, сідаючи поруч і торкаючись мого плеча, — що це в тебе зі шкірою? — запитала вона, розглядаючи мою татуху. — Це пес?", "— Дракон, — відповів я, — просто недомальований.", "— Ну, — не погодилась Даша, — який же це дракон? Це пес. Дивись, який у нього хвіст. Такса, — вона ще раз торкнулась мого дракона. Шкірою мені потік вогонь. Проте не встиг я знайти відповідь, як вона зіскочила з ліжка. — Давай, — наказала, — одягайся, щось тобі покажу.", "Я поспішив одягнутись. Чомусь мені не вистачало впевненості, до того ж після такси взагалі не було бажання в чомусь її переконувати. Даша відчинила двері на балкон, вийшла, стояла й махала рукою: давай, говорила, де ти там є. Вона стояла в білому готельному халаті. Волосся прихоплене було сіточкою, у ній вона, схоже, й спала, від чого зачіска її нагадувала ретельно й уміло підібраний овочевий набір для супу. Я понуро підійшов.", "— Так, — промовила, озирнувшись, — зараз я тобі все покажу. Потім відіспишся. Дивись, — почала, звільняючи мені місце. — Бачиш?", "Я подивився вниз. Було багато сонячного світла, що сліпило очі й позбавляло предмети чіткості. За мить зір повернувся, речі окреслились, фарби набули повноти. Травень завершувався зеленню й теплом, свіже повітря лежало на дахах і стояло в подвір'ях. Вулицею бігли школярі, снували нечисленні перехожі, на розі стояв двірник, світячись здалеку помаранчевим вогнем жилетки. Так починається свято, подумав я.", "— Значить, — почала Даша, — це ось школа, — тицьнула вона пальцем у подвір'я навпроти, — я там не навчалась, я роки три як переїхала. Але, щоб ти знав, там відбуваються страшні речі. Директорка часто спить у своєму кабінеті. Не сама. До неї приїздять. Машина з дипломатичними номерами. До ранку крутять італійську естраду й курять, висунувшись у вікно. У неї червона нічна сорочка, якщо це тобі цікаво. Поруч — салон краси, — тицьнула вона знову. — Вони там усі нарощують одна одній нігті. Подивись як-небудь, вони виходять на вулицю, аби перекурити, сідають на лавку, бачиш, там є лавка під стіною, і дістають одна одній із кишень сигарети, оскільки самі собі дістати не можуть — нігті заважають. Потім сидять, як сови, вчепившись нігтями за край лавки. За рогом підозрілий ресторан — власник щоранку ходить вулицею в рожевому кімоно й говорить із кимось по дамському мобільнику. За ними — спортивний паб, там араби дивляться європейські ліги. За ними в'єтнамці відкрили «ригалівку», але самі там не їдять. Порожній будинок, влітку там живе бомжота, теж цікаво. Поруч із бомжами — майстерні художників, дивись не переплутай. Навпроти — тубдиспансер. Так, що далі? — Вона подивилась ліворуч. — Ліворуч. Ліворуч видавництво, підозрюю, там підпільно переховують невраховану документацію, заносять вечорами паперові пакунки, виносять на світанку трупи, загорнуті в китайські килими. Далі стара садиба, мені здається, там доживають віку коханки батьків міста. Я їх іноді бачу на веранді, ну, не батьків міста, ясна річ, їхніх коханок. Вони там п'ють чай із ромом. Наймолодшій із них років сімдесят.", "— Правда? — засумнівався я.", "— Свята правда, — підтвердила Даша. — У неї теж, до речі, червона нічна сорочка. Вона прямо в ній і п'є свій чай. Із ромом, — додала. — Далі новий будинок. Його довго не могли заселити — дорого. Тому там якийсь час жили будівельники: ночували в спальниках, смажили м'ясо на вогні, знаходили щось смачне на складах. Як партизани, чесне слово. Там далі, якщо повернути, є кілька продуктових, вони завжди зачинені. Чим насправді торгують — не знає ніхто, але особисто я бачила кілька разів, як туди заходять молоді жінки й не виходять звідти вже ніколи. Вниз пішли приватні будинки з палісадниками, там майже ніхто не живе. Але ніхто й не помирає. Багато дерев. Зараз усе квітне. На горішніх поверхах уночі горить світло, на нижніх, як правило, якийсь бізнес — ксерокс, нотаріус, виготовлення пам'ятників. Далі заправка, майстерні, а там і ріка. А ось тут, прямо під нами, — подивилася вона вниз, — військкомат. Я знаю пару секретарок звідти — важка робота, скажу тобі, шкідлива. Ти служив?", "— Ні, — відповів я знехотя.", "— Ясно, — зрозуміла вона. — Ну, і нарешті — наш будинок. Значить, дивись, — вона перехилилась через огорожу, я ледве встиг її схопити за відліг халата, — на першому поверсі живуть вірмени, запах одеколону чуєш? Це від них. Їх там двоє, всім говорять, що брати. Я не вірю. Сусідні вікна, антена, бачиш? Анфіса, журналістка, веде погоду. Буде запрошувати в гості — не ходи. У неї там мама — відразу одружить. Хіба що хочеш більше знати про погоду. На другому поверсі стоїть порожня квартира. Чоловік-мисливець влаштував стрілянину. Вендета! — весело закричала Даша. — Я саме в'їжджала, коли він відстрілювався від міліції. Колишній військовий, артилерист. Останні роки ремонтував одяг. Але рушницю тримав зарядженою. Квартиру так ніхто й не купив. Там пахне смертю. А ось навпроти артилерійської квартири живе Гуталін — комуніст і телепень.", "— Телепень? — перепитав я.", "— Телепень, — підтвердила Даша. — рідкісний, постійно заливає сусідів. Думаю, він це спеціально робить. Ну, з нашим поверхом зрозуміло.", "— Нічого не зрозуміло, — не погодився я. — Звідки в тебе дві квартири?", "— Хоч це й не твоя справа, — відповіла Даша, — але я тобі розповім. Ту, у якій я живу, мені залишив колишній чоловік. А в цій жила його бабуся. Онука вона не любила, квартиру залишила мені.", "— А де він, — запитав я з недовірою, — цей твій чоловік?", "— По-моєму, в Еміратах, — відповіла Даша. — Або в Саудах. Коротше, вивів кудись активи. Тут для нього надто холодно.", "— А бабуся?", "— А бабуся померла. Вона й так довго трималася. Вона листоношею була. Працювала до останнього клієнта. Себто доки не звільнили. Да, а нагорі, — сказала вона пошепки, — чуєш, ходить, це Іван Іванович. Він продає завод. Років десять. Але без мази. Вань, — крикнула в небеса, — ей!", "Згори визирнув чоловік. Ще до сорока, трохи захудий, з утомою в очах, із сигаретою в зубах, у темному костюмі, у несвіжій сорочці. Виглядав так, ніби щойно повернувся з поминок. Тепло кивнув Даші, уважно подивився на мене.", "— Твій? — запитав.", "— Мій, — підтвердила вона.", "— Підріс.", "— Хто? — не зрозуміла Даша.", "— Ладно, — кивнув він рукою й пішов, причинивши за собою балконні двері.", "— Якщо вночі голосно кричатимеш, — попередила Даша, — він усе почує. Коротше, — Даша загорнулася в халат, мов генерал розбитої армії в шинель, — насолоджуйся життям."], ["Але яке могло бути після цього життя? Яка могла бути насолода? Я втратив спокій. Невже нічого не буде? — думав я, стоячи коло вікна й спостерігаючи за сонцем, що підіймалося. Що вона собі вигадала? Простояв на балконі до обіду, провалявся в ліжку до вечора, вийшов її зустрічати. Напустив на обличчя рештки стриманості, ховаючи за окулярами розпач і лють, пройшовся вулицею — від військкомату до тубдиспансеру, від салону краси до будинку колишніх коханок. Туди, потім назад, потім ще раз, потім знову, і так до безкінечності. Вкотре повернувшись, завважив її в кінці вулиці. Ішла повільно, розглядаючи світла за жовтими вечірніми вікнами. Я небагатослівно рушив назустріч. Привітався, поцікавився справами, поділився враженнями, наплів про справи, про ділові зустрічі, мовляв, цілий день бігав (так-так, у капцях), зустрічався з партнерами (в окулярах, аякже), добре, що зустрілись, давай проведу, допоможу нести речі. З речей у неї був якийсь комерційний глянець, який вона мені, втім, не віддала.", "Підіймаючись сходами, мовчала, була задумлива й неуважна, одного разу навіть спробувала припалити від фільтра. Я подумав, що це добрий знак. Вона готова, подумав, вона все зрозуміла, усе побачила й на все згодна. Ще помітив, наскільки інакше вона виглядає в профіль, стає схожою на лисицю, у її погляді з'являється щось недовірливе, як дивно, подумав я, коли дивишся їй в очі, цього всього немає. Так, ніби вона приховує своє справжнє обличчя, видаючи себе за когось іншого. Це все губи, вони в неї мають дивний малюнок, але щоби це зрозуміти, потрібно дивитися на неї збоку. Так іноді буває, подумав я, так навіть краще.", "Але на порозі, щойно я спробував перепинити її, заступити шлях, торкнутися, десь у кишенях її робочого костюма загарчав телефон, і вона впевнено відсторонила мене, відіпхнула вбік коротким залізним рухом, як і належиться справжньому адвокату, а діставши мобло, враз напружилася, скинула дзвінок і зникла за дверима, навіть не побажавши мені солодких снів.", "Але мені вони все одно снились.", "Принцесо, співав я наступного ранку, прокинувшись у пом'ятих джинсах і несвіжій футболці й печально розглядаючи стелю, навіщо розбиваєш мені серце? Навіщо віддаєш його голубам на площі? Вони бавляться ним, сидячи на антенах, і я плачу, принцесо, доки ти малюєш яскравими фарбами своє обличчя. Навіщо ти тримаєш мене в цих срібних ланцюгах, навіщо чіпляєш мені чорний нашийник, який душить мене, не даючи сказати всього того, що я думаю про любов і жорстокість? Де ти зникаєш щоранку, принцесо, у яких норах ховаєшся від мене, ніби лисиця? Чому не прийдеш і не відпустиш мене, чому тримаєш мене на ланцюгу, чому ніколи не називаєш мене на ім'я?", "Я співав собі, доки за вікном прокидалася вулиця, співав, доки оживав будинок, співав, навіть не намагаючись підвестись. Виявляється, думав я з розпачем, любов може бути нещасливою. Від неї може бути боляче, від неї може псуватися настрій. Хто б міг подумати, думав, хто міг передбачити. Втім, сонця ставало все більше, голоси лунали дедалі нахабніше, будинок наповнювався ними, на страждання зовсім не лишалося часу. Мені подобався цей будинок. Він був схожий на електроорган. Я слухав зранку, як робітники брали кабель, тягнули його вологим холодним асфальтом і під'єднували до синіх потоків електричного струму. Двері під'їзду були відчинені, і протяги стояли в них, як водорості, легко здіймаючись, щойно хтось вбігав із вулиці. Ще поночі, доки всі спали, прислухавшись, можна було піймати скрапування води на кухнях, тарганяче шарудіння механічних будильників, сонне перешіптування голубів на даху, тихе жіноче зітхання уві сні, мовби хтось лише налаштовував дроти й антени, готуючись до святкового концерту. Ближче до ранку починався рух, з'являлися перші звуки — вітер протягувався підвіконнями й кімнатами, наче духовими інструментами, скрипіли долівки, озивалися радіоголоси, починали звучати ножі й пательні, бритви й фени, можна було розрізнити праски й тостери, дзвінко сигналили ринґтони, солодко передавались останні новини, чутно було посуд, чутно було воду, поцілунки й перешіптування, наспівування маршів і наговорювання молитов, веселе збігання сходами, що остаточно будило коридори й балкони, які звучали тепер, ніби зрушене з місця піаніно, і ти знаходився в ньому всередині, десь посеред найбільш глибоких звуків, поміж найбільш тривожних нот, знаходився, слухаючи, як починають звучати дерево й жерсть, метал і цемент, скло й шкіра, якими кріпилися поверхи та перекриття. І коли під обід до під'їзду забігали діти, від їхніх високих голосів починали фонити невидимі мікрофони, і будинок голосно вистрілював лунами та рикошетами, і музика ця тривала, не замовкаючи — меланхолійно по обіді, запекло під вечірню пору, нестримно опівночі, але все не стихаючи, не обриваючись, лунаючи далі.", "Від цієї музики хотілося померти. Цим я й зайнявся.", "Вже до вечора алкоголь стояв у моїй крові, як вода у повінь, готова будь-якої миті залити порожні вулиці беззахисного міста. Все, що я випив, все, на що я зважився й до чого приклався — а були це дивні суміші та несподівані комбінації з шампанського, хересу і рому — всього, на що стало моєї гарячої фантазії, вся ця волога охолоджувала моє серце зсередини, уповільнюючи непоправне, ніби графіт у ядерному реакторі, не даючи, втім, жодних приводів засумніватися, що воно, це непоправне, терпляче чекає на мене попереду. Я надто любив себе, аби знатися на алкоголі, я був надто самовпевненим, аби вчасно зупинитися. Я ходив різними підозрілими місцями, заглядав до всіх тих нір та підвалів, які вона згадувала, був у арабів, зазирав до в'єтнамців, братався з працівниками Макдональдса, пив на брудершафт із туберкульозниками, замовляв шампанське в сауні «Здоров'я», втратив пам'ять у підвалі навпроти синагоги, прийшов до тями в дитячому кафе, запиваючи молочні коктейлі гірськими бальзамами, питав адреси в продавців піци, помер від коньячних випарів у барі, який тримали грузини, воскрес від запаху мадери в порожньому супермаркеті. Тримався, уперто п'ючи за її здоров'я, наполегливо пропонуючи зустрічним славити її химерний профіль, пити за її голос і шкіру, за її перукарку, яка чаклує над нею, створюючи з її міцного волосся космічні ландшафти. Стояв на ногах, легко погойдуючись, наче юнга. Встрявав у дискусії, доводячи всім, що жодна жінка в цих кварталах не має таких зелених очей, жодна з них не вміє так переконливо сипати прокляттями й просити вибачення, у жодної з них немає таких високих підборів, таких тонких зап'ясть, такої біографії. Дивно, що мене не побили туберкульозники. Прикметно, що мене не пограбували в'єтнамці. Приємно, що мене викинули з Макдональдса. Жити мені залишалося кілька годин. Я вирішив провести їх із користю. Але не зміг.", "Вона знайшла мене на сходах коло під'їзду. Я сидів, притулившись до дверей і не даючи нікому вийти з будинку. Спочатку вона розгнівалась. Потім злякалась. Підхопила мене, як змогла, потягла нагору, до себе. Доки тягла, я прокинувся, намагався присвічувати їй мобільником, набирав при цьому випадкові номери, вдало, як мені здавалося, жартував із приводу її імені, доречно, у чому був переконаний, пропонував вийти за мене заміж, ніжно, за власним визначенням, висів на ній, обіймаючи однією рукою її, другою — перила. Вона посадила мене на кухні й попросила заткатись. Ходила й вирішувала, що зі мною робити. Спочатку надумала телефонувати моїй мамі. Потім вирішила зробити мені міцного чаю. Потім зовсім уже нервово запропонувала промити мені шлунок, поставити крапельницю, випити снодійне, випити вітаміни, випити морсу, випити марганцівки, випити морсу з марганцівкою, випити марганцівку без морсу, але зі снодійним, випити все разом і запити чаєм — так чи інакше, вона опікувалася мною, і від цього серце моє переганяло кров, і кров моя втікала в серце ніжно-червоною, а витікала з нього темно-кривавою.", "Доки вона ходила довкола, доки порпалась у шафах і шухлядах, вишукувала в ґуґлі рецепти й телефонувала знайомим аптекарям та анестезіологам, мені ставало все самотніше й гірше. Кухня в неї була дбайливо заповнена різними травами й спеціями, овочами та морепродуктами. Я легко пізнавав запахи кориці та гвоздики, гострий аромат каррі, щемкі пахощі чорного перцю, різку присутність часнику та цитрин, темний дух рубаного м'яса, світлий сік різаної городини, свіжість криги й невагомість борошна, гіркоту, приреченість і невідворотність стейків, примарність оцту, замріяність сої, безтямність томатного соусу. Запахів ставало все більше, вони стояли наді мною, мов біси, залазячи в легені й стискаючи горло, вони обступили мене, як військо фортечні мури, вони складалися наді мною в дивні конструкції, набирали несподіваних обрисів, бентежили й пригнічували. Життя моє пахло свіжомороженою рибою, смерть моя буде відгонити китайськими грибами. Кількість запахів убивала мене, їхня насиченість робила цю смерть болючою. Лише не тут, наказував я сам собі, лише не в неї вдома. Іди додому, не зволікай, нашіптував я сам собі, вали звідси. Лише не тут. Тоді вона відчинила холодильник. І я «помер». Потім вона довго стояла наді мною, соваючи мою голову під холодний струмінь. Я відвертався й намагався підвестись, відводив її руку, проте вона наполегливо вимивала з мене біль і чорноту цього світу, примовляючи щось життєствердне й не даючи мені підвестись. Одяг її давно намок, я розумів, що їй холодно, що їй усе це сто років не потрібно і що поводжу я себе, мов останній мудак. І від цього розуміння сльози текли моїм обличчям, перемішуючись із холодною водою, що ж я так, думав я у відчаї, що ж я так усе зіпсував? Що ж тепер робити? Я просив у неї вибачення й вимагав відпустити мене, пояснював, що зі мною все гаразд, і прибріхував, скільки ж я насправді сьогодні випив, просив налити мені ще й важко відпльовувався шампанським та кока-колою, стримано говорив щось про її волосся й небагатослівно пропонував іти зі мною в ліжко. Вона терпляче все це вислуховувала, легко давала мені запотиличники, коли я заговорював про секс до весілля, ледь чутно здригалася від холодної води, ледь стримано посміхалася на всі мої пропозиції.", "Коли я вичовгував від неї, залишаючи в коридорі щедрі мокрі сліди, мені захотілося сказати щось важливе.", "— Знаєш, — сказав, — я б тебе охоче поцілував. Але сама розумієш, я тут тобі все обригав, уявляю, як від мене тепер тхне.", "— Іди-іди, — відповіла вона, чи то погоджуючись, чи то заперечуючи.", "І зранку я все пам'ятав, нічого не забув, жодного її слова, жодного її дотику. Пам'ятав, як стривожено вона на мене дивилась, як обережно тримала за руку, як дбайливо витирала всі мої соплі. Нічого не забув, хоча краще було б нічого не пам'ятати. У пам'яті зграями літали сполохані ластівки, на серце мені тиснули мішки з кригою, хотілося позбутися цього болючого тіла. Проте я знав: не можна втрачати часу. Тепер або ніколи. Я підвівся, так-сяк одягнувся, з третьої спроби почистив зуби, ошпарив руку, заварюючи чай, розлив молоко, розсипав цукор, перевернув відро зі сміттям. Ось тепер усе й станеться, сказав я собі й рішуче вийшов за двері."], ["Знову ніхто не відчиняв. Знову довелося стояти й прислуховуватися до голосів і звуків. Що за чорт? — думав я, — вона що, не хоче мене пускати? Рішуче загупав у чорний метал дверей, будячи голубів на даху. Зрештою задзвеніли ключі, потрапляючи в замок, двері важко відчинились. Я рвонув уперед і наштовхнувся на хлопчика. Було йому років сім. Була на ньому біла майка й футбольні шорти, коліна мав збиті, лікті подряпані, волосся чорне й густе, дивився з-під лоба, довіри не викликав. У руках тримав кулькові ручки й олівці. Критично оглянув мене з ніг до голови. Тут із кухні вибігла Даша. Знітилась, вдавано недбало поклала руки малому на плечі.", "— О, — сказала, — Ромео, це ти? А це Амін, — кивнула на малого.", "— Як? — здивовано перепитав я.", "Малий подивився на мене з ненавистю.", "— Гарні в тебе ручки, — сказав я йому миролюбиво. — Це що, справжній паркер? У мене колись такий був.", "— Ти вмієш писати? — процідив малий і пішов на кухню.", "— У нього канікули почались, — швидко зашепотіла Даша, — його бабуся зранку привезла. Хоча що він тут улітку робитиме? Його б на море куди-небудь…", "Точно, подумав я, на море, за буйки.", "Я сидів на кухні, Даша бігала й щось готувала, демонструючи гостинність, малий дивився на все це скептично. На маму він схожий не був. Але маму, схоже, любив. Я йому, очевидно, заважав. Він мені теж. Даша все більше нервувала, щось спалила, щось пересолила, щось просто викинула в смітник. Я хотів розговоритися з Аміном, але той мені відверто хамив. Мама робила йому зауваження, але він хамив і їй теж, від чого вона нервувала ще більше. Зрештою не витримала, схопила телефон, вибігла до сусідньої кімнати, з кимось довго говорила, доки малий злісно вимальовував паркером у шкільному зошиті монстрів і серійних убивць. Я підвівся й пішов додому. Малий навіть не підійняв голову.", "Так минуло два тижні. Я прокидався рано-вранці від її кроків за стіною, чув, як вона бігає квартирою, як будить малого, як готує йому сніданок, як запізнюється, як збирає одяг, марно намагається навести порядок на голові, панічно шукає взуття, відчайдушно пробує комусь додзвонитися, безнадійно доливає молоко в холодну каву, приречено вибігає в під'їзд, кидаючи до торби телефони, таблетки та сонцезахисні окуляри. Я знав, що повернеться вона пізно, десь під вечір, можна нікуди не поспішати. Малим займались. Приходили якісь її подруги, тітки, сусідки, вихователі. Одного разу вона попросила за ним приглянути мене. Але малий навмисно (так-так, навмисно, я бачив, що він це навмисно) поперевертав каструлі, зателефонував мамі (у нього був дорожчий телефон, аніж у мене!), поскаржився, розплакався. Вона мусила ловити таксі, летіти додому. Я пояснив, вона ніби й повірила, проте разом нас більше не лишала. Я злостився й посилав прокляття на голову малого. Звідки він тут узявся, думав, чому вона справді не відправить його куди-небудь на море, на озера, на болота, поближче до природи, до диких тварин? Малий мене ігнорував — не розмовляв, не відчиняв мені двері (зневажливо дивлячись на мене крізь вічко, підставивши під двері стілець), демонстративно відмовлявся від їжі, коли я сидів у них на кухні, вмикав на повну колонки, коли вона говорила зі мною по телефону. Я навіть заповажав його, який принциповий, подумав. Насправді він безпечний, переконував я сам себе, нічого страшного. Але всі мої спроби потоваришувати з ним нічого не дали. Він загалом не виглядав на людину довірливу й беззахисну, мав тяжкий характер і серйозні іграшки. Тягав у кишенях хімічні олівці та канцелярські прилади (я сам бачив, як він намагався степлером прищепити шнурівки моїх кедів до підлоги, вона, звісно, не повірила), мав подарований татом використаний газовий балончик (ну, це вона думала, що використаний), подарований дідусем портсигар (від нього пахло тютюном, я говорив їй, але вона відмахувалась і не зважала), знайдений десь стетоскоп (для чого він йому? — запитував я знервовано), позичені в когось гільзи з мисливської рушниці, вкрадений у мене швейцарський ніж (не віддавав, уперто переконуючи, що це його, вона знову ж таки ніби й вірила мені, проте ніж так і не забрала). Найгірше, що зі мною вона тепер майже не спілкувалась, хоча й далі забігала час від часу, дверей при цьому не зачиняючи й сторожко увесь час озираючись, на всі мої спроби перепинити її на сходах, заговорити з нею на вулиці, затягнути її до якої-небудь темної затишної брами щоразу напружувалась, ставала вдавано легковажною, нав'язливо привітною, нарочито щирою. Він весь час був десь поруч — чекав на неї, стоячи на балконі, видзвонював її, щойно я торкався її руки, прокидався, щойно я серед ночі легко стукав до її дверей, ранив собі пальці й обпікав язик, дер одяг об цвяхи й встрявав у бійку на вулиці, совав до рота прострочені харчі й тягнув додому вуличних псів — і все це, аби відвернути від мене її увагу, перетягнути її на свій бік, викликати її співчуття чи бодай роздратування, сльози, сміх і любов. Вона натомість злилася на нього все частіше, сварилася з ним усе відвертіше, разом із тим усвідомлюючи: ну, що ж із ним сваритися, він розумний хлопчик, він усе розуміє, усе робить правильно, чужий тут я і злитися треба на мене. Але все одно злилася на нього. Поступово в нас із нею склалися дивні стосунки, які трималися на тому, аби лишити малого ні з чим. Вона намагалася по дорозі з роботи видзвонити мене й повернутися додому разом. Уночі надсилала мені повідомлення, у яких питала про погоду та останні новини в країні. Зранку встигала заскочити до мене на якусь мить просто привітатися й відразу зникала, лишаючи по собі запах гарячого хліба. Малий розумів, що відбувається, тому відразу зайняв оборону, хитро й розумно розставляючи повсюди пастки. Спав із її телефоном, гуляв під своїми вікнами, замастив замок моїх дверей пластиліном (добре, що хоч пластиліном, думав я), писав мені записки з чорними мітками та вудистськими закляттями. Мене все це виснажувало, я втратив сон, втратив спокій, навіть захотілося якоїсь миті повернутися додому. Мені було шкода малого, якого я відверто діставав, шкода її, що не могла знайти собі поміж нами місця, а вже як шкода було самого себе — про це краще взагалі не говорити. Так почалося літо, так померли всі мої мрії."], ["Вона зайшла у п'ятницю надвечір, забігла з вулиці відразу до мене. Кинула торбу, звідти посипались візитки, блокноти, контейнер для лінз. Ходила квартирою, старанно оминаючи мене поглядом. Говорила про спеку, що впала на місто, про птахів, що не давали спати, про проблеми з водою, я спробував її перепинити, але вона якось рішуче виставила долоню, мовляв, стій, де стоїш, і сказала:", "— Ромео, — сказала, розглядаючи шпалери, ніби шукаючи помилки в малюнках, — в мене подружка завтра заміж виходить. Запросила на весілля. Мені немає з ким піти. Пішли разом.", "— На весілля? — насторожився я.", "— Це поруч, — швидко заговорила Даша, — подарунок я вже купила.", "— А малий?", "— Посидить удома, — суворо сказала вона.", "— Як скажеш, — погодився я.", "— Лише одягнись нормально, — порадила Даша, підхопила торбу й зникла в коридорі.", "На ранок вона стояла перед моїми дверима. З малим, звісно, куди ж без нього. Сказала, що няня захворіла, що до сусідки серед ночі приїжджала швидка, що в знайомих у конторі перевірка, одне слово, немає з ким його залишити. Мала дещо припухле від сліз лице, тому одягла великі сонцезахисні окуляри. Малий дивився на мене переможцем. На руці в нього бовтався ролекс — палений, але красивий.", "Краще, звичайно, було б нікуди не йти. Ясно, що краще було б не йти. Хто мене туди тягнув? Ну, як хто? Вона мене тягнула, вона. Вона йшла попереду в чорній сукні, з чорною торбинкою, тягнучи малого, кидаючи на мене розпачливі погляди. Я йшов позаду, тягнув подарунок (щось скляне, максимум — порцелянове) і не міг відвести очей від її ходи, від того, як вона ступала теплим битим асфальтом, як рухалася в цій своїй сукні, ніби весілля вже почалося, ніби почалося свято й слід було святкувати прямо тепер — під акаціями та липами, під синіми небесами червня, у місті, про яке вона так багато мені розповідала, на вулицях, де з нею всі віталися. Я знав її менше місяця, але встиг звикнути до її хапливих рухів, до її сварливих розмов, до тепла її рук, до холоду її очей. Літо буде довгим, сонце буде пекучим, мої радощі будуть сумнівними, мої муки будуть пекельними. Завершиться все щасливо, до кінця не доживе ніхто.", "Весілля святкували в лазнях. Я навіть не здивувався, різне буває. У мене знайомі колись одружувалися в спортзалі, під баскетбольними кошиками, також по-своєму романтично. І ось тут теж було таке таємне, законспіроване місце: ліворуч автосервіс, праворуч — аптека, між ними — святкові столи. Металеву браму з навареними на неї олімпійськими кільцями розчинили настіж, гості з вулиці потрапляли на велике подвір'я, у центрі декоративний фонтан розбризкував воду, заливаючи все навколо, ніби зламаний пожежний кран. Вивіски я не помітив. Можливо, вони просто не змогли придумати назву для такого романтичного закладу. Довкола паркувалися весільні автомобілі: ближче до лазень — іномарки, далі, за аптекою — пара бойових жигулів. Гості під ранковим сонцем поміж аптекою та чорними покришками автосервісу виглядали особливо урочисто. Заходили з вулиці на подвір'я, роззиралися навсібіч, віталися зі знайомими. Бігали офіціанти, сварилися родичі, кричали діти, було багато сонця. Даша проштовхувалась поміж гостей, їй раділи, перепиняли, нахилялися до малого, кидали на мене допитливі погляди. Я прикривався порцеляною. Наречена мені сподобалась — Дашиного віку, невисокого зросту, з коротким, фарбованим у руде волоссям, з утомленими очима, з постійною сигаретою, з легкою посмішкою, ніби говорила: нічого, почекаєте, без мене все одно не почнеться. Під весільною сукнею мала кросівки. Даша довго з нею про щось шепотілась, підтягла малого (той, не вітаючись, вирвався й звалив до фонтана), підвела мене, назвала родичем. Наречена кинулась мене обіймати, ніжно дихаючи нікотином. А ось наречений підгуляв: хоча й був старший за мене, але стояв у костюмі, схожий на випускника, себто видно було, що костюм шили нашвидкуруч. Риси обличчя мав різкі, волосся мав змащене гелем, дивився важко, з коханою майже не розмовляв, навіть на ім'я до неї не звертався, наче боявся помилитись. Ховався за своїми друзями, котрі щільно його обступили, загороджуючи від небажаних контактів. Багато хто з друзів прийшов у тренувальних костюмах із командним лейблом, більшість мали сонцезахисні окуляри. Я, побачивши це, свої демонстративно зняв. Даша, втім, від молодих мене швидко відтягнула, наказала знайти Аміна. Я знайшов, давай, кажу, друже, пішли святкувати. Малий промовчав, але пішов. А побачивши маму, почав нити, мовляв, хочу додому, не хочу тут лишатись, хочу води, не хочу ні з ким знайомитись, хочу любові й не хочу ні з ким нею ділитися. Я пробував його чимось зайняти, проте Амін демонстративно від мене відвертався й голосив усе впевненіше, добиваючи маму контрольними в голову. Даша довгий час робила вигляд, що все гаразд, однак нарешті не витримала, розвернулася й пірнула в натовп. Малий теж розвернувся й так само кудись пірнув. Найбільше заважала, звісно, порцеляна.", "Гості товклися подвір'ям, заходили до бару, виходили з коридорів, на щось очікуючи, про щось перемовляючись. Я пізнав Івана, сусіда згори. Поруч із ним стояв якийсь його опасистий, діабетичного вигляду приятель, уже накачаний, від того ще більш хворобливий. Окрім спортсменів, ходили туди-назад старші чоловіки в старанно випраних сорочках і поважні жінки з яскраво фарбованими обличчями. Проштовхались двоє, схожі на таксистів: один у шкірянці, другий із наколками. Дивні гості, подумав я, вони ніби не на весілля прийшли, а потяг зустрічати. Раптом побачив Дашу. Стояла при стіні, тримала в руках вино, схоже, не перше, сміялась, виснучи на якомусь низенькому мужику. Той мав оливкового кольору заплиле обличчя, вузькі очі, пухкі губи, білу, але несвіжу сорочку, дорогі, проте нечищені черевики. Все намагався торкнутися Даші, все пробував поплескати її дружньо по спині, все хапав за руку, щось радісно викрикуючи й підсміюючись. Даша знову робила вигляд, що все гаразд. Або все справді було гаразд. У мій бік не дивилась. Теж весело щось кричала вузькоокому, теж плескала його по загривку, хоча помітно було, що час від часу робить ледь помітний крок убік, назад, у тінь, так, наче в чувака погано пахло з рота. І коли він, ніби жартуючи, ніби ненавмисно (насправді впевнено й важко) торкнувся її ноги трішки вище коліна, я не витримав і пішов до них.", "— О, Ромео, — вдавано втішилась вона. — Познайомся, це Коля.", "Коля простягнув долоню, навіть не глянувши в мій бік.", "— Потримай, — сказав я, передаючи Даші порцеляну. Вона не чекала, ледь не випустила подарунок із рук, дещо незграбно перехопила його, піддавши знизу коліном. Коля врешті звернув на мене увагу. Тут я і стиснув його долоню. Була вона велика й волога, руку мою він потискав мляво й неохоче. — Роман, — сказав я, — приємно познайомитись. Даша про вас багато розповідала.", "— Що розповідала? — не зрозумів він.", "— Різне, — не став я уточнювати.", "Коля враз якось знітився, закрутився на місці, поплескав мене по плечу волого й неохоче і зник у ближчому коридорі. А вона подивилася на мене злісно й розчаровано, кинула свою порцеляну кудись під святковий стіл і різко заговорила. Говорила про те, що ми всі її дістали — і малий, і я, що ми поводимось, як два недоумки, а вона має нас розводити, має давати з нами раду, а вона теж не залізна (тут вона почала плакати, ніби демонструючи, що ось, мовляв, недоумку, бачиш, справді не залізна), що вона бачити нас не хоче, а коли захоче — сама скаже, тож щоби ми не лізли до неї, щоби відчепилися, щоби дали їй спокій. — Вань, — закричала вона кудись мені за спину, — маєш курити? І рішуче мене відштовхнувши, схопила за руку нашого сусіда, що саме кудись активно пробирався, і повела за собою. Діабетик посунув слідом. Я психонув і пішов у зворотному напрямку. Добре, що святкувалося тут усюди."], ["Де твоя впевненість? — говорив я собі, — де твоя радість, де все те, чого ти так шукав у цьому сонячному світі? І доки на подвір'ї тривали урочистості, доки пил підіймався й торкався ніжної салатової трави, я сидів у барі й дивився серіали. Вийти мені не випадало, довелося б із кимось спілкуватися, щось комусь пояснювати, якось виплутуватись з усього цього, довелося б відводити від неї погляд, принципово на неї не дивитись, вдавати, що не помічаю її. І ось тут, у теплих ранніх сутінках, звідкись нізвідки просто на мене вийшов ковбой — пасажир у ковбойському капелюсі, легкому піджаку, барвистих шортах і розбитих в'єтнамках. Побачивши мене, зауважив також і всю печаль у моїх очах. А тому наполегливо порадив іти за ним, кажучи: давай, Вася, що ти тут виснеш, все найцікавіше зараз відбувається в районі басейнів із холодною водою, в секторі водяних атракціонів, у квадраті чорних гарячих кабін і пекельних випарів, і потягнув мене саме туди, оскільки, говорив, не годиться так нехтувати святковим настроєм. Говорячи, страшенно поспішав, жадібно ковтаючи приголосні й стрибаючи поміж реченнями. Капелюх сповзав йому на очі, піт заливав йому чоло, баки його були мокрими від нетерплячки, але щойно він провів мене таємними кімнатами й вивів до масажного залу, як я відразу зрозумів, що все це було недаремно. Найцікавіше відбувалося саме тут, і вогняна оголена компанія, побачивши нас, кинулась на ковбоя, славлячи його, і всі терлися об нього з вдячністю, і об мене теж терлися, і коли це були жінки — було мені радісно, а коли чоловіки — ставало мені тривожно й хотілося кому-небудь зарядити. І чим далі — тим більше. А ковбой дістав із кишені пухкий запашний згорток, щось коштовне, щось загорнуте в жовту газету, і всіх загалом порвало, його підхопили на руки й потягли за двері, кудись до самого пекла. Тоді я ліг на масажний стіл і дивився на холодний басейн, в якому спалахували електричні вогні, відбиваючись від зеленої поверхні. І довкола снували оголені красуні, солодко усміхаючись, і поважно проходили замотані в кошлаті рушники чоловіки, кидаючи на мене стурбований погляд: чи свій, чи не зальотний? І час спливав, оминаючи мене й роблячи присутність мою тут випадковою, а подальше перебування — позбавленим сенсу. І аж тоді, коли всі пройшли повз мене, вийшли геть і повернулися назад, звідкись знову з'явився ковбой, і мав при собі тацю з коньяком і цитринами, і змусив мене випити стільки, скільки я зможу, а коли я сказав, що більше не можу, змусив випити ще. Оскільки, — кричав, — коли ми ще з тобою вип'ємо, Вася! Я валю звідси, Вася! Міжнародними авіалініями України! Без пересадок! Просто завтра! З невидимих терміналів! Потаємними повітряними коридорами! В обхід усіх митних служб! Пройшовши хрестовим походом через усі д'ютіфрі! Не декларуючи нічого з прикрас та банківських активів! Уже післязавтра, Вася, — п'яно й захоплено кричав він, — я буду сидіти в нормальній компанії де-небудь у районі Філадельфії (Філадельфії, Вася!), у компанії маклерів та брокерів (ага, брокерів!),! і пити нормальний кошерний коньяк! А не це гівно, Вася! — голосив він і щедро прикладався до пляшки, — не це, зовсім не це! А коли до басейну посипалася оголена публіка, знову підхопивши його на руки, я вирішив, що з мене досить і що час нарешті йти.", "Вийшов із кімнати, пройшов до бару. За вікнами стояла ніч, на подвір'ї дзвенів посуд, сварились жінки, обривався спів. За моєю спиною скрипнули двері. Я озирнувся. Встиг помітити сукню нареченої. Двері причинились.", "Я вийшов через бічний вихід на вулицю. Рушив було додому, коли раптом завважив Аміна. Він стояв, притиснувшись до стіни, і гірко ридав. Біля нього тяжів Коля. В руках тримав ролекс малого. Малий нив і тягнувся за годинником.", "— Що тут у вас? — запитав я, підходячи.", "Коля наполохано озирнувся. Втім, побачивши саме мене, заспокоївся.", "— Та все нормально, синок, — сказав, ще сильніше звужуючи очі. — Купив у мальчіка ролекс, а він шото ниє.", "— Нічого не купив, — занив Амін, намагаючись відібрати годинник.", "— Так купив чи не купив? — перепитав я.", "— Купив-купив, — холодно підтвердив Коля. — Давай, синок, іди.", "— Слухай ти, — заговорив я, — віддай малому його ролекс.", "— Не поняв, — не зрозумів мене Коля.", "— Кажу, ролекс віддай, — повторив я.", "— Ти шо, синок? — Коля нарешті розплющив очі й подивився на мене, ніби вперше побачивши.", "Я не дав йому договорити й заїхав кудись під дих. Коля зігнувся, проте на ногах утримався й спробував відступити. Я кинувся на нього. Раптом двері за моєю спиною розчахнулися, і на вулицю посипалися радісні від злості та збудження голоси. Я не встиг навіть роззирнутися, як мене завалили на асфальт. Пару разів дістав по хребту, пару разів по нирках, добре, що встиг прикрити голову руками. Враз усі зупинилися. Я спробував підвестись, проте хтось упевнено притис мене черевиком до асфальту. Наді мною нависав Коля, поруч із ним темніли ще троє чи четверо, я їх не знав, а ось він знав їх напевно, та й вони його, схоже, добре знали. Коля вагався, добити мене чи лишити тут, на асфальті. Врешті попустився.", "— Мудак, — сказав примирливо, сплюнув убік і пішов до бару святкувати. Решта потяглася за ним."], ["Я підвівся. Нога нила, футболку можна було викидати. Малий перелякано стояв поруч. Ролекс валявся на асфальті. Я підняв його, віддав малому. Привалився спиною до стіни. Двері знову відчинилися, звідти вибігла Даша. Побачила нас, підійшла. Її трохи занесло, втім, вона згрупувалась і втримала рівновагу. Подивилася на заплаканого малого, побачила мою роздерту футболку. Почала кричати.", "— Що ти тут робиш?! — кричала вона малому. — Якого чорта?! Скільки можна?!", "Малий привалився до стіни поруч зі мною. Так ми й стояли з ним, ніби чекаючи на спільний розстріл.", "— Я з ким розмовляю? — кричала Даша. — Ти мене чуєш?", "— Не кричи на нього, — сказав я.", "— А ти не лізь! — не погодилась вона й знову закричала. — Я тебе питаю, якого чорта?!", "— Я сказав, не кричи на нього, — перебив її я.", "— Та хто ти такий? — Повернулась вона до мене. — Що ти мені вказуєш?", "— Послухай, — відповів я, — іди бухай, із ким бухала. На малого не кричи, ясно?", "— Що? — перепитала вона. — Що ти сказав?", "Вона витримала паузу й зарядила мені своєю крижаною розчепіреною п'ятірнею. Підхопила малого, поволочила до бару. Я кинувся слідом. Проте двері були причинені. Я потягнув їх на себе, потім навалився плечем, потім довго валив по них розбитими кулаками. Можна було, звісно, зайти з подвір'я, але якого чорта, як говорила Даша, якого чорта. Я побрів додому, піднявся до себе, викинув брудний одяг, зібрав речі. Окуляри залишив на столі. Спустився вниз. Переночую на вокзалі, подумав.", "Усе, що я знав про це місто, я знав від неї. Це вона розповідала мені всі свої неправдоподібні історії. Говорила завжди голосно й переконливо, називала імена й адреси, згадувала дати, малювала носаком черевика на піску, показуючи напрямок, у якому рухаються ріки, і місця, де вони пересихають. Розповідала мені про системи фортифікацій та підземних ходів, описувала металевих драконів, що дихають вогнем у трамвайних депо, і згадувала непробивний панцир бойових тварин, котрі переховуються в піщаних норах довкола водосховища. Розповідала також про макети повітряних фабрик і машини масового знищення, виготовлені дітьми в будинках піонерів, згадувала щось про родючі поля стадіонів, на яких ростуть дивні рослини, від яких добре спиться й покращується пам'ять, скоромовкою нашіптувала інформацію про таємні лабораторії політехнічного, що неприступно темніють на обрії, про наукові школи, що вже добру сотню років намагаються виготовити еліксир безсмертя, і найкоротші трамвайні шляхи, які проходять подвір'ями. Згадувала щось про холодну зброю, яка виготовляється на старих заводах, про те, що влітку дерева затуляють собою небо, вночі не видно ні місяця, ні зірок, тому дехто думає, що в місті живуть відьми, і вони тут справді живуть, стверджувала, і доволі добре себе почувають, тому що це взагалі зручне для проживання місто, ось сюди й сповзаються потопельники та повішеники, припливають ріками, проникають крізь вокзали, покращуючи загальну демографічну ситуацію. Зате взимку, уточнювала вона, місяць просто висить тобі за вікном, хоч бери його до рук, схожий на сир, хоча насправді зліплений із глини й трави. У місті, говорила, легко зимувати, оскільки фабрики постійно прогрівають ранкове повітря. Розповідала, що навесні в передмістях вода розмиває фундаменти старих санаторіїв, ріки стають червоними й пахнуть медикаментами, тому справжній запах весни — це запах нашатирю. А ще говорила, що на вулицях знову почали стріляти, що війна продовжується й ніхто не збирається здаватись. Усе буде тривати, доки ми будемо любити, — пояснювала, ніби на щось натякаючи. Любові стане на всіх, — додавала. Цього останнього я не зрозумів."], ["Уже прокидаючись, Соня встигла побачити сон. Був він короткий і неспокійний. Снилась їй ріка, якою піднімалися кораблі. Старі, іржаві, з жовтими від води бортами й чорними від сажі трубами. Ставали посеред ріки й відчайдушно сигналили. З бортів у воду стрибали моряки — втомлені, неголені, від цього злі й рішучі. Добиралися вплав до берега, вибрідали на пісок у важкому одязі, розбитих черевиках, ішли причалом, гнівно озираючись на кораблі, що далі сурмили так голосно, аж вона остаточно прокинулась. Ну що ж, подумала, сьогодні буде багато гостей.", "У домі ще спали. Вона тихо вислизнула з-під простирадла. Ночі були теплими, вони спали зовсім без одягу, їй це подобалось, подобалось прокидатись і знаходити все таким, яким воно має бути — неприхованим і легким. Він спав лицем на схід усю ніч — глибоко й застигло. Суніт якийсь, подумала Соня, натягла футболку й вийшла з кімнати. У вітальні спали родичі. Учора вона намагалася запам'ятати, хто є ким, у кого яке ім'я, проте безнадійно: усі вони трималися гуртом, спали покотом, як прочани, строго дотримуючись родинних приписів та ієрархічних настанов. Чоловіки втрьох тіснились на канапі, між ними розпачливо застряг чийсь небіж — пухкий і сором'язливий, затиснутий із боків старшими, мов бобслеїст. Жінки лежали на розстелених підлогою верблюдячих ковдрах. Чоловіки одягу не скидали, спали у святкових штанях і сорочках, один навіть краватку звечора не скинув, аби зранку не мучитись. Жінки спали в теплих халатах, поставивши в головах привезені з дому капці. Лягли рано, спали міцно, уві сні не кричали. Соня раптом згадала, що, крім футболки, на ній нічого немає, нечутно причинила двері. У дитячій на розкладачці спав дядя Гриша. Спав так, як сплять герої — розкидавши постіль і застигнувши в якійсь шаленій позі: головою закопався під подушку, ліву руку затис сухими стегнами, правою застряг десь під розкладачкою. Ковдра лежала на підлозі, мов забутий десантником парашут, простирадло звисало з ноги, як зірваний із ворожої адміністрації прапор, щелепа плавала в склянці з водою, на стільці. Уночі — вона чула із сусідньої кімнати — дядя Гриша тяжко крутився на розкладачці, мов грішник на пекельному вогні, стогнав, плакав, зривався на ноги, час від часу хапаючи склянку з щелепою й жадібно п'ючи, а потому довго відпльовуючись. На ранок заспокоївся й високо висвистував синіми устами якусь темну примарну мелодію для сновид. Соня пройшла до ванної, зачинилась. Скинула футболку. Влізла до ванної, пустила гарячу воду. Доки вони спатимуть, подумала, у мене є час. У мене є час, поправилась, доки вони спатимуть.", "Вода торкалася шкіри, роблячи її теплою й чутливою. Хочеться ніжності, подумала Соня, хочеться сексу, хочеться кави з молоком. Коли виходила, наткнулась на нього. Він, виявляється, відчув, що її немає, прокинувся й рушив на пошуки. Стояв під дверима ванної, чекаючи, коли вона закінчить. Щойно відчинила, заштовхав її назад і взявся стягувати з неї футболку. До речі, подумала Соня й допомогла йому. А щойно він зручно примостив її на ванні, притримуючи однією рукою, намагаючись стягнути із себе майку другою, хтось легко й невпевнено постукав у двері. Притому, що двері не зачиняли. Вони зупинилися, Соня прислухалась, він заскрипів зубами. Знову постукали. Чорт, прошипів він, відпустив її, кинув їй її футболку й відчинив. На порозі стояв небіж. Зі сну ще пухкіший і розгубленіший. Стояв у жіночій нічній сорочці й синіх спортивних штанях, переступав невпевнено з ноги на ногу. Соня встигла кинути на коліна футболку, аби приховати від малого бодай щось. А ось він прикривався лише рукою, але скільки там тих рук, тож небіж дивився на нього пильно й перелякано, усе нервовіше тупцяючи й переступаючи. Якийсь час усі мовчали, першим не витримав він.", "— Сусідні двері, — сказав із притиском, висунувся в коридор, клацнув потрібним вимикачем, повернувся назад, причинивши за собою двері.", "Спробував забрати в неї футболку, проте Соня твердо відвела його руку, одяглася й пішла на кухню. Він лишився. Соня подумала, що й відпустив він її загрубо, коли малий почав ломитись, і футболку кинув зарізко, ніби виганяючи, і що все це насправді так недоречно, хоча за великим рахунком яка різниця? Жодної. На кухні, підчеплена до люстри, висіла її весільна сукня. Соня взялася за каву. День буде довгий, подумала. І радісний, додала.", "Родичі прокинулись якось відразу всі. Можливо, малий прийшов і повідомив радісну новину, що молодята вже на ногах, а тому слід підійматися й починати з божою поміччю новий день, а може, дядя Гриша взяв зависоку ноту, але вона ледь устигла прослизнути зі своєю кавою назад до кімнати, як коридорами посипався тупіт і голоси: чоловіки голилися — усі троє одночасно в тісній ванній, притиснувши небожа спинами до пральної машини. А якби й відпустили, той би нікуди не пішов: чоловіча поведінка потребує згуртованості, тож він лише дивився, як дорослі хапливо шкребуть шкіру одноразовими станками, пускаючи першу цього ранку кров, суворо морщачись, але не скаржачись. Жінки голосили на кухні, ходили довкола сукні, розпачливо сплескуючи руками, мовляв, і сукня закоротка, і часу замало, і нічого не встигнемо, а те, що встигнемо, все одно нам не вийде. Щось почали смажити, щось різати, запахло м'ясом і сонцем. З дитячої вибрів дядя Гриша в довгих боксерських трусах, щедро всіяних білими квітами, тримаючи під пахвою дошку для прасування, схожий на серфера, що вибрався на ранковий пляж в очікуванні хвиль і подвигу. Соня сиділа у своїй кімнаті, дивилась у вікно й пила каву, що безнадійно остигала. Коли він повернувся, вона ще навіть не одяглася.", "— Хвилюєшся? — запитав.", "— А то, — відповіла Соня. — Як уперше.", "Він незадоволено скривився, хоча все було чесно — він у свої тридцять два одружувався вперше, вона в її тридцять чотири мала підозру, що востаннє.", "— Сєнь, — обернулася до нього, — може, ну його? Давай я приготую омлет, нагодуємо твоїх і відпустимо з богом.", "— Та ну, ти що, — перелякався Сєня, — вони ж від мене відмовляться. Ти думаєш, це ми з тобою одружуємось? Це вони одружуються.", "— Ладно, — сказала вона, помовчавши, — тоді будемо одружуватись.", "Швидко зібрались, узяли все необхідне, витягнули з ванни небожа, що несподівано надумав купатись, висипали в коридор. Сєня був у чорному костюмі, волосся змастив гелем, зуби почистити родичі йому не дали, тому злісно жував жуйки. Вона була у святковій сукні, у руках тримала босоніжки на тонких високих підборах, озута була в білі кросівки. Ти так і поїдеш? — здивувався Сєня. Не пхатися ж мені в шпильках, — відповіла Соня. Випустивши всіх, вимкнула світло, зачинила двері. Квартира, в якій вони жили, належала їй. За світло платила вона. Спустилися вниз, почали запихатися в таксі. Решта сіла в жовтий форд. Соня поклала шпильки в багажник, сіла за кермо. Форд належав також їй."], ["Вона не хотіла одружуватись — жили як жили, жили б і Далі. Але за Сєню взялася рідня. Були вони єговістами, щотижня приїжджали до міста на службу у свіжовипраному одязі, з дітьми й онуками. Виглядали на погорільців, що встигли врятувати одяг, проте повертатись усе одно не мали куди. Служба відбувалась у кіноконцертному залі. Кіно не показували. Концертів теж не було. По службі Сєня, як місцевий, вів рідню на обід. Чоловіки дивились на нього з повагою, жінки з любов'ю. Всі бажали йому щастя. Всі говорили про Соню. Вимагали, аби одружився. Сєня жив у її квартирі, Соня підвозила його зранку до метро (хоча, що там підвозити — два квартали вгору), купувала йому сигарети. Але він усе одно почав говорити жорстко. Соню це зачепило. Послухай, казала вона, ми живемо разом. Майже рік. Що тобі ще треба? Що це змінить у наших стосунках? — У наших нічого, чесно відповідав Сєня, але в мене є родина, вони хвилюються. — Скажи, хай не хвилюються, передавала Соня. Але Сєня далі наполягав, і вона врешті-решт погодилась. Несподівано для себе. І для Сєні. — Добре, сказала, буде тобі весілля. Лише не зловживай моєю любов'ю: вона має ліміти. Домовилася з татарами, які тримали коло ріки узбецьку кухню. Вичепила однокласника, що працював тамадою. Однокласник її не впізнав. Тим краще, подумала Соня. Замовила сукню, попередила друзів — сказала, що весілля буде в італійському стилі. Себто приходити потрібно в костюмах сицилійської мафії. Хай тепер паряться, подумала задоволено.", "Дивні люди приходили до них на свято. Найгірше, що після цього залишались. Соня стояла посеред натовпу, так і не перевзувшись, — у білих кросівках під такого ж кольору сукнею, — і намагалася зрозуміти, кого вона знає. Чи принаймні хто знає її.", "Прийшов весь її офіс, включно з юридичним відділом: Даша, змучена й заплакана, тягла за собою двох дітей — старшого й молодшого. Під дрес-код із них трьох підпадав хіба що менший: був у строгому шкільному костюмі, дивився на всіх із ненавистю, так що можна було сприйняти його за мафіозного сина полку, відлученого від основних фінансових потоків. На руці мав важкий механічний годинник, напевне, знятий із закатованого сім'єю боржника. Прийшов Іван, як завжди спокійний, хоч і постарілий, побажав щастя. Критично оглянув зачіску Сєні, але втримався, промовчав. Прибіг якийсь дивний чоловік у ковбойському костюмі, здалеку, щоправда, схожий на Челентано, але, скоріше, темпераментом. Соня його не знала, однак гостей при вході зустрічати почав саме він. Потім посипалися сусіди, шкільні приятелі, ділові партнери. Більшість уже орієнтувались, що саме любить наречена, що їй дарувати, що не потрібно: усе-таки не вперше заміж виходила, всі вже якось звикли. Ходили похмурі родичі Сєні, гуртом, не знаючи за що взятись. Найбільш неадекватно поводився небіж: перевернув закуски, курив із татарами, передбачувано завалився у фонтан. І це у свої десять років, захоплено думала Соня, це ще доки нічого не почалось. Зі своєї рідні вона запросила лише дядю Гришу, який чомусь вважав себе її хрещеним батьком, уже цим надаючись до італійського стилю. Хрещений, то й хрещений, думала Соня, головне, аби після весілля повернувся додому, сил немає слухати його нічні крики. Інші її родичі або померли, або зникли з ефіру. З іншого боку, хрещений легко це компенсував: терся коло представниць юридичного відділу, кладучи свої жовті сухі руки на ніжні дівочі коліна, глушив шампанське фужерами, час від часу дістаючи щелепу й протираючи її вологими серветками. Сєня, крім родичів, запросив команду. Цілу футбольну команду. Основний склад, із яким останні три роки захищав честь мережі будівельних гіпермаркетів. Причому захищав доволі успішно, команда трималась у лідерах, і гравці натякали власнику, мовляв, давай, Іван Абрамович, вкладись нормально — виграємо для тебе яку-небудь спартакіаду. Все в наших руках. Себто ногах. Проте Іван Абрамович мав свої плани на майбутнє, тож на початку другого кола, ще взимку, оголосив, що команду розпущено. Зачепився з міськрадою, не розійшовся з київськими, продав мережу, викупив у Єгипті готель і перебрався на африканський континент. Сидів над басейном, рахував верблюдів. Для команди це було справжнім ударом — поза футболом вони мало чим цікавились, тож і мало що вміли. Що тепер робити — ніхто не знав. Хтось устиг влаштуватись на роботу, хтось повернувся до навчання, хтось просто переживав. Сєня просто переживав. Але на весілля прийшли всі. Дрес-коду, ясна річ, не дотримались (яка мафія, говорили нервово, Сєнь, не виябуйся), втім, до спортивних костюмів одягли на всяк випадок сонцезахисні окуляри. Говорили один одному, що на Сицилії саме так і ходять, Саня, їхній правий край, був минулого Різдва на Сицилії, усі наші там саме так і ходять — в адідасах, капцях і чорних окулярах. Як справжня мафія. До весілля ставились насторожено, проте Соня їм подобалась. Тьмяно-червоне волосся, теплі губи, крижані пальці, засмагла шкіра. Невисока, спортивна, стрункі ноги, дорогі кросівки. Якби могли, зґвалтували б її прямо тут, коло фонтана. А якби вона могла, то не заперечувала б."], ["Вони прийшли останніми. Уже по обіді. Стояли під гарячим сонцем, курили, думали. Данило пропонував повертатись додому: пішли, говорив, несолідно якось. Але Олег глибоко, до запаморочення, затягувався й витирав бурштиновий піт рукавом шкірянки. Олегу було тридцять шість. Данило був старшим на чотири роки. Але виглядав на всі п'ятдесят. Олег ремонтував будинки, наймав бригади чорноробів, водив їх за собою містом, освоював об'єкти. При собі завжди носив невеликий панасонік — фотографував башточки й оздоблення аварійних будинків, потім за допомогою зуму розглядав деталі, котрих не міг побачити неозброєним оком. Одягнений був у гірські черевики, випалені джинси й коричневу авіаторську шкірянку. Мав темне нечесане волосся. Давно не голився. Давно не спав. Данило був у спортивному. Череп мав голений і побитий. Враження справляв суворе, проте очі мав сірі й мудрі. Інша річ, що в очі йому ніхто не зазирав, усі зазвичай звертали увагу на сині від наколок кулаки, розписані ним ще під час служби на Кавказі. Працював таксистом, вписався з власним мерсом до якоїсь бюджетної контори, возив студентів та іншу п'яну публіку. Мерседес його стояв під вікнами дому, навпроти Макдональдса, зранку Данило прокидався, брав із собою термос і йшов досипати в машину. Ей, питав він тепер в Олега, нас точно запрошували? Олег думав, нервово спльовував, незадоволено відмахувався. Ясно, що запрошували, говорив Данилові, ми ж друзі. Просто нагадати забули. Як це, забули? — дивувався Данило. Забули-забули, переконано мотав головою Олег, ясно, що забули. Зараз я їм скажу. Данило скептично гмикав, але лишався стояти з братом.", "Прострелили повітря недопалками, побили долонями по кишенях — чи нічого зайвого, рушили вперед. На вході наїхали на обсоса в ковбойському капелюсі, дали запотиличника якомусь малому, мокрому й противному, пильно, хоч і коротко, оглянули незнайомого пацана, кучерявого й нарваного, що дивився на всіх із відразою. Протиснулись до молодої, за лікоть відтягли від неї ветерана з червоними від безсоння очима, дали ще одного запотиличника мокрому малому, що йшов тепер за ними слідом. Привіталися. Данило простягнув долоню, Олег ні.", "Соня здивувалась. Проте швидко взяла себе в руки, усміхнулась Данилові, простягла долоню Олегові, а коли той демонстративно не відповів, притягла його до себе й волого поцілувала в щоку, колючись об його чотириденну щетину. Олег збентежено вибачився, що вони запізнились. І що не в парадному. І без подарунка. Бентежився все більше, але тут Данило перебив його, дістав із кишені в'язанку ключів і простягнув Соні: на, мала, сказав, сьогодні мій мерседес у твоїй власності. А я піду бухну. Соня розсміялася, розганяючи загальну напругу, але ключі несподівано для себе взяла. Давай, сказала, святкуйте. Ключі хай у мене будуть, а то влаштуєте тут американські гірки. Данилові вже хтось наливав, Олег хотів щось додати, але лише махнув рукою й теж потягнувся до столів."], ["Чому кораблі? — думала вона. — Звідки кораблі? Останні роки вона вела щоденник. На фірму приходив психоаналітик, веселий шарлатан, що підкочувався під час сеансів до секретарок і бухгалтерів, за що його любили й не виганяли. У вас усе добре, сказав він Соні: робота, кар'єра, здоров'я. Навіть те, що у вас немає чоловіка — добре. У вас узагалі все гаразд. Саме час занепокоїтись, попередив він. І запропонував вести щоденник. Мовляв, це для себе самої, тому можна не стримуватися — пишіть, що хочете: все одно ніхто не прочитає. Соня погодилась. Вона взагалі легко погоджувалась на все нове й несподіване. Лише, подумала, про що писати? Відразу ж вирішила, що жодних виробничих моментів. Навіщо полегшувати роботу податковій, подумала. І жодної любові, додала подумки. З любов’ю насправді теж усе було гаразд. Соня сама кидала своїх чоловіків — вони її кинути просто не наважувались. Двічі вона була в шлюбі, двічі її чоловіки безслідно зникали з її життя. Соня жартувала з цього приводу, говорила, що повідкушувала їм голови. І не лише голови, додавала. У неї було багато сексу, вона обирала собі цікавих чоловіків, вона, коли хотіла, обирала собі жінок, жінкам вона подобалась, була невтомною й спокійною, такою, якими вони хотіли бачити своїх чоловіків. Чоловікам вона, ясна річ, теж подобалась, була з ними ніжною й відвертою, до того ж завжди платила за свою випивку.", "Тому вона почала фіксувати власні сни. Уважно й детально. Описувала кімнати й будівлі, які бачила, обличчя, які виникали, записувала розмови. Малювала дерева, квіти й дивних тварин, імен у яких не було. Вимальовувала й робила коментарі під малюнками метеоритів, що падали на старі квартали, під схемами мін, закопаних у піщані дюни, під профілями серійних убивць, пійманих і засуджених до страти через повішання. Вбивці на її малюнках були схожі на корабельні команди: виснажені, проте незламні, вони були між собою чимось подібні, як і належиться чоловікам, що проводять разом в обмеженому просторі довший час. Одного разу не втрималась і показала все це мамі, тоді ще живій. Мама почитала й порадила щоденник спалити, щоби спокійно спати надалі. Соня послухалась, щоденник спалила, натомість відразу ж завела новий, швидко наповнюючи його профілями чоловіків.", "З Олегом вони познайомились три роки тому. Їй потрібно було робити щось із фасадом, який будь-якого дня міг завалитися, хтось зі знайомих (Іван? Здається, Іван) порекомендував Олега. Олег з'явився, ще без панасоніка, вийшов на балкон, переліз через перила, пішов уздовж стіни. Вона навіть не встигла злякатись, як він повернувся. Сказав, що треба було побачити все зблизька. За кілька днів привів галасливу піратську компанію. Якийсь штрафбат. Тиждень вони жили в офісі, спали на столах, їли мівіну з її ікеївського посуду, милися в рукомийнику. Відремонтували фасад, випили ящик кримського коньяку, з усіма перезнайомились, усім сподобались. У такому віці нових друзів зазвичай не заводять, думала Соня. Втім, бувають і винятки. Винятки зазвичай цікавіші.", "Вони багато кого знали, хоча все одно почувалися чужими. Родинні свята — дивна штука: чим більше в тебе тут знайомих, тим менше тебе хочуть тут бачити. Данило обережно пив, вичепив з-за столу пару сектантів, друзів молодого, справжніх безстрашних місіонерів, що тягалися чужим для них містом, рятуючи душі, ніби рятувальники на пляжі. Завів із ними розмову. Сектанти взялися за Данила дещо недбало, мов перукарі за нового клієнта. Данилові це сподобалось. Він любив дискутувати. Розповів сектантам історію свого знайомого, який теж зв'язався із сектантами. І навіть переписав на них будинок за рікою, у приватному секторі. А сам загримів на рік, за хуліганку. А коли повернувся, в його будинку жило троє слуг Божих. На поріг його, ясна річ, не пустили. І тоді, задумливо завершив Данило, він їх задушив. Усіх трьох. А будинок переписав дітям. Не своїм, ясна річ, звідки в нього діти? Дослухавши, сектанти пригнічено заспішили у справах. Данило не тримав. Брат його сидів при ньому, заливався потом, проте куртку не скидав, не розслаблявся, на щось очікував, до чогось дослухався. Що ти? — питав його Данило, що не заспокоїшся? Заспокоюсь, весело відповідав йому Олег, надійде час — заспокоюсь. Аякже, сміявся Данило, заспокоїшся ти. Якісь старші сусідки підходили до них і питали про здоров'я, діти, нетямлячись від хаосу та вседозволеності, попід столами підповзали до них і доливали їм у черевики теплого вина. Данилові це навіть подобалось, а ось Олег рішуче садив малим носаком по ребрах, і ті відчайдушно відповзали в темінь і куряву. Данило майже нічого не їв. Олег не їв узагалі нічого. Пару разів підх
