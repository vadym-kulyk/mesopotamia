одила наречена з вином, яке все не остигало в її холодних пальцях. Говорила про погоду, заговорювала зуби. За нею стояли жінки й чоловіки, жінки тримали в руках квіти й кригу, до якої прикладалися розпашілими обличчями, чоловіки ховали в кишенях залізо й пачки грошей, не відводили очей від сонця, не заходили в тінь, ніби остерігаючись чогось не побачити, щось пропустити. Кричали діти, пахло водою й пилом, починалося найцікавіше.", "Дивно, говорила Соня мамі, я веду здоровий спосіб життя, правильно харчуюсь, давно підв'язала з наркотиками, до церкви не ходжу, навіть йогою не цікавлюсь. Але сниться мені таке, що я починаю сумніватись, чи вірно я все роблю. Скажімо, невільники. Що я можу знати про невільників? Де я їх бачила? У мене жодного знайомого невільника, ти ж розумієш? А ось мені сняться невільники, сняться їхні тюремні співи, сняться їхні плачі. Сниться, як вони тяжко працюють, як ранять пальці, як виконують накази, як відпочивають по праці, як помирають. Потім лежать у тісних могилах, присипані вапном, і тяжко скриплять зубами — від люті й безсилля. Всі наші сни, відповідала на це мама, яка все життя пропрацювала в дитячій бібліотеці й найбільше у світі не любила художню літературу, від прочитаних у дитинстві книжок. Чим кращі книги ти читав, тим гірше спиш. Ти б заміж вийшла чи що, радила вона. Я вже виходила, нагадувала Соня. Двічі. Мені не сподобалось.", "Олег її дивував. Одного разу вона спостерігала, як він примусив якихось жирних замовників виплатити борг його бригадам. Замовники спочатку зробили замовлення, потім довго й ретельно контролювали хід робіт, потім уміло переховувались, врешті запропонували Олегові вирішити це питання з київськими. Олег домовився про зустріч у грузинському ресторані. Запросив Соню. Замовники спізнились, прийшли задихані й спітнілі, не вибачаючись, поскаржились, що ледь потрапили досередини, там, внизу, сказали, якісь хороводи, купа народу, може, роздають що. Це мої, пояснив Олег, чекають, до чого ми домовимось. Так що виходити буде ще важче. Замовники пом'ялись, відмовились від обіду, попросили воду без газу, підписали папери. Не хотіла б я з ним жити, ще тоді подумала Соня."], ["Коли з коридорів потягли дими й запахло медом, цукром та корицею, і сонце зайшло за вежі та антени горішніх кварталів, а тут, унизу, на схилах пагорбів, повернутих на південь, по-вечірньому остигали рослини, вони таки надумали вибиратись. Устигли побачити, що молоді пересварилися, що вся футбольна команда повалила на вихід, стояла при дверях і нервово в чомусь одне одного переконувала. Це був знак, потрібно було йти. Данило неквапно підвівся, скинув на підлогу хрещеного молодої, що спав, сидячи на стільці, головою у виделках, осадив одного з футболістів, що ліз битися до офіціантів, провів важкою долонею по спині блідій начальниці юридичного відділу, від чого та запалала, вигораючи зсередини, пішов, не озираючись, відчуваючи за плечима запах паленого цукру й мокрого тютюну. Олег вибирався слідом, дав своїм гірським черевиком хрещеному по ребрах, аби не псував свята, підняв за комір заваленого футболістом офіціанта, різко притягнув до себе Дашу, відчуваючи, як у ній усе палає від гіркоти, ішов, бачачи перед собою лише братову надійну спину, орієнтуючись лише на його побитий череп, лише братові довіряючи, лише його слухаючи. Підійшли до Соні за ключами.", "— Вже йдете? — перепитала вона розчаровано.", "Данило віджартувався, Олег нервово поліз по кишенях за цигарками. Тоді Соня схопила Данила за руку, вклала туди ключі, але не відпустила й потягла за собою. Я ж не можу вас так відпустити, говорила, сміючись, самі подумайте. Данило виважено ступав за нею, останнім сторожко брів Олег. Перед дверима, що вели на кухню, зупинився, схопив малого, якого нині діставали з басейну, але який устиг переодягнутись і йшов за ними слід у слід, розвернув його, засадив коліном під зад. Іди, сказав похмуро, святкуй. І зачинив за собою двері.", "За що їй подобався Сєня: коли платила за нього, він навіть не дякував. Говорив, що чоловік не мусить принижуватись, і якщо в нього випадково немає бабла, це ще не причина вибачатись і дякувати. По-своєму це було принципово. Принципи примушують нас діяти, вони дають нам силу, думала Соня, або слабкість. Або й те, й інше. Коли він переїхав жити до неї разом зі своїми речами (футболки, бутси, щитки, залита потом клавіатура), життя її майже не змінилося. Навіть сни не змінилися, снились так, ніби в житті її нічого не відбувалося, мовби її просто під'єднали до якогось каналу з повчальними й вигадливими сновидіннями, які вона не завжди розуміла, тому не завжди дивилась до кінця. Сєня ставився до неї зі стриманою ввічливістю, багато уваги не вимагав, багато не говорив, іноді загалом мовчав, аж вона починала нервувати. Він любив спати з нею, любив дивитися на неї зранку, доки вона ще не прокинулась і не могла ні про що його запитати. Після ночей із нею тіло його виглядало так, наче він у темряві продирався крізь шипшину. Укуси, синці й подряпини на плечах та спині робили його схожим на великомученика, якому дісталося за переконання. Сєня зупинявся перед дзеркалом, дивився на кров, що проступала шкірою, і йому ставало невимовно солодко. А коли після тренувань він стояв у душі, кров проступала з ран і змішувалась із прохолодною водою, як вітер із дощовими струменями. Друзі підсміювались над ним, він злився й швидко одягався. Проте вдома, перш ніж завалитися спати, все одно підходив до дзеркала й уважно розглядав подряпини, котрі все ніяк не гоїлися.", "Незрозуміло було, куди всі поділись, чому так рано пішли. Вечір, щоправда, був пізній, можна сказати, що й не вечір уже, а рання ніч, проте хто б зважав на час такої пори, за такого настрою? А однак на кухні нікого не було, лише освітлення рівно лягало на блискучі, залиті соусами та кремами газові плити, на металеві поверхні столів та жерстяні нутрощі мийок, на важкі холодильники й гострі ножі, вбиті в криваві дерев'яні дошки для нарубування м’яса та городини. Усюди стояли напівпорожні баняки з рештками частування, підлогою розсипано було яскраво-зелену капусту й ніжні пелюстки салату, у мийці коштовними згустками темніла яловичина, на столі залишились пляшки, банки з медом і шоколадом, тарілки з чимось гострим і перченим, в'язким і невагомим.", "— Давайте, лісоруби, — засміялася Соня, — заходьте, тут нікого немає. Я цілий день нічого не їла. І це на власному весіллі, уявляєте? Зараз щось знайду, сідайте.", "Олег застрибнув на стіл, підхопив капустину, що лежала поруч, прицілився й запустив нею в мийку. Триочковий, стримано потішився він. Данило притулився плечем до холодильника, насмішкувато дивився на брата, прислухаючись разом із тим до тиші в коридорі. Соня почала зазирати до баняків, щось там винюхуючи, виловлюючи звідти щось смачне — рештки середземноморських страв, східні прянощі та південних риб, гриміла посудом, переливала підливу, запалила зрештою чотири вогні на плиті, які розпустились, мов океанські квіти, пускаючи стелею бузкові тіні. Видобула звідкись сир, знайшла цитрини, витягла початий коньяк. Передавала все це Олегові з рук у руки, і він щоразу завмирав, торкаючись її пальців. Сіла поруч із ним, дістала з-за спини яблуко, кинула Данилові. Той легко піймав. Соня щедро надпила, передала пляшку Олегові, брала їжу, рубала її великим ножем, ділячись порівну всім, що в неї було. Олег більше пив, слідкуючи за нею. Соня гостро надкусила цитрину, і золотий сік почав стікати їй підборіддям, і жоден м'яз на обличчі її не здригнувся, лише сльози виступили, проте вона легко змахнула їх, беручись за сир і зелень. Рвала зубами чорний хліб, обережно запиваючи його вишневим соком, ламала пальцями шоколад, злизувала з долоні полуничний джем, весь час сміялася, так що зуби її різко займалися білим вогнем, і посмішка була широкою й щедрою, як це буває лише в дітей. Та й то не в усіх. Вишні лишали на її вустах кривавий слід, алкоголь робив її дихання теплим, їла вона так легко й радісно, аж Олег відчув, що зовсім сп'янів, що його розібрало й підкинуло вгору. Зауважив, що навколо холодно, навіть вогні газової плити не могли прогріти вологого повітря над мийками та морозильними камерами. Вона ж замерзла, мабуть, подумав, стягнув шкірянку й накинув її Соні на плечі. Соня загорнулась, глибоко вдихаючи його запах, повернулася й почала його цілувати. Цілувала довго, і поцілунки її пахли цитринами та медом. Олег чекав-чекав, що ж буде далі, а не дочекавшись, стягнув назад свою куртку, кинув на холодну поверхню столу, і Соня зовсім не заперечувала, опустилась на куртку, тягнучи його за собою. Цілувала далі, доки він скидав сорочку. Цитрини падали на підлогу й твердо бились об замащену джемами плитку, фініки потрапляли йому під руку, від чого шкіра його ставала солодкою, алкоголь розливався поверхнею столу, безнадійно заливаючи рештки салату. В мене під сукнею нічого немає, — раптом сказала Соня. Як це — нічого немає? — здивувався він. — А кросівки? Але вона засміялася, й узяла його руку, показуючи, що справді нічого немає, хто б міг подумати. І доки вони сміялись одне з одного, Данило тихо відійшов до дверей і вимкнув світло. Дістав сигарети, добре, подумав, що в мене лишились і не треба турбувати брата, курив, дивлячись у темне вікно й ледь помітно усміхаючись. Намагався їм не заважати. Намагався на них не дивитись. Шкіра в неї була золотиста, волосся мідне, п'ятки в неї були жовті, наче цитрини."], ["Двері ламали довго й упевнено. Залізо глухо озивалось під важким натиском чоловічих плечей. Але замки були надійними, а метал — непробивним. Тож там, за дверима, у чорних коридорах, чулися лише різкі прокльони й вигуки розчарування. Данило курив, добиваючи одну, сигарету за іншою, Олег зістрибнув на підлогу, поспішно одягаючись, намагався потрапити в рукав куртки, стрибав на одній нозі, іншу соваючи в черевик, роззирався довкола в пошуках чогось важкого. Розслабся, спокійно сказала йому Соня. Вона сиділа на залізному столі й, не поспішаючи, шнурувала кросівки. Зі складок її сукні висипався фундук і монети. Волосся на голові нагадувало червону заграву, що роздувається вітром. Але голос був спокійний, а погляд — ніжний. Спочатку, коли загриміли у двері, Олег зупинився й різко обернувся на стукіт, кинув насторожений погляд на брата, але Данило навіть не поворухнувся, ховаючись у темені, а Соня обхопила його голову руками, потяглась до нього й зашепотіла йому — швидко, тихо, але розбірливо — просто у вухо щось таке, від чого Олег обірвався в неї, і вона обірвалась слідом за ним, далі щось йому нашіптуючи — із вдячністю, втіхою та нічною втомою.", "— Соню, — він мав дивний голос, різкість у ньому поснувалася з невпевненістю, а роздратованість — із ваганням, — ти там?", "— Во дає, — розсміялася Соня, а потому крикнула: — так, я тут. Що ти хотів?", "Сєня розгубився.", "— Відчиняй, — сказав він сухо.", "— Ну добре, — сказала Соня Данилові, — вилазьте через вікно, я їм відчиню. Чуєте?", "Данило мовчав, Олег теж не відповів. За дверима прислуховувались.", "— Дань, — покликала Соня, — ти мене чуєш?", "Олег підійшов до Данила.", "— Що робимо? — спитав тихо.", "— Що скажеш, — так само тихо відповів той.", "— Я не можу її кинути, — пояснив Олег, — він же її вб'є.", "Олег дивився й чекав. Данило на якусь мить завагався.", "— Дань, — покликала вже дещо нервово Соня. — Ви мене чуєте? Давайте, йдіть!", "— Ну от іще, — сказав раптом Данило, — буду я через вікна тікати від босоти різної.", "— Правильно, — підтримав його Олег, — ще чого.", "Данило поплескав його по плечу, ввімкнув світло й відчинив двері, наче брами обложеного міста.", "Нагадували вони справжню футбольну команду, що з темних тунелів стадіону рушала на світло — до бою й перемоги. Щойно двері перед ними розчахнулися, як усім натовпом подалися вперед, відтискаючи Олега й Данила до залізних столів. Оточили їх тісним півколом.", "З-поза їхніх спин зловтішно визирав небіж, тішачись, що встиг усіх повідомити, зумів попередити й привести всіх сюди — на місце злочину. Родичі Сені відразу ж кинулися до Соні, яка непомітно поправила сукню, дістала звідкись Олегові сигарети, припалила і тепер холодно випускала дим в обличчя жінок, які кричали їй щось, не приховуючи стурбованості й відчаю. А футболісти стояли й гнівно дивилися на братів, не знаючи, з чого почати, лише Сєня переводив погляд з Олега на Данила, а потім знову на Олега, аж зрозумів якоїсь миті, що в нього просто бігають очі. Тоді обернувся знову до Олега.", "— Ти, — сказав похмуро, — пішли поговоримо. А ти, — кивнув Данилові, — лишайся тут: з тобою поговоримо пізніше.", "— А ти, — сказав йому в тон Данило, — пішов на хуй.", "Сєня хотів відповісти, але захлинувся від злості й кинувся на Данила. Данило відступив убік, перехопив Сєню за шию й різко кинув на стіл. Сєня врізався грудьми в залізну блискучу поверхню, хрипко видихнув і сповз на підлогу. Футболісти рушили на братів. Олег устиг завалити одного, Данило — двох. Після цього їх збили з ніг і почали добивати. Данило ховав голову й намагався рівно дихати. Олег викручувався й відбивався, нічого не говорячи й ні про що не думаючи. Хоча думати йому насправді було про що."], ["Скажімо, можна було подумати про свою самовпевненість, про переконаність у тому, що все буде так, як він собі вигадав. Вона йому від початку сподобалась. Подобалось, що вона нічого не боїться. Що не боїться бути сама. Що в гаманці поруч із візитками демонстративно носить презервативи. Подобалось, що в потенційних партнерів. яким вона на першій зустрічі лишала візитку, від цього зводило серце.", "Тоді, у грузинів, коли ті двоє наклали повні штани й усе підписали, він відвіз її додому, довго не випускаючи з машини, знаючи, що вона від нього тепер не піде. Тримав і весь час говорив, хоча й помічав, що вона напружується, що їй це не подобається, але був настільки впевненим у собі, що тримав її за руку й розповідав анекдоти, примушуючи її щоразу більше сміятися й напружуватись. Але коли поліз до неї, навіть не вимикаючи двигуна, ніби між іншим, вона накрила його уста холодною долонею і сказала: все, Вась, стоп-машина. Гримнула дверима, пішла до під'їзду, гнівно погойдуючись, аж він не міг відвести погляду. Як? — думав, — як можна так ходити й не падати? Відчинила двері під'їзду, пірнула всередину. Він сидів, не маючи сил відірвати погляд від чорної ночі, що обступила його звідусіль. За якусь мить випірнула на світло. Так само погойдуючись, підійшла до машини. Відчинила дверцята. Ну ти, Рембо, — сказала, — ти йдеш? Він наздогнав її на сходах. Схопивши, спробував обережно покласти на підлогу, проте вона вправно вивернулась — і сама лежала на ньому, притискаючи до холодного каменю. Він відчував, як повітрям гуляє протяг, як лунають співи в чужих помешканнях, як тварини й птахи збираються коло будинку, реагуючи на світло й тепло, реагуючи на її голосні зойки, які вона навіть не стримувала. Тихо, говорив він їй, тобі ж тут жити, ага, відповідала вона, не спиняючись, мені, а кому ж, і далі скрикувала від кожного руху. Лише раз завмерла, коли внизу скрипнули двері, здається, хтось зайшов і швидко збігав угору, він спробував підвестись, проте Соня знову накрила йому вуста долонею, яка вже не була такою холодною й пахла тепер її теплом, а кроки, полунавши якийсь час, обірвалися поверхом нижче, відчинились двері, хтось привітався, когось впустили, все затихло, і далі не було чути взагалі нічого, крім її стогонів. Потім вона побігла до себе, а він до ранку сидів на сходах, не наважуючись піднятись і піти геть.", "Спочатку їх тягли коридором, б'ючи зусібіч і рвучи одяг, потім виштовхали до басейнів. Тут Данило вирвався й завалив когось одного у воду. На нього відразу ж накинулись усією купою й потягли далі, намагаючись дістати й помститись. Коли весь натовп вивалив до бару, їх зупинив Іван. За ним стояло кілька місцевих. Чи то дізнались від когось, чи просто розуміли, що чимось подібним усе й закінчиться. Шо тут у вас? — запитав Іван. Та от, — закричали всі переможно, — заловили двох ліваків. Двох? — перепитав Іван. — І шо, ви всі на двох? Ну да, — дещо невпевнено відповіли футболісти, — ми ж їх заловили. Ну й хулі? — не погодився Іван. — Заловили — тепер відпустіть. Знайшли ліваків. Да хуй там! — викрикнув хтось із молодих. Іди сюди, — попросив його Іван, і коли той, нічого не чекаючи, підійшов, схопив його за комір і, різко розвернувшись, запустив у причинені двері. Двері розчахнулись назовні разом із молодим, а ті, що стояли за Іваном, рушили вперед. Проте молоді не відразу відчули всю небезпеку, бо кинулись відбиватись, і нічим добрим для них це не скінчилось, полягли всі, лише Іван, б'ючи навмання по стрижених головах, кричав своїм: молодого, — кричав, — не бити, у нього свято. Молодого ніхто й не бив, він так і сидів на кухні, сидів і плакав, увіткнувшись носом у Сонині холодні коліна.", "Міг він також думати про втому, яка огортала його щоразу, коли він зранку спускався сходами й відчував, що до його кроків прислуховуються тепер мешканці її під'їзду. Соня ніколи не відпускала його серед ночі. Не йди, — починала хитрувати, — терпіти не можу спати сама. Підеш — покличу кого-небудь. Він злився й лишався. Іноді засинав під її крики, не перестаючи рухатись, і вона навіть не помічала, що він спав. Він сам хвилю по тому не міг повірити, що заснув, адже вона була поруч, і хоча в темряві не можна було розгледіти її обличчя, він напевне знав, коли саме вона сміється, коли нервує, коли кінчає, коли починає все знову. Усе можна було пізнати за її диханням, за тим, що вона йому говорила, а говорила вона весь час, попереджуючи його, щось пояснюючи, до чогось закликаючи. Він так звик до її голосу, що зупинявся й заспокоювався щойно, як вона замовкала. Тоді він лежав поруч із нею й торкався її шкіри.", "Молодих виводили на вулицю, ставили під стіну, хтось спробував вирватися, його відразу ж поклали на асфальт. Стояло їх із півкоманди — решта полягла всередині, витягувати їх на повітря не було сенсу. Місцеві стояли перед ними, дивлячись, аби ніхто не втік, Іван холодно оглядав шеренгу, Данило, тримаючись рукою за бік, стояв поруч, Олег лишався коло нього. До Івана підійшов дядя Гриша, він погано тримався на ногах, але тримався й не відступав від свого, намагався Івана в чомусь переконати, киваючи в бік молодих, можна було лише почути, ну шо ти, да на хуя ти, да цих долбойобів. Дядь Гриш, — відповів йому на це Іван, — ідіть у бар: вам там наллють. І дядя Гриша печально побрів, не підіймаючи на молодих очей. Ну шо, пістони, — почав Іван, — я вам казав? І шо було не послухати? Молоді мовчали. Данило розминав кулаки, Олег спльовував кров із прокушеної губи. Решта стояли за Іваном, думаючи: так, усе справедливо, він же їм казав, шо правда було не послухати? Доб'ємо? — повернувся Іван до своїх. Але не встигли вони відповісти, як небо прорізав сухий спалах, оглушивши й примусивши втягнути голови в плечі, і святковий салют залив собою півнеба, тонко висвічуючи в темряві гілля дерев і дахи будинків, відбиваючись в очах і гаснучи в чорному озоні. Десь поруч радісно загорлали, крик підтримали по кварталу. Із-за дерев та пагорбів усі вітали святкові небесні вогні, що опалювали комах і засліплювали перехожих, роблячи ніч нестерпно красивою, а життя — невимовно прекрасним. Ладно, — поклав Данило руку Іванові на плече, — хуй з ними, не зв'язуватись же з цими щенятами. Правда, — додав Олег, торкаючи язиком надламаний зуб, — хуй з ними. Іван подумав, задер голову вгору, розглядаючи жовті й зелені заграви над ними, повернувся до молодих. Ладно, — сказав, — хуй з вами, живіть. Хтось запропонував завернути за ріг — звідти краще було видно. Всі так і зробили.", "(Одного разу Данила душив пасажир. Він тоді ще не працював на фірму, мав нормальну роботу, просто повертався додому в сильний дощ, побачив, що голосує якийсь пацан, зупинився, запитав. Виявилось по дорозі. Пацан сів позаду, Данило не звернув на це уваги. Коли переїжджали через міст і машина пригальмувала, пацан раптом перехилився вперед, затис Данилові шию ліктем, перехопив одну руку другою і що було сили потягнув на себе. Данило від несподіванки вдарив по гальмах. Пацана кинуло вперед, головою в бортове скло. Данило завалив йому по хребту, витягнув під дощ. Пацан дивився на нього скляними очима. Видно було, що страху не відчував. Видно було, що не відчував узагалі нічого. Сидів у воді, дивився вгору на Данила і з ненавистю в голосі шипів: підар, підар, ну ти й підар. Данила раптом повело — можливо, був просто втомлений, можливо, це була злість, можливо, навіть образа, що ось, мовляв, я його підібрав, а він мене тепер підаром називає, але він несподівано для самого себе зарядив малому з носака по голові. Потім ще раз, потім ще, вже не маючи сили зупинитись. Пацан втиснув голову в плечі. Прикривався руками, якоїсь миті завалився набік. Голова його впала у воду, очі були закривавлені, з рота лізла піна. Данило перелякався, думав навіть кинути його, проте щось примусило знову затягнути пацана — брудного й мокрого — до машини, посадити коло себе й відвезти до невідкладної. Сказав, що підібрав на дорозі. Поговорив із лікарем. Лікар дивився на нього й усе розумів. Я все розумію, так і сказав Данилові. Що він, бив тебе? — спитав, побачивши синці на шиї. Душив, — зізнався Данило. А ти його? Я його ні, — відповів Данило, — але пару разів заїхав. Наркотики, — пояснив лікар. — Здається, ти йому око вибив. Жити буде, але для чого? І що робити? — запитав Данило. Нічого, — відповів лікар. — Нічого не робити. Контролювати себе. Іноді наші уявлення про кривду, завдану нам, зовсім не співмірні з тими докорами сумління, які будуть гризти нас ціле життя. Але щоби зрозуміти це, потрібно й прожити щонайменшеціле життя. Давай, — попрощався лікар, — я тебе не бачив.)", "Думати можна було також про образу та ревність, про потребу помсти, про злість, із якою він їй щось виговорював, про її зневажливе мовчання, про розчарування, яке вона навіть не намагалася приховати. Він не міг зрозуміти, звідки взявся цей футболіст, який навіть шнурівки зав'язувати не вміє, навіщо він їй. Вона гнівно кричала, що це не його справа, що він пхає свого носа куди не треба, що не треба її вчити, що йому взагалі краще забратися звідси. Він забирався, але потім дзвонив, і вони далі сварилися по телефону, аж доки в нього не закінчувалися гроші, а в неї — терпіння. Він збирався перехопити десь цього футболіста й пояснити йому, що він тут зайвий, збирався (збирався ж!), але так чомусь і не зібрався: можливо, вона відговорила (заспокойся, переконувала, це ж несерйозно, ти ж бачиш), можливо, сам зрозумів, що футболіст тут ні до чого, що вся справа в ній, а з нею говорити неможливо — вона звикла робити все так, як їй хотілося, вона звикла все вирішувати сама, і ніхто не міг на неї вплинути — тата в неї не було, мама її пару років тому померла, психоаналітик, з яким вона щотижня бачилась і до якого Олег її теж ревнував, здається, просто не розумів її, тож хто міг на неї вплинути, хто міг її переконати? Нічого, — говорив Олег сам собі, — вона зрештою серйозна ділова жінка, вона сама все зрозуміє рано чи пізно, вона не буде сама собі псувати життя, все буде як раніше, вона буде терзати моє серце, посилаючи мені вдень любовні листи, посилаючи мені ввечері прокляття, розповідаючи мені на ранок свої сни, які все одно неможливо зрозуміти — такі вони прості й такі прекрасні.", "Пройшли вулицею, повернули вгору. Минули інститут, темні будинки, порожнє шкільне подвір'я. Зупинилися коло кіосків. Данило взяв воду з газом. Обмивав рани, газ шипів так, ніби шкіра починала закипати.", "— Ну шо? — запитав Олега.", "— Да нормально, — відповів той.", "— Точно?", "— Да.", "— Ну ладно. — Данило дістав сигарети, простягнув братові.", "Покурили, поплескали один одного по плечах, розійшлися."], ["Можна було думати зрештою про ранок позавчорашнього дня, про низький туман, що теплим воском зліплював сосни, роблячи ліс невидимим і небезпечним. Темний остов будівлі стояв на узліссі, посеред поля, ніби недобудований лінкор, бригада спала в будівельних вагончиках, Олег лежав разом з усіма, як справжній капітан піратів, що ділить із веселим злодійським колективом консерви, хліб і алкоголь. Алкоголь тієї ночі вони ділили майже до ранку, після чого Олег розігнав усіх спати: вихідних, сказав, у нас немає, замовник серйозний, гроші теж, тому три години на сон — і за роботу, будемо далі освоювати об'єкт. Але щойно заснув, як його підняв дзвінок. Телефонував Данило. А ти знав, — почав здалеку, — що твоя знайома завтра заміж виходить? Знайома? — не зрозумів спросоння Олег. Знайома, Соня, — уточнив Данило, — у неї завтра весілля. Я тут із вокзалу її родичів підвозив. З ними ще хлопчик — товстий, мудакуватий такий. Знав? Ясно, що знав, — запевнив його Олег.", "Він підвівся, швидко зібрався, натягнувши на себе робочий одяг. З лісу тягло холодом, тому вирішив накинути куртку. Розбудив бригадира, попередив, що повернеться лише післязавтра. Чистив зуби крижаною водою, розуміючи, що перегар усе одно не переб'єш, а тому доведеться їхати потягом. Ну, що за біда, подумав, п'ять, годин — і я вдома. Пішов до селян, попросив підкинути до станції. Хтось погодився. У тумані й мороці дістались вокзалу. Нічний він пропустив, наступного лишалось чекати дві години. Олег сів на лавку й заснув. Розбудив його сержант. Довго розпитував про документи, довго звіряв із фото в паспорті, кудись телефонував, чимось цікавився, врешті повідомив, що потяга сьогодні не буде, оскільки ходить він лише по непарних. Домовились, що сержант підкине його до траси. На трасі стояв години три. Ніхто не хотів брати чувака, застиглого серед туману у важких черевиках і підозрілій куртці, неголеного й злого. Ліг у траву, поспав. Зателефонував Данилові, попросив приїхати забрати його. Той був не проти, але Олег так і не зміг пояснити, де стоїть. Точніше, лежить. По обіді його таки підібрала фура, водій погодився довезти до найближчого автовокзалу. Навіть грошей не взяв, такий напружений Олег мав вигляд. На вокзалі виявилось, що вечірній автобус, можливо, узагалі не поїде — не було пасажирів. Олег запропонував водієві заплатити за трьох. Водій відмовився. Олег пішов до таксистів. Ті подивились на його щетину, на сліди крові й цементу, які він так і не відмив від черевиків, і так само почали відмовлятись. Але один погодився. Сказав лише, що виїхати зможе о десятій: має дочекатись постійного клієнта, що приїде ростовським нічним і привезе йому щось смачне. Він так і сказав — смачне, ніби мова йшла про шоколадний торт. Олег погодився, сказав, що почекає. Пішов у буфет. Таксисти пішли за ним, стояли за сусіднім столиком, уважно прислухались до його мовчання. О десятій виїхали. Їхали повільно, час від часу глохли. Водій нервував. Олег теж. Минули першу сотню кілометрів. Залишалося зовсім нічого. Не доїжджаючи до міста, випхавшись на черговий пагорб, машина задиміла. Водій поліз під капот із таким відчаєм, що Олег заплатив йому, скільки обіцяв. Далі пішов пішки. Нічого, говорив сам собі, пару годин швидким кроком, а там метро. Вранці буду на місці. Спустився в долину, вибрався нагору.", "Ішов і відчував, як місто стає щоразу ближче, дедалі відчутнішим стає його дихання, дедалі осяйнішими — вогні. Фури виїздили з ночі, доставляючи на ринки та склади свіжу городину, морожені свинячі туші, зерно, бавовну й заборонені ліки. У нутрощах молоковозів погойдувалося свіже молоко й злита на складах нафта, ховалися невільники, яких перевозили з ринку на ринок, тихо наспівували печальних пісень і думали про те, хто їх зрештою викупить, кому вони дістануться. Залізничними коліями котилися безкінечні валки вагонів, вантажені рибою та лісом, і сонні пасажири визирали у вікна, спостерігаючи, як сонце заливає вогнем траву передмість. Річищами піднімались баржі з вугіллям і човни з озброєними командами, що намагалися нечутно прослизнути крізь світанковий туман прямо до міських причалів. Сонце пробивало туман, і місто наповнювалося світлом, голосами й звуками, будячись зі сну й відпускаючи сновидіння. Місто стояло на пагорбах, в межиріччі, омиваючись із двох боків руслами. У долині, що відкривалася внизу, уже стояли перші будинки робітників та школи для їхніх дітей, темніли стіни лікарень, де лікувалися прокажені, і сяяли білим вапном стіни в'язниць, у яких тримали грабіжників та божевільних. За ними тяглися корпуси тракторного й танкового заводів, неканонічні церкви, котрі заборонялося будувати в горішньому місті, чорні площини злітних смуг аеродрому й засіяні маком поля, що належали жіночим монастирям. За аеродромом починалися паркани хлібозаводів і м'ясокомбінатів, що прокидалися поночі, забезпечуючи їжею мешканців міста, далі стояли шибениці, на яких вішали відьом, за ними видно було будівельний гіпермаркет, і в одному з його ангарів непомітно для вахтерів спали на бетонній підлозі, підмостивши під спини шматки картону, прочани, що брели з Півдня, з Донбасу та Криму, аби прикластися до ікон у старих соборах міста. Далі йшли будинки з червоної цегли, обвішані супутниковими антенами й таємними оберегами, що відганяли з району шахраїв і циганів. Жили в цих будинках переважно працівники ринків та вокзалів, зранку вибиралися на роботу, за ними вибігали галасливі діти зі збірниками псалмів та підручниками з алгебри в шкільних ранцях, вдома лишалися жінки, займалися господарством, прали одяг, шили, варили настоянки проти хвороб і чоловічої зради, діставали з комор і холодильників харч — червоні перці, зелені сонця капусти, жовтий сир, схожий на стиглі місяці. За дахами їхніх будинків підіймалися дими з фабрик та заводів, палали вогні, на яких гріли асфальт і виварювали одяг сухотників, і трамваї, напхані робітниками, селянами та кур'єрами, котилися під липами й тополями, розганяючи тополиний пух, що цього року все ніяк не осідав, літаючи над площами.", "Старі квартали виходили просто на ріку, на пологий берег, зарослий очеретом, у якому ховалися рибалки, виловлюючи коштовну рибу, що необачно заривалася в прибережний мул і світилася звідти, мов крадений срібний посуд. Довкола мостів селилися переважно жебраки, займаючи приміщення колишніх типографій та фармацевтичних складів, проститутки, що винаймали дешеві кімнати в гуртожитках інституту залізничників, ювеліри та переписувачі тори, котрі остерігалися жити в приватному секторі, тому поселялись великими родинами в сталінських будинках уздовж проспекту. З берега на місто щоранку видивлялися хворі й бездітні жінки, чоловіки без місця проживання та безробітні підлітки. Діти кидали у воду знайдених на вулиці мертвих птахів, і ті спливали течією, вселяючи своєю появою жах у мешканців дачних кооперативів, що тяглися вздовж лівого берега, відразу за промзоною та цвинтарями для військовополонених.", "Уздовж правого берега стояли фортечні мури — важкі й неприступні для ворогів, вони підпирали собою горби, стримуючи міську забудову. За мостом відразу ж стояла митниця, міська варта в золотих обладунках і даішники зі смугастими жезлами зупиняли фури й легковики, що намагалися проникнути крізь браму, переривали крам, ретельно оглядали багажники й валізи подорожніх у пошуках контрабанди та забороненої літератури. Самих подорожніх перевіряли на предмет чуми та сифілісу, особливо підозрілих відразу завертали й спрямовували до карантину, у сірі бараки червоного хреста, побудовані коло автовокзалу. Зранку охорона мала особливо багато роботи — виловлювала торговців, що пробували проникнути до старого міста підземними ходами та вагонами метрополітену, завертала з причалів цілі ватаги і матросів, що, не заплативши мита й не задекларувавши холодну зброю, вибиралися нагору таємними стежками крізь сади й пустирі за політехнічним. Торгівельний люд і подорожні, які законно сплачували податки й потрапляли-таки за браму, піднімалися ламаною бруківкою чи прокладеним новою владою асфальтовим покриттям до горішніх кварталів. Тут було більше сонця, проте менше зелені. На тісних вуличках, наповнених рекламою та автівками, розташовані були банки й крамниці, цілодобові кіоски з тютюном і цілодобові аптеки з мікстурами. У вітринах зеленими та рожевими кольорами горіли сукні й прикраси, з магазинів служки виносили важкі пляшки з питною водою, поспішаючи принести їх на кухні, де кухарі саме розпалювали вогонь, готуючи для господарів вишукані італійські та арабські страви. У ресторанах і кав'ярнях з'являлися перші відвідувачі — ті, що прибули з інших міст чи не мали можливості після нічних пригод забігти додому на перекуску, або ті, що тижнями жили в готелях та нічних клубах і хотіли просто побути поміж людей, ідучи на ранковий запах коньяку. У дешевих їдальнях збиралися студенти, заливали пивом конспекти, діставали з-за пазух мисливські ножі й погрожували випустити тельбухи викладачам і деканам, розповідали один одному останні новини та читали вголос неблагонадійні вірші. У дорогих рестораціях сиділи бізнесмени й укладали угоди, пускаючи собі лезами для гоління кров і ставлячи нею підписи. Жінки на вулицях пахли сном і любов'ю, діти, біжучи до школи, повторювали ті дивовижні історії, що наснилися їм цієї ночі. Крики їхні здіймалися в небо й тривожили повітряні потоки, що сколихувалися, завмирали й міняли напрямок свого руху.", "А вже там, куди підіймалося ранкове свіже повітря, у сонячному вогні й тополиних хмарах, стояли церкви, мечеті й синагоги, що здатні були в разі небезпеки вмістити всіх мешканців міста, стояли пам'ятники поетам і засновникам університету, лежали парки, якими гуляли привезені з Азії та Південної Америки птахи й тварини, громадились театри, палаци, ратуша, міськрада й центральний універмаг. Зранку двірники мили сходи, що вели до пам'ятників і концертних залів, регулювальники відчайдушно завертали велосипедистів, що вилітали на площу й розганяли зграї голубів та червоних крикливих папуг, професори й радники добиралися до робочих місць, аби дбати про це місто, аби захистити його від фінансових ризиків і цивілізаційних небезпек. Батьки міста виходили на вежі, оглядали згори наповнені сонячним пилом квартали, ловили ледь відчутний запах ріки, що прилітав із півдня, дивились, як крилом літака зблискує річкова поверхня на півночі, слухали птахів, що кружляли над ними, здіймали погляди догори й просили святих про милість і заступництво. Святі стояли в синьому невидимому просторі, за потоками вітру й повітряними ямами, годували з рук птаство, прислухалися до голосів знизу, відповідали батькам міста десь так:", "— Ми робимо все, що від нас залежить. А що залежить від нас далеко не все, то й покладатись потрібно не лише на нас. Більшість життєвих негараздів та душевних сумнівів походять від нашого небажання щоденно поділяти наші вчинки на добрі й погані. Ми маємо нашу любов, проте не завжди нею користаємось. Ми маємо страх і покладаємось на нього більше, аніж потрібно. Життя має лише два шляхи: один веде до раю, інший — до пекла. Щоправда, у багатьох місцях вони перетинаються."], ["Майстерню облаштували в підвалі ЖЕКу. Жодної вивіски, але кому потрібно, той знав: звертаєш від метро, знаходиш потрібний будинок, пірнаєш у цегляну браму й бачиш у стіні чорні залізні двері. Далі або стукаєш, або телефонуєш. До майстерні занесли продавлену канапу, на якій спали робітники, коли не траплялося замовлень. Посеред кімнати темніли верстати, уздовж стін тулилися столи, захаращені банками, щітками, сухими ганчірками, пензлями й олівцями, а ще витертим наждаком і тупими складаними ножами з надламаними лезами. Під стелею розгойдувалася потужна лампа, на стінах висіли вижовклі заводські плакати й кілька почесних грамот, отриманих за успіхи в греко-римській боротьбі. У майстерні пахло фарбою, лаком і старим деревом, а ще чужими помешканнями, з яких притягувалися сюди для ремонту й реставрації крісла, стільці, шафи та книжкові полиці.", "Зранку в майстерні відчинялися вікна, що виходили на подвір'я, заросле травою та диким часником. Приміщення наповнювалося повітрям і глухими звуками вулиці. На подвір'ї росли також покручені яблуні, під ними робітники спорудили дві лавки, на яких теж можна було спати. Ще далі, за деревами, стояли покинуті прибудови, втім, продертися туди за плющем і травою було не так просто. А вже за ними громадилась цегляна стіна, частина давніших будівель, свого часу зруйнованих і забутих. Стіна обривалася на широку вулицю, що тяглася вгору, повз політехнічний, у бік центру. Улітку квартал зовсім порожнів, і подвір'я стояли тихі, як церкви в понеділок. Роботи ставало менше, працівники слухали радіо на мобільних телефонах.", "Маріо працював тут від зими. У березні приміщення було вогке, сніг лежав під вікнами до середини квітня, і вони з напарником закушували ним — темним і твердим — вино з паперових пакетів. Напарник, Яша, працював у майстерні від самого початку, шефа пам'ятав із вісімдесятих — разом працювали на велосипедному, разом пішли у вільне плавання, потім шеф сів, Яша його вірно чекав, як морячка на пірсі, років десять тому, на початку двотисячних, шеф відбив підвал і влаштував у ньому реставраційну майстерню. Сам знаходив замовників, сам щось перекуповував, завозив уночі виловлені речі, приходив зранку з підозрілими клієнтами, легковажно піднімав ціну на старі комоди, з кимось зідзвонювався, когось уникав, мало з ким товаришував, мало кому подобався, мало цим усім переймався. Усю роботу робив Яша, який мав золоті руки й залізну печінку. Роки, втім, не робили його молодшим, і Яша замовив собі помічника. Шеф чужих не брав, хоча й своїм не довіряв. І тоді його близький приятель, Коля, порадив їм свого племінника, Маріо. Сказав, що на роботу краще брати знайомих: вони принаймні не вступатимуть до профспілок. Шеф погодився, часто говорив потім, що зробив добре діло, але говорив так, ніби шкодував за вдіяним. «Марік, — звертався він до нового підмайстра, — потрібно завжди шанувати батьків. Навіть якщо їх у тебе немає». Маріо справді ріс без тата, котрий свого часу виїхав із заготівельною бригадою на Північ і не повернувся, тож виховувала його мама, як уміла і могла, себто ніяк. У найбільш відповідальні моменти допомагав дядя Коля: він відмазав племінника від війська, він допоміг йому влаштуватися на заочне відділення, він час від часу підкидав роботу. Але ставився до малого з підозрою, тримаючи на відстані. Маріо це розумів, тож у свої тридцять довіряв лише провидінню. Хоча довіри воно відверто не заслуговувало.", "Робота не була цікавою, проте й особливих зусиль від підмайстра не вимагала: Маріо тягав меблі, лакував деталі, зачищав дерево. Коли шеф вибігав у справах, Яша йшов за вином, а Маріо валявся на канапі й гортав старі газети, дивуючись прочитаному. Магазин із вином знаходився навпроти майстерні, вмурований у заводську прохідну. Яшу там знали й не любили. До учня свого Яша ставився з педагогічною ніжністю, навіть за вином бігав сам. Випивши, майстер багато розповідав про життя, Маріо слухав неуважно, а почутому не надто вірив, бо коли вірити Яші, виходило так, що у світі не лишилося жінок, з якими він не спав, і чоловіків, з якими він не пив. На роботу Маріо приходив у кедах, перемащених лаком, широких білих джинсах, так само залитих кольоровою хімією, і волонтерських швейцарських футболках, яких його мама тримала вдома цілий набір. Мав спокійний, дещо замкнутий характер і добру натуру, роботою не переймався, давно б звільнився, якби не Коля. Колю він боявся, Коля пригнічував його своєю нав'язливою байдужістю. З усім іншим у Маріо проблем не було: друзів не мав, з мамою жив разом, але і розмовляв рідко, оскільки нічого нового мама йому не розповідала, а зі старого й давно відомого йому мало що подобалось. Любив спати вдень, під час сієсти йому зазвичай снилося щось екзотичне та загрозливе — змії з головами жінок, лисиці, що співали оперними голосами, будинки у вогні й ріки, над якими літали дракони. Прокинувшись по обіді, він вилізав через вікно на подвір'я й сидів на лаві. Його обступали пси, втім, без особливого завзяття — що можна взяти з такого дивного пасажира, який пахне лаком і деревом, що в нього може бути в кишенях, окрім цвяхів, мотузок, схожих на кулеметні набої металевих прямовисів і гострих циркулів? Іноді Маріо лишався працювати вночі. Вмикав настільні лампи, і до кімнати відразу ж тяглися комахи та жуки, обпікаючись і падаючи на підлогу. Маріо блукав кімнатою, і жуки весело хрускотіли під його ногами, мов горіхи."], ["Тієї ночі він теж не спав, тримаючи в собі цей стан довгого безсоння, втому, що приходила на ранок, відчуття неприв'язаності до руху планет у небесах. До тридцяти років він навчився радіти часові, який минає, і не шкодувати, що він минає так швидко. Звички його давно виробились, неспокій розсмоктався, залежності набули чіткості. Улітку особливо гостро хотілося не засинати, зберігаючи в собі примарність і минучість усієї темряви світу. Десь о шостій ранку Маріо остаточно втратив орієнтацію в часі: сонце вже стояло над деревами, але й місяць так само висів угорі, відчуття було таке, що місто давно прокинулося й усі займаються важливими справами, від чого Маріо охопив незрозумілий неспокій, якесь передчуття, ніби планети вишикувались над ним, натякаючи на початок чогось важливого в його житті, чогось, що має початися саме цими дивними днями, наприкінці червня, коли сонця й місяці множаться й ховаються в повітрі, мов лисиці в теплій траві. Він зачинив вікна, вийшов на вулицю, дістав телефон, аби подивитись, котра година. Саме тоді йому зателефонував Коля.", "Коля торгував овочами, мав два кіоски на Кінному, два в центрі. В одному з них працювала мама Маріо. На початку літа спробував відкрити ще один, п'ятий, і прогорів. Від нервів сіла підшлункова. До лікарів Коля вирішив не звертатись, традиційно лікуючись алкоголем. Учора зранку попхався на весілля до доньки однієї своєї однокласниці, що пару років тому померла, лишивши по собі добру пам'ять і дорослу спадкоємицю. Вітав молодих, говорив про сімейні обов'язки, чіплявся до жінок, сварився з чоловіками. Поночі його скрутило. Опинився в лікарні. Гнівався. Сварився з лікаркою. Щойно та пішла, набрав племінника.", "— Марічек, — обережно й сухо добирав слова він, аби не видатися надто безпомічним, — говорити не можу, тут сплять. Зроби так: сходи до мене, ключі в тебе є, візьми зубну щітку, візьми бритву, візьми фен, візьми домашнє взуття, візьми рушники, білизну, журнали, грілку, карти (я зараз про гральні говорю, ти розумієш), миску, ложку, набір ножів, кілька свіжих сорочок, краватки, носові хустинки, чайник, термос, тостер…", "— Ви що, переїжджаєте? — перебив його Маріо.", "— Я в палаті, — жорстко відповів Коля.", "Маріо злякався. А Коля продовжив:", "— Мене прямо з весілля забрали. Уночі. Навіть переодягнутись не маю в що. Давай, Марічек, давай, — тиснув на племінника холодно, — рухайся, рухайся.", "Нервовість його передалася Маріо. Коля вмів напружити, любив тримати все під контролем, плів систему родинних стосунків, наче липку павутину, і страшенно ображався, якщо комусь траплялося вирватись із його ніжних чіпких обіймів. Багато говорив про рідних, говорив загалом добре, але ставився до них при цьому, як до боржників.", "Мешкав Коля у двоповерховому будинку неподалік, йому належав цілий перший поверх. Будинок стояв у глибині двору, з вулиці його навіть не було видно. Стіни пропускали вологу, балкони провисали, стеля могла давно обвалитись, проте трималась на якихось невидимих кріпленнях та опорах. Кімнатами Коля вміло розставляв відра та баняки, мовби хитромудрі пастки, до яких намагався піймати коштовні дощові краплі. За радянської влади в будинку жили чотири родини. Колина родина займала дві кімнати на першому поверсі, поруч із ними жили Павлови: Павлов-тато, інженер, Павлова-мама, теж інженер, і їхня донька — істеричка й інтриганка. Нагорі, прямо над ними, жив Шалва Шотович — грузинського роду, начальник цеху на Шевченка, самотній джиґіт із купою зв'язків. В іншому кутку на тому ж поверсі жили старі більшовики, Коля їх розрізняти так і не навчився. Можливо, вони просто добре конспірувалися. На початку дев'яностих Павлови виявились євреями й виїхали. Квартиру за копійки продали Колі. Більшовиків ставало все менше. Врешті лишилась якась старенька. Почувалась не найкращим чином. Іноді, побачивши себе в дзеркалі, лякалась. Коля її підгодовував. Шалва теж виїхав. Але квартиру не продав. Час від часу, раз на два роки, прилітав звідкись із Гамбурга, де працював у порту. Провітрював кімнати, сидів вечорами з Колею, розповідав про новий побут, не скаржився, хоча Коля все одно його втішав. Квартиру Шалва продавати відмовлявся, незрозуміло чому, мовби тримав у запасі варіант відступу, ілюзію того, що все можна повернути, що все знову може бути добре. На той час Коля лишився сам: батьки померли, сестри — Зіна й Марина — вийшли заміж, народили, розлучились, але повертатись до родинного гнізда не поспішали. Марина виховувала Маріо й працювала на брата. Зіна жила коло моря, приїжджала рідко. Маріо бачив у цьому сімейне прокляття: мама його вийшла заміж, але невдало. І тьотя Зіна вийшла заміж, але теж невдало. Коля ховав у холодильнику великі суми грошей, тримав у коридорах привезені гуртовиками овочі, спав на двомісному дивані, розкинувшись і забувшись. З жінками йому не щастило, їм із ним — так само. Мав оливкового кольору шкіру, вузькі очі, недовірливий важкий погляд, невиразну усмішку, жовті зуби старого вуличного пса, слабкі легені й заплиле жиром серце. Сніданки Коля готував собі сам. Усе так чи інакше мало закінчитись підшлунковою."], ["Він знайшов ключі, відчинив двері, пройшов коридором, потрапив до обжитих Колею кімнат. У помешканні горою лежала зелень і стояв пил, дещо зарізко відгонило ліками, дещо приглушено — горілою їжею. У першій кімнаті над столом звисала нова модна люстра з кількома світильниками. Світив, утім, лише один. У кутку стояли дві пральні машини. Обидві не працювали. У наступній кімнаті стояли шафи з новим фірмовим одягом і старими дитячими книгами. На підлозі лежали килими, густо посипані чіпсами. Далі Маріо наткнувся на непід'єднаний дріт кабельного й невимкнений подовжувач із тостером на кінці. Коля любив хай-тек, але мав проблеми з проводкою. Кімнати огортав присмерк від зачинених жалюзі, і повітря тримало в собі стільки запахів та встояного тепла, що Маріо не витримав і відчинив вікно. Дістав пакет, почав збирати речі. Покопавшись, знайшов термос, рушники, білизну. Згадав про зубну щітку. Ванна знаходилася в іншому кінці будинку. Він минув кімнату з диваном та двома телевізорами (один показував, на іншому був звук), минув загашник, де Коля тримав швабри й мисливську рушницю, рушив прохідною кімнатою, що виводила безпосередньо на простору занедбану кухню, у кутку якої, відгороджена китайською кольоровою ширмою, стояла велика модна ванна, встановлена на чотири цеглини. Колину кухню він любив, тут завжди можна було знайти щось цікаве — як не в холодильнику, що час від часу вимикався сам по собі, то в старому бабусиному столі, де Коля тримав солодощі та снодійне. А ще тут стояли валізи з журналами, паперові коробки з Колиними шкарпетками та пакети із супермаркетів. Вікно було завішане важким оксамитом, схожим на прапор, це робило довколишній безлад таємничим, тож Маріо й зайшов сюди в передчутті таємниць і загадок. А зайшовши, тут-таки їх і побачив: у ванні, повернувшись до Маріо спиною, стояла юна незнайомка й марно намагалася розібратися з гарячою водою. Ширму було ледь відсунуто, незнайомка, схоже, на гостей не очікувала. Маріо завмер, зробив півкроку назад, відступаючи за двері, і знову визирнув. Світло пробивалося крізь діри в оксамиті, вихоплюючи із сутінків кольори й відтінки. На холодильнику співало радіо, крутили щось надривне, два хрипкі жіночі голоси оповідали про тяжку долю дівчини з невеликого портового містечка, яка рано зазнала журби й розчарувань. Незнайомка у ванні навіть не почула, що хтось увійшов, стояла навшпиньках, тягнучись до нікельованої італійської насадки, що її Коля перемотав угорі синьою ізоляційною стрічкою, і погойдувалася, слухаючи сумних жінок, мовби в пісні йшлося саме про її життя. В містечку, де я жила, — заводила перша жінка, — не було жодних розваг, лише щоденне бухалово й вечірній трах у парку культури, білі дими заводів, чорні очі робітників і злодійські малини за нічним лиманом. Так-так, — підспівувала їй інша жінка, — жодних атракціонів, лише сухе південне вино й любов під випаленим накипом зелені. І чорні очі молотобойців, і свіжа малина недільних базарів. Маріо визирав, намагаючись краще розгледіти незнайомку. Була вона невисокою й тонкою, мала довге темне волосся, важке від води, спиналася на пальцях, напруживши м’язи, але все одно нічого не могла дістати, тож і похитувалась так гірко, роблячи й без того не надто веселу пісню зовсім безнадійною. Всі в містечку вважали мене курвою, — плакала перша жінка в радіо, — всі зневажали мене за фарбовані кучері, за золотий ланцюжок на беззахисній шиї. І кожен фраєр намагався зазирнути мені під сукню, торкнутись мого стегна в темряві кінозалу. Справді-справді, — підтягувала друга, — чорні нитки в її волоссі тонко світилися в темряві кінозалу, й засмучені чоловіки проводжали її пізньої пори, оливковими вечорами, мрійно задивляючись, як теплою бронзою відсвічує її шкіра. Але вони любили її, — додавала друга жінка, ніби щось важливе, — за її легковажність та безтурботність. Маріо слухав і дивився. Литки вона мала стрункі й невагомі, стегна — м'які, шкіру — темну, так, наче багато працювала на виноградниках, багато ходила під сонцем, не ховаючись від вітру й дощу. А перша жінка продовжувала: якось, — говорила, — я зустріла його на святковій площі нашого містечка. Був він справжнім гангстером, чистив лохів по трамваях, ніколи не розлучався зі своєю фінкою, перестрілки, схованки, всі діла, і саме йому я віддала своє серце, така ось любов. Але він кинув і мене, одного дня рушивши по етапу, лишаючи мене сам на сам із жорстокою реальністю. Любов-любов, — підхоплювала друга, — робила святковими її дні, коли зранку вона вибігала на площу, й чоловіки билися на ножах за право купити їй букет польових квітів. Але лише один із них відкрив її серце — радісне, як велосипедний замок, і забрав звідти таємну пружину, позбавивши її голосу, забравши її радість.", "І де він тепер, якими трамваями добирається нині додому, і чому не прийде й не забере її? Вона перекинула волосся собі на груди, і Маріо розгледів кілька ледь помітних родимок на її спині, розгледів її ніжні хребці, що гостро виступали з-під шкіри, як озерне каміння, підіймаючись угору, тримаючи її нечутну вагу, розгледів її зовсім дитячі лопатки, не міг відвести від них очей, заворожено спостерігаючи, як вони рухаються, як вони завмирають, розгледів її ключиці, її шию. І відтоді, — нагадала про себе перша, сумніша жінка, — я приходжу щовечора до цього бару, що кришується мусарнею, й продаю свою любов вантажникам і листоношам — всім, хто погоджується заплатити за неї бодай щось. Адже нічого в цьому житті не дається просто так, і за все потрібно платити. І оплачуючи солодку любов, ми зазвичай отримуємо лише сліди на воді, лише блакитну фарбу, розмазану по обличчю. І оплакуючи любов, — тут-таки підтримала її інша, — ми платимо вдячністю всім листоношам, які не приносять нам поганих новин. За все потрібно платити, щовечора й щоночі, й наші сльози — лише синя фарба повітря, блакитні сліди на воді, золото нашої радості, срібло нашого мовчання. Пісня враз обірвалась, холодильник колихнувся й завмер, незнайомка різко повернулась і подивилася йому в очі.", "Спочатку його кинуло в жар, потім крига скувала його рухи, потім він зрозумів, що взагалі не відчуває свого тіла. А незнайомка вже усміхалась йому, як давньому знайомому і, знайшовши теплий білий рушник, недбало прикрилась ним, нічого насправді не ховаючи, ступила на розмоклий скрипучий паркет, підійшла до Маріо й легко подала руку.", "— Привіт, — сказала, відкидаючи за спину волосся. — Ти Марік?", "— Марік, — згадав він власне ім'я.", "— А я Настя, — пояснила вона, — донька тьоті Зіни."], ["У лікарняному коридорі Маріо мусив зачекати: у палаті лікарка саме пояснювала Колі, що ліки потрібно пити. Коля незадоволено опирався, навіть пробував відкупитись, пропонував лікарці гроші, аби та його відпустила. Лікарка ображалась, пояснювала Колі, що його тут ніхто не тримає, що лікування — справа добровільна, якщо ти, звісно, не шизофренік. Тоді ображався Коля, кричав, що за ті півдня, поки вони торгуються, він устиг би продати пів-фури бананів. Лікарка починала плакати, Коля просив пробачення й намагався запхати їй купюри до кишені халату, лікарка вимагала, аби він ліг і не бігав за нею з крапельницею в руках. Врешті вона пішла, кинувши в коридорі на Маріо заплаканий погляд. Маріо зайшов до палати. Коля лежав коло вікна в білих м'ятих брюках і несвіжій сорочці. Під ліжком валялись дорогі брудні черевики. Вигляд він мав утомлений, обличчя його, і без того підпухле, після вчорашнього святкування взагалі набрякло й набуло лимонних відтінків. Мав Коля туге черево й короткуваті ноги, загалом племіннику він нагадував негативного персонажа якого-небудь індійського фільму. В індійському кіно такі герої зазвичай зловживають владою. І терпінням глядачів. Коля й тепер, із голкою у вені, викликав не так співчуття, як острах: що, як виживе й почне мститись? У палаті з ним лежали ще троє: один інтелігентний, в окулярах, лежав якраз навпроти Колі, читав газети, гриз печиво; коло нього роботяга, явно із заводу — руки в мазуті, під очима мішки, на столику при ліжку кип'ятильник, ніби він саме ним і лікувався; а поруч із роботягою пацан у помаранчевих шортах, довгих білих шкарпетках, схожих на гольфи, у смугастій футболці, з навушниками на голові — лежав, слухав музику, ні з ким не заговорював, на провокативні питання не відповідав. Можна було подумати, що він просто зайшов полежати, відпочити, послухати улюблену музику. Маріо відразу помітив, що Коля себе вміло поставив: усі троє кидали на нього час від часу насторожені погляди, чекаючи, що ж він вигадає наступної миті, на кого наїде, звідки чекати небезпеки. Маріо за це й побоювався дядька: ніколи не можна було зрозуміти, який у того настрій, коли він жартує, коли збирається в'їхати тобі в коліно. Коля пильно вивчав співрозмовника крізь вузькі щілинки очей, говорив так, наче робив замовлення в ресторані — і слухати не хотілось, і перервати було не можна. Розмовляв тихо, ти завжди мусив прислуховуватись до його слів, бути уважним, аби чогось не пропустити. Побачивши Маріо, підвівся, виштрикнув голку з вени, приліпив її пластиром до крапельниці.", "— Приніс? — запитав спокійно, ніби це не він щойно тут брав на понт лікарку.", "— Приніс, — відповів Маріо.", "— Що там? — знову запитав Коля, маючи на увазі, очевидно, якісь домашні новини.", "— Зіни донька приїхала, — відповів Маріо, не знаючи, як про це говорити: з радістю чи навпаки — з докором і відразою.", "Коля взяв один із пакетів, вивалив із нього все на ліжко. Повільно, не поспішаючи, стягнув із себе сорочку, потім брюки. Кинув усе це до порожнього пакета, передав назад Маріо. Почав одягатися в чисте. Маріо відзначив, що Коля був засмаглий до пояса, проте мав бліді синюшні ноги, мовби хтось узяв різні частини й склав докупи такого ось Колю, і тепер лишилося хіба що закачати в нього трішки крові, і можна буде відпускати на вулицю. Коля нарешті заговорив.", "— Настя, — сказав, — точно: вона ж мала вчора приїхати. Як я забув. — Він замовк, дивився у вікно, заклавши руки до кишень. Потім обернувся. — Ось що, Марік. Приглянь за нею, доки мене не буде. Добре?", "— Добре, — відповів Марік. — Що за нею приглядати? Не маленька.", "Маріо помітив, що Коля стискає в кишенях кулаки.", "— Не маленька, — відповів племіннику, стримавшись, — а все одно приглянь. Добре?", "— Добре, — заспокоїв його Маріо.", "— Я тобі довіряю, — сказав Коля, і Маріо відчув, скільки злості було в цих словах. — Купи їй щось на вечерю.", "Він дістав із-під подушки пачку грошей, перехоплену гумкою для волосся, відрахував кілька купюр, передав Маріо. Встромив голку у вену, ліг і незадоволено сказав:", "— Ми всі — одна родина. У родині головне що? Довіра. Запам'ятав?", "Було незрозуміло, іронізує він чи говорить серйозно, але Маріо про всяк випадок кивнув. Коли виходив, помітив, що пацан із навушниками дивиться на нього зі співчуттям."], ["На вулиці зупинився й довго все обмірковував. Зайшов до цілодобового через дорогу, купив мороженої риби. Вийшов на вулицю. Потім повернувся й купив пакет вина. Знову вийшов. Знову повернувся — узяв ще пакет. Подумав, згадав жовте Колине обличчя, віддав пакет назад. Приготую їй рибу, подумав, і піду. Коли прийшов до Колі, сестра бігала квартирою й пробувала прибратись. Була в легкій короткій сукні. Маріо помітив, яка вона схожа на свою маму: чорне волосся, яскравий одяг. Братові зраділа, довго й весело обіймалась. Від неї пахло дитячим шампунем. Рибу кинула в мийку на кухні, сказала Маріо зачекати: вона, мовляв, зараз щось приготує, головне — розібратись, що тут у дяді Колі їстівне, а чого краще не чіпати. Довго копалася в холодильнику, вивуджуючи звідти застиглі, мов холодний цемент, пакети з молоком, шматки м'яса, що кольором нагадували нечищені черевики, підозрілі банки з домашніми соліннями, схожі на відьомські приправи. Викидала все це до відра зі сміттям, зазирала до шухляд столу, ставала на стілець і вибирала щось із горішніх полиць, просила Маріо підійти і взяти в неї з рук цукор, мед і морську сіль. Маріо підходив, сторожко задивлявся на неї знизу, світло йому повнилося морською сіллю, і сльози виступали на очах від того, що він бачив. Настя навантажувала його соусами й консервами, нишпорила кухнею, зрештою скинула все це на стіл і спробувала дати раду зі знайденими запасами. Тут Маріо вийшов із забуття й почав відбирати в неї кухонні ножі. Сказав, давай, мала, йди читати комікси, я сам усе приготую. І піду. Мені, сказав, сьогодні ще на роботу.", "— Ти хоч готувати вмієш? — спитала Настя.", "— Погано, — відповів Маріо, згадуючи, як нещодавно варив у майстерні для напарника клей і ледь не спалив будинок.", "— Я тебе навчу, — запропонувала Настя, знову беручи все до своїх рук. — Тут усе просто. Головне — спеції.", "Вона діставала рибу й овочі, траву, темно-червоні порошки й товчені корені, усе це змішувала й перетирала, ретельно нарізала й дрібно провіювала, скидаючи до великого баняка, що незабаром почав закипати й набувати небачених кольорів. Маріо стояв у неї за спиною й думав про Колю. Згадував, що той говорив про довіру, намагався здогадатись, що саме він мав на увазі. Не зовсім розумів, як поводити себе із сестрою, сумнівався, чи не піти йому вже тепер. Але знову згадував про Колю й залишався на місці. Щоби відволіктись, запитав Настю, де та навчилась готувати. І почув цілу історію. Виростала Настя в приморському місті, між заводом і портом. Жили вони з мамою в заводському гуртожитку. Тата в них не було, тож коли мама бігла на роботу, Настею опікувалися сусідки. А сусідки наші, розповідала вона, були справжні відьми. Вони й навчили Настю куховарити, навчили застосовувати різні підозрілі приправи, від чого їжа ставала поживною, хоча й не завжди стравною. З дитинства вона запам'ятала безліч смаків і запахів, мертвих птахів на кухні й холодний підвал, обжитий слимаками й наповнений осінньою городиною. Одного разу сусідки випадково її в цьому підвалі зачинили. Вона сиділа там до вечора, доки не прийшла мама. З тих пір, сказала Настя, я зовсім не боюсь темряви.", "Я теж не боюсь темряви, відповів Маріо й тут-таки згадав, як йому трапилось ночувати в цій квартирі. Коля поклав його в коридорі на розкладачці, сам довго засинав на канапі, важко повертався уві сні, розмовляв і прокидався, канапа рипіла під ним, мов акордеон. Маріо дослуховувався до Колиного галасу, вираховував інтервали між його скрикуваннями, а потім несподівано заснув. Прокинувся, підвів голову й відразу побачив Колю. Той стояв на кухні, коло вікна, зовсім без одягу, й пильно вдивлявся у чорно-лимонну ніч. Місячне світло робило його шкіру зеленою, а череп блискучим. Дихання його було важким і хижим. Він стояв нерухомо. Потім розвернувся й рушив назад до кімнати, у темряві не звертаючи жодної уваги на Маріо. Ступав насторожено й важко. Паркет похрускував, як перший сніг під лапами зомбі, що вийшов на полювання.", "Настя розклала в глибокі тарілки те, що зварилось. Пішла до сусідньої кімнати. Сіла на килим, поставила посуд перед собою. Маріо з вином посунув слідом, розірвав пакет, вино вибухнуло в його руках, заливаючи килим, всотувалось у товсту поверхню, торкалося ліній і руйнувало симетрію візерунків. Маріо прибіг із серветками й заходився вилизувати цей чортів килим, але Настя зупинила його, сказала: заспокойся, я потім відчищу, я знаю один таємний спосіб, ще давньоіндійський, як чистити китайські синтетичні килими. Давньоіндійський? — засумнівався Маріо. — А звідки знаєш? У нас, — пояснила Настя, — часто зупинялись іноземці. Переважно моряки й торговці бурштином. Вони мене й читати навчили. Я взагалі спочатку вивчила есперанто, лише потім російську. Ти знаєш есперанто? — спитала, поправляючи волосся й осмикуючи сукню.", "— Погано, — відповів Маріо.", "А сам згадав, як Коля взявся «рішати справи» з якимись поляками, а він, Маріо, мусив вести з ними телефонні бесіди. Говорили англійською, Коля його й викликав як носія англійської. Проте говорив Маріо погано, поляки говорили ще гірше, Маріо їх майже не розумів, а те, що розумів, Колі відверто не подобалось. Він стояв поруч із племінником, дивився на нього холодно й відсторонено, постійно перепитував, злився, від чого Маріо панікував і розумів ще менше. Зрештою Коля відібрав У нього слухавку, злісно пояснив усе, що про нього думає, й узявся вести перемовини сам. Потім показував Маріо рахунки за телефонні розмови, ніби список його, Маріо, дитячих гріхів. Довіра, думав Маріо, аякже.", "Про їжу якось забули, Маріо сидів і згадував усі життєві прикрощі, думав про довіру й легковажність, думав про те, що йому взагалі нечасто довіряли, і ставало йому від цього ще прикріше й незатишніше. Вона справді схожа на свою маму, подумав. І на мою теж. Усі жінки в нашій родині чимось подібні — вони так багато говорять, що ти просто не встигаєш їм відповідати. Тому вони думають, що їх усі ігнорують. Як і його мама, Настя мала допитливі очі й ніжне обличчя. Вона так само легко одягалась, не боячись протягів і не відчуваючи холоду. Так само швидко добирала потрібні слова, так само голосно їх вимовляла. Яким, цікаво, був її тато?", "Настя натомість засумувала: брат сидів на кривавому килимі й думав про щось своє. На неї уваги не звертав. Чи принаймні робив вигляд, що не звертає. І тоді вона розповіла ще одну історію."], ["— Я рано закохалася, — сказала вона. — У нас у місті всі рано закохуються, особливо жінки. Він був старшим за мене років на десять. Ось як ти, — вона торкнулася Маріо. Той неуважно повів плечем. — І тому в нас нічого не вийшло. Я переживала, думала, що це мені покара за ранню любов. Тоді взяла й поставила собі брекети.", "— Для чого? — не зрозумів Маріо. Довіра, далі думав він, ну-ну.", "— Для покути, — пояснила Настя. — Щоби ні з ким не цілуватись. Два роки я ні з ким не цілувалась. Два роки. Аж доки не зняла ці штуки. А вже коли зняла… — закотила вона очі.", "— Що? — перепитав її Маріо.", "— Тепер я цілуюся з усіма, — відповіла Настя.", "— З усіма?", "— З усіма.", "Аж тут Маріо нарешті зрозумів, про що вона говорить, довіра, подумав він. І лише після цього поцілував сестру. І діяв наполегливо. Сам не розумів, що примушує його займатись такими дивними речами. Адже він ні на мить не забував про те, у чиєму помешканні знаходиться, чиї килими тут щойно залив. Ні на хвилину не забував важкого Колиного погляду, сухого голосу. Пам'ятав, де той ховає ножі й заточки, пам'ятав, як він погрожує по телефону, як набрякає від злості його сіро-коричневе обличчя, як надимаються вени на шиї, як, сварячись, він хрипко дихає, видмухуючи крізь широкі ніздрі дим і вогонь. Пам'ятав, боявся, проте зупинитися не міг. Настя тим часом не зовсім розуміла, що з ним сталося. їй подобалось, як він невміло цілується, подобався його запах, однак щойно він брався за її сукню, щойно заходив надто далеко, тепло била його долонею по руці, ніжно відштовхувала, коротко й застережливо озивалась, і Маріо відкочувався назад. Але тут-таки згадував, скільки крові й вина пролито в цьому домі, скільки пороху й золотого піску спущено в каналізацію, скільки смертей та образ пам'ятають ці стіни, і знову торкався її обличчя, ловив її долоні, позбавляв її одягу. Настя сміялася й опиралась, щось йому говорила, він навіть щось відповідав, не завжди дослуховуючись до її запитань. Якоїсь миті вона навіть пошкодувала, що зняла свої брекети, такий він був нестримний, цей її старший брат з усіма своїми страхами та довірою. Вона хапалася за його коротко стрижене світле волосся, відводила його голову, дивилась йому в очі. Тоді він знову прибирав її руку й щось їй наговорював, аби відволікти увагу й підібратись поближче. І вона знову дозоляла йому майже все, не зупиняючи його, ніби чекала на якийсь сигнал. А коли цей чутний лише для неї сигнал лунав, тут-таки упиралася ліктями в килим, вигиналася всім своїм тілом, вислизала з його обіймів, зісковзуючи в темряву. Маріо віддихувався, заспокоювався і знову брався за справу. Тривало так кілька годин. Доки в неї не скінчилось терпіння. Після цього він хапливо поклав її на килим, китайський і синтетичний, а вона й не опиралась.", "Що я йому скажу і як я подивлюся йому в очі? Він зрозуміє все, щойно мене побачить. Мені навіть не доведеться ні в чому зізнаватись. Він вирве мені горлянку, думав Маріо. Або переламає мені ноги. Спочатку одну, потім другу. Буде топтатись мені по ребрах, зніме з мене скальп, осліпить мене й відпустить на вулицю жебракувати. Я буду сидіти на теплому асфальті з паперовим стаканом із Макдональдса, збиратиму копійки, але навіть їх він буде в мене відбирати, зсипаючи собі до глибоких кишень. Але перед тим розповість усе сестрам — Зіні й мамі. І вони довершать те, чого не посміє зробити він: позбавлять мене чоловічої гідності. У прямому сенсі. Відріжуть мені гідність садовими ножицями. Що загалом на це може сказати мама? Що вона говорить у таких випадках? Маріо думав, але в голову нічого не приходило. Та й випадків таких він не пригадував. Мама, очевидно, стане на бік племінниці, буде її заспокоювати, буде втішати. Сидітимуть разом на Колиних килимах і вигадуватимуть, що з ним, Маріо, зробити в першу чергу — повісити в коридорі чи все ж четвертувати на кухні. Що ж, погоджувався Маріо, я сам у всьому винен, я сам усе це затіяв, ніхто не змушував мене пити з нею на килимах, ніхто не змушував мене слухати її історії, ніхто не змушував мене зрештою в неї кінчати. У руках Маріо тримав торбинку зі сніданком, погляд мав змучений, на шиї — кілька свіжих подряпин."], ["Коля зустрів його похмуро. Кивнув головою, мовчки забрав сніданок. Підозріло оглянув приготовану Настею рибу, недовірливо принюхався до зелені.", "— Риба? — здивувався. — Вона ж знає, що мені не можна.", "У палаті щось сталося, сусідів Коля, схоже, запресував: інтелігент відразу приніс їм із Маріо два пакетики чаю, роботяга передав кип'ятильник, пацан із навушниками принижено відвернувся до стіни. Коля сидів на ліжку й дивився кудись за спину Маріо — так що й погляд перехопити було не можна, й очей відвести несила.", "— Діти, Марічек, — сказав Коля з притиском, — не завжди народжуються в любові. Іноді вони народжуються випадково й незаплановано. Тоді життя їхнє наповнюється пригодами й випробуваннями. Переважно випробуваннями.", "Про що він говорить? — запанікував Маріо. Невже про все здогадався? Чому досі не топчеться мені по ребрах?", "— Що ти якийсь сонний? — подивився на нього Коля.", "— Не спав, — пояснив Маріо.", "— Ну, ясно, що не спав, якщо сонний, — погодився Коля. — А чого не спав?", "— Робота.", "— Робота, — повторив Коля. — Робота. Добре, коли робота є. Погано, коли її немає.", "Про що він? — Маріо відчув, що пітніє. — На що натякає? — Щойно Коля нахилився до пакета з їжею, Маріо швидким рухом витер піт, який зрадницьки стікав обличчям. Втім, Коля блискавично підняв голову. Усе побачив. Маріо відчув, як кров приступила йому до горла, потім ще вище. Сидів перед темним і важким Колею, стікаючи потом і заливаючись барвою, сидів і не знав, куди подіти руки, як приховати подряпини на шиї. Коля, не відриваючи від нього погляду, мовчки шарив рукою в пакеті. Дістав звідти смажену рибину. Не дивлячись на неї, почав гризти. Соус застиг йому в куточках губ, зелень налипла на підборіддя, очі зовсім запливли, обличчя набрякло. Йому ж не можна, подумав Маріо. І мені, мабуть, теж не можна.", "— Що там мама? — запитав Коля, жуючи. Жував повільно й старанно, як підпільники жують записники з шифрами, аби не дати ворогу жодного шансу.", "— Нормально, — неохоче відповів Маріо, уже переконаний, що його викрито й засуджено.", "— Нормально? — не повірив Коля, продовжуючи терзати рибу жовтими різцями. — Скажи, хай набере мене.", "Маріо кивнув.", "— У нашій родині жінки завжди добре готували рибу, — сказав Коля, прискіпливо дивлячись племіннику в очі. Говорив тихо, проте Маріо не сумнівався, що в палаті його чують усі. Навіть пацан із навушниками. — Риба вимагає часу. У нашій родині жінки завжди мали час. На них ніхто не тиснув. Я не тиснув. І тобі не раджу.", "— Я теж не тиснув, — сказав Маріо про щось своє.", "— Не тиснув?", "— Ні.", "— Це добре, — Коля кинув рештки риби назад до торбини, дав потримати її Маріо, дістав із-під подушки рушника, старанно обтер обличчя. Забрав у Маріо торбину, закинув її під ковдру. — Тиснути не треба, — продовжив. — І неправду казати теж не треба.", "— Я піду, — відповів Маріо, — у мене робота.", "Настя чекала його, сидячи босоніж на сходах. Коли він підійшов, підвелася, розвернулась і зникла за дверима. Маріо поспішив слідом.", "Уночі вона прокинулась, легко, аби не розбудити, прибрала його руку, піднялась, не одягаючись, відчинила свою валізу, що стояла тут-таки, на підлозі в Колиній спальні. Знайшла якісь таблетки, запила їх вином. Маріо прокинувся, торкнувся її шкіри. Настя здригнулась, швидко заспокоїлась, повернулась до нього. Він ліг підборіддям їй на коліна, лежав на животі, розглядав її валізу, торкався різних її речей. Усе залежить від нас, думав, усе залежить від нашого бажання. Тепер нічого не зміниш, далі буде лише так. Він діставав книги, гортав їх. Були це підручники з хімії та детективи. У детективах зазвичай використовувались отрути, по-своєму це теж були підручники з хімії. Діставав її одяг, відчував, який він жорсткий на дотик. Настя мовчала й не заперечувала. Потім дістав іконку. На ній була зображена свята. З темним обличчям і в яскравому одязі.", "— Хто це? — запитав Маріо.", "— Свята Capa, — пояснила Настя.", "— Шо за ім'я таке? — здивувався він. — Єврейка?", "— Єгиптянка, — відповіла йому Настя з темряви. — Була така свята. Врятувала човен із важливими особами.", "— Ну, і для чого вона тобі?", "— Мені її в таборі подарували. Колись давно, у дитинстві, мама відправила мене в католицький табір.", "— Для чого? — не зрозумів Маріо.", "— Ну, треба ж було мене кудись на літо відправляти? Лишати мене на літо в порту вона не наважилась — боялася, що втечу. Грошей на нормальний табір у нас не було, ось мама й відправила мене до католиків. А Capy мені подарували на згадку. Там ще напис є, бачиш?", "— І що там написано?", "— Ну, якщо опустити всі згадки про Ісуса й церковне керівництво, там написано, що найбільша небезпека ховається в ріках. Але й найнадійніший захист також. Тому що ріки відділяють своїх від чужих, відмежовують світло від темряви й захищають нас від загроз та несподіванок. Потрібно всього лише триматися берега й уміти надати першу допомогу на воді. Ти вмієш плавати?", "— Погано. — Маріо навіть не захотів згадувати, як вони з Колею вночі витягали сітями рибу з водосховища і як він, Маріо, звалився в чорну пройму води, і Коля мусив виловлювати його, а потому відпоювати спиртом, проклинаючи, на чому світ стоїть.", "— А я підпрацьовувала на рятувальній станції, — підтримала його Настя. — Надавала першу медичну допомогу.", "— Кому? — не зрозумів Маріо.", "— Тим, кого рятувала, — пояснила Настя.", "Зранку вона залатала йому передерті на колінах джинси, нагодувала сніданком, змастила якимось розчином подряпини — старі й зовсім свіжі, отримані цієї ночі. Боляче? — запитала. Нормально, — відповів Маріо, відчуваючи, як у шкіру входить вогонь. Ладно-ладно, — не повірила Настя, — не треба казати неправду."], ["Коля помітив його ще з вікна. Визирав зі свого третього поверху, мовби спеціально на нього очікуючи. Маріо зібрався з думками, зайшов до лікарні. У коридорі зіткнувся з цікавим пацієнтом — той стояв при дверях, щось напружено й нервово обмірковуючи, так, наче від когось утік, проте забув, від кого саме. Об нього чіплялись студенти-практиканти, на нього наштовхувались літні відвідувачки, його недовірливо оминали хворі в потріпаних халатах. В одній руці тримав білий піджак, в другій — великий паперовий пакет. Побачив Маріо, зупинив його.", "— Курити є? — спитав. Голос у нього був утомлений, але твердий.", "— Немає, — відповів Маріо.", "Постояли якийсь час, дивлячись один на одного.", "— Ладно, — сказав нарешті пацієнт, — не сси, усе буде добре.", "Маріо подякував.", "У палаті знову щось сталося: пацан із навушниками зник, лише ліжко по ньому стояло неприбране, а інтелігент похапцем кидав свої речі до чорних пакетів, нікого не слухаючи й ні з ким не заговорюючи. Коля озирав його зі зневагою, роботяга поглядав на Колю з острахом. Маріо викладав перед Колею йогурти й молоко, але той навіть не дивився на них, відразу ж почав розпитувати, що там у місті, які новини, як мама, як робота. Питав, чи не тисне шеф, чи не хоче Маріо звільнитись, а якщо хоче, то чим думає зайнятись. А якщо не хоче, то чому? Бо думати про такі речі, говорив Коля, потрібно завжди: життя — штука виснажлива, потрібно підтримувати один одного, особливо якщо ми одна сім'я. У нашій сім'ї, цідив Коля, чоловіки завжди були в одному бізнесі. Ніхто б навіть подумати не міг кидати один одного, ти розумієш, Марічек? Про Настю не питав, але Маріо відчував, що саме про неї він запитати й хоче. Ну, хоче, і добре, — так собі подумав Маріо й вирішив не боятись. Нічого він мені не зробить, вирішив, побоїться. Коля розпитував, дивлячись племіннику просто в очі, і Маріо не витримав: піймав його погляд і вже не відводив очей, оглядаючи Колю з усією своєю ненавистю й злістю. Коля теж перехопив цей погляд і намагався його якийсь час погасити, тиснув на малого темною вагою, проте Маріо не піддавався, опирався й витримував, і Коля якоїсь миті поплив і почав дивитись кудись йому за плечі. І прикрикнув щось на роботягу, і перевів мову на антибіотики. Маріо сидів перед ним, упершись долонями в коліна, і бачив Колю таким, яким не бачив ніколи раніше — постарілим, із вижовклою, ніби старі фото, шкірою, з вигаслим поглядом, зігнутим, лихим і поламаним, несвіжим і невпевненим, хворим і голодним. Маріо думав спочатку його пожаліти. Та на хуй нада, подумав зрештою. Чим вони тебе тут лікують? — запитав. Коля подумав, зважив ситуацію, заговорив примирливо.", "— Мене нормально лікують, Марічек, — відповів спокійно. — Просто лікувати мене — це те саме, що лікувати повішеного: проблеми зі здоров'ям очевидні, а терапія мало що дає. Ти сам-то як почуваєш себе? — спитав, прискаливши око.", "— Нормально я себе почуваю, — відповів Маріо, не надто замислюючись.", "— А що за сліди на шиї? — запитав його Коля, ніби між іншим.", "— Порізався, — відповів Маріо. — Коли голився.", "— Ага, — з розумінням кивнув Коля. — Ти тепер щодня голишся? Дивись, горло переріжеш. Добре, якщо хтось зможе надати першу медичну допомогу. А якщо ні?", "Коля знову дивився на нього холодними вовчими очима. Маріо підвівся, сухо попрощався, пообіцяв передати всім привіт. Стоячи на перехресті, відчував на собі Колин погляд.", "— Що він може знати про бізнес? — скаржився Маріо ввечері, сидячи в Колиній ванні. — Він навіть кіоск новий відкрити не може.", "Настя сиділа на краю ванни в тренувальних шортах і тісному топі, тримала в руках сухі рушники, посміхалась, слухаючи брата.", "— Все він може, — не погоджувалась. — Просто його кинули.", "— Просто він нічого не вміє, — не погоджувався своєю чергою Маріо. — Він навіть у карти грати не вміє.", "— В карти всі вміють грати, — заперечила Настя. — Навіть я.", "— Та ладно, — скептично відгукнувся Маріо.", "— Хочеш спробувати? — Настя підвелася. Кинула йому рушники й вийшла в коридор.", "Маріо обмотався рушником, пішов, лишаючи мокрі сліди. Настя сиділа з картами на килимі. Ну, тут уже я знаю, що робити, подумав Маріо, згадуючи, як недоладно поводився в грі Коля. Ну, давай, сказав Насті з усмішкою.", "Тричі програв. Розлютився. Програв ще раз. Порвав колоду, вийшов на кухню. Настя перечекала й вийшла слідом.", "— Ну, Марік, — сказала заспокійливо, — не злись. Все одно в тебе не було шансів. Просто я знаю всі ці фокуси. Я в циркову студію ходила.", "— Серйозно? — повернувся до неї Маріо. Подумав, що циркова студія — достатня підстава, аби прийняти поразку.", "— Так, — запевнила його Настя. — Морські карти я, до речі, теж умію читати. Як свята Capa.", "Лежачи поруч із нею і в темряві пізнаючи її рухи, Маріо думав, що мама його спить так само — розкидавши одяг довкола ліжка, накрутивши будильник до холодного дзвону, забувши про все на світі, ні за чим не шкодуючи, ні про що не печалячись, лишаючи нічні гризоти всім неспокійним і невротичним. Ось таким, як Маріо. Маріо перебирав у голові всі слова, що почув за ці три ночі від Насті, усі її розповіді та обіцянки. Прораховував варіанти, намагався вибудувати схему захисту, знаходив несподівані аргументи на власну користь, підшуковував виважені відповіді. На ранок планети стали на свої місця — усе залежить від нас, усе контролюється нашим серцем, жодного розпачу, жодного страху, жодного виправдання."], ["Крізь сонні відлуння та ранкові повітряні потоки він відчув, що світла раптом стало більше, що неподалік з'явилося ще чиєсь дихання — глухе й вороже, і дихання цього ставало щоразу більше, аж урешті ним переповнилась і прорвалася ранкова пустка.", "— Марік! — Маріо підстрибнув, перевернувся в повітрі мов кіт, приземлився на коліна, різко скочив на ноги, боляче вдарився об будильник, що так і не спрацював, вступив до тарілки з рештками пасти, перевернув на простирадла келих із вином, зачепив Настину валізу, з якої полетіли гігієнічні прокладки, підхопив подушку, аби чимось прикритись. — Марік, сука! — Коля стояв у проймі дверей, чорно-оливковий, грізний, накачаний антибіотиками й отрутами, у зіжмаканих білих брюках, у жовтій велосипедній майці.", "Від його крику Настя також прокинулась і висунулась із-під ковдри. Пізнавши її, Коля завмер, впадаючи в шал, і кинувся вперед, лишивши на підлозі пакети з лікарняними речами. Маріо перехопив цей його рух, секунди виявилося достатньо, аби перегрупуватись, розвернутись і рвонути вперед — чорними коридорами, запиленими кімнатами в напрямку кухні, подалі від смерті. Коля перестрибнув через валізу, послизнувся на пасті, різко в'їхав у бічну стіну. Його тут-таки відкинуло в інший бік. Маріо вже босоного гупотів кухонним паркетом. Коля підвівся й побіг до загашника. За рушницею, аякже. Маріо натомість зірвав оксамитову завісу й марно намагався відчинити вікно. Коля відстав, але зрозуміло було, що це ненадовго, що зараз він його настигне й почне топтатись йому по ребрах. Маріо зробив кілька кроків назад. Позаду почулись важкі поквапливі кроки. Озирнувшись, Маріо встиг помітити, з яким спортивним завзяттям Коля дістає зі жмаканих кишень набої, нервово запихаючи їх до своєї іжевської двостволки. Маріо вистрибнув на підвіконня, ввалив коліном. Скло хруснуло, як березнева крига. Згрупувався й стрибнув уперед, лишаючи по собі криваві сліди. Нічого він мені не зробить, — біг і заспокоював сам себе, — побоїться.", "День Маріо просидів у майстерні. Лікував коліно, лежав на канапі, прислуховуючись до голосів із вулиці. Дивився на меблі, розкидані навколо, торкався старого дерева, відчував запах старості. Більшість людей, думав, яким належали ці речі, давно виїхали. Щось гнало їх із цього міста, примушувало лишати домівку, виходити за фортечні мури, перебиратися на той бік ріки й розчинятися в просторі. Що їх насправді вело? Можливо, злигодні й невдачі. Можливо, потреба розуміння. Або неспроможність жити за таких кліматичних умов, коли півроку небо обкладене хмарами й дощами, а решта півроку палить тебе чорним вогнем. Хтось зривався, аби знайти спокій. Хтось хотів спокою позбутись. Когось кликав голос віри. Хтось ішов, ві
