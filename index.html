<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>«Месопотамія»: дев'ять історій</title>
<script src="config.js"></script>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: одна колонка для телефона, липка шапка зверху, скляна панель вкладок знизу; текст читається колонкою 66ch. */
:root{
  --bg:#ffffff; --surface:#faf8fc; --surface-2:#f1ecf7; --line:#e5e0ee; --text:#1e1b26;
  --muted:#6a6377; --lime:#99cc00; --lime-soft:#eef7d4; --violet:#9d6bdb; --violet-ink:#6b3fb0; --violet-soft:#efe6fb;
  --yellow:#f7c915; --yellow-soft:#fdf3c9; --right:#3f7a16; --right-soft:#e6f2da; --wrong:#c13f2c; --wrong-soft:#fbe3df;
  --on-lime:#1e1b26; --glass:rgba(255,255,255,.82); --shadow:0 10px 30px -18px rgba(40,20,70,.35);
  --f-display:'Unbounded','Rubik',system-ui,sans-serif; --f-text:'Manrope','PT Sans','Fira Sans',system-ui,sans-serif; --f-mono:'JetBrains Mono','PT Mono',ui-monospace,monospace;
  --r:18px; --r-sm:12px; --read:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12101a; --surface:#1b1826; --surface-2:#231f31; --line:#332d44; --text:#f4f1f9;
  --muted:#a39bb3; --lime-soft:#26301a; --violet-ink:#c4a3f0; --violet-soft:#2b2240; --yellow-soft:#3a3218;
  --right:#a5d914; --right-soft:#1f2c16; --wrong:#ff7a5e; --wrong-soft:#3a1d19; --glass:rgba(27,24,38,.85); --shadow:0 10px 30px -18px rgba(0,0,0,.7);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12101a; --surface:#1b1826; --surface-2:#231f31; --line:#332d44; --text:#f4f1f9;
  --muted:#a39bb3; --lime-soft:#26301a; --violet-ink:#c4a3f0; --violet-soft:#2b2240; --yellow-soft:#3a3218;
  --right:#a5d914; --right-soft:#1f2c16; --wrong:#ff7a5e; --wrong-soft:#3a1d19; --glass:rgba(27,24,38,.85); --shadow:0 10px 30px -18px rgba(0,0,0,.7);
  color-scheme:dark; }
:root.big{ --read:21px; }

*{ box-sizing:border-box; }
html{ scroll-padding-top:calc(76px + env(safe-area-inset-top,0px)); }
body{ background:var(--bg); color:var(--text); font-family:var(--f-text); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; }
h1,h2,h3{ font-family:var(--f-display); line-height:1.12; letter-spacing:-.01em; text-wrap:balance; margin:0; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--violet); outline-offset:2px; }
.mono{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; }

/* шапка */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
.top-in{ max-width:760px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; }
.top .logo{ width:132px; height:auto; display:block; }
.top .sp{ flex:1; }
.pill{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:700; }
.ring{ --p:0; width:26px; height:26px; border-radius:50%; background:conic-gradient(var(--lime) calc(var(--p)*1%), var(--line) 0); display:grid; place-items:center; flex:none; }
.ring::after{ content:""; width:18px; height:18px; border-radius:50%; background:var(--bg); }
.iconbtn{ border:1px solid var(--line); background:var(--bg); border-radius:999px; height:36px; min-width:36px; padding:0 12px; font-weight:700; font-size:14px; }
.rbar{ height:3px; background:transparent; }
.rbar i{ display:block; height:100%; width:0; background:var(--lime); transition:width .15s; }

main{ max-width:760px; margin:0 auto; padding-inline:16px; padding-block:18px calc(110px + env(safe-area-inset-bottom,0px)); position:relative; }
.view{ display:grid; gap:18px; }

/* hero */
.hero{ position:relative; overflow:hidden; border-radius:24px; background:var(--surface); border:1px solid var(--line); padding:26px 20px 22px; display:grid; gap:14px; }
.hero .mark{ position:absolute; pointer-events:none; user-select:none; opacity:.1; z-index:0; }
.hero .m1{ width:62%; right:-26%; top:-14%; }
.hero .m2{ width:52%; left:-24%; bottom:-22%; opacity:.08; }
.hero > :not(.mark){ position:relative; z-index:1; }
.eyebrow{ font-family:var(--f-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--violet-ink); }
.hero h1{ font-size:clamp(56px,19vw,104px); font-weight:800; letter-spacing:-.03em; line-height:.95; }
.hero h1 span{ background:linear-gradient(transparent 58%, var(--lime) 58% 88%, transparent 88%); padding:0 .06em; }
.hero .sub{ font-family:var(--f-display); font-weight:500; font-size:15px; color:var(--muted); }
.lede{ max-width:60ch; margin:0; }
.field{ display:grid; gap:6px; }
.field label{ font-weight:700; font-size:14px; }
.in{ width:100%; border:1.5px solid var(--line); background:var(--bg); border-radius:var(--r-sm); padding:12px 14px; font-size:16px; }
.in:focus{ border-color:var(--violet); outline:none; }
textarea.in{ min-height:150px; resize:vertical; line-height:1.55; }

.btn{ border:0; border-radius:14px; padding:13px 18px; font-weight:800; font-size:15px; background:var(--lime); color:var(--on-lime); display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn.ghost{ background:transparent; border:1.5px solid var(--line); color:var(--text); }
.btn.violet{ background:var(--violet); color:#fff; }
.btn.sm{ padding:9px 14px; font-size:14px; border-radius:12px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

/* картки оцінок */
.scores{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.score{ border:1px solid var(--line); background:var(--bg); border-radius:var(--r); padding:14px 12px; display:grid; gap:6px; }
.score .n{ font-family:var(--f-display); font-weight:800; font-size:26px; line-height:1; }
.score .l{ font-size:12px; color:var(--muted); line-height:1.3; }
.score .bar{ height:6px; border-radius:6px; background:var(--line); overflow:hidden; }
.scores.two{ grid-template-columns:repeat(2,minmax(0,1fr)); margin-top:10px; }
#topPct{ white-space:nowrap; font-size:12px; }
.sgrid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.score.sc{ text-align:left; font:inherit; color:inherit; cursor:pointer; padding:10px; gap:5px; }
.score.sc .n{ font-size:22px; } .score.sc b{ color:var(--text); font-size:12.5px; }
.story-h .pct{ font-family:var(--f-display); font-weight:800; font-size:22px; color:var(--text); line-height:1; text-align:right; }
.story-h .pct small{ display:block; font-family:var(--f-mono,monospace); font-weight:500; font-size:11.5px; color:var(--muted); margin-top:3px; }
.score .bar i{ display:block; height:100%; background:var(--c,var(--lime)); }
@media (max-width:420px){ .score .n{ font-size:21px; } }

.sec-h{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.sec-h h2{ font-size:20px; }
.sec-h .mono{ font-size:12px; color:var(--muted); }

/* список частин */
.plist{ display:grid; gap:8px; }
.pitem{ display:grid; grid-template-columns:42px minmax(0,1fr) auto; align-items:center; gap:12px; border:1px solid var(--line); background:var(--bg); border-radius:16px; padding:10px 12px; text-align:left; width:100%; }
.pitem .num{ width:42px; height:42px; border-radius:12px; background:var(--surface-2); display:grid; place-items:center; font-family:var(--f-display); font-weight:800; }
.pitem.done .num{ background:var(--lime); color:var(--on-lime); }
.pitem b{ display:block; font-size:15px; }
.pitem small{ color:var(--muted); font-size:12.5px; }
.pitem .cnt{ font-family:var(--f-mono); font-size:13px; color:var(--muted); }

/* вкладки частин */
.chips{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; margin-inline:-16px; padding-inline:16px; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ flex:none; border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:8px 12px; font-size:13px; font-weight:700; display:inline-flex; gap:7px; align-items:center; white-space:nowrap; }
.chip .d{ width:20px; height:20px; border-radius:50%; background:var(--surface-2); display:grid; place-items:center; font-family:var(--f-mono); font-size:11px; }
.chip.on{ background:var(--text); color:var(--bg); border-color:var(--text); }
.chip.on .d{ background:var(--lime); color:var(--on-lime); }
.chip.done .d{ background:var(--lime); color:var(--on-lime); }

.phead{ display:grid; gap:8px; }
.phead h2{ font-size:clamp(26px,7vw,38px); font-weight:800; }
.tags{ display:flex; gap:6px; flex-wrap:wrap; }
.tag{ font-size:12px; font-weight:700; border-radius:999px; padding:4px 10px; background:var(--violet-soft); color:var(--violet-ink); }
.tag.y{ background:var(--yellow-soft); color:var(--text); }
.tag.g{ background:var(--lime-soft); color:var(--text); }

.reading{ font-size:var(--read); line-height:1.75; max-width:66ch; }
.reading p{ margin:0 0 1em; hyphens:auto; }
.reading p.dlg{ padding-left:.9em; border-left:3px solid var(--line); }
.reading p:first-child::first-letter{ font-family:var(--f-display); font-weight:800; font-size:3.1em; float:left; line-height:.85; padding:.06em .1em 0 0; color:var(--violet); }

/* завдання */
.qhead{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:6px; border-top:2px dashed var(--line); padding-top:22px; }
.qhead h3{ font-size:20px; }
.q{ border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:16px; display:grid; gap:12px; }
.q.ok{ border-color:var(--right); }
.q.bad{ border-color:var(--wrong); }
.q .top2{ display:flex; gap:10px; align-items:flex-start; }
.q .no{ flex:none; font-family:var(--f-mono); font-weight:600; font-size:12px; background:var(--text); color:var(--bg); border-radius:8px; padding:3px 7px; }
.q.ok .no{ background:var(--right); color:var(--bg); }
.q.bad .no{ background:var(--wrong); color:var(--bg); }
.q .kind{ font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.q .txt{ font-weight:700; font-size:16px; line-height:1.45; }
.opts{ display:grid; gap:8px; }
.opts.two{ grid-template-columns:1fr 1fr; }
.opt{ text-align:left; border:1.5px solid var(--line); background:var(--bg); border-radius:var(--r-sm); padding:11px 12px; display:flex; gap:10px; align-items:flex-start; font-size:15px; line-height:1.4; }
.opt .bx{ flex:none; width:20px; height:20px; margin-top:1px; border:2px solid var(--line); border-radius:6px; display:grid; place-items:center; font-size:12px; font-weight:800; }
.opt.r .bx{ border-radius:50%; }
.opt.sel{ border-color:var(--violet); background:var(--violet-soft); }
.opt.sel .bx{ border-color:var(--violet); background:var(--violet); color:#fff; }
.opt.good{ border-color:var(--right); background:var(--right-soft); }
.opt.good .bx{ border-color:var(--right); background:var(--right); color:var(--bg); }
.opt.miss{ border-color:var(--wrong); background:var(--wrong-soft); }
.opt.miss .bx{ border-color:var(--wrong); background:var(--wrong); color:var(--bg); }
.opt:disabled{ cursor:default; }
.mrow{ display:grid; gap:6px; }
.mrow .ml{ font-weight:700; font-size:14px; }
select.in{ appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%; background-size:5px 5px; background-repeat:no-repeat; padding-right:34px; font-size:15px; }
select.in.good{ border-color:var(--right); } select.in.miss{ border-color:var(--wrong); }
.ord{ display:grid; gap:6px; }
.oi{ display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:8px; align-items:center; border:1.5px solid var(--line); background:var(--bg); border-radius:var(--r-sm); padding:8px 8px 8px 10px; font-size:15px; line-height:1.35; }
.oi .k{ font-family:var(--f-mono); font-weight:700; color:var(--violet-ink); }
.oi.good{ border-color:var(--right); } .oi.miss{ border-color:var(--wrong); }
.oi .ar{ display:flex; gap:4px; }
.oi .ar button{ width:36px; height:36px; border:1px solid var(--line); background:var(--surface); border-radius:10px; font-size:14px; }
.oi .ar button:disabled{ opacity:.3; }
.fb{ border-radius:var(--r-sm); padding:11px 13px; font-size:14.5px; line-height:1.5; }
.fb.ok{ background:var(--right-soft); } .fb.bad{ background:var(--wrong-soft); }
.fb b{ display:block; margin-bottom:2px; }
.fb .ca{ margin-top:6px; font-size:14px; }
.pager{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* гра */
.game{ display:grid; gap:14px; }
.deck{ position:relative; height:250px; display:grid; place-items:center; }
.card{ position:absolute; inset:0; margin:auto; width:min(100%,420px); height:230px; border-radius:24px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); display:grid; align-content:center; gap:12px; padding:22px; text-align:center; touch-action:pan-y; user-select:none; transition:transform .25s ease, opacity .25s ease; }
.card.back{ transform:translateY(10px) scale(.95); opacity:.6; }
.card .ct{ font-family:var(--f-display); font-weight:700; font-size:clamp(18px,5vw,22px); line-height:1.25; }
.card .cn{ font-family:var(--f-mono); font-size:12px; color:var(--muted); }
.card.fly-l{ transform:translateX(-120%) rotate(-12deg); opacity:0; }
.card.fly-r{ transform:translateX(120%) rotate(12deg); opacity:0; }
.gbtns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.gbtn{ border-radius:18px; padding:14px 10px; font-weight:800; font-size:14px; line-height:1.25; border:2px solid; background:var(--bg); display:grid; gap:2px; }
.gbtn.old{ border-color:var(--violet); color:var(--violet-ink); }
.gbtn.now{ border-color:var(--lime); }
.gbtn small{ font-weight:600; color:var(--muted); font-size:11.5px; }
.flash{ min-height:48px; text-align:center; font-weight:700; font-size:14px; }
.flash.ok{ color:var(--right); } .flash.bad{ color:var(--wrong); }
.dots{ display:flex; gap:4px; justify-content:center; flex-wrap:wrap; }
.dots i{ width:9px; height:9px; border-radius:50%; background:var(--line); }
.dots i.ok{ background:var(--right); } .dots i.bad{ background:var(--wrong); }
.big-n{ font-family:var(--f-display); font-weight:800; font-size:64px; line-height:1; }

.note{ border-radius:var(--r); background:var(--yellow-soft); padding:14px 16px; font-size:14.5px; }
.panel{ border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:16px; display:grid; gap:12px; }
.oq .cnt{ font-family:var(--f-mono); font-size:12px; color:var(--muted); text-align:right; }
.oq .cnt.ok{ color:var(--right); }
.table{ width:100%; border-collapse:collapse; font-size:14px; }
.table td{ padding:8px 4px; border-bottom:1px solid var(--line); }
.table td:last-child{ text-align:right; font-family:var(--f-mono); }
.confirm{ border:1.5px solid var(--wrong); background:var(--wrong-soft); border-radius:var(--r); padding:14px; display:grid; gap:10px; }

/* панель вкладок */
.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:30; padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px)); background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); }
.tabs-in{ max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr); gap:2px; }
.tab{ border:0; background:transparent; border-radius:14px; padding:6px 2px; display:grid; justify-items:center; gap:2px; font-size:10.5px; font-weight:700; color:var(--muted); min-width:0; }
.tab svg{ width:22px; height:22px; }
.tab.on{ color:var(--text); background:var(--lime-soft); }
.tab.on svg{ color:var(--text); }

.two-col{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
textarea.in.small{ min-height:72px; font-size:15px; }
.pick{ display:grid; gap:10px; border:1px dashed var(--line); border-radius:var(--r); padding:12px; background:var(--bg); }
.pick-out{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.pick-name{ font-family:var(--f-display); font-weight:800; font-size:clamp(22px,7vw,32px); line-height:1.1; }
.cn{ font-family:var(--f-mono); font-size:12px; color:var(--muted); }
.timer{ display:grid; gap:8px; }
.tbar{ height:10px; border-radius:10px; background:var(--line); overflow:hidden; }
.tbar i{ display:block; height:100%; background:var(--violet); transition:width .5s linear; }
.no2{ flex:none; width:34px; height:34px; border-radius:10px; background:var(--lime); color:var(--on-lime); display:grid; place-items:center; font-family:var(--f-display); font-weight:800; }
.mode{ border-radius:var(--r-sm); padding:10px 12px; background:var(--bg); border:1px solid var(--line); }
.mode.onl{ border-color:var(--violet); background:var(--violet-soft); }
.mode b{ font-size:12px; font-family:var(--f-mono); text-transform:uppercase; letter-spacing:.06em; }
.mode p{ margin:4px 0 0; font-size:15px; line-height:1.5; }
.tip{ margin:0; font-size:13.5px; color:var(--muted); }
.ws{ display:grid; gap:10px; border-top:1px dashed var(--line); padding-top:12px; }
.ws-q{ font-family:var(--f-display); font-weight:700; font-size:clamp(17px,5vw,21px); line-height:1.3; }
.ws-a{ font-weight:800; color:var(--right); }
.story{ display:grid; gap:8px; }
.story-h{ display:flex; justify-content:space-between; align-items:flex-end; gap:10px; padding-top:6px; }
.story-h h3{ font-size:19px; } .story-h small{ color:var(--muted); font-size:13px; }
.story-h .mono{ font-size:13px; color:var(--muted); }
.chips.stories{ padding-bottom:0; }
.chips.stories .chip{ font-family:var(--f-display); font-weight:700; }
.foot{ text-align:center; padding:28px 0 6px; font-family:var(--f-mono); font-size:12px; color:var(--muted); letter-spacing:.04em; }
.foot b{ color:var(--text); font-weight:600; }
.toast{ position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:14px; font-weight:700; z-index:40; }
@media (prefers-reduced-motion: reduce){ *{ transition:none!important; } }
</style>

const PARTS = [["За ті сорок днів, відколи помер Марат, до міста прийшла весна. І майже встигла минути. Ховали його в поминальний вівторок, на початку квітня, а нині пагорби заросли травою, зеленою й пекучою: надходило літо. За сорок днів ми встигли все забути й заспокоїтись. Але ось Маратові батьки зателефонували й нагадали. І я подумав: так, справді, лише сорок днів. Померлі не мають до нас претензій, живі вміють нас напружити.", "Ховали його кілька друзів і сусіди. Більшість знайомих — а знайомих Марат мав у місті цілі натовпи — так і не повірили, що їх справді запрошують на його похорон. Потім, звісно, вибачалися, приїжджали на цвинтар, шукали надгробок. Квітень був дощовий, за автобусом із домовиною бігли вуличні пси, ніби почесна сторожа, час від часу кидаючись на чорні колеса похоронного фольксваґена, не бажаючи відпускати Марата до царства мертвих. Цвинтарем ходили урочисті натовпи, вибиралися на пагорби, де над ними висли низькі хмари, спускалися в долину, залиту зливою, святкували як могли, мішаючи алкоголь із дощовою водою. Ми чи не єдині приїхали на цвинтар із небіжчиком і виглядали доволі неприродно — так, наче прийшли в музичний магазин зі своїм піаніно. Великдень усе змішав, роблячи нашу скорботу дещо недоречною. На Великдень ніхто не помирає. Нормальні люди в цей час, навпаки, встають із могил.", "Смерть Марата виявилася подібною до його життя — нелогічною й сповненою таємниць. Була ніч із суботи на неділю. До церкви Марат не пішов, оскільки вважав себе мусульманином, до того ж невіруючим, натомість посеред ночі вибрався в кіоск за сигаретами. У домашніх капцях і з купюрою, затиснутою в кулаку. Там його й підстрелили. Ніхто нічого не бачив, усі були по церквах. Нічна продавчиня з кіоску сказала, що нічого не чула, хоча їй здалося, ніби хтось співав і лунав рев моторів, проте вона не впевнена, але в разі чого могла б упізнати голоси; втім, точно сказати, були вони чоловічі чи жіночі, не може, а все ж устигла записати номери на жигулях, однак виявилося, що жигулі ці стоять на узбіччі під студентською поліклінікою вже другий рік і в них двірники складають порожні пляшки та знайдений на смітниках картон. Ну ось, говорили ми один одному, дев'яності повертаються, хто наступний?", "Незрозуміло було також, за що його розстріляли. Бізнес Марат не вів, із владою не перетинався, ворогів у нього не було, щоправда, деяких друзів він не впізнавав в обличчя, але хіба це привід влаштовувати стрілянину? На вулицях не стріляли вже років десять, хіба що в інкасаторів, та це за великим рахунком до уваги не береться: багато серед ваших знайомих інкасаторів? Ми лише гадали, що сталося насправді."], ["Минуло сорок днів, час рухався вперед, ріки встигли вийти з берегів і повернутися назад. Починалися теплі дні. Я не хотів іти, навіть вирішив передзвонити, вибачитися, відмовитися. Потім подумав: яка різниця? Все одно буду цілий вечір про це думати, краще вже в компанії друзів, близьких та родичів. Втрачати голову розумніше в перевірених місцях. Вийшов із дому, оминув свою школу, зупинився коло кіосків, довго вибирав сигарети, так і не вибрав, подумав, може, все-таки повернутися, і рушив далі. Збіг крутим спуском уздовж корпусів інституту, пригальмував уже на Маратовій вулиці. Стояла тиша. Під будинком, у пообідній тіні, прогрівалися сонні псячі тіла. Відчувши мою появу, головний підняв голову, ковзнув по мені темним уважним поглядом, опустив голову на асфальт, втомлено заплющив очі. Нічого не сталося. Нічого не змінилось.", "Марат жив лише за кілька кварталів від мене, ближче до ріки. Три хвилини пішки. Тут узагалі все було під боком: пологовий будинок, дитячий садок, музична школа, військкомат, магазини, аптеки, лікарні, цвинтарі. Можна було прожити життя, не виходячи до найближчої станції метро. Ми так і чинили. Жили в старих кварталах, що зависли над рікою, виростали в перебудованих і переділених помешканнях, вибігали зранку з вогких під'їздів, поверталися ввечері під ненадійні діряві дахи, які годі було до кінця залатати. Згори нам бачилося ціле місто, на подвір'ях ми відчували, що під нами лежать камені, на яких усе й будувалося. Влітку вони нагрівалися — і нам ставало тепло, взимку вони промерзали — й у нас починалася застуда.", "Подвір'я їхнє виходило на тубдиспансер, поруч тяглася дорога, збігаючи до старих складських приміщень. З одного боку, внизу, за дахами — набережна й міст, чорні заводські корпуси, новобудови, непролазний харківський приватний сектор. З іншого, вгорі — центральні вулиці, церкви й торгівля. Я пройшов брамою, відчуваючи все, з чим жив стільки років: пил, глина й піски, крізь які навіть трава не могла пробитися. Подвір'я вимощене було битою цеглою та камінням — Марат в останні роки погрожував залити все асфальтом, проте щось йому заважало, тож усе лишалось, як раніше: два древні, ще дореволюційної забудови двоповерхові будинки, напівпорожні й давно не ремонтовані, посеред двору — клумби й палісадники, за ними яблуні й чорна цегляна стіна будівлі, що виходила вже на сусіднє подвір'я. Родина винесла столи, повитягала з квартири стільці, сусіди приходили зі своїми табуретами, про всяк випадок, аби не лишитись без місця. Над столами світилися яблуні, білий цвіт падав у салати, додаючи їм смаку та гіркоти.", "Я привітався. У відповідь мені закивали, одна із сусідок дістала з-під себе зайвий табурет, я втиснувся поміж двох теплих травневих жіночих тіл. Хтось почав одразу ж щедро накладати щось до тарілки, хтось наливав, я роззирнувся, розглядаючи й упізнаючи. Наші всі були тут: навпроти мене сидів Беня, сивий і коротко стрижений, підбадьорливо кивнув мені й повернувся до загальної розмови. Говорили, наскільки я міг зрозуміти, про погоду. Нейтральна тема, чому б ні. Принаймні голосити ніхто не буде. Костик сидів з іншого краю, здалеку махнув мені рукою, не відриваючись від їжі. Яблуневі пелюстки падали на його білу сорочку, розчиняючись у ній, як сніг у зимовій ріці. Збоку до нього притулилася сухенька сусідка, котра жила якраз над Маратом і котру тепер Костик просто витискав зі стільця своїми крутими боками. Сем стояв віддалік, під деревами. Разом із Рустамом — Маратовим братом. Той нервово ходив битою цеглою в гумових капцях і новому тренувальному костюмі й говорив із кимось по телефону, іноді щось у Сема перепитуючи. Сем теж був у тренувальному костюмі, під яблунями вони схожі були на двох марафонців, що збилися з маршруту й тепер видзвонювали організаторів змагань, аби розпитати, куди бігти далі. Сусідки підтримували розмову, і виглядало все так, ніби незабаром мали ввімкнути музику й почати дискотеку. Час від часу всі кликали Рустама до столу, але той суворо махав рукою, мовляв, від'їбіться, православні, і далі щось говорив пристрасно й незадоволено, а Сем кивав головою, в усьому його, схоже, підтримуючи.", "Я розглядав наших. За сорок днів, що минули, з ними мало що сталося. Втім, із ними мало що сталося за останні десять років. Хіба що зморшки щоразу гостріше прорізали Бенину фізію, роблячи його чимдалі подібнішим до Міка Джаґґера. Чорний светр, дорогі черевики — Беня з останніх сил намагався виглядати пристойно, хоча я знав краще за інших, що фірму його відтиснули й живе він за рахунок банківських вкладень, які зумів зберегти. Зрозуміло було, що надовго їх не вистачить, від чого Беня, здається, ще більше сивів. Печальні часи для чесного бізнесу, що тут скажеш. Костик натомість усе гладшав, хоча на характері його це мало позначалося: характер у нього був паскудніше нікуди, про які зміни могла йти мова? Костик був залізничником, себто сидів в управлінні південної й за щось відповідав. За що саме — підозрюю, він і сам не знав. Набирав вагу, втрачав почуття гумору. Тримався лише нас — друзів дитинства. Найбільше змінився, мабуть, Сем. Я маю на увазі його новий тренувальний костюм. Ну і все. В усьому іншому — та ж таки бойова стійка старого досвідченого бомбили, ключі від тачки, які він ніколи не випускав із рук, недовірливе ставлення до пасажирів, принципова ненависть до патрулів. Щодо мене, то я відчував, що десь там, усередині мого тіла, поміж серцем і селезінкою, зароджується й підіймається теплим згустком утома, захоплюючи все більше місця й примушуючи печально прислухатися: що ж там робиться в моїй душі, під моїм одягом, під моєю шкірою. І жодні робочі будні, жоден кар'єрний поступ нічого не важили проти цього згустку, який просто роз'їдав ізсередини всі внутрішні органи, мов запущена кимось під шкіру піранья. Свого часу я вирішив не відходити далеко від насиджених місць і влаштувався на завод, зовсім поруч, за два квартали звідси. За п'ятнадцять років навіть дослужився до власного кабінету. Втім, завод років десять як не працював, і робити кар'єру на ньому було те саме, що робити кар'єру на кораблі, який іде на дно: можна, звісно, але можливості від початку дещо обмежені. Ми здавали під офіси колишні лабораторії, здавали під склади колишні цехи, я нормально отримував, ходив у костюмі, який на мені не сидів. Як і в моїх друзів, у мене з'явилися проблеми зі сном і пробилася перша сивина. На проблеми я не скаржився, почав коротко стригтись. Вахтеркам на прохідній це навіть подобалося — вони почали мене поважати. Або жаліти. Для всіх нас, Маратових друзів, починався той вік, коли життя уповільнюється, даючи тобі значно більше часу на страх і невпевненість. Марат дотягнув до тридцяти п'яти, ми натомість мали всі шанси прожити довго й померти власною смертю. Скажімо, від маразму."], ["Дядя Алік і Рая Давидівна — батьки Марата — сиділи по різні боки столу, ніби не знали одне одного. Дядя Алік мовчав, а Рая Давидівна говорила переважно про салати, і всім думалося, що краще б вона теж мовчала. Я сидів і додавав щось від себе, згадував лише хороше, робив скорботне лице, звертаючись до мами небіжчика, відчував, як від ріки підіймається вогкість, вловима навіть тут, на старих подвір'ях, засаджених деревами й забудованих брамами, вежами та комуналками. Дядь Саша, рідний брат Маратового тата, разом із Семом протягнули від гаражів дроти з двома потужними лампами, розвісили їх на яблуневому гіллі, і жовта електрика, змішавшись із білим цвітом, накрила нас тінями. У сутінках усі зазбиралися, почали прощатися, домовлялися про наступні зустрічі, обіцяли підтримувати й не забувати, пропонували свою допомогу, просили звертатися в разі чого, зітхали, цілувалися з усіма й виходили крізь браму, повертаючись до життя.", "Першими пішли сусідки. Дві повні, поміж яких я вмостився, і третя, сухенька, притиснута Костею. Пішли, несучи в руках табурети, наче отримані на Новий рік подарунки. За ними пішов сліпий Зураб, який займався ремонтом взуття і якого сюди ніхто не запрошував. Хоча саме йому напевне поспішати не було куди: жив просто на робочому місці, у заваленій підошвами та халявами металевій будці на Революції, де зовсім не було світла, хоч він його не надто й потребував — усе одно нічого не бачив, а зі взуттям виробляв страшні речі. Отже, зазбирався й пішов. Пішла Марина, невідомо чия далека родичка з глибоким голосом і якоюсь прив'ялою зачіскою. Вона торгувала овочами в кіоску нагорі, ближче до податкової, з родичами була в добрих стосунках і за Маратом чи не єдина плакала щиро й не стримуючись. З нею пішов Марік, її син, у білому комбінезоні, перемащеному жовтою фарбою, пішов, оскільки мусив на ніч повертатися до майстерні на Дарвіна, де реставрував меблі й до ранку мав перефарбувати «під Польщу» фанерну етажерку, принесену вчора двома вірменами. Пішов Жора — аптекар-практикант, гроза цілодобових магазинів, який, закінчивши нічну зміну, щоразу рушав у рейд пивними кіосками Пушкінської, виводячи продавців із мутного ранкового сну й вимагаючи від них уваги та розуміння. Пішов, побажавши всім доброї ночі, яка на нього, поза всяким сумнівом, очікувала. За ним пішла Тамара, наша класна керівниця — виснажена, проте непереможена, взявши із собою загорнутий у бульварну пресу шматок пирога. Вона би й не йшла, проте всі вже втомилися підтримувати з нею розмову, тож просто слухали її марення, погоджуючись і не перебиваючи. Втративши інтерес до такої розмови, вона всім сухо подякувала й зникла в брамі, як примара. За нею посунули Паша Чингачгук зі своєю Маргаритою. Марат називав їх кумами, хоча дітей у них, наскільки знаю, не було. У Марата їх не було тим більше. Паша накульгував, мав травму після занять мотоспортом. У сенсі розбився колись на краденому скутері. Іноді мені здавалося, що Маргарита теж накульгує, можливо, тому, що завжди тримала Пашу попід руку й намагалася підлаштуватися під його розбовтану ходу. Так вони й пішли, як два веселі матроси, списані із суховантажа за нестійкість. Після них важко підвелися й рушили в темряву два друзяки, які росли разом із нами, хоча й були за нас молодшими, — Кошкін та Саша Цой. Кошкін плакав і наливав сам собі, оскільки днями відлітав до Філадельфії провідати татових родичів, котрі застрягли там ще в 90-ті, не відгукуючись і не відповідаючи на листи, тож тато, який регулярно ходив до синагоги, вирішив, що так не годиться, що слід відправити їхніми слідами єдиного сина й з'ясувати, що вони там, у Філадельфії, думають. Кошкін навіть купив собі ковбойського капелюха з гуцульським орнаментом, аби не сильно відрізнятися від місцевих, як він їх уявляв. Для нього це була взагалі чи не перша в житті виправа з батьківського дому, якщо не рахувати піонерських таборів, але їх справді можна було не рахувати, оскільки тато Кошкін сам працював у цих таборах, тож під час чергової зміни Кошкін-молодший почувався, як рецидивіст, що повертався на зону, де на нього чекав здавна знайомий дружній колектив наглядачів. А Саша поривався йти вже давно, оскільки мав якесь засідання поетичного гуртка в якійсь літературній кав'ярні, але признаватися не хотів, лише сидів і нервував. Був він сином корейського студента, якого занесло сюди на початку 80-х, проте з батьком не надто ладнав, жив окремо, писав духовні вірші. Мав складний характер, часто заводився з незнайомими поетами на студії, регулярно вигрібав, але не здавався. За друзяками Кошкіним та Цоєм пішла Алка-Акула, яку ми довго не відпускали, яка й сама не хотіла йти, однак мусила, оскільки робота, графік, пацієнти. Вона чи не найбільше нами всіма тішилася, згадувала те, що могла згадати, фантазувала там, де вже ніхто нічого не пам'ятав, ділилася життєвими планами, запевнила, що зав'язала з колишнім безтурботним життям, що працює нині у сфері медицини, що Марина допомогла їй улаштуватися в тубдиспансер сестрою, тож у неї тепер нове цікаве життя, єдине що — пацієнти часто мруть, а так усе гаразд. Електричне світло робило ніжними й тремкими зморшки під її очима, фарбоване в жовте волосся займалося іскрами, і коли вона схилялася над столом, аби прошепотіти комусь із нас теплі слова вдячності, її волосся потрапляло до склянок із вином, стаючи рожевим і вологим. Вона довго не знаходила собі місця, не давала нікому слова й поводилась, як на власному дні народження, вимагаючи добрих слів, радості й напоїв. Але зрештою пішла й вона. Чим ближче підходила до брами, чим глибше вступала в пітьму, тим похмурішим ставало повітря над її головою, ніби там, де закінчувалося світло, куди не добивали жовті лампи, їй доводилося дихати попелом і глиною і розмовляти з померлими, які в цій глині ховалися. Я дивився їй услід і згадав раптом, що вона насправді була першою жінкою Марата, якось так сталося. І Бениною, між іншим, теж. Ну, і Костиковою, ясна річ. Та й Семовою, якщо вже бути відвертим. А якщо вже бути зовсім відвертим — моєю також."], ["Чи не останніми пішли ще дві подружки Рустама. Пішли, тримаючись за руки — старша, Кіра, ображалася на молодшу, Олю, за те, що та знову забагато пила, а Оля ніжно поплескувала Кіру по спині, від чого шкірою Кіри бігли мурашки, лопатки аж подзенькували від холоду, а на очах виступали сльози. У нас у всіх виступали сльози, і сміх ламався на зубах, і ми раптом помітили, що всі розійшлися, лишилися тільки ми й родина, як у старі-добрі часи, коли ми збиралися в Марата на чий-небудь день народження чи інше сімейне свято, і я подумав, що всі разом ми сходилися переважно саме на свята, можливо, саме тому й тепер було дивне та незрозуміле відчуття свята, відчуття салюту, що ось-ось почнеться за сусідніми дахами, які ставали бузковими й золотими від вечірнього травневого сонця, яке вгорі ще світилося, хоча тут, над нами, повітря зовсім згасло й захололо. Ми теж почали збиратися, проте нас зупинив дядь Саша. Він спеціально припхався на сороковини звідкись із передмість, ночувати збирався в родичів, спати йому не хотілося, відпускати нас — тим більше. Так не годиться, — сказав серйозно, — так ніхто не робить. Ми не можемо, — сказав він, — просто розійтися. Треба сидіти і згадувати покійного, а то не буде йому спокою. Ці слова якось відразу повернули нас до тями, і ми навперебій заговорили, мовляв, дядь Саш, ну що за питання, ясна річ, ми нікуди не підемо, куди нам іти, хто на нас чекає? Маратові батьки лише тяжко зітхнули, проте не заперечували. Сказали тільки, що самі вже підуть, оскільки в дяді Аліка зранку нили нирки, а Рая Давидівна мала подивитися новини, так, мовби на щось очікувала, тож вони залишили нас самих, попросивши Аліну, Маратову дружину, принести нам щось із кухні. Аліна мовчки взялася до справи. Лише тепер, коли всі розійшлися, коли стало тихо й порожньо, ми згадали про неї, помітили її присутність. Лише тепер ми побачили її, хоча вона весь час була поруч — щось приносила з дому, щось відносила назад, вислуховувала плачі сусідок, записувала рецепти печеного карпа, викликала таксі для Саші з Маргаритою, цілувалася з усіма на прощання. Разом із тим була ніби сама по собі, ніби стояла осторонь, по той бік розмови, з того боку темряви. Я лише тепер помітив, що в неї інша зачіска, вона мала тепер коротке волосся, яке за звичкою намагалася прибрати з очей, одягнена була в коротку чорну сукню, чорні колготи й домашні капці. Вони всі тут ходили, як пляжники на море, у домашньому. Сукня робила її стрункою, капці робили її кроки нечутними. Обручку вона так і не зняла, інших прикрас ніколи й не носила. Волосся мала теж чорне, шкіру тьмяну, і здавалося, що ось-ось розчиниться серед ночі. Мені стало незручно за нас: ми до неї добре ставилися, попри всі історії з Маратом, ніхто з нас ніколи її не ображав, і вона, слід сказати, теж ставилася до нас із терпінням і витримкою, на які ми не завжди заслуговували. Свого часу Марат, знайомлячи нас із нею, попередив її, що ми його друзі і що ставитись до нас потрібно добре. Вона запам'ятала. Вона узагалі пам'ятала все, що говорив їй Марат. А ось ми, виходить, про неї забули. Я помітив, що решта наших теж нарешті звернули на Аліну увагу, можливо, навіть надмірну: Беня побіг із нею на кухню, несучи в руках якісь тарілки й гублячи їх дорогою, Костик кинувся прибирати зі столу порожній посуд, нещадно його згрібаючи на землю, навіть Сем потягнув Рустама під світло, доки той докрикував у слухавку щось погрозливе, щось про іпотеку. І коли всі зібралися, дядь Саша спробував узяти ситуацію під контроль.", "Він сказав нам дивну річ. Сказав, що Марат сьогодні останній вечір із нами, тому ми зобов'язані говорити про нього різні хороші речі. Інакше він так просто не піде. Ми були й не проти. І навіть кинулися навперебій згадувати якісь історії, проте нічого розумного згадати не могли, лише перебивали один одного, перекрикуючи і сварячись. Тоді дядь Саша попросив нас усіх замовкнути. Запала тиша, і я раптом побачив, як із брами до подвір'я заповзає холодний липкий туман. Він піднімався знизу, від чорного річища, яке ще не встигло по-літньому пересохнути. Мені враз стало моторошно, і моторош ця передалася іншим. Усі почали розуміти, про що нас тут попереджає дядь Саша, горбатячись за столом і присвічуючи собі мобільним, аби налити: він попереджає, що Марат десь поруч, стоїть у нас за спинами й не піде звідси, доки не почує необхідні йому слова. Не надто приємне відчуття — прислухатись, чи не дихає тобі з-за спини померлий приятель, який щось не договорив за життя і про якого ти знаєш стільки історій, що йому простіше тебе придушити, аніж сподіватися, що ти будеш тримати їх при собі. І тут хтось обережно й коротко торкнувся мого плеча. Я здригнувся й різко озирнувся назад — за спиною стояла Аліна, вибачливо усміхаючись і простягаючи мені серветки. Я теж заусміхався, схопив ці чортові серветки, вони тут-таки посипалися в мене з рук, я вилаявся й нахилився, аби зібрати їх, підіймаючись, стукнувся головою об стіл, виводячи всіх із трансу. І всі знову навперебій заговорили, а найголосніше заговорив Беня, то й слухати почали його. Аліна так і завмерла позад мене, стояла й слухала. Беню це помітно напружувало, зрозуміло було, як старанно й дбайливо він добирає слова, аби не образити вдову. Говорив, зазираючи нам в очі, ніби просячи про підтримку та розуміння, мовби пояснюючи: ну, ви ж усе розумієте, підтримайте мене, потвердіть мої слова, нагадайте, як там усе було насправді. Ми нагадували й потверджували. Аліна постояла якийсь час, нахилилася до столу, зібрала порожні келихи зі слідами помади й хотіла було рушити в дім, проте щось її затримало, щось змусило далі слухати цю розповідь, яка весь час обривалася й починалася з іншого місця. Туман підступав усе ближче, тихо й невблаганно наближаючись до її теплого тьмяного тіла."], ["— Скажу так, — якось здалеку почав Беня. Він стояв під лампою й тримав у руках стопар, ніби виголошуючи тост. Причому виголошував його, звертаючись перш за все до дядь Саші, котрий у сутінках став зовсім темний, гостроносий і непроглядний. — Що мені найбільше подобалося в Мараті, — вів далі Беня, — це його чоловічі якості.", "Він роззирнувся по нас, чекаючи на підтримку, проте ми не зовсім розуміли, що саме він має на увазі, тож Беня знову звернувся до дядь Саші.", "— Я хочу сказати, — пояснив він, — що Марат завжди був таким, яким має бути справжній чоловік — дорослим і відповідальним.", "Усі погодились, а Беня продовжив:", "— Ми ж разом ходили до школи, правда? Ми одного віку. Коли Марат записувався на бокс, я ходив записуватися з ним.", "— Я теж, — додав Костик.", "— І я, — додали в один голос ми із Семом.", "— Так, — продовжив Беня, — але нас не взяли. Я знаю, — знову звернувся він до дядь Саші, — у вас там, на Кавказі, кожен другий боксер. Або самбіст.", "— Або альпініст, — додав дещо не в тему Костик.", "— Але Марат був справжнім бійцем, — не дав перебити себе Беня. — Він навіть режим не порушував. Навіть коли почав зустрічатися з Аліною, — звернувся Беня вже до Аліни, — не пропускав тренування.", "— Так-так! — підхопили ми в один голос.", "Аліна напружилась, порожні келихи озвалися в її руках. Усі затихли.", "— І тут, — сказав Беня, перевівши подих, — я можу розповісти вам таку історію. Можливо, ви її не знаєте.", "І почав розповідати. З його слів виходило так, що перші рукавички Маратові подарував тато. Ще коли Марат не стояв як слід на ногах. Себто спочатку Марат навчився шанувати батьків, потім боксувати, а лише потім — ходити. Боксував він натхненно й наполегливо, всюди і весь час. Удари його, за словами Бені, несли супротивнику поразку й забуття, а його спорттовариству — славу й звитягу. Тренери відразу це помітили, його й узяли з ходу, не спитавши, скільки йому років, де він навчається й хто він за віросповіданням. А даремно, наголосив Беня. Оскільки справа віри була для Марата справою честі. Він завжди мав при собі священні мощі, привезені йому Бенею із Синаю, а що ніхто з нас ніколи в очі їх не бачив, то лише з тієї причини, що мощі виносити в ринг суворо заборонено олімпійським комітетом. Крім того, Марат чинив усі намази, шанував вечір п'ятниці, не їв м'яса й віддавав на церкву десятину. На яку саме церкву, Беня з'ясовувати не став, обмежившись сухими цифрами. Тренери, поза сумнівом, розуміли, кого саме виховують у себе на базі, з ким їм пощастило перетнутися в їхньому нікчемному житті. То й ухопилися за Марата, мов за останній шанс. Що цілком зрозуміло: кому ж не хочеться виховати олімпійського чемпіона? Всім хочеться. Його й виховували на чемпіона — так і не інакше! Він це відчував, тож коли його вчергове намагалися перетягнути на історичну батьківщину, на Кавказ, уточнив Беня, він завжди говорив, що тут його виховали, тут він і реалізується як професіонал. Амбіції завжди сповнюють нас сили й витривалості. Клопітка щоденна праця, виснажливі тренування, цілеспрямований шлях до мети — усе це не могло не дати результату. З простого чеченського хлопчика Марат перетворювався на спортивну надію Харківщини. Не було такого суперника, дещо патетично заявив Беня, звісно, у його ваговій категорії, виправився він, який вистояв би проти нашого Марата бодай п'ять раундів! Я хочу згадати, почав згадувати Беня, як він готувався до бою. Утримання й піст, молитви та медитації, покора й упевненість! — Беня остаточно збився з теми. — Шкіра його з віком ставала міцною, а кості — твердими й холодними. І коли він бився за звання чемпіона області, батьки міста завмирали на трибунах, слідкуючи за його граційними рухами та переможним криком!", "— Так усе й було, — погодився дядь Саша, і синя сльоза скотилася йому в коньяк.", "— Жодного бою! — далі виголошував Беня. — Жодного бою без перемоги! Жодних зборів без звитяги й успіху! Кров ворогів запікалася на його волоссі, їхнє голосіння супроводжувало його поступ! До його взуття намагалися доторкнутися найкрасивіші жінки! — тут Беня згадав про Аліну й затнувся. — Ну, мається на увазі, від федерації, — пояснив він, — профспілкова робота, трудові резерви.", "Але всім якось ураз стало незатишно, тож Беня не вигадав нічого кращого, як говорити далі:", "— А ось історія, яку я вам хочу розповісти, сталася саме на зборах. У Ялті. Я чому так детально розповідаю, — пояснив Беня, — сам там був. Ніхто не міг змагатися з Маратом у спритності й витривалості. Ніхто не міг вистояти проти нього, не втративши здоров'я. Ніхто не сумнівався в його великому майбутньому. Крім Чорного. Як його звали, я тепер і не згадаю. Хоча, — замислено замовк Беня, — чому ж не згадаю, Чорним його всі й звали. Був він не місцевий, батьки його приїхали звідкись зі Сходу або із Заходу — не пам'ятаю. Чорного як бійця ніхто сьогодні й не згадає. Його й тоді мало хто помічав, усі говорили лише про Марата. І ось Чорний на зборах зірвався. Жили вони на базі, до міста їх не випускали, режим, розпорядок, ранкова гімнастика. І ось тренерський штаб викликали на якусь нараду. Причому весь. Тут-то Чорного й понесло. Спочатку він пив сам. Потім споїв масажистів. Потім узявся за юніорів. Єдиний, хто з ним не пив, — Марат! Два дні ламав його Чорний, два дні спокушав. Що лише не пропонував. І масажистів підсилав до нього, і юніорів підмовляв. Але так і лишився ні з чим! І тому я пропоную випити, — спробував якось завершити всю цю історію Беня, — за нашого приятеля, за Марата, за його чоловічі якості, — я помітив, що Аліна не дослухала й рушила до будинку, і туман холодив її литки, доки вона проходила подвір'ям, — за його витримку, — не міг зупинитися Беня, — за його відданість спорту й справжній чоловічій дружбі!", "Ніхто не був проти випити, ніхто не мав нічого проти справжньої чоловічої дружби. Дядь Саша, худий, з голеною головою, з акуратною смужечкою вусів, у своєму чорному піджаку схожий був на сажотруса, який упав із даху просто до святкового столу й тішився, адже все могло скластися куди гірше. Що темнішим ставало небо, то тривожніше горіли лампи над нами. Темрява стояла довкола них, ніби вода довкола нерухомих сомів, не наважуючись сколихнути їхній спокій.", "Ми всі знали цю історію. Доки поруч була Аліна, ніхто не перебивав і не заперечував, а тут, щойно вона відійшла, я згадав, як усе було насправді. Та й інші згадали, помітним було загальне сум'яття. Навіть Рустам відвів очі, дістав мобільник і почав гнівно набивати комусь повідомлення. Чорного звали Валера. Їх із Маратом виганяли із секції разом. Тричі. Але щоразу брали назад. Не те, щоби Марат справді був такий непереможний — він навіть на області ніколи не брав перше місце, просто в Чорного тато був в органах і завжди за малих домовлявся. У Крим вони звалили теж разом. Просто зі зборів, які відбувалися тут, на місці. Марат уже зустрічався з Аліною, вони навіть говорили всім про весілля, але тут його перемкнуло, був березень, на площах і в скверах лежав чорний сніг, небо спалахувало й горіло, Марата підривало з місця, тож він і вигадав цю історію зі зборами в Ялті. Із собою вони взяли двох подружок-гімнасток. Ті, здається, ще й паспортів не мали, Марат із Чорним, яким було по сімнадцять, видавалися їм дорослими та відповідальними — одне слово, справжні чоловіки з чоловічими якостями. Поселилися вони у знайомих Чорного, у тісній квартирі в панельнику, з вікон навіть моря не було видно. Та й не мали вони особливого інтересу до моря, яке штормило й заливало набережну кригою та мерзлими водоростями. Десь на п'ятий день відпочинку, коли гроші, шампанське та хліб закінчувалися, Чорний зі своєю гімнасткою почали тягти Марата додому. Але з тим щось трапилося, якась переміна, він нам розповідав потім. Говорив, що сам не розуміє, як так сталося і коли це почалося, але його напарниця, ще зовсім юна, тиха й тонка, в якої не було нічого, крім спортивних перспектив, утратила від нього голову, і він теж утратив свою, причому задовго до цього, тож ніхто з них особливо ні про що не думав. Вони зачинилися в одній із кімнат і днями не вилазили з ліжка, цілуючись і виснажуючи одне одного. Марат розповідав, що вона зовсім нічого не вміла і він пояснював їй усе від початку, показував, що і як потрібно робити, аби все тривало й надалі. Помешкання зовсім не обігрівалося, вони ховалися під товстими ковдрами, тож він її майже й не бачив роздягненою, вивчаючи її радше на дотик. Потім довго згадував, які в неї ніжні долоні, які тонкі вени, яка пересушена шкіра. Вона легко в нього всього навчалася, забувши, як їй було незручно й боляче першого дня, плакала вночі, сміялася зранку й хапала його за шию, коли він намагався вибратися з-під ковдр і сходити на кухню за черговою пляшкою шампанського. Він повертався, ліз разом із шампанським під ковдри, й усе починалося спочатку. Від алкоголю вона ставала невтомною та неуважною, кусала його тіло, потім довго зализувала рани, ніжно шепотіла йому щось, доки він думав, як би вибратися й відлити, потім засинала й говорила вві сні з мамою, після чого він будив її й повертав до тями, і так усі ці дні.", "Першим запанікував Чорний. Він розумів, що дівчатка не мають паспортів. Добре, Бог із ними — з паспортами, але він розумів, що дівчатка теж повідомили вдома, нібито їдуть на збори. Виходило так, що потрібно було якось вибиратися додому, тому що збори зборами, але якщо історія випливе, не допоможе навіть тато-правоохоронець. Подружка Чорного теж панікувала, плакала й просила взяти їй квиток до Харкова. Чорний спробував поговорити з Маратом. Вони сиділи на кухні, добивали рештки сигарет, і з Маратових ран виступала кров, перемішана із солодкою слиною. Марат говорив, що нікуди не поїде, що не хоче нічого чути, що боїться повертатися додому, що вона всім усе розповість, що йому нічого сказати Аліні, яка ні про що не здогадується, а здогадається — просто помре від горя, тому найкраще — залишатися тут, наскільки вистачить сил і сигарет. Чорний терпляче переконував його, що це не вихід, що рано чи пізно їх почнуть шукати й рано чи пізно знайдуть, і тоді від горя помруть вони — Чорний із Маратом, а може, навіть і не від горя, а від побиття камінням та громадської обструкції. — Ні-ні, — не погоджувався Марат, — ти не розумієш: коли щось не складається, коли тебе заганяють у глухий кут, краще просто не рухатися, краще стояти й чекати, доки все минеться. І він повертався в ліжко, і зігрівав її холодні лопатки, грів її долоні й живіт, намагаючись ні про що не думати, не думати взагалі. Чорний умовляв його кілька днів. Ходив на поштамт, телефонував Аліні, передавав вітання від Марата, говорив, що той у залі, займається. Аліна все розуміла, проте виду не подавала, лише переказувала не надто порушувати спортивний режим. Якогось ранку подружка Чорного зібрала речі, непомітно вислизнула з квартири, дісталася траси, піймала машину, доїхала до Сімферополя й наступного ранку була вдома. Поява міліції стала питанням часу. Чорний вибив двері, дістав із ліжка Маратову подружку, мовчки допоміг їй одягнутися, плутаючись у колготках і шкарпетках, і потягнув її на вокзал. Марат лишився. За пару днів прийшли господарі квартири, так чи інакше довелося повертатися додому. Аліна його кинула. Потім повернулася. Подружка-гімнастка труїлася якимись таблетками. Але якось невдало. Ну, мається на увазі, вижила."], ["Доки ми все це згадували, над подвір'ям завис тонкий, мідного відтінку місяць. Туман ховав його, проте він усе одно проступав крізь вогке повітря, тихо рухаючись над бляшаними дахами й чорними горлами коминів. З будинку вийшла Аліна, цілковито потонувши в сутіні — темрява щільно огортала її чорну сукню, лише лікті й зап'ястки час від часу вихоплювалися з повітря, ніби з чорного молока. Усі враз споважніли, Беня знову кинувся їй допомагати, взяв із рук хліб і вино, дядь Саша почав припрошувати її до столу, Аліна врешті погодилася. Ставало все прохолодніше, так, мовби десь поруч пройшов дощ, лишивши по собі рівне промерзле дихання. Аліна здебільшого мовчала, лише іноді перепитувала когось із гостей, що кому подати, потому відкидалася на тверду спинку стільця й задумливо розглядала синє вино в зелених пляшках.", "Тоді заговорив Костик. Важкий і неповороткий, наче весь розмоклий від туману та вина, він розв'язав краватку, кинувши її на якусь запечену рибу, і говорив уже не надто чітко, проте переконливо й голосно. Коли людина так говорить, їй немає чим заперечити, навіть якщо говорить вона дурниці. Костик це розумів, тому намагався говорити ще голосніше. Іноді здавалося, що він когось звинувачує, іноді — що захищає, іноді він просто зривався на крик, і тоді Сем клав йому на плече свою суху руку, а дядь Саша застережливо кивав Семові, мовляв, не чіпай, хай говорить, все одно на ранок не згадає нічого з того, що наговорив.", "— Так-так, — хвилювався Костик, — я теж хочу сказати. Що ви не даєте мені сказати?! Не дивіться так на мене, — заводився він, перекидаючи склянки з вином. Біле полотно набрякало темною вагою алкоголю, але Костик не зважав і просив його не перебивати. — Я хочу сказати про добре серце. Коли в людини добре серце, багато речей вона сприймає зовсім інакше, ніж ми з вами. Очі такої людини осяяні внутрішнім світлом, і люди тягнуться до неї. І чоловіки, і жінки, — уточнив Костик.", "— Ну, почалося, — незадоволено відреагував Беня, — казав: не наливайте йому. Зараз він наговорить.", "Всі розуміли, про що йдеться. Всі знали, чого чекати. Спочатку він голоситиме про внутрішнє світло, потім затягне про порятунок душі, можливо, плакатиме, скоріш за все полізе в бійку. З Костиком це почалося після реабілітації. Наркотики нікого не роблять спокійнішими. Радше навпаки. Костик підсів уже в зрілому віці, маючи що втрачати. А коли втратив, зумів зупинитися. Довго тягався реабілітаційними центрами, школами просвітлення та курсами духовного розвитку. Після цього повернувся до життя, але почав набирати вагу. Очевидно, проблеми з цукром, так я собі думав. І з нирками. І з головою. З іншого боку, до чого тут наркотики — у дитинстві він поводився за столом так само жахливо.", "Нам не дуже подобалося те, що він говорив, проте всіх підкуповувала його емоційність. Ну так, внутрішньо погоджувалися ми, все правильно: відкрите серце, тягнуться чоловіки. І жінки. Аліна, схоже, зовсім змерзла, знайшла на стільцях забуту кимось хустку, загорнулась у неї, час від часу ледь здригаючись, ніби реагуючи на чийсь шепіт, який чула лише вона.", "— Добре серце допомагає нам у тяжкі хвилини й тішить у години радості, — далі говорив Костик, глибоко вдихаючи нічне повітря, від чого біла сорочка його надималася, як вітрило в чорному морі. — Добре серце, друзі, — почав він плакати, — добре серце!", "А далі говорив про щось зовсім далеке, що, втім, вилилося в доволі-таки приємну й усім зрозумілу історію. Говорив про серця, наповнені добром і надією, серця милосердні та не обділені щедрістю, через які у світ приходить совість і які ніколи не піддаються спокусам і марнославству. Після довгого й дещо плутаного вступу нагадав усім, який теплий і погідний був вересень кілька років тому, коли стався той дивовижний випадок.", "— Ось ви говорите, — хлипав Костик, — про чоловічі якості. А чи не найбільшою чеснотою справжнього чоловіка є все-таки співпереживання та готовність надати першу медичну допомогу. Візьмімо Марата. На той час він — знаний атлет, авторитетний серед молоді боксер, чуйний син, вірний чоловік, людина залізної волі й суворих переконань, аскетичний, нестримний і витривалий, — перебував у тому віці, коли нічого не видається неможливим, коли трапляються дива й небеса відкриваються над нами, аби святі могли краще розгледіти колір наших щасливих очей. Він і на Кавказ через це не поїхав, хоча його кликали туди в збірну. Ну, самі подумайте, як можна кинути всі свої обов'язки? Почуття обов'язку — ось що тримало його тут!", "Одного разу, повертаючись зі спарингів, він натрапив посеред осіннього парку на невідомого, що лежав просто на землі головою на схід. Поруч товклася випадкова перехожа, яка потім і переповіла цю історію ширшому загалу. Що робить більшість із нас, зіткнувшися з чужою смертю? Зазвичай ми намагаємося не реагувати, аби не привернути її уваги. Ми просто робимо вигляд, що смерті не існує, не помічаючи померлих і не думаючи про живих. Натомість Марат зупинився, якийсь внутрішній голос, як потім розповідала з його слів перехожа, примусив його схилитися над мертвим тілом. Щось підказало йому, що втрачено ще далеко не все, що можна спробувати відігнати темну тінь, яка вже підступала з-за багряних дерев. Невідомий був інтелігентного вигляду, у дещо старомодному пальті, поруч лежав портфель. Марат швидко зорієнтувався в ситуації, змусив перехожу викликати міліцію та швидку, і доки та набирала холодними пальцями потрібні номери, зробив невідомому масаж серця, повернувши сердегу фактично з того світу. Після чого дочекався медиків та міліцію й навіть проїхав до відділку, аби все пояснити. Разом із випадковою перехожою.", "Тут Аліна зовсім розплакалася й зірвалася йти до будинку, проте дядь Саша встиг перехопити її й міцно обійняв за плечі. Вона припала до нього, задихаючись плачем, а ми сиділи й мовчали, відчуваючи, як незворотньо минає та мить, коли потрібно було щось сказати, підхопити розмову, не дати запанувати тиші, яка ставала дедалі нестерпнішою, загрожуючи розірвати повітря, мов паперовий пакет. Усе майже так і було — і спаринги, й осінній парк. Чорні дерева, бузкові небеса з червоними відблисками на заході. Марат усе збирався піти з клубу, сварився з керівництвом, тижнями десь пропадав, з Аліною в них все було так погано, що він сам дивувався, як вони досі не розійшлися. Того дня ми з обіду засіли в парку, у розбитому барі, фактично в якомусь наметі з пивом, де, крім нас, нікого й не було, сиділи, нікуди не поспішаючи, — я, Марат, ще хтось із його одноклубників, — чекали ночі й слухали Маратові байки про те, що навесні він усе кине й звалить на Кавказ, куди його давно кличуть тренером. Десь під вечір до бару прибилася пара — він виглядав значно старшим, схожий був на викладача університету, ні на кого не звертав уваги, дивився лише перед собою. Був в осінньому пальті, носив окуляри, майже не пив. Вона була юною, хоча на студентку не скидалася — поводилася впевнено, сама замовляла, пропонувала щось йому. Марат замовк і почав до неї придивлятися, щось його в ній зачепило, щось у ньому озвалося. Мала жорстке світле волосся й довгі пальці з гострими нігтями, і ще яскраві білі зуби, а що весь час сміялася й говорила, то Марат лише й розглядав її посмішку, навіть не особливо ховаючись. А десь за годину, коли викладач кинув-таки на нас двозначний погляд, Марат узагалі влаштував сварку й намірився битися. Бармени всіх розтягли й порадили розходитися, викладач намагався поводитися спокійно, проте дещо зашвидко подав своїй подружці плащ, дещо забагато лишив чайових, дещо демонстративно простягнув їй руку, щоби вивести на вулицю. І саме тоді Марат вирвався з наших обіймів і перехопив її, піймавши за лікоть, потягнув до себе — різко й не стримуючись, аж вона скрикнула. І не зрозуміло було, чого в її крику містилося більше — обурення чи здивування. Мені здалося, що здивування. Причому приємного. Хоча вона й спробувала вирватися й гнівно щось кричала, зблискуючи зубами й крутячи головою, а проте подалася вперед, налетіла на Марата й далі заскочено розглядала впритул його гостре неголене обличчя зі шрамами й порізами, сірі запалені очі, чорне волосся й тверду шкіру. І чим довше дивилася, тим уважнішим ставав її погляд. А коли викладач кинувся виривати її назад, Марат себе вже й зовсім не стримував і завалив із правої, як його вчили ще в дитячо-юнацькій школі, себто старанно й від душі. Викладач покотився підлогою, а на Марата ззаду наскочили бармени, і вже всі троє полетіли на землю. Ми з Маратовим приятелем взялися викидати всіх на вулицю, у синьо-червону паркову пітьму, що тривожно поглинала вогні барної вивіски. І там, посеред золотого листя, Марат товк викладача, бармени пробували відтягнути його від жертви, а ми, своєю чергою, намагалися відтягнути їх.", "Міліція забрала всіх, крім барменів. Викладач нив і просив зробити йому масаж серця. Його подружка прикладала Маратові хустинку до розбитої брови. У відділку викладач із подружкою сиділи в одному кутку, ми — в іншому. Ніхто нічого не говорив, лише вона дивилася на Марата прискіпливим і нервовим поглядом, ніби вивчаючи. Чи принаймні запам'ятовуючи. Потім їх відпустили, а ми залишилися. Марат просив мене скористатися правом одного дзвінка, зателефонувати Аліні й пояснити, що його викликали на зустріч із президентом федерації.", "— Яким президентом? — говорив я йому. — Друга ночі. Давай я подзвоню, скажу, що ми в міліції, хай щось робить!", "— У міліції? — сумнівався Марат. — Занадто правдоподібно, вона не повірить.", "І навіщо розповідати те, що всім і так відомо, думав я. Навіщо задобрювати померлих історіями, у яких так багато крові та болю. Але всім, схоже, подобалося згадувати Марата саме таким — у червоних боксерських трусах, з архангельськими крилами за плечима, з Господнім благословенням у доброму серці. Я зважився йти, повернувся до дядь Саші, аби все пояснити, вибачитися й розчинитися в тумані, проте Аліна перехилилася до мене і втомлено торкнулася руки.", "— Вань, — сказала, — допоможеш?", "— Так-так, — відповів я, — що за питання.", "Треба було просто не приходити, — подумав.", "Аліна почала вибирати з трави порожні пляшки, передавала мені, сама взяла зі столу тарілки та виделки, пішла в дім. Я пішов за нею, відчуваючи погляди й голоси за спиною, ішов, ступаючи битою цеглою й дивлячись, як вона легко рухається, як заглиблюється в ніч, як несподівано віконне світло падає на її шкіру й темне волосся. Відчинила двері, пройшла досередини. Я ступив слідом. Тут вона озирнулася, тихо попросила лишити пляшки в коридорі, після чого передала мені виделки. Я не втримав, виделки посипалися на підлогу, гостро й холодно, ніби шматки криги. У будинку, десь глибоко, скрипнули дверима. Аліна приклала пальця до вуст, попросила поводитися тихіше, сказала, що всі вже сплять. Говорила пошепки, від чого голос її звучав по-особливому довірливо. Прочинила двері до вітальні, обережно рушила вперед. Світло було вимкнене, я її не так бачив, як відчував, ловив її дихання, ледь загострий запах її волосся, що пахло волоськими горіхами, ледь зарізке поскрипування старої підлоги під її ногами. Що станеться, думав, коли тут, у темряві, я, не помітивши, випадково натраплю на неї, коли торкнуся її в пітьмі, коли пораню її гострими ножами й виделками, які тримаю в руках? Вона пройшла вітальнею, завернула в довгий коридор, ішла навпомацки, торкаючись пальцями предметів. Я добре знав їхнє помешкання ще з дитинства. Дивно сплановане й кілька разів переділене, захаращене старими меблями й високими шафами, воно нагадувало мені про Марата, про трохи кращі обставини, про веселі часи. Мені завжди подобалось, як тут пахло: зручним теплим одягом, деревом і чаєм. Жодної книги на полицях, жодних картин на стінах. Тісні кімнати, вузькі коридори, нерухомі тіні, невидимі мешканці. Ми рухалися в темряві, обережно обходячи стільці й торби, важкі вазони з квітами й розкидані підлогою черевики. Я раптом усвідомив, що не пам'ятаю цього коридору, раніше його тут не було, я це напевне знав, оскільки сотні разів бував тут у різному віці, у різному стані, але ось саме цього коридору, який витягувався й щодалі звужувався, коридору, переповненого пилом і темрявою, не пам'ятав. Можливо, подумав я, вони тут укотре щось перебудовували, ну так, звісно, Марат планував пробити стіну, аби сполучити батьківську спальню з маленькою кімнатою, в якій ніхто не жив, але не пам'ятаю, аби він перед смертю щось говорив про ремонтні роботи. Зрештою, ми з ним останнім часом майже не спілкувалися. Не вистачало часу, не вистачало бажання, не вистачало терпіння витримувати весь той дим, в якому він жив. Може, й справді він устиг вибудувати в батьківському помешканні цей коридор і вийшов ним зі свого життя, прорубав собі приватний канал зв'язку з ніччю, знайшов те місце, де обшивка світу була тонкою й ненадійною, і скористався зручною нагодою виправити нарешті все на свою користь. Я зупинився й прислухався. У суцільній темряві, що обступала й тиснула, не чути було нічого, навіть дихання Аліни урвалося, мовби вона затримала повітря й розчинилася в чорному чаї нічного приміщення, граючи зі мною в хованки. Мені згадалося, як Марат любив розповідати про свого старого, про те, як старий навчав його плавати. Брав за шию й опускав під воду, примушуючи виборсуватись, задихаючись і відпльовуючись. Марат говорив про це з гордістю: ось, мовляв, бачите — не задихнувся, не здох, випірнув, вижив і далі буду жити, і жодна смерть мене тепер не візьме. Але говорив про це так злісно, що мені самому кожного разу перехоплювало подих і не вистачало кисню, і я пожадливо хапав його ротом, аби пересвідчитись, що не задихнувся. І потрібно було потрапити до цієї пастки, аби розбудити найстрашніші розповіді з дитинства. Я відчув страх. Як звідси вибратися, подумав, куди веде цей чортів коридор? Кинувся шукати стіну, наткнувся рукою на щось тверде, на якісь металеві виступи й штирі, взявся бити рукою по чорній порожнечі, другою рукою намагаючись утримати виделки й ножі. Намацав рвані шпалери, з-під яких виступала прохолодна цегла, намацав вішак для одягу, намацав штори й капелюхи, хустки й целофан. Враз пальці зупинилися на чомусь пругкому й теплому. Я спробував зрозуміти, що це. Пір'я, це було пір'я, ніжне й невагоме на дотик. Щось, схоже на щойно забитого птаха, щось, наповнене кров'ю й пам'яттю. Я торкався обережно й уважно, пробуючи відгадати, що ж це все-таки є. Раптом темрява під моїми пальцями здригнулася, легко озвалася, ніби хтось зітхнув. Я відчув, як щось ворухнулося. Жах пройняв мене. Жах і відчай. Я кинувся просто в темряву, викинувши перед собою розчепірену долоню. Завалив вішак, зачепив стілець, перевернув якісь каструлі. Рука вдарилася об тверду поверхню, темрява розчахнулася, в очі вдарило різке світло. Я вивалився на стару кухню, на якій був тисячі разів, де знав кожен куток і кожен закамарок, де все було знайомим і не викликало жодних страхів чи недовіри. Посеред кухні стояла Аліна, помішуючи щось ложкою у великому баняку. Вона здивовано дивилася на мене. Очевидно, вигляд у мене був неспокійний.", "— Ти де був? — запитала.", "— Заблукав, — відповів я.", "— Усе гаразд? — засумнівалась.", "— Так, — збрехав я.", "Скоріш за все, вона не повірила. Але промовчала.", "— Ось, — сказала, помовчавши, — віднеси на стіл.", "Я взяв з її рук глибоку тарілку з овочами, рушив назад."], ["Вони саме заспокоювали Костика й згадували, на чому спинилися, де було перервано розмову, з якого моменту все пішло не так. Костик гірко плакав, поклавши голову на руки, а руки, своєю чергою, поклавши на запечену рибу. Можна було подумати, що він її оплакує, цю рибу. Дядь Саша пересів до нього й заспокійливо поплескував по загривку. — Тихо, хлопче, — говорив він, — не годиться так побиватися за мертвими. Костик ображено шморгав носом, витираючи сльози й шмарклі рукавами сорочки. Дядь Саша нависав над ним своїм гострим профілем, мов крук, Беня нервово курив, струшуючи попіл в мариновані гриби, а Рустам із Семом сиділи віддалік, далі про щось сперечаючись. Я підсів до них, поставив овочі на стіл.", "Тоді Сем розповів найцікавішу історію. Була вона настільки дивовижною та заплутаною, що навіть Рустам, молодший брат, на очах якого все це відбувалося, сплескував час від часу руками, широко розплющував очі й заперечливо мотав головою, не погоджуючись і виправляючи оповідача. Було що виправляти! Ніхто з нас не знає, говорив Сем, припалюючи так, що рубці на поламаному кілька разів носі рожево спалахували в гасовому сяйві, як близько знаходиться його смерть. Ніхто з нас уявити не може, як далеко на її територію ми заходимо. Говорив він, можливо, не так розважливо, як я переказую, нервово затягувався, дещо затинався, проте оповідь його була саме про це. Смерть, говорив він, ніколи не ступає нам назустріч, вона має час і можливість вичікувати, вона стоїть посеред свіжої смарагдової трави, невидима та неминуча, й спостерігає, як легковажно та необачно ми забігаємо в її тінь. Іноді нам вдається з цієї тіні вискочити. Хоча в більшості випадків від нас тут мало що залежить. Ми беззахисні перед нею, нас паралізують страх і приреченість. І мало хто цю приреченість здатен у собі перемогти. З Маратом усе склалося особливо дивно. Він не боявся смерті й любив жінок. Одного разу його запрошували за кордон, тренером, ну, усім це відомо. То знаєте, що він сказав? Він сказав: я помру тут, поруч зі своєю мамою. Всім відома була та ґречність і шляхетність, з якою він ставився до жінок. Можливо, це передалося йому від мами. Можливо, причина тут у спортивному вихованні. Хай там як, а до жінок він ставився ледь не побожно. Одного разу, минулої весни, та фактично рік тому, Марата втягнули в бійку. Сталося це так: він уже повертався додому після бою й спускався по Революції, коли раптом побачив, як якийсь мудило чіпляється до дівчини. Причому доволі брутально. Посеред вулиці. Ясна річ, Марат поліз битися. Здавалося б, що професійному боксеру було завалити якогось лівака. Проте мудило виявився не так тренованим, як витривалим. Мав просто залізну голову, об яку можна було гнути велосипедні рами. Бились вони години дві. То сходилися, то переводили подих. Потім знову кидалися один на одного. Навіть дівчина не витримала, вибачилась і пішла собі. Та її ніхто й не тримав. Ну, але гору взяла майстерність — Марат таки завалив цього кабана. Той лежав на теплому вечірньому асфальті й стікав кров'ю. Марату б розвернутися й піти додому, але щось його зупинило, щось примусило залишитись. Він нахилився, потягнув мужика на себе, закинув собі на плечі й поніс на світла, що горіли коло метро, думаючи там кинути під дверима якої-небудь аптеки. Мужик виявився важким і незручним, ноги йому волочилися по землі, джинси сповзали, він тяжко хрипів, кров його затікала Маратові за комір. Проте Марат ішов, оскільки знав: не можна лишати по собі трупи, боротьба має бути чесною. А вже коли дотягнув-таки цього мудила до аптеки, обережно поклав його під дверима й зібрався натиснути кнопку виклику чергового, але вирішив наостанок витерти тому кров з обличчя. І коли нахилився, мужик несподівано розплющив очі й засадив Маратові в бочину довгими блискучими ножицями, які тримав у задній кишені джинсів. Після чого просто втік. Марат спробував його наздогнати, але з ножицями бігти було незручно, тож він просто повернув додому й півночі добирався сюди з ножицями в тілі, тримаючись рукою за стіни й дерева. А дівчина виявилася перукаркою.", "І вони заговорили всі водночас, перебиваючи й висміюючи один одного. — Він уже не бився, — кричав Рустам, — він уже з малими працював! — Куди там, — мотав головою Сем, — я сам ходив на його бої, ясно, це вже був не той Марат, ну але що. — Та де? — наполягав Рустам, — які бої? Він на дивані валявся днями, з двору не виходив! — Правильно, — погоджувався Сем, — а коли виходив, то бився. — Та з ким там він бився? — зривався на ноги Рустам, проте Сем тягнув його вниз за рукав спортивної куртки, — в нього серце хворе було! — Так-так, — підтримував його Костик, — хворе добре серце.", "Я попрощався, потиснув руки Рустамові із Семом, поплескав по плечу Костика, записав телефон дядь Саші, махнув Бені рукою. Мене ніхто не зупиняв. Усі втомилися й засинали за столом, проте не розходилися, ніби боялися залишитися сам на сам з усіма цими історіями. Туман підіймався вгору, у травневі небеса, оголюючи предмети, роблячи темноту ще більш порожньою. На другому поверсі Маратового будинку жовто роз'їдали ніч три вікна. Усі три сусідки — дві повні, одна сухенька — пильно вдивлялися мені в спину, щось віщуючи й передбачаючи.", "Я знав цю перукарку. Марат познайомився з нею минулого березня. Випадково серед вечора проходив повз, зреагував на блискуче світло вітрини з красивими, мовби відрубаними жіночими головами, вирішив зайти. Був кінець холодного робочого дня, крім неї, у перукарні нікого не було. Вона теж збиралася йти — що сидіти в порожній перукарні, коли за чорним вікном починається солодке життя? І вже скинула свій блискучий фартух із багатьма кишенями, куди напхано було ножиці, гребені та механічні машинки для підстригання. І тут зайшов Марат. Вона відразу звернула увагу на темні кола під його очима, що нагадували про всі безсонні ночі та випалені тютюном легені, звернула увагу на його щетину, що дивним чином робила його молодшим і злішим, аніж він був у житті. Помітила його перебинтовану правицю, розуміючи, що цей пасажир у разі чого буде стояти до останнього. Ковзнула поглядом по чорній куртці з капюшоном, по спортивній торбі з найківським лейблом, по чорних, пропалених у кількох місцях сигаретами джинсах, по легких кросівках. Подумала, що так у кіно виглядають наймані вбивці. Потім їх і знаходять за відбитками їхніх кросівок. Одягла фартух, кивнула Маратові на крісло. Той мовчки сів. Підійшла, довго розглядала його в дзеркало, провела рукою по його колючому чорному волоссю. З Марата посипалися іскри. Вона взялася за ножиці.", "Марат розповідав, що на ній було забагато рожевого й кривавого. Рожеве волосся, кривава помада, рожева майка, криваві нігті, рожеві пухнасті капці, кривавого кольору білизна. Коли вона торкнулася його, він відчув, які в неї нетерплячі руки, як вона навчено торкається чоловіків, як відчуває їхній жар, стримує їхній трепет. Або не стримує, додавав Марат. Він крутнувся на кріслі й притягнув її до себе, але цей її рожевий фартух із різними перукарськими штуками — він заважав, Марат спробував його стягнути, проте він міцно охоплював її тіло, захищаючи від чужих доторків. Тоді вона сама розв'язала кінці й кинула його на підлогу, і дзвінкий метал ножиць та гребінців полетів під крісло, а вона стояла перед ним, і він дивився на її оголений живіт, який жодним чином не могла приховати коротка майка, і різко посадив її собі на коліна, знімаючи з неї все, боячись не встигнути, не наважуючись зупинитись. Вона навіть дверей не зачинила, розповідав Марат, хтось навіть зазирав із вулиці, доки він рвав усі її червоні бретельки й рожеві панчохи, доки притискав її до себе, відчуваючи, як її шкіра то нагрівається від його дотиків, то охолоджується від березневого протягу. А коли вона скрикнула й завмерла, він ще якийсь час повертав її обличчя до світла, намагаючись зрозуміти, що сталося, чому вона не рухається, але потім і сам завмер, лише стискав її далі, розглядав зблизька її волосся, її вії, дивувався, яке все це яскраве й кольорове, уявляв собі, як вона ретельно все це вимальовує щоранку, скільки часу проводить коло дзеркала, як старанно натягує на себе всі ці кольорові речі, як легко потім їх скидає. Ще здивувався, як швидко й просто вона заспокоїлась. Дивилась на нього уважно й відсторонено, аж йому враз стало ніяково, він мовчки підвівся, тримаючи її в руках, впевнено, хоча й не надто обережно кинув її на шкіряну канапу й пішов додому. Так нічого їй і не сказавши.", "Наступного вечора знову прийшов. Вона знову була сама. Марат мовчки зачинив за собою двері, стояв і чекав. Вона все зрозуміла й вимкнула світло. Вулиця за вікном була наповнена вогнями й тінями, вони змішувалися й розтікалися, пливли в очах і розмивали обриси будинків. Вона хапливо говорила йому щось дивне й несподіване, говорила, що чекала на нього, знала, що він прийде, розповідала про себе, згадувала історії про своїх чоловіків, тихо пояснювала, що їй подобається, а що ні, що вона любить і чого боїться, і так до глибокої ночі, не втомлюючись і ні про що не запитуючи, роблячи все, що він хотів, не заперечуючи й не зупиняючи його, доки він сам не зупинився й не заснув.", "Марату вона чомусь подобалася, він говорив, що відчуває, як прискорюється її серце, коли вона цілується, і як потому воно заспокоюється й уповільнюється. Вона, розповідав, іноді поводиться так, ніби мене зовсім немає. При цьому лежить поруч зі мною. Або на мені. Вона просто дивиться крізь мене, бачить щось своє, можливо, чує моє дихання, можливо, відчуває мій запах, не більше. Йому це, схоже, теж подобалося. Він навіть не приховував удома, що йде до перукарні. Коли став ходити частіше, говорив, що ходить туди голитися, що справжній чоловік завжди має бути поголений. Щоправда, ідучи голитися до перукарні, іноді голився вдома. У нього все руйнувалося й розвалювалося в руках, всі стосунки й взаємини: з Аліною, з батьками, з братом. Навіть із перукаркою своєю він усе частіше сварився. Зізнався одного разу, що вже боїться в неї стригтися. — Вона мені голову колись відріже, — припускав він. Десь так воно й сталося. Вся ця історія з ножицями — він її вигадав, сидячи в мене на кухні й затискаючи рану рукою. Скаржився, що вона зовсім збожеволіла, що хоче його вбити, що вимагає неможливого й трахається, ніби востаннє. Що він спробував їй щось пояснити, спробував поговорити з нею, ти розумієш? — кричав, — я хотів просто з нею поговорити! Але все завершилося скандалом, вона не хотіла нічого чути, плакала й звинувачувала його в бозна-чому, він завівся, накричав на неї, розгромив її робоче крісло, розтрощив дзеркало, бив одеколони й розламував навпіл фени. Ось вона й всадила йому ножиці по саме руків'я. — Але нікому нічого не кажи, — просив він, — ніхто ні про що не повинен знати. Я й не говорив. Він сам усім розповів.", "Я питав його, чому він не поїде звідси. Його ж постійно запрошували якісь татові родичі, додому, на Кавказ. — Ну, як я поїду, — відповідав він, — як я їх кину? — говорив він про всіх своїх жінок, про всіх рідних, про друзів та суперників. — Не можу, ніяк. Але я знав, що він говорить неправду. Знав, що вся справа в Аліні. Що вона навідріз відмовилася з ним їхати. Сказала, що помре тут — з його батьками, в його домі, невтішною вдовою. Але нікуди звідси не поїде. Марат міг робити все, що йому спадало на думку. Він жив, із ким хотів, спав, із ким хотів, бився, коли хотів, він утрачав приятелів і наживав ворогів, відмовлявся від важливих знайомств і нехтував дружніми обов'язками, під кінець пересварився з усіма, навіть зі мною. Я не спілкувався з ним цілу зиму. Костику він був винен багато грошей. Віддавати, наскільки я розумів, не збирався. Та Костик і не взяв би. Здавалося, він готувався до чогось важливого, до якогось рішення, до особливих подій. І відмовитися міг від будь-чого. Крім Аліни. Це я знав напевне. Скільки б у нього не було жінок, як би глибоко не прокушувала йому шкіру ця його рожева перукарка, я знав, що без Аліни він не поїде. І я знав чому. Ніхто не знав, крім мене. Чомусь мені Марат свого часу про все розповів. Як вони познайомилися десь на вулиці, як він зупинив її, як не хотів відпускати, вже напевне знаючи, що спробує жити з нею разом. Як вона довго його уникала, як увесь час щось приховувала. Як він уперше потрапив до неї додому і чим усе це закінчилося. Як вона погодилася зрештою жити з ним. Але перед тим розповіла про свою маму, щоби все було чесно. Розповіла, що мама її час від часу мусить лягати до лікарні, ось така біда, нічого страшного, хоча й при
