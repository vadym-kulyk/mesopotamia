дчуваючи небезпеку. Чому вони не лишились, думав Маріо, чого їм насправді бракувало? Спокою? Упевненості? Любові? Маріо уявляв, як вони довго мусили до цього йти, скільки різних прикростей мало статись у їхньому житті, скільки зневіри мали всотати їхні душі. Хтось із них зважувався повільно й болісно, але хтось — легко й невимушено, хтось тривалий час не міг зізнатися самому собі, що вже готовий — готовий відмовитись від усього, що надбав, і рушити вперед — за ріку, між чужих, у темряву. Вони мали вирішити купу питань, залагодити безліч справ, знайти перекупників, зв'язатися з перевізниками, попрощатися з близькими, взяти все необхідне, скинути все зайве. Меблі були зайвими. На пошуки кращого життя зі своїми меблями не рушають. Їх лишають тут — тліти й помирати. Можливо, думав Маріо, я б теж міг зірватися й рушити вперед, можливо, мені б вдалося почати все спочатку, знайти своє місце, відшукати свою територію. Я б міг зупинятися у великих містах, жити поміж таких само біженців, ловити свій шанс, випробовувати долю, не затримуватись ніде надовго, рухатись далі, до того благословенного місця, де сонце над моєю головою не буде ніколи заходити, де дощі оминатимуть моє житло, де земля для мене буде м'якою, а хліб — солодким. Звісно, що міг би, думав Маріо. Але як бути з тим, від чого доведеться в такому разі відмовитись? Як бути з мамою? Як бути з Колею? Лишатися з ними не надто хотілось, брати із собою — тим більше. Що важливіше, думав Маріо, усе віднайти чи все залишити? Добре, що завжди є вибір, думав він, добре, що все залежить від нас.", "Надвечір прийшла Настя. Була в довгій, до п’ят, барвистій сукні й прозорій сорочці. Намагалася поводитися серйозно, проте їй це не надто вдавалося. Побачила набрякле криваве коліно, взялася лікувати. Маріо мужньо терпів, аж якоїсь миті не витримав і закричав. Тоді вона лягла на нього, ніби прикриваючи від вечірньої спеки, лежала й мовчала, заспокоюючи. Лежала, збираючи його докупи, не даючи йому розвалитись на гарячі шматки глини. Маріо поступово затих і навіть почав засинати, аж вона заговорила.", "— Поїхали зі мною, — сказала. — Кидай усе — і почали.", "— Що я там робитиму? — поцікавився Маріо.", "— Та що завгодно, — заспокоїла його Настя. — Хочеш — навчу тебе готувати. Хочеш — влаштую працювати в порт. Можу народити тобі дитину.", "— Серйозно?", "— Так. А можу не народити. Я вмію переривати вагітність. Можу її відновлювати. Можу заговорювати павуків і скорпіонів. Можу підробляти підписи.", "— Ну, це мені точно не потрібно.", "— Будемо жити в нас. Допоможеш мені доглядати за дідусем.", "— Звідки в тебе дідусь?", "— Довга історія, — пояснила Настя. — Він зовсім старий. Мама хотіла вписати його в хоспіс, проте мені стало його шкода. Я сама за ним і доглядаю. Він, коли говорить, пускає слину. Але говорить при цьому мудрі речі, є що послухати. То як?", "— Та ні, — подумав Маріо. — Краще ти сюди. Разом із дідусем.", "— Як знаєш, — спокійно відповіла Настя. — Вирішуй сам.", "Зранку вона пішла. Намагалася його не розбудити. Але все одно розбудила. Серед дня з'явився Коля. Приніс апельсинів. Довго сидів, мовчав, хотів про щось запитати, але стримався. Запропонував працювати разом. Маріо подумав, погодився."], ["Мрець виглядав ще гірше, ніж за життя. Сиве волосся, запалі очниці, гострий ніс, різкі зморшки на незадоволеному обличчі. Стримів угору борлак, видовжились пальці, посиніли нігті. Він мовчав останні дві доби, лише кашель час від часу рвав ізсередини груди. Потім навіть кашлю не стало. Лежав і повільно дихав, як риба — уже виловлена з водойми, проте ще не залита олією. По обіді серце спинилось. Молодий підходив, схилявся над ним, зацікавлено розглядав. Можна було подумати, що вивчає малюнки на лікарняному халаті.", "— Ти ще дзеркало приклади, — порадив Юра.", "— Сам приклади, — образився молодий. — Що робити? — запитав. — Він же зараз розкладатися почне.", "— Чому там розкладатися, — відповів Юра. — Шкіра та кістки. Лиши його.", "Юра припускав, що той, хто повідомить лікаря, сам і буде цього мерця виносити. Тому розгорнув принесений йому минулорічний випуск «Національної географії» й несподівано для самого себе зачепився за матеріал про тваринний світ Месопотамії. Месопотамія, думав, Месопотамія — щось пов'язане з водою. Щось із каміння та піску. З тваринним світом у Месопотамії складалося не найгіршим чином — стверджували в журналі. Худоба здебільшого належала монастирям, тварин приносили богам у жертву, у подяку за щедроти, повертаючи таким чином борги. Прочитавши про борги, Юра занервував і відклав журнал убік. Засинаючи, слухав човгання малого. Навіть не повертаючись, знав, що той кружляє довкола мерця. Смерть притягує, особливо чужа.", "Надвечір прокинувся, визирнув за вікно. Темні дерева, ранні сутінки, початок липня. Молодий сидів на сусідньому ліжку, не відводячи очей від трупа.", "— Ми що, — спитав, побачивши, що Юра прокинувся, — будемо спати з ним в одній кімнаті?", "— Спи в коридорі, — порадив Юра.", "Але той лише налякано пересмикнув плечима. Молодого звали Саша. Саня, — сказав він під час знайомства. Був насправді не такий і молодий — років двадцять, просто виглядав недосвідчено. Особливо коли порівнювати з тими, хто вже помер. Худий, тренований, грав у футбол. Постійно гриз нігті, від чого мав рожеві пальці. Мав також нестрижене чорне волосся й тріщину в нозі. Через неї сюди й потрапив. Після травми в лікарні порадили обстежитись, як це й буває зазвичай. Зробив знімок, лікарі щось знайшли. Саня стверджував, що це в нього від стресу. Лікувався близько місяця, а все ніяк не міг звикнути. Провідувала його мама, передавала привіти від команди. У стаціонар, схоже, потрапив уперше. Боявся мертвих. Тепер сидів у футбольних шортах і червоній майці, на чолі від напруження проступили вени, мабуть, уявляв, що йому сьогодні буде снитись. Юра не витримав, накинув сорочку, вийшов у коридор, знайшов лікаря. З лікарем вони підтримували один одного — лікарю хворі теж не подобались. Кому будуть подобатись доходяги, що постійно намагаються виплюнути таблетки й пронести в палату алкоголь? Юра кивнув, лікар важко підвівся, вийшов за ним. Був заповільний, як на свій вік, проте інтелігентний і доволі привітний. Звик перебувати серед хворих, скидався поміж них на свого, вирізнявся хіба що білосніжним халатом та окулярами в тонкій золотій оправі на повному обличчі.", "— Ну, і куди я його? — зайшовши й сховавши пухкі долоні до кишень халата, кивнув на мерця. — Хай уже лежить до завтра.", "— Може, у коридор винести? — невпевнено запропонував молодий.", "— Ще наступить хто вночі, — не погодився лікар. — Усе, — сказав, — відбій.", "— Відбій так відбій, — погодився Юра, стрельнув у коридорі в якогось доходяги сигарету, вибрався чорним ходом надвір. Сів на бортик фонтана, знайшов заникану для таких випадків запальничку. Ночі в липні короткі, навіть не накуришся.", "Фонтан стояв посеред великого прохідного двору, навпроти головних дверей диспансеру. Був засипаний торішнім листям і недопалками. Води в ньому не було. Причому ніколи. Жовта будівля виступала з-поза дерев, вікна на першому поверсі стояли темні, з другого, де знаходились палати, падали жовті плями світла, вихоплюючи у темряви з рук метеликів. Доходяги готувались до сну. У темряві хотілося лишатись. Загасив недопалок, зібрався йти до палати. Молодий чекав на нього, не лягаючи. Спробував розговорити, але Юра відмахнувся й завалився прямо на «Національну географію». Молодий ображено сховався під ковдру, кидаючи в бік мерця розпачливі погляди. Юра подумав, що поруч із мерцем, мабуть, лежить його душа. Лежать собі, тісняться, мов родинна пара, що так і не надбала двомісного ліжка.", "Юра ховався тут третю добу. Як чоловік навчений, він відразу завів необхідні знайомства — телефонував від лікаря, брав, не повертаючи, посуд у сестричок, мінявся з хворими тютюном. Нагадувало трішки дембель. Або першу його відсидку, коли сиділося легко й ненав'язливо.", "Рік узагалі не задався. Студію, яку він щойно відремонтував і запустив, уклавши в неї все, що мав, обібрали. Юра не вигадав нічого кращого, як влізти в борги. Позичив у Чорного двадцятку. Чорний сказав: не хвилюйся, працюй, потім віддаси. Запустив усе по новій. Минуло кілька місяців. Потрібно було віддавати борг. Але віддавати не було з чого. Чорний довго про себе нагадував. Жартував по телефону. Потім пару разів прийшов на студію. Питав про страхування, протипожежний захист. Цікавився справами сім'ї. Сім'ї в Юри не було: з дружиною розлучився, донька виросла й жила в Канаді. Зі старим не спілкувався років десять. До того років десять хотів його прирізати. Про що тут говорити. Життя в рок-н-ролі передбачає ненависть і прокляття. А Юра в рок-н-ролі був років сто. Одне слово, коли Чорний почав надсилати порожні есемеси, Юра запив. А коли його виводили, тоді й дізнався, як говорять на телебаченні, про страшний діагноз. Ну, як страшний, думав він, стоячи на порозі поліклініки, з білим парадним піджаком в одній руці й конвертом з іще вологими плівками в іншій, як страшний — буває гірше. Іноді людина народжується без голосу. А іноді з таким голосом, що краще б його ніхто не чув. Іноді людям відрізають зайві частини тіла, іноді ці зайві частини в них виростають. Не зрозуміло, що краще. Принаймні, я не ходжу під себе. Ладно, — сказав сам собі, — не сси, все буде добре. Перехопив у когось сигарету, пішов здаватися в диспансер просто в білому піджаку. Пройшов санпропускник, познайомився з персоналом, вибив місце в хорошій палаті — усього на три ліжка. У палаті лежав молодий. Поруч із ним валялись футбольні газети. На сусідньому ліжку хтось тихо, проте впевнено доходив. Чисто, прибрано, може бути, — подумав Юра й вирішив залишитись. Відразу заприятелював із лікарем, підкотився до сестрички, перекурив із контингентом коло порожнього фонтана. Вимкнув мобільний. Від лікаря зателефонував кільком друзям. Пояснив, де він, що принести, про що мовчати. Друзі потім приходили й стояли під вікнами. Усередину заходити боялись.", "— Ну да, стрес, — говорив він першого вечора молодому, якому в сутінках ставало особливо печально, і він починав скаржитись Юрі на долю. — Стрес — це коли ти граєш на електрогітарі, а в залі немає електрики. Звикли ми на все скаржитись, розслабились, почали здавати. Навіть не знаємо, з чого насправді складаються наші внутрішні органи. А дістанешся до них — там таке зло, що й не знаєш, чи справді треба його лікувати. Ще вилікуєш, чого доброго.", "Уночі за ним зайшла сестричка, Алла. Викликала в коридор, довго шепотіла при місячному світлі. Лишила номер свого телефону, побігла додому. Юра повернувся до палати, дістав мобільник. Згадав про Чорного, заховав. Лежав, замріяно дивлячись за вікно. Нормально, думав, пересиджу місяць, далі буде видно. Лікарні він любив — у лікарнях було чисто. Удома в нього так чисто ніколи не бувало. За останні років двадцять він лежав із двома ножовими пораненнями, з опіком, з нирками, з різними запаленнями. Уже не говорячи про наркологію. Тому жодної паніки не відчував: ще одна цеглина в стіну, думав, ще один труп у ріку. Трішки давив вік, дещо трясло після останніх ранкових крапельниць, легко накочувався сон, змішуючи запахи листя й казенних простирадл. На сусідньому ліжку лежав доходяга. Дихання його уповільнювалось, ніби ріка в низині. Мав ще два дні життя, купу часу, купу смутку."], ["Це було першої ночі, а за три дні, щойно мерця винесли й постіль за ним перестелили, до палати підселили новенького. Шо за фізрук? — подумав Юра, розглядаючи щойно прибулого. Був це чоловік у літах, і одяг теж мав давній, хоч і акуратно ношений та ремонтований. Носив бавовняний запрано-блакитного кольору спортивний костюм із білими тонкими лампасами. Святково зблискували гостроносі лаковані черевики. А проте справляв приємне враження. Можливо, доброю губатою посмішкою, можливо, великим клоунським носом, а можливо, що й рештками волосся, хвацько перечесаними через вижовклий череп. У руках тримав два роздуті пакети Г'юґоБосс. Пакети запхав під ліжко, розгледівся, з ходу визначив, хто тут за головного. Кивнув молодому, підсів на ліжко до Юри, змовницьки кивнув у бік Санька, мовляв, що, заябує напарник? Юра дипломатично відклав «Національну географію», показуючи: давай, говори, як маєш що. Новенький назвався Валерою й говорив, зазираючи Юрі просто в обличчя, аби нічого з того, що він говорить, не лишилось поза увагою. Очі в нього були під колір костюма — такі ж запрані, такі ж блакитні. Постійно сльозились, ніби він на щось скаржився.", "— Як тут? — запитав. — Жити можна?", "— Можна, — відповів Юра. — Якщо недовго.", "— Довго й не треба, — погодився з ним Валера. — Довго лікують лише психів — їм на роботу не треба. Я все життя з психами, — раптом признався Валера. — Я в цирку працюю, — пояснив.", "— Клоуном? — чомусь одразу запитав Юра.", "— Ні, — не образився той, — завгоспом.", "І, повернувшись на своє ліжко, тут-таки взявся переповідати історію життя. А було воно в нього, ясна річ, сповнене пригод і небезпек. Юра ще подумав, що люди з такими широкими та беззахисними посмішками зазвичай і потрапляють до найбільш глибоких кар'єрних ям. Вони дивляться на світ настільки широко розплющеними очима, що просто не бачать, куди йдуть. Валера оповідав про солодкий і таємничий світ циркового ремесла, про строгі порядки й суворі звичаї, древні ритуали та внутрішньоцехову ієрархію. Кидався датами, цитував поетів, згадував імена артистів і дресированих тигрів, ділився способами страховки. Говорив більше до Юри, проте молодий слухав уважніше. Можливо, любив цирк, можливо, просто тішився, що на сусідньому з ним ліжку лежить не труп. Юра неуважно кивав у відповідь, підтакував чи заперечливо хитав головою, коли завгосп закликав його у свідки, але незабаром закрився географічним журналом, намагаючись зосередитись на тваринах і птахах Месопотамії. Доки він говоритиме? — думав. — Розповідає вже годину, а мова все ще йде про його вступні іспити. Скільки ж у нього історій? — нервував. Валера натомість згадував сонячні дні й фіолетові ночі, яскраві програми й гарячих жінок 60-х, котрі любили цирк так, як жоден християнин не любить свою церкву. Відповідно його теж любили, бо як можна було обійти його увагою? Як? — вигукнув Валера, дістаючи з пакета пачку старих кольорових фотокарток, дбайливо складених у конверт з-під фотопаперу. На конверті було написано «Унібром», Юра відразу ж згадав ці конверти, що продавалися за часів його дитинства, і подумав, скільки ж йому, Юрі себто, років, як багато непотребу він бачив, як безнадійно відстав від життя. Подумав, коли востаннє був у цирку. Років десять тому. Чи більше? Мабуть, десять.", "Машка була вже цілком дорослою дівчинкою, у цирк іти не хотіла, проте її традиційно не питали, Юра, повернувшись додому після чергового запливу, намагався наново будувати родинні стосунки. Цирк нагадував Рейхстаг після штурму: обличчя в усіх були радісні, проте приміщення явно потребувало ремонту. Холодні коридори, жінки в шубах, коньяк у буфеті й тварини Месопотамії на печальній арені. Машка плакала, їй було шкода левів, жінки сміялись. Додому добирались пішки — не хотілося їхати з цими людьми в одному трамваї. Тепер він дивився на конверт у руках старого й розглядав його пальці — темні від тютюну, покручені часом та алкоголем, побиті й пошрамовані, мовби хтось ставив йому на пальцях мітки після кожного прожитого року. А Валера, побачивши, який ефект справляє на присутніх його оповідь, пожвавився, дістав із конверта одне фото, очевидно, улюблене, ніжно-недбало кинув на нього оком і передав молодому. Дивись, пацан, — сказав, ледь стримуючи хвилювання, — це я в сімдесят першому. Бачиш, який я був? І скажи, як після цього не любити цирк? Молодий, захоплено гмикнувши, передав фото Юрі. Юра приклав його до розгорнутого журналу. На сусідній сторінці був зображений дикий пустельний мул. На фото Валера мав незалежний вигляд, горду поставу, пронизливі очі, а головне — густе волосся на голові, піратські баки й кавалерійські вуса. Юра мимоволі порівняв два фото — Валери й мула. Щось є, подумав, щось, безперечно, є. Віддав фото молодому, ще якийсь час послухав. Коли оповідь дійшла до приймання пологів у левиць, непомітно закрився від усіх журналом, почав ловити знайомі літери, складати їх у слова, вибудовувати з цього всього речення, відсіювати почуте, відокремлювати наговорене циркачем від написаного в журналі, розплутувати кольорові шовкові нитки історій, розв'язувати вузли, терпляче брести в сонячному промінні, тримаючи в руках рятівну нитку. Зважаючи при цьому на те, що кіньми в Месопотамії не їздили верхи й не використовували їх для перевезення вантажів. Їх впрягали хіба що в бойові та мисливські колісниці, полювали з ними на диких птахів і хижаків, що підходили під міські вежі. Ставлення до коней загалом було ніжним і уважним, їх цінували й ними опікувались. Зворушують і змушують замислитись настанови тодішніх конюхів, які давали поради щодо догляду за кіньми, наполегливо радячи власникам цих прекрасних тварин дбати про їхню гігієну та дієту, не перевантажувати їх довгими перегонами, а за першої потреби пускати тварин до помешкань, вкладати їх на долівку поруч із собою, спати з ними в одній кімнаті, відчуваючи їхнє дихання, накривати їх теплими тканинами в зимну погоду, розуміти їхній настрій, вислуховувати їхні скорботи. Сон робить нас сильними, говорили конюхи. І безпорадними, додавали. Бо інша річ — зебри. Зебри в трупу потрапляли часто не надто законними шляхами. Їх ввозили через азійські республіки під вигаданими іменами, дописуючи їм роки й міняючи їм у супровідних документах стать та історії хвороби. У циркових загонах їх тримали разом, вони швидко звикали до великої галасливої аудиторії, трималися купи, а коли хтось із них помирав, обступали померлого колом, не підпускаючи працівників. Так, ніби приносили жертву справедливим богам. Виринувши з цього липкого потоку, Юра важко підвівся й побрів на перекур. Що за зебри? — думав незадоволено. — Звідки взялися зебри?", "Уночі він дочекався, доки всі заснуть, знайшов сестричку, що спала на розкладачці в ординаторській, залишився з нею. Та від хвилювання навіть не знала, що говорити, лише заборонила з нею цілуватись. А більше не забороняла нічого, просто намагалася робити все трішки тихіше, аби не побудити доходяг корабельним скрипом розкладачки. Волосся її, жовте й сонячне, було таким довгим, що в різних місцях пахло по-різному — то гарячим вітром, то темною річковою водою. Горло її здавалося ніжним і постійно застудженим. Була вона стриманою і втомленою. Сон робить нас сильними, думав Юра, засинаючи, і безпорадними, додавав, слухаючи її дихання.", "Вікна виходили в затінок дерев, гілки торкались підвіконь, ловлячи й надламуючи сонячне проміння. Час від часу залітали оси, проте, відчувши запах хлорки й смерті, що стояв у коридорах, не затримувались і вилітали надвір, утрапляючи в густу липневу павутину. Десь о десятій на подвір'я вкочувалася міліцейська автівка. З неї патруль виводив Артема — веселого дезертира, пійманого зо два місяці тому. Тепер його щоранку привозили із СІЗО на процедури, й Артем неабияк радів щоденній можливості вирушати в сповнену пригод подорож в оточенні лінивих ментів. Вітався з Юрою, кричав щось запальне сестричкам, огризався до патрульних, загалом поводився так, ніби все життя мріяв полежати в диспансері, а тут несподівано його мрію здійснили.", "Зранку до Юри прийшли друзі, чекали при фонтані, з місцевими не говорили. Коли Юра вийшов, почали розповідати. Один із них, Жора, що працював у цілодобовій аптеці, поводився більш упевнено, як людина зі світу медицини, хапався за Юрину сорочку довгими чіпкими пальцями, схилявся йому прямо до вуха, нашіптував, мовляв, Чорний тебе шукає, пробиває по знайомих, приходив до старого. І що старий? — зацікавився Юра. Вигнав його, — відповів Жора. Правильно зробив, — потішився Юра. Ладно, — сказав, — ідіть, не тріпайтесь лише. В палаті Валера все випитував його про Аллу, вимагав подробиць, висловлював підтримку, пропонував допомогу. Молодий зрештою не витримав і, грюкнувши дверима, зник у коридорі. Все, не заводься, — строго сказав Юра циркачеві, а сам подумав, що з молодим діються прикрі речі. Схоже, сестричка йому подобалась. Вона тут, схоже, усім подобалась. Але в молодого від неї просто відбирало мову, Юра це добре бачив. Коли заходила до палати, молодий червонів і мовчав. Дивився на її волосся, на підстрижені нігті, помічав, безперечно, шрам на зап’ясті, звертав увагу, поза всяким сумнівом, на втомлене обличчя, на золотий медальйон і відсутність обручки, на високі підбори й голосний сміх. Вона взагалі весь час сміялася, ніби тішачись перебігом лікувального процесу. Мала гострі зуби, під такими зубами хотілося загинути. І видихав молодий лише тоді, коли вона виходила. Юра подумав, що молодий мав би його ненавидіти. Мабуть, так. Згадав, як ненавидів у дитинстві свого старого, коли в того з'являлися нові подружки, як дратувався, приходячи пізно додому й знаходячи на підлозі їхні речі, панчохи й светри, витерті джинси, яскраві сукні. Вони пахли дорослим жіночим тілом, Юра підхоплював цю теплу тканину, відчуваючи її легкість, і мовчки закидав старому до кімнати. Той злостився й сварився, але зробити вже нічого не міг — рано чи пізно настає той час, коли кожен хлопчик має приставити ножа до батьківського горла. Питання лише в тому, що робити далі.", "Валера тим часом знову взявся за своє. Дочекавшись молодого, що мовчки заліз на ліжко й відвернувся до стіни, продовжив оповідати байки. Цирк, говорив він, дав мені все. Роботу, освіту, любов. Цирк навчив мене ніжного ставлення до дітей і шанобливого — до старших. Ти, як Мауглі, говориш, — перебив його Юра, але старого циркача було не збити, він лише всміхнувся всіма своїми складками й почав розповідати про циркові династії, про славні традиції й родинні рецепти накладання клоунського гриму, що передавалися від батька до старшого сина, змальовував пристрасті, що вирували в гримерках, розкривав криваві таємниці й ділився секретами таємних змов, говорив і говорив, навіть під час обходу не вмовкав, розповідав Аллі про свою першу дружину, показував лікарю фото своїх доньок, пропонував з однією з них одружитись, а коли всі разом з'ясували, що вона вже давно заміжня, натякнув, що все можна владнати — була б добра воля!", "Династія, думав Юра, тримаючи в руках жменю кольорових таблеток. Старий завжди хотів, аби вони працювали разом. Справжні чоловіки не займаються музикою, — говорив він Юрі. Справжнім чоловікам і без того є чим зайнятись. Одного разу старий узяв його із собою на якісь сезонні заробітки. Було це так само посеред літа, стояли спекотні дні, старий сидів із такими ж роботягами, як сам, десь на запасних коліях, просто на шпалах, чекаючи на бригадира, аби йти й вивантажувати з вагонів ящики з консервами, Юра сидів поруч, у білій сорочці й темних робочих джинсах, чи не востаннє вони сиділи так близько один до одного, під відкритим гарячим небом, передаючи один одному сигарети. Старий ділився з ним своїми сигаретами, ніби кажучи: тепер ти з нами, тепер ти такий, як ми всі. Вони всі ділилися сигаретами й водою під пекучим сонцем, у простому одязі, розбитих черевиках, справжні чоловіки зі справжніми проблемами. Ага, підтягував Валера, мовби почувши його думки, розбиті черевики, важкі від поту тренувальні костюми — працювати доводилося зранку й до вечора, усе життя вміщалося в цих стінах, пропахлих запахом чоловіків і жіночими парфумами, скільки щасливих ночей, скільки кривавих ранків! За кожною біографією стояли свої образи й освідчення, за кожними дверима народжувалась любов і помирала надія, чоловіки зранку годували диких тварин, ламаючи їм характери й роблячи м'якими їхні рухи. А жінки стояли в холодних коридорах, виношуючи у своїх серцях плани зради й утечі з цього балагана. Але не можна втекти від себе, не можна втекти від своєї печалі, і тому погляди їхні були сумні, а рухи на манежі — точні й невблаганні.", "Уночі Алла ніяк не могла заснути, будила його, витягала зі сну. Прокидаючись, він не розумів, де знаходиться, відразу ж думав про Чорного, потім на дотик упізнавав її, заспокоювався, просив принести води. Ще просив розповісти про батьків, цікаво, думав, що в неї з династією, чого від неї хотіли.", "— Тата я не пам'ятаю, — розповіла вона. — Коли він загинув, я ще не ходила до школи.", "— Пілот? — запитав дипломатично Юра.", "— Угу, — підтвердила Алла. — Випробувач. Двічі лікувався в ЛТП.", "— Ясно, — з повагою відповів Юра.", "— Я з вітчимом завжди товаришувала, — продовжила вона. — Але з ним теж щось зробилося. Працює садівником за містом. Розмовляє з деревами.", "— Може, йому просто поговорити хочеться, — припустив Юра.", "— Ясно, що хочеться, — погодилась вона. — Він у в'єтнамців працює. Не з в'єтнамцями ж йому розмовляти. Краще вже з грушами."], ["На ранок, повернувшись до палати, Юра спробував розговорити молодого. Той відповідав коротко й жорстко, на контакт не йшов. Схоже, злився. Навіть Валера замовк, сидів і спостерігав зі свого ліжка, що відбувається. Юра не став тиснути. Добре, подумав, розберемось. Накинув сорочку, пішов на перекур. Коло фонтана Валера його наздогнав.", "— Що з молодим? — запитав.", "— Біситься, — пояснив Юра.", "— Через сестру?", "— Ну.", "— Я так і подумав, — зрозумів Валера. — Що робити будеш?", "— Доведеться одружитися, — сказав Юра.", "— Ти що? — жахнувся старий. — Ти що, Юр? Ти бачив? Ти бачив її? — перепитав із жахом.", "— Темно було, — віджартувався Юра.", "— У неї точно хтось є, — відчайдушно шепотів Валера. — у такої жінки не може нікого не бути. Вам усім голови повідбивають — і тобі, і молодому.", "— Молодому за що? — не зрозумів Юра.", "— За компанію. Я тобі кажу, — не міг заспокоїтись Валера. — Точно хтось є. Ти подивись, яка вона обережна.", "— Ну, вона на роботі.", "— Чорта з два, — не погодився Валера. — Я на роботі знаєш що робив? І хто мені що казав? Ось побачиш, — шепотів він, боязко озираючись навколо. — Є тільки один спосіб, — сказав змовницьки.", "— Ну? — Юра викинув недопалок.", "— Втечи з нею.", "— Куди?", "— Куди-небудь. Подалі. Ми з моєю першою дружиною так і зробили. Я тобі фото показував?", "— Своє?", "— Її.", "— Показував.", "— Ну ось. Я її вкрав. Просто з репетиції. Тигрів потім пожежники ловили.", "— Ну?", "— Втекли. У Крим. Але через місяць повернулись.", "— Тигри?", "— Ми.", "— Для чого?", "— Для чого? — перепитав Валера. — Сам не знаю. Злякались, запанікували. Вирішили, хай усе буде, як раніше. І все стало, як раніше. Себто погано. А ось ти не повернешся. Ти зможеш.", "— Не хочу я нікуди тікати, — занервував Юра. — Мені й тут добре.", "— Тут? — Валера кивнув головою на диспансер. — Тут тобі добре?", "— З ким ти взагалі живеш? — запитав її Юра за кілька днів. Вона знову була на чергуванні, вони сиділи в темній кімнаті, він курив, навіть не виходячи надвір. Візьму, думав, і спалю тут усе разом із контингентом.", "— У мене вдома є тварини, — пояснила Алла.", "— Ясно. Як тебе називали в дитинстві?", "— О, — засміялась вона. — У мене було фантастичне ім'я. Мене всі називали Акулою.", "— Це через домашніх тварин?", "— Через посмішку, — пояснила Алла. — У мене була особлива посмішка. І купа друзів. У школі я ледь не вийшла заміж. У нас усі рано закохуються. Особливо жінки. Він був на пару років за мене старшим. Ось як ти, — вона торкнулася в темряві його волосся. Юра здригнувся. — Тому в нас нічого не вийшло. Я переживала, думала, що це мені кара за погану поведінку. Ще він був боксером. Тоді я взяла й переспала з усіма його друзями.", "— З усіма відразу? — не зрозумів Юра.", "— З усіма по черзі.", "— Любиш бокс? — поцікавився Юра.", "— Ладно тобі, — образилась Алла.", "Юра докурив, повернувся в палату. Сказав, що сусіди нервують, коли він не ночує вдома.", "Кілька днів її не було. Юра пішов до лікаря — той пояснив, що відпросилася, щось із батьком. Юра уявив, як вони на пару з вітчимом стоять і розмовляють із фруктовими деревами. Добре було б справді її забрати звідси, подумав. А то як студенти — спимо на розкладачці. З іншого боку, востаннє жінка затрималась у нього на довший час років п'ять тому. Забрали її санітари. Юра не був певен, чи готовий до аж настільки серйозних стосунків.", "Молодий заспокоївся, тримав свої образи та підозри при собі. Юри уникав, більше спілкувався з циркачем. Циркач, своєю чергою, молодого оминав, чіплявся до Юри, а коли той брався за «Національну географію», волів просто походити коридорами, заважаючи персоналу.", "Десь ближче до середини липня знову заявився Жора. Прийшов просто з аптеки, з нічної зміни, ще до обходу. Викликав Юру свистом, ховався за деревами. Тіні зранку падали густо й холодно, Юра звично знайшов сорочку, обережно, щоби не розбудити сусідів, вийшов надвір. Жора привітався, потягнув Юру в тінь. Розповів, що Чорний нервує, знову приходив до його старого, погрожував. Старий, ясна річ, не злякався, але з Чорним були ще двоє. Обіцяли наступного разу спалити будинок. Вони ж спалять, переконано говорив Жора, їм можна, вони ж пожежники.", "— Ти б віддзвонився Чорному, поговорив би, — наполягав він.", "— Шо ти так напружуєшся? — не зрозумів Юра. — Тебе Чорний просив?", "— Іди ти на хуй, — образився Жора. — Про старого подумай.", "— Ладно, — відповів Юра, прощаючись, — подумаю.", "Ну, а що тут думати? — думав він. Потрібно вибиратись. Потрібно домовитись із лікарем. Потрібно заспокоїти молодого. Потрібно вирішити щось з Аллою-Акулою. Потрібно поговорити з Чорним. З іншого боку, ну що він зробить, Чорний? Ну, спалить старого. Юра сам бензину на розтопку принесе. Звикли ми всі скаржитись, думав він про себе, розслабились. Усе через родинні проблеми. Що за батьки? Один бичує, інший із деревами розмовляє.", "Сусіди мовби чекали, коли він повернеться. Щойно зайшов до палати, Валера вистромив голову з-під ковдри, а молодий, навпаки, під ковдру заховався. Юра сів поруч із циркачем.", "— Так що ти там про першу дружину розповідав? — запитав, поплескавши старого по коліну.", "Валера пожвавився, остаточно прокинувся, прокашлявся, сів поруч із Юрою.", "— Моя дружина, — почав, — була, до речі, місцевою знаменитістю. Повечеряти з нею в ресторані було за честь.", "— А тигрів вона із собою на вечерю брала? — не повірив Юра.", "— Ну що ти, — образився старий, — я ж серйозно. Я коли поступив у трупу, вона на мене навіть не дивилась. У неї був такий вибір! Я її з першого погляду полюбив. А потім ми втекли, ну, я розповідав. Мене, правда, ненадовго вистачило. Молодий був, розгубився. Слабак.", "— А потім? — запитав Юра.", "— А потім я її втратив. Сам винен, все розумію. Просто не втримав її.", "— У сенсі страховки? — не зрозумів Юра.", "— У сенсі пішла вона від мене. На гастролях.", "— Що за гастролі?", "— У соціалістичній Румунії. Ми там місяць терлися серед румунів. Я був молодий, самовпевнений, зовсім не розумів, що мені треба, чого хочу. Забував про неї, займався собою. Вона це відчувала, якийсь час намагалася все виправити, але я нічого не хотів чути. Думаю, усе змінилось після того, як ми повернулися з Криму. Вона побачила, що я слабак, що легко відступаюсь, що не буду за неї гризти землю. Не сказала нічого, але зрозуміла. А потім на гастролях у них раптом почалося з одним із наших, з адміністрації. Я навіть не встиг нічого зробити. Повертались вони разом. Я хотів звільнитись. Але знову ж таки не наважився.", "— Да, Валер, — поплескав його по плечу Юра. — Хто ж так робить?", "Валері, схоже, подобалось, що весь час говорили саме про нього. Навіть молодий вистромився з-під ковдри й печально слухав любовні історії старого.", "— Так і є, — погодився Валера. — Думаєш, я сам не знаю? Навіть згадати соромно. Живеш із нею, думаєш, що це надовго, що все гаразд. Перестаєш її помічати, забуваєш про те, що все може легко й швидко змінитись. А одного разу саме так і стається. І ти не розумієш, а що ж змінилося. Де я помилився? І починаєш звинувачувати всіх навколо. Хоча ніхто, крім тебе, ні в чому не винен. Починаєш робити дурниці. Намагаєшся все виправити, намагаєшся все забути. А як можна виправити те, чого вже немає? І як можна про все забути? Ніяк. Не можна втекти від себе. Не можна втекти від своєї печалі.", "Старий щось зовсім розклеївся, Юра подумав, що не варто було з нього все це витягати. Краще вже говорити про зебр. Хотів підвестись, але Валера легко притримав його за лікоть.", "— Узагалі ці гастролі… Це ж зовсім інший час, інші порядки. Про нас там просто забули. Відпрацювали місяць, почалась зима, треба повертатись. Адміністрація собі зникла, а нас лишили. Навіть бензину не було — наші його місцевим увесь продали.", "— Так ви б на зебрах назад, через перевали, — пожартував Юра. Але, поглянувши на розпачливе губате обличчя циркача, виправився: — Ну, себто на конях.", "— Куди там, — гірко відповів той. — Вони ж у нас не тяглові.", "— Як у Месопотамії, — сказав Юра."], ["Розмова обірвалась, бо й додати було нічого, і наговореного виявилося забагато. І всі сиділи, чекаючи обходу й не знаючи, чим зайнятись. А коли до палати разом із лікарем зайшла Алла, котячи перед собою возика з ліками, все стало зовсім погано — так це було невчасно й недоречно. А найгірше, що за ними пхалась мама Сані, не відстаючи від лікаря ні на крок, щось у нього випитуючи й чогось від нього вимагаючи. Обличчям лікаря гуляв нервовий рум'янець, він постійно, хоч і занадто м’яко, повторював мамі, що сюди заходити не можна, що це заборонено, що це небезпечно врешті-решт. Але мама натягла на лице пов'язку й не зважала на жодні заборони, а лікар був надто делікатною та інтелігентною особою, аби вигнати її на очах сина-футболіста. У палаті мама зовсім осміліла й почала хазяйнувати. Відразу ж підсіла до молодого, потріпала його по загривку, почала діставати цукерки та печиво й питати про самопочуття. Була вона вчителькою, і подібна була на вчительку, і поводилась, як типова вчителька: навіть коли питала про здоров'я, виникало відчуття, що за неправильної відповіді отримаєш погану оцінку. Молодий нервував, спочатку відмовчувався, потім пошепки просив маму не заважати лікарям, кидав принизливі й пронизливі погляди в бік Валери, аби той заступився, упівока спостерігав за реакцією Юри, боявся подивитися на сестричку й страшенно знічувався, відповідаючи лікарю. А мама лікаря ніби й не помічала, поводилась, як на контрольній, лише й чекала, коли лікар з Аллою вийдуть, залишивши її наодинці із сином. Тож коли Алла приступила до молодого й висипала йому в простягнуту долоню (вона помітила, як дрижать у нього руки, помітила краплі нервового поту, встигла побачити синці під очима, зрозуміла, що він погано спить, що йому тут узагалі недобре, що він би з радістю звідси втік, але куди втечеш — удома мама, і не зрозуміло, де краще: тут, поміж трупів, чи там, з її любов'ю; встигла помітити все це за якусь мить, встигла здивуватись і запам'ятати) з десяток таблеток, мама, не звернувши на неї жодної уваги, почала діставати з-під ліжка синові шкарпетки, сварячи того за неорганізованість і неохайність. Алла спробувала перевести все це на жарт і навіть усміхнулась їм так, як вона могла, своєю неймовірною посмішкою, й аж тут малого порвало: надто довго сиділа в ньому ця пружина, надто сильно підтискала вона серце, виштовхуючи його з грудей, надто довго він стримувався, надто багато від нього вимагали. Місяць на цій койці, з цими мудаками, один із яких давно впав у маразм, вигадуючи різну хуйню про зебр і антилоп, а другий, блядь, узагалі ставився до нього, як до урода, так, ніби він, блядь, тут крайній і має за все відповідати, так, ніби до нього, сука, можна ставитись, як до пацана, не помічаючи, блядь, упритул, на хуй! Молодий вибив мамі з рук ці йобані шкарпетки, запустив печивом об стіну (лікар устиг відхилитись, Юра здивовано підвівся) і зайшовся криком, пояснюючи цій ідіотці, щоби його, блядь, не чіпали, щоби залишили його, блядь, у спокої, що він, блядь, сам, на хуй, розбереться зі своїми шкарпетками, і щоби вона, стара ідіотка, валила звідси й більше не приходила.", "Усі завмерли, не знаючи, що сказати. Лікар притримував за плече Аллу, мама розгублено стояла посеред кімнати й хотіла заплакати, проте не вміла — розучилася за сорок років педагогічної діяльності. А молодий дивився на них усіх із ненавистю й розпачем і вже підбирав слова для нових проклять, коли раптом Юра його перебив.", "— Ну ти, — сказав, — клоун. Що на матір кричиш?", "— А тобі що? — ошкірився на нього молодий, побачивши нарешті перед собою супротивника.", "— Рот закрий, — порадив Юра.", "— Сам закрий, — молодий вирішив не відступати.", "Юра різко й сильно заліпив йому долонею. Молодий від несподіванки не втримався, упав на ліжко, прямо на цукерки з таблетками, тут-таки оскаженіло підстрибнув угору, кинувся було до Юри, проте побачив його погляд і зупинився, не наважився. Лише обернувся й традиційно вискочив у коридор. Мама побігла за ним. Лікар почекав, вийшов слідом. Алла подивилась на Юру суворим поглядом і теж покотила свого возика. Валера побачив коло себе, на ковдрі, шматок печива. Підняв. «Ювілейне», — сказав, прожувавши.", "Вона спробувала його не пустити. Сказала, давай завтра поговоримо. Уже пізно, сказала схвильовано, притримуючи двері ординаторської, розбудиш усіх, іди. Чорта з два, не погоджувався Юра, ніжно, проте наполегливо ламаючи двері. Врешті-решт вона відступила.", "— Ну, все, — сказав він, — ти показала характер, я побачив. Для чого двері тримала?", "— Ти ж не знаєш, — відповіла вона, — коли звідси вийдеш. І чи взагалі вийдеш. Правда ж? Для чого тоді все це починати?", "— Як це не знаю? — не погодився Юра. — Ще б мені не знати. Ясно, що вийду. Завтра й вийду. Теж мені проблема. Ось коли мені апендицит вирізали й лікарі забули мене на столі, бо це якраз на Великдень було — ось тоді я справді сумнівався, чи вийду.", "— Ладно, — перебила вона, — не заливай, забули. Ти для чого малому завалив?", "— Щоб школу не пропускав, — відповів Юра. — Що там твій вітчим? — запитав.", "— Нормально, — відказала вона. — Скоро будуть збирати врожай. Переживає.", "— Ну, правильно, — погодився Юра. — За що ще й переживати.", "Коли я так востаннє розмовляв із жінкою? — думав він уже після того, як вона заснула, а він сидів, обережно поклавши її ноги собі на коліна. — Особливо вночі, коли? Уночі хіба з диспетчерками таксі. А так, щоби сидіти поруч, торкатись її стіп, зігрівати долонями її литки — навіть не згадаю. Сидів, притулившись головою до стіни. Вона швидко заснула: тримала якийсь час його за руку, потім відпустила, він підвівся й підійшов до вікна, дивився на темне подвір'я, освітлене ліхтарями, тихе й порожнє. А коли повернувся, вона вже спала. Обережно сів, притулившись до стіни, вона крізь сон знову схопила його руку і знову відпустила. Юра чомусь згадав ту зиму, особливо довгу й важку, коли на кухні лишився тільки чорний чай і про щось інше можна було навіть не думати. Вони й не думали: життя видавалось легким та безкінечним, він був зовсім молодий, мав не такі ламані кості, не таке зношене серце. Альона ставилась просто до їхньої бідності, нічого, говорила, будеш збирати повні стадіони — обов'язково заробиш. Можна почекати. Вони тижнями тягались квартирами знайомих, ночували на підлозі, пили на зимових дахах. Золоті часи, думав Юра тепер. Усе щойно починалось, усе давалось їм до рук, і лише їхня легковажність і неуважність не дозволяли їм прямо тоді витрусити зі світу те, що їм належало за правом. А потрібно було витрусити, жалкував Юра, потрібно було вибити з життя все до останньої копійки. Хто ж знав, що все так безнадійно зміниться, що все так швидко минеться. На початку березня Альона таки підхопила запалення легень і надовго злягла. Гроші швидко закінчились. Узяти їх не було де. Ліків у домі не було. Харчі так само скінчились. Усі друзі й знайомі, з якими вони до цього водили безкінечні святкові хороводи, раптом кудись зникли. Розсмоктались у крижаних бузкових сутінках. Альоні ставало все гірше, вона вже кілька днів майже не вставала з ліжка, лежала, накинувши на себе всі ковдри й куртки, що були вдома. Він сидів поруч із нею й тримав її за руку, прямо як тепер, ось тут, тримав і відчував, як закипає її тіло, як жар блукає під шкірою, як вогонь випалює її зсередини. Вона не скаржилась, лише просила не відпускати, тримати її. Він і тримав, аж доки їй не стало краще. Куди все це потім зникло? Як про все це можна було забути, як можна було все це втратити? Він згадав, коли востаннє з нею бачився — пару років тому, коли передавав щось для Машки, потім шкодував, що взагалі все це придумав — і чорний, виснажений погляд, втома й відчай, беззахисна оголена шия, крижані пальці. У вухах не було сережок, на руці не було годинника. Не було про що говорити, не було про що запитувати. Нас убиває слабкість, яку ми тримаємо в собі, позбутись якої нам так шкода. Вона вижирає нас ізсередини, наче вірус, вона не дає нам приймати правильні рішення, триматись за близьких нам людей, вона робить нас приреченими, хоча насправді ми такими не є. Юра відчув, що засинає. Добре, що не довелося ламати дверей, подумав насамкінець.", "Двері доводилося на ніч зачиняти. Аби не було протягів і до складів, де вони спали, не забігали дикі пси. Псячі зграї вартували під дверима, ховалися в морозяному привокзальному тумані, снували запасними коліями, задираючи писки й виючи в промерзле небо Бухареста. Зима видалася ранньою, паморозь лежала на дротах і яблуневих гілках. Склади швидко прогріли багаттями. Палили принесений із вокзалу картон або знайдену в товарняках солому. Тварини стояли сумирно, чекаючи щоденної їжі, уночі коні сахались від псячого виття, ніби остерігаючись смерті, що мала за ними прийти. Місцева влада присилала щоранку церковні делегації та парламентерів, до них виходили акробати й гіпнотизери й довго торгувались. Але команди відправляти їх не було, тож вони далі стерегли реквізит і випасали дресировану звірину, час від часу здійснюючи зухвалі рейди на передмістя та продуктові склади. Оббирали селянські угіддя, повертаючись на склади з провізією для себе й тварин. Спали, вклавшись поміж левами та лисицями, пили курячу кров, аби втамувати спрагу. Приносили тварин у жертву, просячи в небес благословення та доброї погоди. Місцеве населення чинило, як могло, спротив, захищаючи магазинний крам і домашнє добро. Врешті-решт, зваживши на кількість письмових скарг, — анонімних і надісланих цілими трудовими колективами, — керівництво вокзалу на власний ризик виділило трупі кілька плацкартних вагонів. Перед Різдвом, завантаживши тварин і реквізовані трофеї, потяг рушив на Схід. Вагони були обтяжені жіночими шубами й турецькими килимами, ящиками з апельсинами й ендеерівськими болоньєвими куртками. Найгірше було, що увесь цей час тварини народжували, кількість їх за накладними не збігалась, прикордонники нервували, залізничники розбігались по домівках, придорожні містечка зачиняли перед ними свої брами, мов перед приходом чуми. Зрештою їх випустили. Вони довго їхали, перебирались Карпатами, тижнями простоювали на маленьких станціях Східної Галичини, міняючи болоньєві куртки на овечий сир, і вперто рухались уперед — додому, туди, де на них уже й не чекали.", "І лежачи на своїй другій полиці, накрившись килимом, відчуваючи над собою шерех пташиних крил і мудре зміїне сичання, вибираючи час від часу з пташиних гнізд яйця й гладячи вовчі загривки, граючи в карти з повітряними гімнастами й виловлюючи в тамбурі веселих макак, Валера думав лише одне: потрібно повертатися, потрібно вертатись до міста, яке на тебе чекає, яке лежить поміж рік, на пагорбах, відкрите небу, засипане синім снігом. Потрібно повертатись, оскільки немає щастя в дорозі, немає порозуміння поміж чужинцями. Вдома все стоїть на своїх місцях, вдома все діється вчасно й доречно. Потрібно завжди повертатися, інакше для чого було кудись узагалі рушати? Все знаходиться поміж рік і все звідти починається — і всі історії, і вся любов. Мандрівний вогонь алкоголю перекидався йому з легені на легеню, лишаючи по собі сліди, спалахував і зникав, обіцяючи одного разу обов'язково повернутись і про все нагадати.", "Уранці Юра повернувся до палати, зібрав речі. Кивнув молодому, мовляв, пішли, поговоримо. Той неохоче вийшов. Стали коло вікна.", "— Послухай, — почав Юра. — Я виписуюсь. Не хочу, щоб ти злився.", "— Як виписуєшся? — не зрозумів молодий. — Ти ж не долікувався.", "— Долікуюсь, — заспокоїв його Юра. — Ти не психуй, ладно?", "— Та ладно, — заспокоїв його молодий, — сам винен, зірвався.", "— Коли назад у команду? — запитав Юра.", "— Та немає команди, — відповів молодий, — розформували. Спонсор бабки в готель вклав.", "— Ясно, — розгубився Юра. — І куди ти тепер?", "— Не знаю, — сказав молодий. — Довчусь, мабуть.", "— Правильно, — погодився Юра. — Мене мій старий до сьогодні дістає, що я не довчився. І правильно робить. Запиши номер. Треба буде студію — звертайся.", "— Обов’язково, — запевнив його молодий.", "Юра швидко домовився з лікарем. Той пом'явся, сказав, що так не роблять, що це не за правилами, що це небезпечно й шкідливо, але добре, погодився, під твою відповідальність. Тільки за таблетками приходь.", "У коридорі піймав Аллу. Вийшли надвір, на вулиці, відразу за рогом, знайшли якийсь спортивний бар. За столом кілька арабів дивились повтор матчу. Бармен із кимось розмовляв. Підійшла офіціантка — хлопчача зачіска, уважний погляд. Юра попросив прибрати звук. Араби запротестували, проте офіціантка холодно попросила їх заспокоїтись. Юра подякував їй у спину, вона обернулась, легко кивнула головою, ніби висловлюючи підтримку.", "— Запиши номер, — сказав Юра.", "— Добре, — Алла швидко погодилась.", "Про всяк випадок він відібрав у неї мобільний, набив туди свій номер.", "— Подзвониш?", "— Подзвоню.", "— Не забудеш?", "— Не забуду.", "— Давай, буду чекати.", "За час його відсутності вдома зіпсувались консерви й висохли квіти. Ні того, ні іншого шкода не було. Юра покрутився квартирою, поставив чайник, сходив у душ. Ходив кімнатами, обмотавшись рушником і лишаючи на лінолеумі мокрі сліди. Проходячи повз дзеркало, кинув погляд: жилаве, бите й шрамоване тіло, поріділий хаєр, ламаний ніс, міцне боксерське підборіддя. Дещо схуд, але не страшно. Відірваний палець на лівій руці, через який кинув грати. Обпечена права нога. Суха, вивітрена шкіра. Злий, упевнений погляд. Усе як завжди. За останні двадцять років майже нічого не змінилося. Згадав про Аллу. Дістав телефон. Увімкнув. Почав чекати. За п'ять хвилин зателефонували. Висвітлився номер Чорного. Юра на якусь мить завмер, потім різко підхопив слухавку-", "— Алло, — сказав."], ["Усім потрібна хороша робота, ніхто не любить роботодавців. Усі ухиляються від сплати податків, проте саджають зазвичай того, хто перший запропонував не платити. І що в такому разі може нас вивільнити? Нас може вивільнити хіба що віра. Усіх атеїстів найчастіше об'єднує саме релігія. Релігія, як правило, обслуговує спекулянтів та соціалістів, тож нам залишається хіба що молитись. І дбати про бухгалтерію. Щось подібне Фіма — для друзів — Фома — думав щоразу, коли траплялося спочатку довго домовлятися із замовниками про зустріч, а потому так само довго на них чекати. Навіщо взагалі домовлятися? — думав він незадоволено, — навіщо уточнювати адреси, звіряти годинники, нервувати? Ніхто не приходить вчасно, ніхто нікуди не поспішає, ніхто не дотримує слова. Справи ведуться абияк, гроші працюють самі на себе, усі ми в цьому світі — покинуті й самотні, усім потрібна любов, всім потрібна увага, усім потрібна хороша робота.", "Фіма тримав невелику мережу пересувних кав'ярень (яскраво розмальовані душогубки, що стояли під брамами університетів), погано підготовлений персонал (студенти тих-таки університетів, що стояли коло душогубок і продавали брунатного кольору отруту), багато працював, терпіти не міг безробітних. У світі стільки роботи, — говорив підлеглим, — як при цьому можна бути безробітним? Підлеглі натомість часто звільнялись. Він навіть не встигав запам'ятати їхні імена. Зникали безіменними.", "Цього разу місце зустрічі запропонували замовники. Хороший ресторан, сказали по телефону, затишний, приємний, зранку там буде порожньо. Фіма знав, про що мова, жив за два квартали звідти. Час від часу проїжджав повз цей підозрілий заклад, бачив власника, що ходив вулицею в рожевому кімоно, говорячи при цьому по дамському мобільнику. Але добре, вирішив, хай буде. Приїхав заздалегідь, припаркувався. Ресторан виявився зачиненим, відчинявся лише за дві години. Фіма передзвонив замовникам. Ох, справді? — здивувалися ті. Ну, почекайте нас де-небудь. Запізнюємось. Але скоро будемо. Фіма озирнувся. Сонячний липень, порожня вулиця. Поруч спортивний бар. Те, що треба, — подумав Фіма. Він знав господарів, знав бармена, був там кілька разів. Господар тепер сидів за навмисне вбивство (переїхав брата дружини, стверджував, що випадково: спочатку збив його на власному подвір'ї, потім нібито повернувся, аби надати першу допомогу, і переїхав іще раз), дружина засудженого тягла бізнес й оплачувала послуги адвокатів. Бар знаходився в холодному підвалі. Центр, поруч із метро, на підходах до інститутських корпусів, завжди купа студентів. Фарбовані стіни, на стінах дві плазми. На вулиці, під вивіскою, — піратський прапор. Публіка строката: студенти старших курсів, котрі навчалися в другу зміну, тож першу могли просиджувати в барі, араби, котрих до інших закладів не завжди пускали з огляду на зовнішній вигляд, кілька місцевих алкоголіків, що забрідали ввечері, на другий тайм, оскільки пити два тайми поспіль було для них фінансово сутужно. Бармена звали Антон, він виконував роботу власне бармена та офіціанта. Ну, і міліцію викликав у разі чого. Фіма з ним вітався, той завжди мовчки кивав у відповідь. Був неговіркий, ніколи нікуди не поспішав, але все тримав у пам'яті, був акуратний у розрахунках і коректний у поводженні з алкоголіками. Щоправда, дивно одягався: у помаранчеві футболки й зелені джинси, чи в білі сорочки й короткі шорти, чи у рвані светри й смугасті брюки. Ага, ну й носив кульчики в обох вухах. При цьому рідко голився й майже не усміхався. Відвідувачі вважали бармена підаром. Бармен був про них такої самої думки.", "Фіма зайшов, привітався з Антоном. Той звично кивнув у відповідь. Чорт, — подумав Фіма, — він щоразу так вітається, ніби хотів побачити когось іншого. У барі, незважаючи на ранній час, було весело. У кутку під плазмою сиділи араби. Схоже, не вистачило грошей на авіаквитки, тож літні канікули вирішили пересидіти тут, у підвалі. Дивились повтор вчорашнього футболу. На Фіму глянули вороже — високий, сутулий, костюм недорогий, хоча й акуратний. Не надто вміло, хоча й старанно зав'язана краватка. Новий телефон, старий механічний годинник. Обдивившись, повернулись до футболу. Фіма навіть залип в екран разом із ними, потім згадав, що вчора все це вже дивився, знає, чим усе закінчиться, тож підійшов до Антона, розговорився. Несподівано з кухні вийшла дівчина. Довгі ноги, темні джинси, біла блузка, хлопчача стрижка. Фарбовані в чорне нігті. Привіталась із Фімою, як із давнім приятелем, забрала в Антона склянки із соком, понесла парі, що сиділа при виході.", "Фіма подивився їй услід, зупинився на парі. Чоловік нервував, схоже, хотів курити, але курити не можна, забрав у жінки мобільний, почав щось записувати. Писав повільно — не мав на руці одного пальця. Жінка напроти теж нервувала. З пальцями в неї було все гаразд. Дівчина лишила їм сік, уже збиралась іти, коли чоловік за столом легко її притримав, кинув пару слів. Вона кивнула у відповідь, узяла на сусідньому столику пульт, стишила звук на плазмі. Араби нервово заґелґотали, проте вона повернулась і тихо щось їм відповіла. Араби враз замовкли. Як вона з ними! — подумав Фіма.", "— Звідки вона? — запитав.", "— Офіціантка, — неохоче пояснив Антон. — Оля звати. Тиждень як узяли. Сам не встигаю.", "Передзвонили замовники. Спитали, де він. У барі, пояснив Фіма, дивлюсь футбол. Який рахунок? — запитали замовники. Фінальний чи на цей момент? — перепитав він. Послухайте, сказали замовники, ми тут застрягли перед мостом. Як до вас добиратись? Фіма почав пояснювати, але тут підійшла Оля. Ти що? — сказала Фімі. — Там же ремонт, їм потрібно вліво, до проспекту, там угору, потім праворуч. Дай сюди, — сказала, забираючи у Фіми телефон. Швидко все пояснила, згадала кілька вулиць, назвала кілька магазинів, які потрібно проїхати, школу, військкомат. Віддала телефон, пішла до арабів, довго з ними про щось говорила. Араби дивились на неї стривожено, але поводили себе тихо. Фіму дивував її спокій, він звик, що робота офіціантки, як правило, пов'язана з істериками. Араби, схоже, щось їй закидали, проте вона ледь помітно торкнулася долонею плеча одного — і той відразу примовк. До другого нахилилась, про щось перепитуючи, і він почав заперечувати й виправдовуватись. Інші, не помічаючи, що за ними спостерігають, пропікали поглядами повітря, викрешували з озону іскри, дивлячись їй в обличчя, ловлячи її рухи, слухаючи її образи.", "Хвилин за п'ятнадцять знову передзвонили замовники. Усе, сказали, все відміняється. Виявилось, на мості в когось в'їхали, тепер стоять, чекають на ДАІ. Попросили вибачення, ще раз поцікавились рахунком. Фіма попрощався з Антоном, почекав, доки підійде Оля, хотів щось їй сказати, але розгубився, не знайшов потрібних слів, лише простягнув їй руку, мов на діловій зустрічі. Вона засміялась, стиснула йому долоню, і він, не стримавшись, дещо незграбно, проте виключно дружньо, не виходячи за межі дозволеного, обійняв її, легко провівши рукою по спині. А вже коли виявилось, що білизни під блузкою вона не носить, Фіма й зовсім розгубився і якось поквапом вискочив надвір. Знайшов свій фіат. Сів. Почекав. Набрав Антона.", "— Ця офіціантка, — сказав, — Оля — хто вона?", "— Ти далеко? — перепитав його Антон по паузі.", "За хвилину вийшов, сів поруч, обережно причинивши дверцята.", "— Курити є? — запитав Фіму.", "— Кинув, — виправдовуючись, відповів той. — Жуйку жую. Не допомагає. Будеш?", "Антон із відразою подивився на жуйку, махнув рукою, мовляв, давай.", "— Ну, значить, Оля, — почав, зосереджено розжовуючи свій стіморол. Зовні виглядало, ніби він пережовує кожне слово. — Коротше, вона проституткою працювала. Було таке.", "— А ти звідки знаєш? — зажував у відповідь Фіма.", "— Так вона в сусідньому під'їзді живе, — пояснив Антон. — Я її сто років знаю. Я її сюди й привів. Думаєш, багато охочих тут сидіти?", "— Ну, а що ж вона пішла з проституток?", "— Звідки я знаю? — незадоволено відповів Антон. — Проститутки — вони як боксери, кар'єра в них яскрава, але коротка.", "— Я зрозумів, — відповів Фіма.", "Він відчинив вікно. Вистрілив стіморолом у повітря. Антон теж відчинив, теж вистрілив. Мовчки потисли один одному руки, розійшлися."], ["Чи так уже погано бути проституткою? Чи така вже це життєва поразка? — думав Фіма, повертаючись до себе. Що нас відштовхує від цих жінок? Суспільна зневага? Працівників прокуратури суспільство зневажає куди більше. Якщо подумати, — говорив він собі, — хто взагалі йде в проститутки? Люди тяжкої долі, суперечливого життєвого шляху. Покинуті коханки, зраджені наречені, нелюблені діти. Студентки, позбавлені родинної підтримки. Робітниці, викинуті зі швейних цехів. Матері-одиначки, жінки-алкоголічки, сироти, зайди та вдови. Стають удови проститутками? Певно, що стають — чим їм іще займатись? І хто я такий, аби їх засуджувати? — думав Фіма. Які в мене підстави думати про них недобре? Більше того, маю підозру, що більшість із них живуть життям куди цікавішим за моє, більш насиченим, сповненим пригод і небезпеки. Очевидно, у проститутки йдуть жінки, що потребують любові. Безперечно. Лише так. Жінки, здатні ділитись ніжністю, здатні викликати ревнощі й зупиняти депресію. Певен, що серед проституток часто трапляються натури освічені й начитані, які в такий дивний спосіб виявляють свій захват перед світом, вдаються до більш глибокого та повного його пізнання. Ясно, що більшість із них знаються на психології та медицині, здатні знімати втому й повертати пам'ять, більшість із них носить шовкову білизну чи пірсинґ у найбільш несподіваних місцях. Усі вони залюблені в музику та свою роботу, усі вони навчені ці заняття поєднувати. Вечорами вони прибігають до своїх кімнат, легко й весело накладають коштовний макіяж, одягають маски й прикраси, стелять червоні простирадла в очікуванні сміливих і щедрих чоловіків. Відчиняють вікна й впускають до приміщення зелені круглі місяці, що сріблять їм шкіру й роблять зуби їхні білими, як колота порцеляна. Вони палять у кімнаті трави, аби чоловікам потому снились ліси й чорні ріки з невідомими містами, вони не сплять уночі й засинають удень, як вампіри. На ранок збираються на терасах, обвитих виноградом, і говорять про співи та астрономію, знаходять на чорних полотнищах передсвітанкового неба сузір'я, спостерігають за птахами, вгадують погоду на найближчі дні, п’ючи солодкий ром. Потому розходяться домівками, набирають повні ванни прохолодної води, лежать там годинами, і коліна їхні світяться в темній воді, як місяці.", "Наступного ранку він знову приїхав. Довго зав'язував святкову краватку, ледь при цьому не задушився. Припаркувався під піратським прапором, набрав Антона. Той вибіг заклопотаний і похмурий, мовчки потис руку, взяв запропонований стіморол.", "— На місці? — запитав Фіма.", "— На місці, — відповів Антон.", "— Я зайду?", "Антон зосереджено зажував.", "— Слухай, — сказав, помовчавши, — воно тобі треба?", "— А що таке? — не зрозумів Фіма.", "— Для чого тобі?", "— Для рівноваги, — пояснив Фіма.", "Антон мовчки виліз, хряснувши дверцятами. Фіма посидів, почекав, виліз слідом. У барі було порожньо. Він кивнув Антону, той роздратовано відвернувся. Вибрав місце напроти барної стійки. Показували той же футбол, що і вчора. Фіма подумав, що за ці три дні встиг вивчити склади команд. Але дивився на екран із непідробним інтересом. Оля вибігла хвилин за десять. Про щось пошепотілась із барменом, знову зникла, навіть не подивившись у зал. Фіма занервував. Дивився матч, із відразою чекаючи на нульову нічию.", "За якийсь час вона підійшла. Запитала, що він буде пити. Фіма розгубився. Що ж їй сказати? — подумав. Щось запитав, чимось поцікавився, мимоволі поліз по кишенях.", "— Що там? — запитала вона.", "— Трубу посіяв, — незадоволено відповів Фіма.", "— Давай тебе наберу.", "Оля дістала розбиту й перемотану скотчем нокію. Фіма продиктував, вона набрала. Почекали. На барі Антон скрипуче протирав посуд. Фіма знічено сказав щось на прощання, виходячи, махнув Антонові, навіть не став чекати на відповідь. Та й не було жодної відповіді. Труба лежала у фіаті, на підлозі, під кермом. Фіма підняв, подивився вхідні, набрав її номер.", "— Ти сьогодні коли закінчуєш? — запитав.", "— А що? — вона навіть не здивувалась.", "— Давай заїду за тобою?", "— Ну, заїдь, — легко погодилась Оля.", "Він хотів щось додати. Але що тут можна додати?", "У липні ці порожні будинки видаються особливо занедбаними. Трава на підвіконнях втрачає свіжість, сухо вказуючи напрямок ранкових протягів. Деревам у під'їздах не стає вологи. Гіркота битого каміння, сонячна липка павутина, вуличні пси — чутливі й повільні, наче вагітні жінки: липень видовжує тіні й випалює кольори, довгі вечори настають раптово й несподівано, старі чоловіки сидять у тихих дворах, залитих вечірнім світлом, шкіра їхня стає теплою, зморшки робляться глибокими, літо перевалюється на той бік міста й опалює на протилежному березі червону цегляну кладку старих складів та заводських прохідних. Сонце спливає за течією, наче скинутий із моста квартирний злодій, обрій до ночі проймається спалахами. Наприкінці липня помирають старі безробітні у своїх захаращених кімнатах, позбавлені уваги й любові, оскільки вся любов цих днів дістається молодим. Дівчата знемагають від спеки, спускаються до води, тримаються її свіжості, остерігаються прибережної зелені. Вулиці особливо лункі, тому кожен необережний крок і раптовий вигук сполохують голубів на дахах і розімлілих від сонця безпритульних, що селяться на літо в покинутих, розбомблених помешканнях. Хочеться говорити тихо, щоби тебе ніхто не почув, а почувши — не зрозумів.", "Він ще не встиг припаркуватись, а Оля вже піднялася сходами нагору. Побачила його фіат, сіла на переднє сидіння. Фіма потягнувся цілуватись, вона сухо торкнулась його виголеної щоки. Усе як поміж старими друзями. Або поміж чоловіком і дружиною, що домовились розлучитися. На ній була коротка сукня. Ноги її від цього здавалися ще довшими. Вона весь час поправляла зачіску, мружачись проти вечірнього сонця.", "— Курити можна? — спитала.", "— Я кинув, — відповів Фіма.", "— Молодець, — відповіла на це Оля, дістала сигарети й закурила. Подивилась на його розгублене обличчя, скептично гмикнула, опустила зі свого боку скло.", "— Куди поїдемо? — Фіма впорався-таки зі своїм хвилюванням і взявся до справи.", "— Та нікуди, — відповіла Оля. — Давай тут постоїмо.", "— Тут? — не зрозумів її Фіма. — Ну давай.", "— Ти щось хотів? — запитала Оля, навіть не подивившись у його бік.", "— Просто поговорити хотів, — відповів Фіма.", "— Добре, — погодилась вона, — говори.", "І відвернулася до вікна.", "Вона ображається, зрозумів Фіма. Можливо, Антон їй усе розповів. Можливо, вона здогадується, що я про все знаю. Можливо, думає, що я ставлюсь до неї, як до колишньої проститутки. Можливо, саме це її й пригнічує. Справді, свинство з мого боку — грати на її минулому, користатись із її помилок. Вона давно почала нове життя, а тут я. Ясно, що її це ображає. У жодному разі не можна їй говорити, що я про все знаю. Навіть натяками, навіть жартома. Потрібно, аби вона заспокоїлась, аби зрозуміла, що я не збираюсь її шантажувати. Краще говорити про щось нейтральне.", "— Розкажи про себе, — попросив Фіма. — Чим ти цікавилася в дитинстві? Хлопцями?", "Чорт, — подумав, — зараз вона мене пошле.", "— Хімією, — відповіла Оля.", "— Хімією? — здивувався Фіма. — Розумію: формули, колби, кислоти. Багато в тебе друзів було?", "Чорт! — знову похопився.", "— Так, — відповіла на це Оля, — в нас цілий гурток був.", "— І чим ви там займались? — поцікавився Фіма. — Справді хімією?", "Чорт! Чорт!", "— Ми ставили досліди.", "— Експериментували разом?", "!!!!!!!!!!!!", "— Ми всі, — сказала раптом Оля, — були закохані в хіміка. Він був старий і красивий. Тобі подобаються старі чоловіки?", "— Старі? Що ти! — якось недоладно відповів Фіма, гарячково думаючи, про що говорити далі.", "— У нього були красиві пальці, — не дала йому продовжити Оля. — Коли він торкався мене, мені ставало холодно. А потім я вся починала горіти.", "— Він торкався тебе? — не зрозумів Фіма.", "— Так, — підтвердила вона. — Мені було п'ятнадцять. Мені хотілося дізнатися про всі таємниці життя. Відчути всю насолоду цього світу. Тому я вибрала саме його — дорослого й досвідченого, з красивими пальцями. Він був моїм першим чоловіком.", "— Як це? — не відразу зрозумів Фіма.", "— У плані сексу, — повернулась до нього Оля. — У нас із ним це сталося просто в класі після уроків. На мені була зовсім коротка форма, йому навіть не довелося мене роздягати.", "Оля дістала нову сигарету.", "— А потім? — Фіма важко ковтнув слину й послабив вузол краватки.", "— А потім він помер, — охоче пояснила Оля. — Не відразу, звісно, не після нашого з ним сексу. Десь через рік. Серце. Ми класом ходили на похорон. Після нього лишилась красива вдова. Трішки заповна, але взагалі нічого, як на її вік. Підкинеш мене додому? — спитала несподівано.", "Дорогою вони мовчали. Але й дорога була короткою.", "Вдóви, думав Фіма, вдóви — ті напевне. Вдовам туди пряма дорога. Їх там чекають із розпростертими обіймами. Вдови — найкращі коханки. Найвитриваліші. Найнеспокійніші. Його першою жінкою була вдова. Це була чи не єдина її перевага. Знайома батьків. Кандидат наук. Більшість знайомих його батьків були кандидатами наук. У дитинстві Фіма був переконаний, що кандидати наук становлять більшість населення цього міста. А доценти становлять його меншість. Доцентів серед їхніх знайомих теж вистачало. У них була солідна родина, Фіма виростав у порядному середовищі. У принципі, маючи таку кількість знайомих кандидатів, важко було переспати вперше з кимось іншим. Вдова сама виявила ініціативу, запропонувала дружбу, обіцяла протекцію під час вступу, давала консультації. Одна з консультацій у неї вдома завершилась дещо зашвидким сексом. Фіма не опирався. Хай буде кандидат, — подумав. Потім вона справді допомогла під час вступу, хоча між ними більше нічого не було. Сподіваюсь, їй не сподобалось, — думав Фіма. Але з вдовами після цього був обережний. З вдовами ніколи не знаєш, як вийде, — гадав він тепер, курячи на балконі й розглядаючи золоті вогні в старих будинках над рікою. З вдовами він був обережний настільки, що, навіть почавши власну справу, намагався брати на роботу лише заміжніх. Бажано середнього віку. Бажано із золотими зубами. Це дисциплінувало."], ["Уночі він написав їй повідомлення. Щось про те, що цієї пізньої пори, коли над вулицями в липкому повітрі проносяться демони й дим на кухнях гусне, пахнучи маком і шоколадом, він, як старий потяганий пірат, видивляється серед бузкової ночі вогні її помешкання й відчуває своїм гострим щурячим нюхом, як ніжно пахне її шкіра, відчуває, як вона легко провалюється у свої сновидіння, ніби в крихкий і невагомий різдвяний сніг, і доки кристали морозу запікаються їй на вустах, він несе свою вахту, охороняючи її спокій і розганяючи демонів своїми кубинськими сигаретами. Перечитав, подумав, що про мак — це зайве. Вирішив повідомлення знищити. Натиснув щось не те, есемес таки надіслалося їй. Стояв і з острахом чекав: відпише чи ні. Десь о четвертій ранку, коли останні демони розтанули в ранкових сутінках, телефон сів.", "Вона передзвонила сама, по обіді.", "— А що ти про шоколад писав? — поцікавилась.", "Фіма почав виправдовуватись, вигадувати плутану таємничу історію про події минулої ночі, про підозрілих знайомих та їхні родинні проблеми, про пізні дзвінки й нічні істерики, про марні спроби всіх заспокоїти й помирити, про виклики таксі й поїздки крізь нічне місто, про відверті погрози й урочисті присягання. Шоколаду в цій історії місця відверто не було, він геть заплутався й просто запропонував зустрітись.", "У грузинів, куди вони прийшли, вона привіталася з офіціантом, той упізнав її, весело відгукнувся, поважно кивнув Фімі. Відразу почав щось радити, від чогось відговорювати. Фіма спеціально одягнувся неофіційно, себто в літню сорочку й світлі брюки, і без краватки почувався невпевнено — наче пес, якого вперше на ніч спустили з ланцюга. Найбільше йому хотілося назад — на ланцюг. Звідки він її знає? — думав, підозріло дивлячись на офіціанта. Це якось пов'язано з її минулим? Скільки чоловіків лишилось у цьому її минулому? Вона що, з усіма ними буде вітатись? Фіма нервував і якось несподівано для самого себе напився. Олю це тішило, молодець, говорила, пий, тобі так краще. Він пив, але пильності не втрачав, головне, нагадував собі, не проговоритись, не дати їй зрозуміти, головне — без натяків. Спочатку заговорив про роботу, назвав замовників продажними суками, прикусив язика, перейшов на політику, розповів історію про депутатів від партії влади, які користуються послугами хлопчиків за викликом, знову обірвався на півслові, згадав кримінальну хроніку, випадок із закритою сауною, у якій накрили священиків, але тут навіть вона попросила його замовкнути. Зрештою перейшов до новин спорту. Подивився на офіціанта, сказав, що той, очевидно, колишній боксер — такий у нього м'ятий ніс. Так і є, підтвердила Оля, він боксер. А звідки ти його знаєш? — не витримав-таки Фіма. Буде що буде, плавав він алкогольним туманом, але я маю це знати. Ну як звідки? — відповіла Оля. — Він до нас у бар ходить. За Манчестер уболіває. Дивно, правда? Він приходить до мене, я приходжу до нього. Таке враження, що вся публіка ресторанів — це офіціанти з інших закладів. Тобі подобаються офіціанти? — спитала.", "— Офіціантки, — відповів Фіма хапливо. — Офіціантки подобаються.", "— О, — підхопила Оля. — Мені теж офіціантки подобаються. У мене була колись одна офіціантка. Звали її Кірою, вона жила на Тракторному, займалася йогою, могла довго не дихати. Довго-довго. Ти вже думаєш: усе, треба викликати швидку, вставати, одягатись, бігти за міліцією. І тут вона видихає. Я почувалася сумно й порожньо, мені було вісімнадцять, і життя здавалося мені нестерпним. Саме тоді я з нею й познайомилась. Хочеш, тебе познайомлю?", "— Хочу, — п'яно закивав головою Фіма, — дуже хочу.", "— Познайомлю, — пообіцяла Оля. — Прямо тепер, хочеш?", "— Хочу, — знову погодився він і допив рештки грузинського червоного просто з пляшки.", "Він хотів познайомитись з усіма її подружками, побачити всіх її чоловіків, подивитися в очі всім її знайомим, хотів обійматися з боксерами й мірятися силами з борцями, битися на ножах із барменами й грати в кості з паркувальниками. Хотів дізнатися в її подружок, що вони говорили їй, перш ніж вона йшла з ними в ліжко, як вони переконували її, що обіцяли. Хотів дізнатися в її чоловіків, як вона виглядала раніше, без цієї хлопчачої зачіски, якого насправді кольору її волосся, як вона виглядає зранку, без усієї цієї чорної фарби, що вона говорить зі сну, після всього того, що було вночі, як вона заговорює після виснаження й мовчанки. Хотів переговорити з її шкільними вчителями, хотів, щоби вони розповіли йому про її успішність, про її поведінку, про її захоплення хімією та спортом, про колір і крій її шкільної форми. Хотів випити з учителем праці й порозумітися з учителем історії, хотів подивитись в очі завучу й розцілувати класну керівничку, хотів опинитися в її житті, опинитися там поруч із нею, так близько, щоби відчувати, як кров перетікає під її шкірою. Хотів долучитись до всіх її таємниць, до всіх загадок, які вона ховала в пам'яті, хотів знати напам'ять всі її численні історії, хотів виправляти її помилки, розвіювати її сумніви, стати часткою того, що з нею відбувалося, відкрити для себе її життя, ніби знайдену в чужому помешканні валізу, сидіти й перебирати коштовні свідчення чужих переживань і чужого сміху. Хотів усім керувати, хотів мати до всього стосунок.", "На вулиці вона довго відмовляла його від автомобільної прогулянки за місто. Врешті-решт він погодився. Добре, сказав, де твої офіціантки? Спочатку вони зупинилися в турків навпроти. Там він підтягував безкінечну любовну пісню за якоюсь тлустою, вусатою, блискучою дівою на екрані й намагався лишити чайові комусь із відвідувачів. Відвідувачі були виключно турками, розібратись, хто з них працівник, а хто — клієнт, було не так просто. Потім Оля потягла його різними підозрілими місцями. Вони зазирали до всіх тих нір та підвалів, які вона могла згадати, були, ясна річ, в арабів, зазирнули, звісно ж, до в'єтнамців, браталися з працівниками Макдональдса, які давно до такого звикли, пили на брудершафт із працівниками тубдиспансеру, марно намагалися замовити шампанське в сауні «Здоров'я», згадували дитинство в підвалі проти синагоги, намагалися знайти дівчат за викликом у дитячому кафе. Саме там він перевернув собі на коліна молочний коктейль і довго замочував плями гірським бальзамом. Просив записати продавців піци йому свої адреси, ловив коньячні випари в грузинів, до яких вони знову повернулись, оскільки на той час усе було зачинено. Уже там з'явилася жива музика, і він танцював ірландські народні танці, заважаючи офіціантам і викликаючи її захват.", "А десь опівночі опинились коло його будинку, і він твердо, як йому здавалося, сказав: ти нікуди не підеш, ти маєш лишитися зі мною. Лише так. Сказав це так твердо й переконливо, що вона не стала заперечувати, добре, відповіла, так і буде, іди вперед і показуй дорогу, бо вже сил моїх немає тебе тягнути. Він розвернувся й пішов, важко орієнтуючись у липневій темряві й слухаючи шепоти у власній голові. А щоби вона не згубила його й не відстала посеред ночі, весь час говорив, говорив, аби вона йшла на його голос, аби рухалася за ним і не лишилася сама. Говорив, що хоче побачити подружок її чоловіків, битися з боксерами й ламати кості паркувальникам. Говорив, що обов'язково переконається, з ким її подружки йдуть у ліжко, та дізнається, що їм для цього пообіцяли. Говорив, що знає все про чорну фарбу хлопчачих зачісок і виснаження шкільних учителів, натякав, що від нього не приховаєш манеру та поведінку, стверджував, що обов'язково має поцілуватися з учителем праці й випити з класною керівничкою. Загрозливо натякав про кров, що тече надто близько, скептично відгукувався про свої численні історії. Насамкінець завів мову про коштовні валізи в чужих помешканнях, вимагав принести їх йому прямо тепер, не міг заспокоїтись із цими валізами, говорив про них зі сміхом та переживанням. Говорив і думав так: головне — не озиратись, головне — не замовкати, доки я йтиму й говоритиму, вона буде йти за моїм сміхом, доки я матиму що сказати, вона змушена буде слухати, вона дійде до кінця, і дослухає до кінця, і залишиться зі мною цієї ночі. Адже має вона дізнатись, чим це все закінчиться, має ж дочекатися розв'язки. Головне — говорити й не зупинятись. Він більш-менш твердо підійшов до під'їзду, надміру широко прочинив двері, достатньо безтурботно ступив у темряву. Важко підіймався сходами, повільно підбирав ключі, завбачливо не вмикав світла. Говорячи й не озираючись, пройшов коридором, скинув черевики, пройшов до кімнати, стягнув із себе сорочку, завалився в ліжко.", "Вона постояла внизу, на вулиці, почекала. Почувши, як скрипнули двері його помешкання, заспокоїлась, пішла.", "Він прокинувся рано. У власному ліжку. Знайшов у кишені рекламу з Макдональдса. Здивувався. Шкіра його відгонила гірським бальзамом, футболка була перемащена соєвим соусом. Передзвонили з роботи, сказали, що замовники хочуть зустрітися. Він подумав, вирішив зустріч перенести. Потім подумав і вирішив нічого не переносити. Але поглянув на футболку й усе-таки переніс.", "Оля почала писати десь під обід, коли йому стало краще. Про які валізи ти говорив? — питала. З тобою все гаразд? Ти нікого не пограбував? Здається, ні, — відповів він, — хоча все може бути. Ти налякав мене цими валізами, — написала вона знову, — я сиділа на терасі, обвитій виноградом, говорила з подружками про співи та астрономію, спостерігала за птахами і все не могла заснути. Навіть ром не допоміг.", "Яке цікаве й таємниче в неї життя, думав він, повільно приходячи до тями, скільки всього несподіваного й загадкового відбувається з нею щоночі. Як вона живе? Хто її друзі? Скільки в неї знайомих? Їй, напевно, легко з ними, вони люблять її, їм завжди є про що поговорити. Зібравшись, вони згадують подорожі й пригоди, безтямні вечірки й ночі кохання, морські узбережжя та вогкі міські підземелля. Вони говорять про любов і зраду, показують нові прикраси й розповідають про останні подвиги, їхні кишені набиті банкнотами й залізничними квитками, вони завжди готові зірватися з місця й розчинитись у просторі, рвучись назустріч сонцю, тікаючи від утоми й зневіри. Як би мені хотілося теж усе це мати, гірко думав він, як би мені хотілося жити так, як вона: легко, невимушено й вигадливо. Ні від кого не залежати. Ні в чому собі не відмовляти. Мати справу з коханням, мати справу з пристрастю. Що я бачив у своєму житті? Хіба мені доводилось коли-небудь переживати смертельну небезпеку? Хіба мені траплялося хоча б колись пережити шалену закоханість? Я навіть не спав із жодною офіціанткою! З донькою директора ресторану спав, а з офіціантками — жодного разу!", "Донька директора ресторану була його першою дружиною. Сталося це якось само собою: познайомились у когось на весіллі, потім сходили разом до когось на поминки, були в когось на дні народження, зустрічали з кимось Новий рік. Десь переспали, якось звикли одне до одного. Вона запропонувала одружитись, він не заперечував. Її тато подарував йому фольксваген. Чесно кажучи, якби була така можливість, він узяв би лише фольксваген. Шкода, але після розлучення довелось його повернути.", "Наступного дня, по обіді, він витягнув її за місто. Розповідав про роботу, згадував смішні випадки з минулого, сам і сміявся. Коло восьмої вона попросила відвезти її додому. На вихідних він запросив її до себе. Вона відмовилась, запропонувала просто десь посидіти. Він знову щось розповідав, намагався її розговорити. Вона неуважно відповідала, іноді не зовсім його розуміла, проте чемно слухала. Наступного тижня було багато роботи — він звільнявся десь по дев'ятій, набирав її, вона відповідала, що сьогодні не може, зустрічається з друзями, їде до подружки, чекає на знайомих. Домовились зустрітися в п'ятницю. Зустрілися. Він довго їй щось плів, плутано пояснював якісь прості, як йому здавалося, речі, пристрасно в чомусь запевняв, уперто щось повторював. Ну, добре, — погодилась вона, — пішли до тебе. Покажеш свої валізи.", "Пити вона відмовилась, і що було в такому разі робити, він не знав. Вона запитала про роботу, він почав розповідати, але й сам зрозумів, наскільки печально все це звучить. Даремно я її сюди притягнув, думав, усе більше нервуючи, виглядаю тепер ідіотом. І поводжуся, як ідіот.", "І вже гарячково думав, що б таке вигадати, що б запропонувати, аби вона погодилася звідси піти, куди її повести, чим заповнити час. Оля підійшла до полиці з книгами, дістала щось пригодницьке.", "— У тебе є діти? — запитала.", "— Діти? — здивувався він. — Ні, дітей немає.", "— Чому? — поцікавилась вона.", "— Не знаю, — розгубився Фіма. — Ніхто не хотів, я сам не подумав. Якось так. Ти про книги питаєш? — зрозумів він. — Це мої, дитячі. Давно хотів викинути, мама попросила залишити. Свого часу їх не так просто було дістати.", "— Я знаю, — відповіла Оля, — наші старші читали ці книжки. Так має бути, правильно? Чоловіки з дитинства повинні звикати до поганої літератури, оскільки саме вона вчить їх бути справжніми чоловіками.", "Узяла книгу, сіла з нею на підлогу. Він сів поруч. У дитинстві, сказала Оля, мене це хвилювало. Я думала: треба ж, вони всі читають ті самі книги. Мабуть, це не просто так, мабуть, я багато чого просто не можу зрозуміти, доки теж не прочитаю їх. Хоча, прочитавши, усе одно нічого не зрозуміла. Зате потім, спілкуючись із ними всіма, спостерігаючи за їхнім дорослішанням, маючи з ними справу, закохуючись у них, я завжди знаходила щось із цих книг — у розмовах, у поведінці, у дурницях, які вони робили. Не так багато речей нас об'єднує. Точно, погоджувався він, не так багато. Навіть книги, які ми читали, об'єднують не завжди. Ось у мене, почав розповідати він, ніколи не було друзів. Я товаришував із тими, з ким радили батьки. Коли ми з ними залишалися самі, нам не було про що говорити. Сиділи, розглядали рибок в акваріумі. І жодні книги нас не об'єднували. А ось у мене, підхопила вона й теж почала розповідати про рибок. І про інших тварин, яких вони знаходили на вулицях і тягли додому. І про батьків, що викидали на вулицю всіх цих псів, їжачків та очеретяних котів, доводячи дітей до сліз і зневіри. І про своїх старших, що першими йшли з дому й починали жити дорослим життям. І про те, як їй хотілося бути до них подібною, як її зачаровували ритми та механізми їхньої життєдіяльності, їхня незалежність, їхня самостійність. І про особисті проблеми подружок, і про чоловічі проблеми друзів, і про складну систему родинних стосунків, і про заплутані принципи любовних трикутників. Було вже десь по третій ночі, Фіма тримався як міг, але після того, як вона заговорила про трикутники, мовчки забрав у неї з рук книгу і так само мовчки почав стягувати з неї футболку. Вона здивувалась і спробувала підвестись, але він тримав її за руки й тягнув до себе. Ну, що ти? — попросила вона. — Не треба. Але його це лише підштовхнуло вперед. Головне — не зупинятись, укотре подумав він і знову рішуче взявся за футболку. Вона ще спробувала щось заперечувати, м'яко його відштовхувала, але коли тканина тріснула під його рукою, не стрималась і засадила йому коліном просто між ніг. Фіма розпачливо скрикнув і завалився на підлогу. Вона відповзла назад, важко дихаючи й поправляючи свою хлопчачу зачіску. Поступово заспокоїлась. Він теж затих, лежав, не наважуючись підвестись.", "— Ти як? — спитала вона хрипко.", "— Нормально, — відповів Фіма, не підводячись.", "— Вибач, не хотіла так сильно, — запевнила вона.", "— Нічого, — відповів він, тримаючись за травмоване місце, — буває.", "— Я піду? — запитала вона.", "— Давай відвезу тебе, — запропонував Фіма.", "— Дійду, — запевнила вона. — Ти точно в порядку?", "Він бадьоро підняв руку, мовляв, усе нормально, буває гірше. Коли вона вже виходила, повернувся й запитав:", "— Пам'ятаєш, ти писала мені про співи та астрономію?", "— Про яку астрономію? — не зрозуміла Оля.", "—
